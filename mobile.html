<script id="addons-m">
/* ═══ ADD-ONS on the phone — same switches and records as the web (DB.settings.addons, DB.addonRecords) ═══
   Switched on / off only on the web (Settings → Add-ons, Super Admin). While off, nothing here changes.
   ISO : More → "ISO / ระบบคุณภาพ": open & update NCRs, traceability lookup, document register (read),
         and — if the rule is on — a reason before deleting / editing a movement or posting a count.
   ERP : More → "ส่งออกไป ERP" (Admin): CSV export with the web's field mapping; "new movements only" shares the web's marker.
         Import, mapping and the API key stay on the web. */
(function(){
"use strict";
function on(k){ try{ return !!(DB&&DB.settings&&DB.settings.addons&&DB.settings.addons[k]); }catch(e){ return false; } }
window.addonOnM=on;
function ruleOn(k){ return on("iso")&&!(DB.settings.addons.isoRules&&DB.settings.addons.isoRules[k]===false); }
function recs(){ if(!Array.isArray(DB.addonRecords)) DB.addonRecords=[]; return DB.addonRecords; }
try{ _MERGEM.addonRecords="id"; }catch(e){}
function byKind(k){ return recs().filter(function(r){return r.kind===k;}); }
function rid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function seqNo(prefix,kind){ var ym=today().slice(0,7).replace("-",""), pre=prefix+"-"+ym+"-", n=0;
  byKind(kind).forEach(function(r){ var s=String(r.no||""); if(s.indexOf(pre)===0){ var v=parseInt(s.slice(pre.length),10)||0; if(v>n) n=v; } }); return pre+String(n+1).padStart(3,"0"); }
function hd(ic,title,sub){ return '<div class="grab"></div><div class="sh-h"><div class="thumb">'+ic+'</div><div style="flex:1;min-width:0"><b>'+title+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div></div>'; }
function g(id){ return ((document.getElementById(id)||{}).value||"").trim(); }
function sel(id,opts,v){ return '<select class="inp" id="'+id+'">'+opts.map(function(o){ return '<option value="'+esc(o[0])+'"'+(o[0]===v?" selected":"")+'>'+esc(o[1])+'</option>'; }).join("")+'</select>'; }
function fld(lb,inner){ return '<div class="field"><label>'+lb+'</label>'+inner+'</div>'; }
function nm(arr,k){ var x=arr.find(function(a){return a[0]===k;}); return x?x[1]:k; }

/* ───────── ISO ───────── */
var SRC=[["RECV",T("รับสินค้า","Receiving")],["QC",T("ตรวจคุณภาพ / NG","QC / NG")],["STOCK",T("ในคลัง","In storage")],["PICK",T("หยิบ / จ่ายออก","Picking / shipping")],["CUST",T("ลูกค้าร้องเรียน / รับคืน","Customer complaint / return")],["SUPP",T("ผู้จำหน่าย","Supplier")],["AUDIT",T("ผลการตรวจติดตาม","Audit finding")]];
var SEV=[["MINOR",T("เล็กน้อย","Minor")],["MAJOR",T("ร้ายแรง","Major")],["CRITICAL",T("วิกฤต","Critical")]];
var DISP=[["",T("— ยังไม่กำหนด —","— not decided —")],["HOLD",T("กักไว้รอตัดสินใจ","Hold")],["UAI",T("ใช้ตามสภาพ","Use as is")],["REWORK",T("แก้ไข / คัดแยก","Rework / sort")],["RTV",T("ส่งคืนผู้จำหน่าย","Return to vendor")],["SCRAP",T("ทำลาย / ตัดจำหน่าย","Scrap")]];
var NST=[["OPEN",T("เปิด","Open")],["ACTION",T("กำลังแก้ไข","In action")],["VERIFY",T("รอทวนสอบ","To verify")],["CLOSED",T("ปิดแล้ว","Closed")]];
var REASONS=[T("ตรวจนับพบผลต่าง","Count difference"),T("สินค้าเสียหาย","Damaged"),T("สินค้าสูญหาย","Lost"),T("บันทึกผิดพลาด","Entry error"),T("หมดอายุ","Expired"),T("เบิกตัวอย่าง / ทดสอบ","Sample / test"),T("อื่น ๆ","Other")];
var ICQ=IC.warn;

window.isoMenuM=function(){ var open=byKind("NCR").filter(function(r){return r.status!=="CLOSED";}).length, td=today();
  var late=byKind("NCR").filter(function(r){return r.status!=="CLOSED"&&r.due&&r.due<td;}).length;
  var opt=function(fn,ic,t1,t2){ return '<div class="opt" onclick="'+fn+'"><div class="oi">'+ic+'</div><div><b>'+t1+'</b><small>'+t2+'</small></div></div>'; };
  openSheet(hd(ICQ,T("ISO / ระบบคุณภาพ","ISO / Quality"),T("NCR · สอบย้อนกลับ · เอกสาร","NCR · traceability · documents"))
    +'<div class="adm-kv"><div><b>'+num(open)+'</b>'+T("NCR ยังเปิด","Open NCR")+'</div><div><b style="'+(late?"color:var(--danger)":"")+'">'+num(late)+'</b>'+T("เลยกำหนด","Overdue")+'</div><div><b>'+num(byKind("DOC").filter(function(d){return d.status==="EFFECTIVE";}).length)+'</b>'+T("เอกสารใช้งาน","Docs in force")+'</div></div>'
    +'<div class="opts">'+opt("isoNcrFormM()",IC.plus,T("แจ้งปัญหา (เปิด NCR)","Report a problem (new NCR)"),T("ของเสีย ผิดสเปก ขาด/เกิน ฯลฯ","Damage, wrong spec, short / over…"))
    +opt("isoNcrListM()",ICQ,T("รายการ NCR","NCR list"),T("ติดตามและอัปเดตสถานะ","Follow up and update"))
    +opt("isoTraceM()",IC.search,T("สอบย้อนกลับ","Traceability"),T("ค้นรหัส ล็อต ซีเรียล เลขเอกสาร","Item, lot, serial or document"))
    +opt("isoDocsM()",IC.guide||IC.book,T("ทะเบียนเอกสาร","Documents"),T("SOP / WI / แบบฟอร์มที่ใช้งาน","SOP / WI / forms in force"))+'</div>');
};
window.isoNcrListM=function(all){ var rows=byKind("NCR").filter(function(r){ return all||r.status!=="CLOSED"; }).sort(function(a,b){ return String(b.no).localeCompare(String(a.no)); }), td=today();
  openSheet(hd(ICQ,"NCR / CAPA",all?T("ทั้งหมด","All"):T("ยังไม่ปิด","Not closed"))
    +'<button class="btn primary" style="margin-bottom:10px" onclick="isoNcrFormM()">'+T("เปิด NCR ใหม่","New NCR")+'</button>'
    +'<div class="card" style="padding:4px 0">'+(rows.length?rows.map(function(r){ var late=r.status!=="CLOSED"&&r.due&&r.due<td;
      return '<div class="row" onclick="isoNcrFormM('+jsa(r.id)+')"><div class="rt"><b>'+esc(r.no)+'</b><small>'+esc(nm(SEV,r.severity))+' · '+esc(r.code||"-")+(r.lot?' · '+esc(r.lot):'')+'</small><small style="'+(late?"color:var(--danger);font-weight:800":"")+'">'+esc(String(r.desc||"").slice(0,60))+'</small></div><span class="pill">'+esc(nm(NST,r.status))+'</span></div>'; }).join(""):'<div style="text-align:center;color:var(--sub);padding:20px">'+T("ไม่มี NCR","No NCRs")+'</div>')+'</div>'
    +'<button class="btn ghost" style="margin-top:10px" onclick="isoNcrListM('+(all?"false":"true")+')">'+(all?T("เฉพาะที่ยังไม่ปิด","Not closed only"):T("แสดงทั้งหมด","Show all"))+'</button>'
    +'<button class="btn ghost" style="margin-top:8px" onclick="isoMenuM()">'+T("กลับ","Back")+'</button>');
};
window.isoNcrFormM=function(id,pre){ var ex=id?recs().find(function(r){return r.id===id;}):null;
  var d=ex||Object.assign({date:today(),source:"STOCK",severity:"MINOR",status:"OPEN",qty:""},pre||{});
  var items=(DB.itemMaster||[]).map(function(i){ return '<option value="'+esc(i.code)+'">'+esc(i.name||"")+'</option>'; }).join("");
  var mgr=isMgrUpM();
  openSheet(hd(ICQ,ex?esc(ex.no):T("เปิด NCR ใหม่","New NCR"),ex?esc(nm(NST,ex.status)):T("แจ้งสิ่งที่ไม่เป็นไปตามข้อกำหนด","Report a non-conformance"))
    +fld(T("แหล่งที่พบ","Source"),sel("nmSrc",SRC,d.source))+fld(T("ความรุนแรง","Severity"),sel("nmSev",SEV,d.severity))
    +fld(T("รหัสสินค้า","Item code"),'<input class="inp" id="nmCode" list="nmItems" value="'+esc(d.code||"")+'"><datalist id="nmItems">'+items+'</datalist>')
    +'<div style="display:flex;gap:8px"><div style="flex:1">'+fld(T("ล็อต / ซีเรียล","Lot / serial"),'<input class="inp" id="nmLot" value="'+esc(d.lot||"")+'">')+'</div><div style="width:110px">'+fld(T("จำนวน","Qty"),'<input class="inp" id="nmQty" type="number" inputmode="numeric" min="0" value="'+esc(d.qty)+'">')+'</div></div>'
    +fld(T("เอกสารอ้างอิง","Reference"),'<input class="inp" id="nmRef" value="'+esc(d.ref||"")+'" placeholder="PO / SO / ใบรับ">')
    +fld(T("รายละเอียดปัญหา *","What is wrong *"),'<textarea class="inp" id="nmDesc" rows="3">'+esc(d.desc||"")+'</textarea>')
    +(ex?fld(T("การจัดการสินค้า","Disposition"),sel("nmDisp",DISP,d.disposition||""))+fld(T("ผู้รับผิดชอบ","Owner"),'<input class="inp" id="nmOwner" value="'+esc(d.owner||"")+'">')
      +fld(T("การแก้ไข (Corrective)","Corrective action"),'<textarea class="inp" id="nmAct" rows="2">'+esc(d.action||"")+'</textarea>')
      +fld(T("สถานะ","Status"),sel("nmSt",mgr?NST:NST.filter(function(s){return s[0]!=="CLOSED";}),d.status))
      +(mgr?fld(T("ผลการทวนสอบ (ต้องกรอกก่อนปิด)","Verification (needed to close)"),'<input class="inp" id="nmVer" value="'+esc(d.verify||"")+'">'):""):"")
    +'<button class="btn primary" onclick="isoNcrSaveM('+(ex?jsa(ex.id):"null")+')">'+T("บันทึก","Save")+'</button>'
    +'<button class="btn ghost" style="margin-top:8px" onclick="isoNcrListM()">'+T("กลับ","Back")+'</button>'
    +(ex?'<p style="font-size:11.5px;color:var(--sub2);text-align:center;margin-top:10px">'+T("สาเหตุราก / การป้องกัน แก้ไขได้ที่เว็บหลัก","Root cause / preventive action: on the web")+'</p>':""));
};
window.isoNcrSaveM=function(id){ var v={source:g("nmSrc"),severity:g("nmSev"),code:g("nmCode"),lot:g("nmLot"),qty:parseFloat(g("nmQty"))||0,ref:g("nmRef"),desc:g("nmDesc")};
  if(!v.desc){ toast(T("กรอกรายละเอียดปัญหา","Describe the problem"),"warn"); return; }
  var it=v.code?(itemByCode(v.code)||{}):{}; v.name=it.name||"";
  var r=id?recs().find(function(x){return x.id===id;}):null, now=today()+" "+nowTime();
  if(!r){ r=Object.assign({id:rid("NCR"),kind:"NCR",no:seqNo("NCR","NCR"),date:today(),status:"OPEN",by:whoName(),hist:[{at:now,by:whoName(),status:"OPEN",note:T("เปิด NCR (มือถือ)","Opened (phone)")}]},v); recs().push(r); }
  else { var st=g("nmSt")||r.status, ver=g("nmVer");
    Object.assign(v,{disposition:g("nmDisp"),owner:g("nmOwner"),action:g("nmAct")});
    if(st==="CLOSED"){ if(!isMgrUpM()){ toast(T("ปิด NCR ได้เฉพาะผู้จัดการขึ้นไป","Only a manager can close an NCR"),"err"); return; }
      if(!v.action){ toast(T("กรอกการแก้ไขก่อนปิด","Enter the corrective action before closing"),"warn"); return; }
      if(!ver){ toast(T("กรอกผลการทวนสอบก่อนปิด","Enter the verification before closing"),"warn"); return; } v.verify=ver; if(!r.closedDate){ v.closedDate=today(); v.closedBy=whoName(); } }
    if(st!==r.status) (r.hist=r.hist||[]).push({at:now,by:whoName(),status:st,note:st==="CLOSED"?ver:""});
    Object.assign(r,v,{status:st}); }
  mSave(); toast(T("บันทึกแล้ว ","Saved ")+r.no,"ok"); isoNcrListM(); };

window._isoTqM=window._isoTqM||"";
window.isoTraceM=function(q){ if(q!=null) window._isoTqM=q; q=window._isoTqM; var Q=String(q).toLowerCase();
  var body=hd(IC.search,T("สอบย้อนกลับ","Traceability"),T("ที่มา-ที่ไปของสินค้า","Where goods came from and went"))
    +'<div style="display:flex;gap:8px;margin-bottom:12px"><input class="inp" id="trqM" value="'+esc(q)+'" placeholder="'+T("รหัส / ล็อต / ซีเรียล / เลขเอกสาร","Code / lot / serial / document")+'" onkeydown="if(event.key===\'Enter\')isoTraceM(this.value)"><button class="btn primary" style="width:auto;padding:0 18px" onclick="isoTraceM(document.getElementById(\'trqM\').value)">'+T("ค้น","Go")+'</button></div>';
  if(q){ var m=function(v){ return String(v||"").toLowerCase()===Q; };
    var hs=(DB.history||[]).filter(function(h){ return m(h.code)||m(h.lotNo)||m(h.sn)||m(h.orderNo)||m(h.lotSup); }).sort(function(a,b){ return (String(b.date)+String(b.time)).localeCompare(String(a.date)+String(a.time)); });
    var st=(DB.stock||[]).filter(function(s){ return (m(s.code)||m(s.lotNo)||m(s.sn)||m(s.lotSup))&&(parseInt(s.qty,10)||0)!==0; });
    var sumT=function(t){ return hs.filter(function(h){return h.type===t;}).reduce(function(a,h){return a+(parseFloat(h.qty)||0);},0); };
    body+='<div class="adm-kv"><div><b>'+num(sumT("IN"))+'</b>'+T("รับเข้า","In")+'</div><div><b>'+num(sumT("OUT"))+'</b>'+T("จ่ายออก","Out")+'</div><div><b>'+num(st.reduce(function(a,s){return a+(parseInt(s.qty,10)||0);},0))+'</b>'+T("คงเหลือ","On hand")+'</div></div>'
      +(st.length?'<div class="adm-grp">'+T("อยู่ที่ไหนตอนนี้","Where it is now")+'</div><div class="card" style="padding:6px 14px">'+st.map(function(s){ return '<div class="adm-tl"><b>'+esc(s.code)+' @ '+esc(s.loc)+'</b>'+(s.lotNo?' · '+esc(s.lotNo):'')+' · '+num(s.qty)+'</div>'; }).join("")+'</div>':"")

/* ── runner ── */
async function runStep(i){ var st=STEPS[i]; R.i=i; if(!st) return;
  if(st.pre){ try{ st.pre(); }catch(e){ console.warn(e); } await W(400); if(R.abort) return; }
  var x=st.el?await waitFor(st.el,4000):null; if(R.abort) return; if(window.__mdLog) window.__mdLog.push(i+":"+(!!x||!st.el));
  var r=await focusOn(x); bubble(st,r);
  if(st.act&&x){ await W(700/R.speed); if(R.abort) return; var v=typeof st.v==="function"?st.v():st.v;
    try{ if(st.act==="tap") await aTap(x); else if(st.act==="type") await aType(x,v); else if(st.act==="pick") await aPick(x,v); }catch(e){ console.warn("demo step",e); }
    if(st.wait) await waitFor(st.wait,4000); await W(250); var x2=$(st.el); var r2=(x2&&shown(vis(x2)))?await focusOn(x2):await focusOn(null); bubble(st,r2); } }
async function loop(){ while(R.on&&!R.abort&&R.i<R.n){ await runStep(R.i); if(R.abort) break;
    await new Promise(function(res){ R.next=res; if(!R.paused){ var dl=(STEPS[R.i]&&!STEPS[R.i].act)?2600:1500; R.tm=setTimeout(function(){ if(!R.paused) res(); },dl/R.speed); } });
    clearTimeout(R.tm); R.next=null; R.i++; } stop(); }
function stop(){ if(!R.on) return; R.abort=true; R.on=false; clearTimeout(R.tm); if(R.next){ var n=R.next; R.next=null; n(); }
  ["md-block","md-dim","md-bub","md-tap","md-ban"].forEach(rm); sbEnd(); toast(T("จบการสาธิต — คืนค่าข้อมูลเดิมแล้ว ไม่มีอะไรถูกบันทึก","Demo finished — everything put back, nothing was saved"),"ok"); }
window.mdStop=stop;
window.mdNext=function(){ if(R.next){ var n=R.next; R.next=null; n(); } };
window.mdPause=function(){ R.paused=!R.paused; bubble(STEPS[R.i]||{},null); if(!R.paused) window.mdNext(); };
window.mdStart=function(name){ var f=D[name]; if(!f||R.on) return; try{ mhClose(); }catch(e){} try{ closeSheet(); }catch(e){}
  R.on=true; R.abort=false; R.paused=false; R.i=0; sbBegin(); seed(); STEPS=f(); R.n=STEPS.length;
  el("md-block").addEventListener("click",function(e){ e.stopPropagation(); e.preventDefault(); },true); el("md-dim"); el("md-tap");
  el("md-ban").innerHTML=XI.demo+T("โหมดสาธิต — <b>ไม่บันทึกข้อมูลจริง</b>","Demo mode — <b>nothing is saved</b>"); loop(); };
document.addEventListener("keydown",function(e){ if(R.on&&e.key==="Escape"){ e.preventDefault(); stop(); } },true);

    if(ok){ ok.classList.remove("primary"); ok.classList.add("ghost"); p.insertBefore(b,ok); p.insertBefore(note,ok); } } }catch(e){}
  return r; }; }
