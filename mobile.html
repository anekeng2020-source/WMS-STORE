<script>/* localhost only: an optional local-dev.js (never uploaded) switches the app to local mode */
if(/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) document.write('<script src="local-dev.js"><\/script>');</script>
<script id="mobile-local">
/* ═══ LOCAL MODE (localhost + local-dev.js only) ═══
   The phone app talks to the backend through fetch(…api…php?action=…). On localhost with local-dev.js those calls are
   answered here instead, from the same browser storage the web app uses in local mode (wms_db_v3) — so index.html and
   mobile.html opened on the same localhost share one set of data, and nothing is sent to the real server. Sign-in uses
   the local-dev.js accounts (PBKDF2 hash) or users made on the web in local mode. */
(function(){
  if(!(window.LOCAL_DEV&&/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))) return;
  window.MOBILE_LOCAL=true;
  var KEY="wms_db_v3", realFetch=window.fetch.bind(window);
  function load(){ var d=null; try{ d=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
    if(!d||!d.partitions||!d.companies||!d.companies.length) d={companies:[{id:"C1",name:"My Company"}],users:[],partitions:{C1:{}},settings:{C1:{}},txnSeq:100,schedSeq:0,bookSeq:0,bomSeq:0};
    d.users=Array.isArray(d.users)?d.users:[]; d.settings=d.settings||{}; d.partitions=d.partitions||{};
    (LOCAL_DEV.users||[]).forEach(function(lu){ var i=d.users.findIndex(function(x){ return String(x.username).toLowerCase()===String(lu.username).toLowerCase(); });
      if(i<0) d.users.push(JSON.parse(JSON.stringify(lu))); else d.users[i]=Object.assign({},d.users[i],JSON.parse(JSON.stringify(lu))); });   // local accounts always current (as on the web)
    return d; }
  function save(d){ localStorage.setItem(KEY,JSON.stringify(d)); }
  function strip(u){ var o=Object.assign({},u); delete o.passHash; delete o.password; delete o.pin; return o; }
  function reply(status,obj){ return Promise.resolve(new Response(JSON.stringify(obj),{status:status,headers:{"Content-Type":"application/json"}})); }
  function hdr(init,name){ var h=(init&&init.headers)||{}; if(typeof h.get==="function") return h.get(name)||""; var k=Object.keys(h).find(function(x){ return x.toLowerCase()===name.toLowerCase(); }); return k?h[k]:""; }
  function me(init){ var t=hdr(init,"X-Auth-Token"), m=/^local:(.+)$/.exec(t||""); return m?m[1]:""; }
  function userOf(d,name){ return d.users.find(function(x){ return String(x.username).toLowerCase()===String(name||"").toLowerCase(); })||null; }
  async function passOk(p,h){ try{ var key=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);
    var bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:Uint8Array.from(atob(h.salt),function(c){ return c.charCodeAt(0); }),iterations:+h.iter||150000},key,256);
    return btoa(String.fromCharCode.apply(null,new Uint8Array(bits)))===h.hash; }catch(e){ return false; } }
  function rowKey(row,key){ if(typeof _rowKeyM==="function") return _rowKeyM(row,key); return String(row&&row[key]!=null?row[key]:""); }
  function setPath(o,path,v){ var x=o; for(var i=0;i<path.length-1;i++){ if(!x[path[i]]||typeof x[path[i]]!=="object") x[path[i]]={}; x=x[path[i]]; } x[path[path.length-1]]=v; }
  function unsetPath(o,path){ var x=o; for(var i=0;i<path.length-1;i++){ x=x&&x[path[i]]; if(!x) return; } if(x) delete x[path[path.length-1]]; }
  function applyBatch(d,b){ var cid=b.company; if(!cid) return;
    var p=d.partitions[cid]||(d.partitions[cid]={});
    (b.ops||[]).forEach(function(op){
      if(op.table==="settings"){ var s=d.settings[cid]||(d.settings[cid]={});
        if(op.mode==="replace") d.settings[cid]=op.data||{};
        else if(op.mode==="patch"){ (op.set||[]).forEach(function(x){ setPath(s,x[0],x[1]); }); (op.unset||[]).forEach(function(pth){ unsetPath(s,pth); }); }
        return; }
      var rows=Array.isArray(p[op.table])?p[op.table]:(p[op.table]=[]);
      if(op.mode==="replace"){ p[op.table]=op.data; return; }
      if(op.mode==="merge"){ var del={}; (op.deletes||[]).forEach(function(k){ del[k]=1; });
        if(op.deletes&&op.deletes.length) p[op.table]=rows=rows.filter(function(r){ return !del[rowKey(r,op.key)]; });
        (op.upserts||[]).forEach(function(u){ var k=rowKey(u,op.key), i=rows.findIndex(function(r){ return rowKey(r,op.key)===k; }); if(i>=0) rows[i]=u; else rows.push(u); });
        return; }
      if(op.mode==="delta"){ (op.rows||[]).forEach(function(x){ var k=rowKey(x.data,op.key), i=rows.findIndex(function(r){ return rowKey(r,op.key)===k; }), r=i>=0?rows[i]:null;
          if(!r){ r=JSON.parse(JSON.stringify(x.data)); Object.keys(x.d||{}).forEach(function(f){ r[f]=0; }); rows.push(r); }
          Object.keys(x.d||{}).forEach(function(f){ r[f]=Math.round(((parseFloat(r[f])||0)+x.d[f])*100)/100; });
          Object.keys(x.set||{}).forEach(function(f){ if(x.set[f]===null) delete r[f]; else r[f]=x.set[f]; });
          if(x.del&&op.table==="stock"&&(parseFloat(r.qty)||0)<=0){ var j=rows.indexOf(r); if(j>=0) rows.splice(j,1); } }); } });
    var g=b.globals||{};
    if(Array.isArray(g.companies)) d.companies=g.companies;
    if(Array.isArray(g.users)) d.users=g.users.map(function(u){ var old=userOf(d,u.username)||{}, o=Object.assign({},u);   // the phone never had the secrets: keep them
      ["passHash","password","pin"].forEach(function(f){ if(o[f]==null&&old[f]!=null) o[f]=old[f]; }); return o; });
    if(g.seq){ ["txnSeq","schedSeq","bookSeq","bomSeq"].forEach(function(k){ if(typeof g.seq[k]==="number") d[k]=Math.max(d[k]||0,g.seq[k]); }); } }
  async function handle(action,init){
    var body={}; try{ body=init&&init.body?JSON.parse(init.body):{}; }catch(e){}
    if(action==="login"){ var d=load(), u=userOf(d,body.username);
      var ok=!!u&&(body.pin!=null?(u.pin!=null&&String(u.pin)===String(body.pin)):(u.passHash?await passOk(String(body.password||""),u.passHash):(u.password!=null&&u.password===body.password)));
      if(!ok) return reply(401,{error:"invalid credentials"});
      return reply(200,{token:"local:"+u.username,user:strip(u)}); }
    var who=me(init); if(!who) return reply(401,{error:"not signed in"});
    if(action==="load"){ var d2=load(), m=userOf(d2,who); if(!m) return reply(401,{error:"not signed in"});
      return reply(200,{companies:d2.companies,users:d2.users.map(strip),partitions:d2.partitions,settings:d2.settings,billing:d2.billing||{},
        txnSeq:d2.txnSeq||100,schedSeq:d2.schedSeq||0,bookSeq:d2.bookSeq||0,bomSeq:d2.bomSeq||0,me:strip(m),caps:["table:huMaster"]}); }
    if(action==="savebatch"){ var d3=load(); applyBatch(d3,body); try{ save(d3); }catch(e){ return reply(413,{error:"browser storage full"}); } return reply(200,{ok:true}); }
    if(action==="upload") return reply(200,{path:String(body.data||"")});   // local mode: the photo stays inline
    return reply(200,{ok:true}); }
  window.fetch=function(input,init){ var url=typeof input==="string"?input:(input&&input.url)||"", m=/\.php\?(?:[^#]*&)?action=([a-z_]+)/i.exec(url);
    if(!m) return realFetch(input,init);
    var a=m[1].toLowerCase(); if(a==="version") return reply(200,{version:"local"});
    return handle(a,init); };
})();
</script>

<script id="keep-empty-maps">
/* The server (PHP) turns an empty object {} into an empty list [] — later, keys written onto that list
   ({}-style: list.someKey = value) are silently dropped by JSON, so the data vanished after a refresh.
   An empty list that carries named keys is really an object: send / store it as one. Real lists are untouched. */
(function(){
  if(Array.prototype.toJSON) return;
  Object.defineProperty(Array.prototype,"toJSON",{configurable:true,writable:true,value:function(){
    if(this.length!==0) return this;
    var ks=Object.keys(this); if(!ks.length) return this;
    var o={}; for(var i=0;i<ks.length;i++) o[ks[i]]=this[ks[i]];
    return o;
  }});
})();
</script>

<style>
:root{
  --orange:#e8720c;--orange2:#c2570a;--orange-grad:linear-gradient(135deg,#f0872a,#e8720c);
  --bg:#f4f2ee;--card:#ffffff;--ink:#1f2937;--sub:#6b7280;--sub2:#9ca3af;
  --line:#e7e1d6;--line2:#efeae1;--soft:#faf8f4;
  --ok:#22c55e;--okbg:#eafaf0;--danger:#ef4444;--warn:#f59e0b;--info:#0ea5e9;
  --shadow:0 2px 12px rgba(30,30,20,.06);--shadow2:0 8px 30px rgba(30,30,20,.14);
  --head:#1f2125;--head-ink:#f5f6f8;--head-sub:#9aa0a8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea,select{font-family:inherit;-webkit-user-select:text;user-select:text}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}

/* ── Top bar ── */
.top{position:sticky;top:0;z-index:40;background:var(--head);border-bottom:none;color:var(--head-ink);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
.top .logo{height:32px;max-width:110px;border-radius:0;background:none;display:flex;align-items:center;justify-content:center}
.top .logo img{height:28px;width:auto;max-width:110px;object-fit:contain;display:block}
.top .logo svg{width:20px;height:20px;stroke:#fff}
.top .tt{flex:1;min-width:0}
.top .tt b{font-size:16px;font-weight:800;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt span{font-size:11px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.top .co{font-size:10px;font-weight:700;background:var(--orange);color:#fff;padding:3px 9px;border-radius:20px;white-space:nowrap}
/* dark-header control overrides */
.top .tt span{color:var(--head-sub)}
.top .lang{background:rgba(255,255,255,.08);border-radius:20px}
.top .lang button{color:rgba(255,255,255,.72)}
.top .lang button.on{background:var(--orange);color:#fff}
.top .topbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff}
/* dark hero banner (top section) with light content below */
.hero{background:radial-gradient(130% 95% at 100% 0%, #3a2b1c 0%, rgba(58,43,28,0) 48%), var(--head);
  margin:-16px -16px 18px;padding:16px 16px 20px;border-radius:0 0 26px 26px;color:var(--head-ink)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
/* stock in / out picture: a box slides into the shelf (green ↓ in), another slides out (orange ↑ out) */
.sec-h{display:flex;align-items:baseline;justify-content:space-between}
.sec-h .sec-go{font-size:12px;font-weight:800;color:var(--orange);cursor:pointer;margin:20px 4px 10px;text-transform:none;letter-spacing:0}
.empty.tap{cursor:pointer}
.empty.tap small{display:block;margin-top:4px;color:var(--orange);font-weight:700}
.done-ic{width:46px;height:46px;display:block;margin:0 auto 8px}
.done-ic .ck{stroke-dasharray:20;stroke-dashoffset:20;animation:doneCk .55s cubic-bezier(.4,0,.2,1) .25s forwards}
.done-ic .bd{transform-origin:31px 31px;animation:donePop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes doneCk{to{stroke-dashoffset:0}}
@keyframes donePop{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.done-ic .ck,.done-ic .bd{animation:none;stroke-dashoffset:0}}
.due-late{font-size:10.5px;font-weight:800;color:#fff;background:var(--danger);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.hero .sub{color:var(--head-sub);margin-bottom:0}
/* home banner: one long, thin barcode — a laser sweeps across it, then the corners turn green */
.hero-top .ph-anim{flex:1 1 auto;min-width:0;max-width:250px;height:34px;display:block;margin:4px 0 0}
.ph-anim .lz{animation:phLz 2.6s ease-in-out infinite}
.ph-anim .ok{animation:phOk 2.6s ease-in-out infinite}
@keyframes phLz{0%{transform:translateX(0);opacity:0}6%{opacity:1}70%{transform:translateX(224px);opacity:1}76%,100%{transform:translateX(224px);opacity:0}}
@keyframes phOk{0%,68%{stroke:#ef6a10}74%,96%{stroke:#22c55e}100%{stroke:#ef6a10}}
@media (prefers-reduced-motion:reduce){.ph-anim *{animation:none!important}}
.hero-date{margin-left:auto;font-size:12px;color:var(--head-sub);text-align:right;font-weight:600;line-height:1.5;white-space:nowrap}
.hero .stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.hero .stat .v{color:#fff}
.hero .stat .l{color:rgba(255,255,255,.55)}
.hero .stat .ic{background:rgba(255,255,255,.1)}
.hero .stat .ic svg{stroke:#fff}
.hero .stat .go svg{stroke:rgba(255,255,255,.45)}
.topbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--sub);flex:0 0 auto;padding:0}
.topbtn svg{width:17px;height:17px;stroke:currentColor}
.topbtn:active{transform:scale(.92)}
.topbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Screen area ── */
.screen{padding:16px 16px 96px;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h1{font-size:22px;font-weight:900;margin-bottom:2px}
.sub{font-size:13px;color:var(--sub);margin-bottom:16px}
.sec-t{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin:20px 4px 10px}

/* ── Cards / stats ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:rgba(255,255,255,.6);border:1px solid var(--line2);border-radius:18px;padding:16px;box-shadow:0 1px 6px rgba(30,30,20,.04);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .1s}
.stat:active{transform:scale(.97)}
.stat .stat-top{display:flex;align-items:center;gap:11px}
.stat .ic{width:36px;height:36px;border-radius:11px;background:rgba(232,114,12,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stat .ic svg{width:19px;height:19px;stroke:var(--orange)}
.stat .v{font-size:27px;font-weight:900;line-height:1;color:var(--ink)}
.stat .l{font-size:12.5px;color:var(--sub);margin-top:10px;font-weight:600}
.stat .go{margin-left:auto;color:var(--sub2)}
.stat .go svg{width:16px;height:16px;stroke:currentColor}

/* list row */
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row .rt{flex:1;min-width:0}
.row .rt b{font-size:14.5px;font-weight:700;display:block}
.row .rt small{font-size:12px;color:var(--sub)}
.row .rv{font-weight:800;font-size:15px;text-align:right}
.thumb{width:44px;height:44px;border-radius:11px;background:rgba(232,114,12,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
.thumb svg{width:22px;height:22px;stroke:var(--orange)}
.thumb[style*="grad"] svg{stroke:#fff}
.thumb img{width:100%;height:100%;object-fit:cover}
.vbtn{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--sub);display:flex;align-items:center;justify-content:center;margin-left:8px;padding:0;cursor:pointer}
.vbtn svg{width:18px;height:18px}
/* expand button (same look as the web app): orange chevron in a soft box, turns down with an orange fill when open */
.xbtn{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--orange);display:flex;align-items:center;justify-content:center;margin-left:8px;padding:0;cursor:pointer;transition:transform .2s ease,background .15s;-webkit-tap-highlight-color:transparent}
.xbtn svg{width:18px;height:18px}
.xgrp.open .xbtn{transform:rotate(90deg);background:var(--orange-grad);border-color:transparent;color:#fff;box-shadow:0 4px 10px rgba(232,114,12,.3)}
.xgrp{border-bottom:1px solid var(--line2)}.xgrp:last-child{border-bottom:none}.xgrp>.row{border-bottom:none}
.xsub{display:none;background:var(--soft,#f8fafc);border-top:1px dashed var(--line2);padding:2px 0 8px}
.xgrp.open .xsub{display:block}
.xline{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 30px;border-bottom:1px solid var(--line2)}
.xline .rt{flex:1;min-width:0}.xline .rt b{font-size:13.5px}.xline .rt small{display:block;color:var(--sub);font-size:12px}
.xmore{display:block;margin:8px 16px 0 auto;border:none;background:none;color:var(--orange);font-weight:800;font-size:12.5px;cursor:pointer;padding:4px 0}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--okbg);color:#16a34a}

.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 26px;background:linear-gradient(160deg,#fff,#faf6f0)}

</style>

#splash .sp-box svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#splash .sp-brand{font-size:15px;font-weight:900;letter-spacing:1px;color:#e8720c;margin-bottom:-6px;opacity:0;animation:sp-up .55s .15s forwards}
#splash .sp-brand img{display:block;height:34px;max-width:160px;width:auto;object-fit:contain;margin:0 auto}

#splash .sp-bar{width:170px;height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}
#splash .sp-bar i{position:absolute;height:5px;width:44px;border-radius:99px;background:linear-gradient(90deg,#f7a34d,#e8720c);animation:sp-load 1.15s cubic-bezier(.4,0,.2,1) infinite}

<script>
/* Post-login loading screen — same look as the startup splash, plus a welcome line.
   EntryLoader.show({hello,name,sub}) right after the server accepts the login,
   EntryLoader.done() once the app has rendered underneath (kept visible >= MIN ms). */
window.EntryLoader=(function(){
  var MIN=1600, el=null, t0=0, cap=null;
  var BOX='<svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>';
  function line(cls,txt){ var d=document.createElement('div'); d.className=cls; d.textContent=txt||''; return d; }
  function show(o){
    o=o||{};
    var old=document.getElementById('splash'); if(old&&old.parentNode) old.parentNode.removeChild(old);
    el=document.createElement('div'); el.id='splash'; el.className='entry';
    el.innerHTML='<div class="sp-core"><div class="sp-ring"></div><div class="sp-box">'+BOX+'</div></div>'
      +'<div class="sp-brand"><img alt="logo" onerror="this.parentNode.style.display=\'none\'"></div>';
    var bl=(function(){try{return JSON.parse(localStorage.getItem('wms_brand')||'{}')||{};}catch(e){return {};}})(); el.querySelector('.sp-brand img').src=bl.logo||'images/logo.svg';
    el.appendChild(line('sp-title',o.hello));
    if(o.name) el.appendChild(line('sp-name',o.name));      // textContent: user data is never parsed as HTML
    el.appendChild(line('sp-sub',o.sub));
    var bar=document.createElement('div'); bar.className='sp-bar'; bar.innerHTML='<i></i>'; el.appendChild(bar);
    document.body.appendChild(el);
    t0=Date.now();
    clearTimeout(cap); cap=setTimeout(function(){ done(true); },15000);   // never trap the user behind the loader
  }
  function done(now){
    var e=el; el=null; clearTimeout(cap);
    if(!e) return Promise.resolve();
    var wait=now===true?0:Math.max(0,MIN-(Date.now()-t0));
    return new Promise(function(res){ setTimeout(function(){
      e.classList.add('hide'); setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); res(); },560);
    },wait); });
  }
  return {show:show, done:done};
})();
</script>

var _saveDirty=false, _saveT=null;
function downscaleImg(dataURI,maxPx,q){ return new Promise(function(res){
  var fin=false; function done(v){ if(fin)return; fin=true; res(v); }
  try{ if(!dataURI||String(dataURI).slice(0,5)!=="data:"){ done(dataURI); return; }
    var to=setTimeout(function(){ done(dataURI); },5000);
    var img=new Image();
    img.onload=function(){ clearTimeout(to); try{ var w=img.width,h=img.height,s=Math.min(1,(maxPx||1000)/Math.max(w,h));
      var nw=Math.max(1,Math.round(w*s)),nh=Math.max(1,Math.round(h*s));
      var c=document.createElement("canvas"); c.width=nw;c.height=nh; c.getContext("2d").drawImage(img,0,0,nw,nh);
      done(c.toDataURL("image/jpeg",q||0.8)); }catch(e){ done(dataURI); } };
    img.onerror=function(){ clearTimeout(to); done(dataURI); };
    img.src=dataURI;
  }catch(e){ done(dataURI); }
}); }
function uploadItemImageM(cid,code,dataURI){

function convertImagesM(){

    var parts=META.partitions||{}, jobs=[];
    Object.keys(parts).forEach(function(cid){ var items=(parts[cid]&&parts[cid].itemMaster)||[];

      });
    }); }, Promise.resolve());
  }catch(e){ return Promise.resolve(); }
}
var _saveFailAt=0;

    if(res.ok){ if(rev===_saveRev) _saveDirty=false; _saveFailAt=0; }   // an edit made meanwhile stays dirty (its save is queued)

  });
}
var _snapM={}, _snapRowsM={};
var _MERGEM={labelLog:"id",huMaster:"code",purchaseOrders:"id",salesOrders:"id",stock:"code|loc|lotNo|lotSup|mfd|exp|sn|hu?",history:"id",schedule:"id",bookings:"id",sales:"id",shifts:"id",returns:"id",stocktake:"id",promotions:"id",giftcards:"code",itemMaster:"code",locationMaster:"code",customerMaster:"code",supplierMaster:"code",ngMaster:"code",logisticMaster:"name",mpOrders:"id",withdrawals:"id"};

function _rowKeyM(row,key){ if(key.indexOf("|")>=0){ var s=""; key.split("|").forEach(function(f,i){ var opt=f.slice(-1)==="?"; if(opt) f=f.slice(0,-1);
    var v=(row&&row[f]!=null)?String(row[f]):""; if(opt&&v==="") return; s+=(i?"|":"")+v; }); return s; } return (row&&row[key]!=null)?String(row[key]):""; }
/* saves run one after another: two overlapping sends could each clear the other's queued change */
var _saveChain=null, _saveRev=0;
function saveByTableM(useBeacon){
  var prev=_saveChain||Promise.resolve();
  var p=prev.then(function(){},function(){}).then(function(){ return saveByTableM_(useBeacon); });
  _saveChain=p;
  var done=function(){ if(_saveChain===p) _saveChain=null; }; p.then(done,done);
  return p;
}
function saveByTableM_(useBeacon){
  if(!(session.user&&session.user.username)) return Promise.resolve({ok:false,err:"not signed in"});   // nothing is taken off the books without someone to send it as
  try{
    var cid=session.company; if(!cid) return Promise.resolve({ok:false});
    var p=(META.partitions&&META.partitions[cid])||{};
    var LIMIT=4*1024*1024;
    var ops=[], commit=[];
    Object.keys(p).forEach(function(tb){
      if(tb==="settings") return;                                   // DB.settings sits on the partition object; it travels as a settings patch
      var data=p[tb]||[];
      if(_MERGEM[tb]!==undefined && Array.isArray(data)){
        var key=_MERGEM[tb], snapKey=cid+":"+tb, snap=_snapRowsM[snapKey]||null;
        var cur={}; data.forEach(function(row){ cur[_rowKeyM(row,key)]=JSON.stringify(row); });
        if(deltaOn(tb,snap)){                                         // quantities as +/- changes
          var dr=deltaRows(tb,DELTA_FIELDS[tb],snap,cur);
          if(dr.rows.length) ops.push({table:tb,mode:"delta",key:key,id:deltaId(),rows:dr.rows});
          if(dr.dels.length) ops.push({table:tb,mode:"merge",key:key,upserts:[],deletes:dr.dels});
          if(dr.rows.length||dr.dels.length) commit.push(function(){ _snapRowsM[snapKey]=cur; });
          return; }
        var upserts=[], deletes=[];
        if(snap===null){ Object.keys(cur).forEach(function(k){ upserts.push(JSON.parse(cur[k])); }); }
        else{ Object.keys(cur).forEach(function(k){ if(cur[k]!==snap[k] && cur[k].length<=LIMIT) upserts.push(JSON.parse(cur[k])); });
              Object.keys(snap).forEach(function(k){ if(!(k in cur)) deletes.push(k); }); }
        if(upserts.length||deletes.length||snap===null){
          if(upserts.length||deletes.length) ops.push({table:tb,mode:"merge",key:key,upserts:upserts,deletes:deletes});
          commit.push(function(){ _snapRowsM[snapKey]=cur; });
        }
      } else {
        var b; try{ b=JSON.stringify(data); }catch(e){ return; }
        if(b.length>LIMIT) return;
        var sk=cid+":"+tb;
        if(_snapM[sk]!==b){ ops.push({table:tb,mode:"replace",data:data}); commit.push(function(){ _snapM[sk]=b; }); }
      }
    });
    (function(){ var s=(META.settings&&META.settings[cid])||{}; var b; try{b=JSON.stringify(s);}catch(e){return;} var sk="set:"+cid;
      if(_snapM[sk]!==b){ var po=settingsPatchOp(_snapM[sk],s,META.caps);
        if(!po) ops.push({table:"settings",mode:"replace",data:s}); else if(po.set.length||po.unset.length) ops.push(po);
        commit.push(function(){_snapM[sk]=b;}); } })();
    var globals={};
    (function(){ var b=JSON.stringify(META.companies||[]); if(_snapM["g:companies"]!==b){ globals.companies=META.companies||[]; commit.push(function(){_snapM["g:companies"]=b;}); } })();
    (function(){ var b=JSON.stringify(META.users||[]); if(_snapM["g:users"]!==b){ globals.users=META.users||[]; commit.push(function(){_snapM["g:users"]=b;}); } })();
    (function(){ var seq={txnSeq:txnSeq,schedSeq:META.schedSeq||0,bookSeq:META.bookSeq||0,bomSeq:META.bomSeq||0}; var b=JSON.stringify(seq); if(_snapM["g:seq"]!==b){ globals.seq=seq; commit.push(function(){_snapM["g:seq"]=b;}); } })();
    var me=(session.user&&session.user.username)||"";
    var cur=(ops.length||Object.keys(globals).length)?{company:cid,ops:ops,globals:globals}:null;
    /* every unsent change is kept in localStorage until the server confirms it, so closing the app,
       losing the network or an expired session never loses work. "base" = left over from an earlier
       run (replayed first, in order), "cur" = this run's changes since the last confirmed save. */
    var pend=pendLoadM(); if(pend.u&&pend.u!==me){ shelfPutM(pend.u,(pend.base||[]).concat(pend.cur?[pend.cur]:[])); pend={base:[]}; }   // another user's leftovers wait for them
    if(me) shelfTakeM(me,pend);
    if(pend.cur){ pend.base.push(pend.cur); pend.cur=null; }        // (queue written by an older version)
    if(cur){ commit.forEach(function(f){f();}); pend.base.push(cur); }   // frozen: this exact set (its ids too) is what every retry sends — never rebuilt
    pend.u=me; pendStoreM(pend);
    var step=function(){
      var pd=pendLoadM(); if(!(pd.base||[]).length) return Promise.resolve({ok:true});
      var x=pd.base[0], payload=JSON.stringify(x);
      /* app going to background: keepalive survives unload but is capped at 64KB */
      var keep=!!useBeacon && payload.length<60000;
      return sendBatchM(payload,keep).then(function(res){
        if(!res.ok && !res.drop) return res;                                 // stop; stays queued and is resent unchanged
        if(!res.ok) toast(T("เซิร์ฟเวอร์ไม่รับข้อมูลชุดหนึ่ง (ข้ามไป): ","The server refused a change set (skipped): ")+(res.err||""),"err");
        var p2=pendLoadM(), k=-1; (p2.base||[]).some(function(y,i){ if(JSON.stringify(y)===payload){ k=i; return true; } return false; });
        if(k>=0) p2.base.splice(k,1); pendStoreM(p2);                        // the one just sent, wherever it is now
        return step();
      });
    };
    return step();
  }catch(e){ return Promise.resolve({ok:false}); }
}
/* settings travel as a PATCH (only the fields that changed) once the server says it can merge them —
   a whole-object replace would undo another user's recent change (menus, features, label setup…) */
function settingsPatchOp(prevJson,cur,caps){
  if(!caps||caps.indexOf("settingsPatch")<0) return null;
  var prev=null; try{ prev=prevJson?JSON.parse(prevJson):null; }catch(e){}
  if(!prev||typeof prev!=="object"||Array.isArray(prev)) return null;
  var set=[], unset=[], isObj=function(v){ return !!v&&typeof v==="object"&&!Array.isArray(v); };
  (function walk(a,b,path){
    Object.keys(b).forEach(function(k){ var p=path.concat(k), bv=b[k];
      if(bv===undefined){ if(Object.prototype.hasOwnProperty.call(a,k)) unset.push(p); return; }
      if(isObj(a[k])&&isObj(bv)&&p.length<6) walk(a[k],bv,p);
      else if(!Object.prototype.hasOwnProperty.call(a,k)||JSON.stringify(a[k])!==JSON.stringify(bv)) set.push([p,bv]); });
    Object.keys(a).forEach(function(k){ if(!Object.prototype.hasOwnProperty.call(b,k)) unset.push(path.concat(k)); });
  })(prev,cur||{},[]);
  return {table:"settings",mode:"patch",set:set,unset:unset};
}
/* quantities travel as +/- changes once the server supports it (caps "delta"): two devices selling the same item at
   the same moment both send "-1" and the database adds both, instead of both sending "9" and losing a sale */
var DELTA_FIELDS={stock:["qty"],giftcards:["balance"],customerMaster:["points","storeCredit","totalSpent"]};
function deltaOn(tb,snap){ return !!(snap&&DELTA_FIELDS[tb]&&META&&META.caps&&META.caps.indexOf("delta")>=0); }
function deltaId(){ return "D"+Date.now().toString(36)+Math.random().toString(36).slice(2,9); }   // one per change set: a retry is never added twice
/* snap / cur: {rowKey: JSON of the row} -> {rows:[{data,d,set,del}], dels:[rowKey]} */
function deltaRows(tb,fields,snap,cur){
  var rows=[], dels=[], num=function(v){ var n=parseFloat(v); return isFinite(n)?n:0; };
  Object.keys(cur).forEach(function(k){
    if(cur[k]===snap[k]) return;
    var c=JSON.parse(cur[k]), s=(k in snap)?JSON.parse(snap[k]):null, d={}, set={};
    fields.forEach(function(f){ var x=Math.round((num(c[f])-(s?num(s[f]):0))*100)/100; if(x) d[f]=x; });
    Object.keys(c).forEach(function(f){ if(fields.indexOf(f)>=0) return; if(!s||JSON.stringify(c[f])!==JSON.stringify(s[f])) set[f]=c[f]; });
    if(s) Object.keys(s).forEach(function(f){ if(fields.indexOf(f)<0&&!(f in c)) set[f]=null; });
    if(s&&!Object.keys(d).length&&!Object.keys(set).length) return;
    rows.push({data:c,d:d,set:set}); });

function authShake(){ var a=document.querySelector("#app .auth"); if(a){a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake");setTimeout(function(){a.classList.remove("shake");},350);} }
function authErrMsg(e){ return (e&&e.status===401)?T("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง","Invalid credentials"):((e&&e.message)||T("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้","Cannot reach server")); }
function doLogin(){
  var u=(document.getElementById("lg_u")||{}).value||"", p=(document.getElementById("lg_p")||{}).value||"";
  u=u.trim();
  if(!u||!p){ toast(T("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง","Invalid credentials"),"err"); authShake(); return; }
  authCall("login",{username:u,password:p}).then(afterLogin).catch(function(e){ toast(authErrMsg(e),"err"); authShake(); if(!e||e.status!==429) showApiHint(e); });
}
/* server accepted the credentials: keep the token, load this user's data, enter the app */
function afterLogin(d){
  _lockedM=false;                                                    // signed in again (e.g. after the session expired on the PIN screen)
  setAuthTok(d.token);
  EntryLoader.show({hello:T("ยินดีต้อนรับ","Welcome"), name:(d.user&&(d.user.fullName||d.user.username))||"",
    sub:T("กำลังเตรียมข้อมูลคลังสินค้า…","Preparing your workspace…")});
  return loadFromServer().then(function(remote){
    if(!remote||remote==="UNAUTH"){ EntryLoader.done(true); showNoData(); return; }
    META=remote; ensureMeta(); saveMETA();
    var me=META.me||d.user;
    var user=(META.users||[]).find(function(x){return String(x.username).toLowerCase()===String(me.username).toLowerCase();})||me;
    session.user=user; activateCompany(homeCompany(user)); txnSeq=META.txnSeq||0;
    if(pendLoadM().base.length) return saveByTableM().then(function(res){      // unsent work from before: send it, then take the fresh copy
      return res&&res.ok?loadFromServer():null; }).then(function(r2){
      if(r2&&r2.companies){ var cid=session.company; META=r2; ensureMeta(); saveMETA(); session.user=curUserM()||session.user; activateCompany(cid); txnSeq=META.txnSeq||0; }
      enterM(); });
    enterM(); });
  function enterM(){
    var user=session.user;
    try{localStorage.setItem(SESS_KEY,JSON.stringify({user:{username:user.username},company:session.company}));localStorage.setItem("_wms_last_user",user.username);}catch(e){}
    beep("success"); go("home");                        // app renders underneath the loader
    EntryLoader.done();
    if(d.weak) setTimeout(function(){ toast(T("รหัสผ่านไม่ปลอดภัย — กรุณาเปลี่ยนในเว็บหลัก","Weak password — please change it in the web app"),"warn"); },900);
  }
}
function homeCompany(u){ return (u&&u.company&&u.company!=="*"&&(META.companies||[]).some(function(c){return c.id===u.company;}))?u.company:((META.companies[0]&&META.companies[0].id)||"C1"); }
function ensureMeta(){ if(!META.companies||!META.companies.length) META.companies=[{id:"C1",name:"My Company"}];
  META.users=META.users||[]; META.partitions=META.partitions||{}; META.settings=META.settings||{}; }

/* PINs are 4–6 digits. Auto-submit at the length this user used last time on this device; otherwise press OK. */
function pinUserM(){ return _pinMode==="login"?((document.getElementById("pl_user")||{}).value||"").trim().toLowerCase():String((session.user&&session.user.username)||"").toLowerCase(); }
function pinLenM(){ try{ return parseInt(localStorage.getItem("_wms_pinlen_"+pinUserM()))||0; }catch(e){ return 0; } }
function pinDots(err){var el=document.getElementById("pinDots");if(!el)return;el.className="pin-dots"+(err?" err":"");
  var n=Math.min(6,Math.max(pinLenM()||4,_pin.length)); while(el.children.length<n){ var d=document.createElement("div"); el.appendChild(d); } while(el.children.length>n) el.removeChild(el.lastChild);
  [].forEach.call(el.children,function(d,i){d.className="d"+(i<_pin.length?" on":"");});}
function pinOkBtn(){ return '<button class="btn primary" style="margin-top:14px" onclick="pinCheck()">'+T("ตกลง","OK")+'</button>'; }
function pinPress(n,btn){ if(_pin.length>=6)return; beep("tap"); vib(12);
  if(btn){ btn.classList.remove("tapd"); void btn.offsetWidth; btn.classList.add("tapd"); setTimeout(function(){btn.classList.remove("tapd");},420); }
  _pin+=n; pinDots();
  var el=document.getElementById("pinDots"); if(el){ var d=el.children[_pin.length-1]; if(d){ d.classList.add("pop"); setTimeout(function(){d.classList.remove("pop");},320); } }
  var want=pinLenM(); if((want&&_pin.length===want)||_pin.length===6) setTimeout(pinCheck,150);
}
function pinDel(btn){ if(!_pin.length){ if(btn){btn.classList.remove("deld");void btn.offsetWidth;btn.classList.add("deld");setTimeout(function(){btn.classList.remove("deld");},320);} return; }
  beep("del"); vib(18);
  if(btn){ btn.classList.remove("deld"); void btn.offsetWidth; btn.classList.add("deld"); setTimeout(function(){btn.classList.remove("deld");},320); }
  var el=document.getElementById("pinDots"); if(el){ var d=el.children[_pin.length-1]; if(d){ d.classList.add("out"); setTimeout(function(){ _pin=_pin.slice(0,-1); pinDots(); },210); return; } }
  _pin=_pin.slice(0,-1); pinDots();
}
function pinSwitch(){ leaveSessionM(); }
function pinErr(){ beep("err"); pinDots(true);navigator.vibrate&&navigator.vibrate(120);setTimeout(function(){_pin="";pinDots();},420);}
function pinCheck(){
  var pin=_pin;
  if(pin.length<4){ toast(T("PIN ต้องมี 4–6 หลัก","PIN must be 4–6 digits"),"err"); pinErr(); return; }
  var remember=function(){ try{ localStorage.setItem("_wms_pinlen_"+pinUserM(),String(pin.length)); }catch(e){} };
  var pinFail=function(e){ toast((e&&e.status&&e.status!==401&&e.message)?e.message:T("PIN ไม่ถูกต้อง หรือไม่พบผู้ใช้","Wrong PIN or user not found"),"err"); pinErr(); };
  if(_pinMode==="login"){
    var uname=((document.getElementById("pl_user")||{}).value||"").trim();
    if(!uname){ toast(T("กรุณากรอกชื่อผู้ใช้","Please enter a username"),"err"); pinErr(); return; }
    authCall("login",{username:uname,pin:pin}).then(function(d){ remember(); return afterLogin(d); }).catch(pinFail);
  } else {                                   // quick unlock: the server re-checks the PIN and issues a fresh token

function openSchedule(id){
  var s=findSched(id); if(!s){toast(T("ไม่พบเอกสาร","Order not found"),"err");return;}
  var isIn=(s.type==="PO"||s.type==="PD"), who=s.supplier||s.customer||s.dept||"", p=schedProgress(s);

function schedLineConfirm(id,idx){
  var s=findSched(id); if(!s)return; var ln=(s.lines||[])[idx]; if(!ln)return;
  var isIn=(s.type==="PO"||s.type==="PD"), it=itemByCode(ln.code)||{code:ln.code,name:ln.name,unit:ln.unit};
  if(!canFeat("schedule")||!canFeat(isIn?"receive":"issue")){ toast(T("ไม่มีสิทธิ์ทำรายการนี้","No permission"),"err"); return; }
  if(s.status==="Cancelled"){ toast(T("เอกสารนี้ถูกยกเลิกแล้ว","This schedule was cancelled"),"err"); return; }
  var entered=wholeQ((document.getElementById("op_qty")||{}).value);
  if(entered<=0){toast(T("ใส่จำนวนเต็มที่มากกว่า 0","Enter a whole number above 0"),"err");return;}
  var up=opUnitParts(), mult=up.mult>0?up.mult:1, qty=entered*mult, uLabel=up.label||it.unit||"";
  var rem=(parseInt(ln.qty)||0)-(parseInt(ln.done)||0);
  if(qty>rem&&!confirm(T("จำนวนเกินที่ค้าง (","More than remaining (")+num(Math.max(0,rem))+T(") ดำเนินการต่อ?","). Continue?"))) return;
  var pkgNote=(mult>1)?(entered+" "+uLabel+" × "+mult):"";
  if(isIn){
    var to=(document.getElementById("op_to")||{}).value;
    if(!to){toast(T("เลือกตำแหน่งปลายทาง","Select destination"),"err");return;}
    if(!capWarnM(to,qty))return;
    var huS=window.huPutM?huPutM(to,"op"):{hu:""}; if(!huS) return;           /* pallet / tote (when turned on) */
    receiveStock(ln.code,to,qty,{hu:huS.hu||""});
    hpush({id:nextTxnId(),type:"IN",date:today(),time:nowTime(),code:ln.code,name:it.name||ln.name,qty:qty,unit:it.unit||ln.unit,unitQty:uLabel,pkg:pkgNote,loc:to,hu:huS.hu||undefined,pallet:huS.pallet||undefined,tote:huS.tote||undefined,orderNo:(s.ref||s.id),note:(s.type+" Receive"),status:"Stored",schedId:s.id,schedLineCode:ln.code,schedLineIdx:idx});
    toast(T("รับเข้าแล้ว","Received")+" +"+qty,"ok");
  } else {
    var from=(document.getElementById("op_from")||{}).value;
    if(availAt(ln.code,from)<qty){toast(T("สต๊อกไม่พอ","Not enough stock"),"err");return;}
    var scs=takeAt(ln.code,from,qty,(document.getElementById("op_lot")||{}).value);
    hpushLots({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:ln.code,name:it.name||ln.name,qty:qty,unit:it.unit||ln.unit,unitQty:uLabel,pkg:pkgNote,loc:from,orderNo:(s.ref||s.id),note:(s.type+" Issue"),status:"Done",schedId:s.id,schedLineCode:ln.code,schedLineIdx:idx},scs);
    toast(T("เบิกออกแล้ว","Issued")+" -"+qty,"ok");
  }
  ln.done=(parseInt(ln.done)||0)+qty;
  s.status=(s.lines||[]).every(function(l){return (parseInt(l.done)||0)>=(parseInt(l.qty)||0);})?"Done":"Pending";   // same words as the web app
  mSave();
  if(CUR==="home")renderHome();else if(CUR==="stock")renderStock();else if(CUR==="history")renderHistory();
  openSchedule(s.id||s.ref);
}

    +'<div class="opt" onclick="closeSheet();histEditForm('+jsn(h.id)+')"><div class="oi" style="background:var(--orange-grad)">'+IC.pencil+'</div><div><b>'+T("แก้ไขรายการ","Edit record")+'</b><small>'+T("แก้จำนวน / ตำแหน่ง","Change qty / location")+'</small></div></div>'
    +'<div class="opt" onclick="closeSheet();histDelete('+jsn(h.id)+')"><div class="oi" style="background:linear-gradient(135deg,#f87171,#dc2626)">'+IC.trash+'</div><div><b>'+T("ลบรายการ","Delete record")+'</b><small>'+T("คืนสต๊อกตามรายการนี้","Reverses this movement")+'</small></div></div>';
  openSheet(body);

/* the other half of a two-record move (transfer / QC / NG release): OUT loc→toLoc  <->  IN loc=toLoc,fromLoc=loc */
function histPartner(h){
  if(h.pair!=null){ var pm=(DB.history||[]).find(function(x){ return x!==h&&x.pair===h.pair; }); if(pm) return pm; }   // linked when written
  var isIn=(h.type==="IN"||h.type==="NGIN"), other=isIn?h.fromLoc:h.toLoc; if(!other) return null;
  var best=null, bestGap=Infinity;
  (DB.history||[]).forEach(function(x){ if(x===h||x.code!==h.code||(parseInt(x.qty)||0)!==(parseInt(h.qty)||0)||(x.orderNo||"")!==(h.orderNo||"")) return;
    var xIn=(x.type==="IN"||x.type==="NGIN"); if(xIn===isIn) return;
    if(isIn ? (x.loc!==other||x.toLoc!==h.loc) : (x.loc!==other||x.fromLoc!==h.loc)) return;
    var gap=Math.abs((+x.id||0)-(+h.id||0)); if(gap<bestGap){ bestGap=gap; best=x; } });
  return best;
}
/* booking reservation rows: editing / deleting them here would hand the stock back twice */
function histLockedM(h){ if(h&&h.note==="BOOKING"&&h.status==="Reserved"){ toast(T("รายการนี้เป็นการกันสต๊อกของการจอง — แก้ไข/ยกเลิกที่การจอง","This is a booking reservation — change it from the booking"),"warn"); return true; } return false; }
/* a history row posted against a schedule line: keep that line's "done" (and the schedule status) in step */
function syncSchedFromHistM(h,deltaDone){
  if(!deltaDone) return; var isIn=(h.type==="IN"||h.type==="NGIN"), s=null;
  if(h.schedId!=null) s=(DB.schedule||[]).find(function(x){ return String(x.id)===String(h.schedId); });
  else if(h.orderNo&&/ (Receive|Issue)$/.test(h.note||"")) s=(DB.schedule||[]).find(function(x){ return x.ref===h.orderNo&&((x.type==="PO"||x.type==="PD")===isIn)&&(x.lines||[]).some(function(l){ return l.code===h.code; }); });
  if(!s) return;
  var code=h.schedLineCode||h.code, lines=s.lines||[], left=deltaDone, num0=function(v){ return parseFloat(v)||0; };
  if(h.schedLineIdx!=null&&lines[h.schedLineIdx]&&lines[h.schedLineIdx].code===code){ var l0=lines[h.schedLineIdx], nv0=Math.max(0,num0(l0.done)+left); left-=nv0-num0(l0.done); l0.done=nv0; }
  lines.filter(function(l){ return l.code===code; }).forEach(function(l){ if(!left) return; var cur=num0(l.done), nv=left<0?Math.max(0,cur+left):cur+left; left-=nv-cur; l.done=nv; });
  if(s.status!=="Cancelled"){ var q=lines.reduce(function(a,l){ return a+num0(l.qty); },0), d=lines.reduce(function(a,l){ return a+num0(l.done); },0);
    s.status=(q>0&&d>=q)?"Done":(d>0?"Pending":"Planned"); }
}
/* after a history row was removed: if it was the last issue row of a booking, that booking is no longer issued */
function bkAfterHistGoneM(h){
  if(!h||h.bookingId==null||h.status==="Reserved") return false;
  var b=(DB.bookings||[]).find(function(x){ return String(x.id)===String(h.bookingId); }); if(!b||!bkIssued(b)) return false;
  var left=(DB.history||[]).some(function(x){ return x.bookingId!=null&&String(x.bookingId)===String(b.id)&&x.status!=="Reserved"; });
  if(left) return false;
  b.issued=false; b.reserved=false;                                  // its stock came back with the deleted rows
  if(b.status==="Reserved"||b.status==="Done"||b.status==="Fulfilled") b.status="Booked";
  return true;
}
function histDelete(id){
  if(!isAdminM()){toast(T("เฉพาะผู้ดูแล (Admin)","Admin only"),"err");return;}
  var h0=(DB.history||[]).find(function(h){return String(h.id)===String(id);}); if(!h0)return;
  if(histLockedM(h0)) return;
  if(h0.soRef||h0.subtype){ toast(T("รายการนี้ผูกกับเอกสาร SO — แก้ที่เอกสารแทน","Linked to a sales order — change it there"),"err"); return; }
  var mate=histPartner(h0);
  if(h0.orderNo==="HU-MOVE"){ toast(T("รายการนี้มาจากการย้ายทั้งพาเลท/ตะกร้า — ให้ย้ายภาชนะกลับที่เดิมแทนการลบ","This came from moving a whole pallet / tote — move the container back instead"),"err"); return; }
  var inHu=[h0].concat(mate?[mate]:[]).filter(function(r){ return r&&r.hu&&(r.type==="IN"||r.type==="NGIN"); })[0];
  if(inHu&&stockAtHuM(inHu.code,inHu.loc,inHu.hu)<(parseInt(inHu.qty)||0)){ toast(T("ลบไม่ได้ — สินค้าใน "+inHu.hu+" ที่ "+inHu.loc+" ถูกใช้หรือย้ายไปแล้ว","Can't delete — the stock in "+inHu.hu+" at "+inHu.loc+" was used or moved since"),"err"); return; }
  if(!confirm(mate?T("ลบรายการย้ายนี้ทั้งคู่ (ออก+เข้า) และย้อนสต๊อก?","Delete both halves of this move (out + in) and reverse stock?")
                  :T("ลบรายการนี้และย้อนสต๊อก?","Delete this record and reverse stock?")))return;
  var needDel={};                                                    // stock each deleted receipt must still have on hand
  [h0].concat(mate?[mate]:[]).forEach(function(h){ if(h.type==="IN"||h.type==="NGIN"){ var k=h.code+"@@"+h.loc+"@@"+(h.hu||""); needDel[k]=(needDel[k]||0)+(parseInt(h.qty)||0); } });
  if(mate){ var back=(h0.type==="IN"||h0.type==="NGIN")?mate:h0; var kb=back.code+"@@"+back.loc+"@@"+(back.hu||""); if(needDel[kb]) needDel[kb]-=(parseInt(back.qty)||0); }   // the move's other half gives it back first
  for(var nk in needDel){ var pp=nk.split("@@"); if(needDel[nk]>0&&stockAtHuM(pp[0],pp[1],pp[2])<needDel[nk]){ toast(T("สต๊อกไม่พอ","Not enough stock")+": "+pp[0]+" @"+pp[1]+T(" — ของชุดนี้ถูกใช้ไปแล้ว"," — this stock was already used"),"err"); return; } }
  [h0].concat(mate?[mate]:[]).forEach(function(h){
    var idx=DB.history.indexOf(h); if(idx<0) return;
    var sign=(h.type==="IN"||h.type==="NGIN")?1:-1;
    changeAt(h.code,h.loc,-sign*(parseInt(h.qty)||0),h);
    syncSchedFromHistM(h,-(parseInt(h.qty)||0));                     // the schedule line it was posted against
    DB.history.splice(idx,1); });
  var bkBack=bkAfterHistGoneM(h0);
  mSave(); toast(bkBack?T("ลบรายการแล้ว — การจองกลับเป็น “จองแล้ว” เบิกใหม่ได้","Record deleted — the booking is back to Booked"):T("ลบรายการแล้ว","Record deleted"),"ok"); renderHistory(); bindScanButton();
}

function histEditSave(id){
  if(!isAdminM())return;

var HIST_PER_PAGE=15;
function histPageRows(list){ var pages=Math.max(1,Math.ceil(list.length/HIST_PER_PAGE));
  if(_histPage>pages)_histPage=pages; if(_histPage<1)_histPage=1;
  return list.slice((_histPage-1)*HIST_PER_PAGE,_histPage*HIST_PER_PAGE); }
function histPager(list){
  var total=list.length, pages=Math.max(1,Math.ceil(total/HIST_PER_PAGE));
  if(!total) return '';
  var first=(_histPage-1)*HIST_PER_PAGE+1, last=Math.min(_histPage*HIST_PER_PAGE,total);
  return '<div class="hpager">'
    +'<button class="btn ghost sm"'+(_histPage<=1?' disabled':'')+' onclick="histPage('+(_histPage-1)+')">'+T("ก่อนหน้า","Prev")+'</button>'
    +'<span>'+num(first)+'–'+num(last)+' / '+num(total)+'</span>'
    +'<button class="btn ghost sm"'+(_histPage>=pages?' disabled':'')+' onclick="histPage('+(_histPage+1)+')">'+T("ถัดไป","Next")+'</button>'
    +'</div>';
}

  var list=(META.users||[]).filter(function(u){ return u&&u.username&&(u.company===session.company||u.company==="*"||!u.company); })
    .sort(function(a,b){return String(a.username).localeCompare(String(b.username));});
  var rows=list.map(function(u){
    var n=MORE_ITEMS.filter(function(m){return moreHiddenFor(u,m.id);}).length;
    return '<div class="row" onclick="moreMenuUser('+jsa(u.username)+')"><div class="thumb">'+IC.users+'</div><div class="rt"><b>'+esc(u.fullName||u.username)+'</b><small>'+esc(u.username)+' · '+esc(u.position||"-")+'</small></div>'
      +'<div class="rv" style="font-size:12px;color:'+(n?"var(--danger)":"var(--sub)")+'">'+(n?T("ซ่อน ","Hidden ")+n:T("แสดงทั้งหมด","All shown"))+'</div></div>';
  }).join("")||'<div class="empty">'+T("ไม่พบผู้ใช้","No users")+'</div>';
  openSheet('<div class="grab"></div><div class="sh-h"><div class="thumb" style="background:var(--orange-grad)">'+IC.users.replace(/currentColor/g,"#fff")+'</div><div style="flex:1"><b>'+T("ตั้งค่าเมนูตามผู้ใช้","Menu settings per user")+'</b><small>'+T("เลือกผู้ใช้เพื่อซ่อน/แสดงเมนู","Pick a user to hide / show items")+'</small></div></div>'
    +'<div class="card">'+rows+'</div>');
}
/* admin: tick which More items this user can see */
function moreMenuUser(username){
  var u=(META.users||[]).find(function(x){return x.username===username;}); if(!u) return;
  var rows=MORE_ITEMS.map(function(m){
    return '<label class="row" style="cursor:pointer"><div class="thumb">'+(IC[m.ic]||IC.box)+'</div><div class="rt"><b>'+T(m.th,m.en)+'</b><small>'+(m.ok===isMgrUpM?T("เฉพาะ Manager ขึ้นไป","Manager and above"):m.ok===isAdminM?T("เฉพาะ Admin","Admin only"):T(m.sth,m.sen))+'</small></div>'
      +'<input type="checkbox" class="mmChk" data-id="'+esc(m.id)+'" '+(moreHiddenFor(u,m.id)?"":"checked")+' style="width:22px;height:22px;accent-color:var(--orange)"></label>';
  }).join("");
  openSheet('<div class="grab"></div><div class="sh-h"><div class="thumb">'+IC.users+'</div><div style="flex:1"><b>'+esc(u.fullName||u.username)+'</b><small>'+T("ติ๊ก = แสดงในเมนูเพิ่มเติม","Ticked = shown in More")+'</small></div></div>'
    +'<div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn ghost sm" style="flex:1" onclick="mmAll(true)">'+T("แสดงทั้งหมด","Show all")+'</button><button class="btn ghost sm" style="flex:1" onclick="mmAll(false)">'+T("ซ่อนทั้งหมด","Hide all")+'</button></div>'
    +'<div class="card" style="margin-bottom:14px">'+rows+'</div>'
    +'<button class="btn primary" onclick="moreMenuSave('+jsa(username)+')">'+T("บันทึก","Save")+'</button>'
    +'<button class="btn ghost" style="margin-top:10px" onclick="moreMenuSettings()">'+T("กลับ","Back")+'</button>');
}
function mmAll(on){ [].forEach.call(document.querySelectorAll(".mmChk"),function(c){c.checked=on;}); }
function moreMenuSave(username){
  if(!isAdminM()) return;
  var u=(META.users||[]).find(function(x){return x.username===username;}); if(!u) return;
  var menus=Object.assign({},u.menus||{});
  [].forEach.call(document.querySelectorAll(".mmChk"),function(c){ var id=c.getAttribute("data-id"); if(c.checked) delete menus[id]; else menus[id]=true; });
  u.menus=menus;
  if(session.user&&session.user.username===username) session.user.menus=menus;
  mSave(); beep("success"); toast(T("บันทึกการตั้งค่าเมนูแล้ว","Menu settings saved"),"ok");
  moreMenuSettings(); if(CUR==="more") renderMore();
}

function imPickImg(inp){ var f=inp.files&&inp.files[0]; if(!f) return;
  var rd=new FileReader(); rd.onload=function(e){ downscaleImg(e.target.result,1000,0.8).then(function(small){ _imImg=small;
    var p=document.getElementById("imPrev"); if(p) p.innerHTML='<img src="'+small+'" style="width:100%;height:100%;object-fit:cover">'; }); };
  rd.readAsDataURL(f); }
function imClearImg(){ _imImg=""; var p=document.getElementById("imPrev"); if(p) p.innerHTML=IC.box; }
function itemSaveM(code){
  if(!isAdminM()){ toast(T("สำหรับผู้ดูแลระบบเท่านั้น","Admins only"),"err"); return; }
  var isNew=!code, g=function(id){ var e=document.getElementById(id); return e?String(e.value).trim():""; };
  var n=function(id){ var v=g(id); return v===""?"":(parseFloat(v)||0); };
  var rec={ code:isNew?g("im_code"):code, name:g("im_name"), barcode:g("im_barcode"), unit:g("im_unit"), cat:g("im_cat"),
    unitPackage:g("im_unitPackage"), qtyPackage:n("im_qtyPackage"), cost:n("im_cost"), price:n("im_price"),
    minQty:n("im_minQty"), maxQty:n("im_maxQty"), sup:g("im_sup"), shelfLifeDays:n("im_shelfLifeDays"), desc:g("im_desc") };
  if(!rec.code){ toast(T("กรุณากรอกรหัสสินค้า","Item code is required"),"err"); return; }
  if(!rec.name){ toast(T("กรุณากรอกชื่อสินค้า","Item name is required"),"err"); return; }
  if(isNew && (DB.itemMaster||[]).some(function(x){return String(x.code).toLowerCase()===rec.code.toLowerCase();})){ toast(T("รหัสสินค้านี้มีอยู่แล้ว","This item code already exists"),"err"); return; }
  if(rec.barcode && (DB.itemMaster||[]).some(function(x){return x.code!==rec.code&&String(x.barcode||"")===rec.barcode;})){ toast(T("บาร์โค้ดนี้ใช้กับสินค้าอื่นแล้ว","Barcode already used by another item"),"err"); return; }
  var btn=document.getElementById("imSaveBtn"); if(btn){ btn.disabled=true; btn.style.opacity=".6"; }
  var cid=session.company;
  var imgStep;
  if(_imImg){ imgStep=uploadItemImageM(cid,rec.code,_imImg).then(function(path){ rec.img=path; }); }          // new photo -> Supabase Storage
  else if(_imImg===""){ rec.img=""; imgStep=_imHadImg?fetch(PHP_API+"?action=delimg",{method:"POST",headers:apiHeaders(),body:JSON.stringify({company:cid,code:rec.code}),cache:"no-store"}).catch(function(){}):Promise.resolve(); }
  else imgStep=Promise.resolve();
  imgStep.then(function(){
    var list=DB.itemMaster=DB.itemMaster||[];
    var it=isNew?null:list.find(function(x){return x.code===code;});
    if(it){
      var oldP=parseFloat(it.price)||0, newP=parseFloat(rec.price)||0;
      if(rec.price!==""&&newP!==oldP){ if(!Array.isArray(it.priceHistory)) it.priceHistory=[];
        it.priceHistory.push({prevPrice:oldP,price:newP,at:new Date().toISOString(),by:whoName(),note:"mobile"}); }
      Object.assign(it,rec);
    } else { list.push(rec); }
    mSave(); beep("success"); toast(T("บันทึกสินค้าแล้ว","Item saved"),"ok");
    _imQ=""; itemMasterM();
  }).catch(function(e){
    if(btn){ btn.disabled=false; btn.style.opacity=""; }
    toast(T("อัปโหลดรูปไม่สำเร็จ: ","Photo upload failed: ")+((e&&e.message)||e),"err");
  });
}

/* ═══ BOOKING ═══ */
/* same model as the web app: an issued booking keeps status Booked/Reserved + issued:true; a reserved one already
   took its stock at booking time, held in history rows {note:"BOOKING",status:"Reserved",bookingId} */
function bkIssued(b){ return !!(b&&(b.issued||b.status==="Done"||b.status==="Fulfilled")); }
function bkState(b){ if(!b) return "Booked"; if(b.status==="Cancelled") return "Cancelled"; if(bkIssued(b)) return "Done";
  if(b.reserved||b.status==="Reserved") return "Reserved"; return "Booked"; }
function bkStateLabel(s){ return ({Booked:T("จองแล้ว","Booked"),Reserved:T("กันสต๊อกแล้ว","Reserved"),Done:T("เบิกแล้ว","Issued"),Cancelled:T("ยกเลิก","Cancelled")})[s]||s; }
function bkPill(b){ var s=bkState(b); return '<span class="pill '+(s==="Done"?"ok":(s==="Cancelled"?"ng":"warn"))+'"><i></i>'+esc(bkStateLabel(s))+'</span>'; }
function bkFind(id){ return (DB.bookings||[]).find(function(x){return String(x.id)===String(id)||String(x.ref)===String(id);}); }
function bkResRowsM(b){ return (DB.history||[]).filter(function(h){ return h.note==="BOOKING"&&h.status==="Reserved"&&(h.bookingId!=null?String(h.bookingId)===String(b.id):h.orderNo===b.ref); }); }
/* give a reservation back to the very lots it came from and drop its rows */
function bkUnreserveM(b){ var rows=bkResRowsM(b);
  if(rows.length) rows.forEach(function(r){ changeAt(r.code,r.loc,parseInt(r.qty)||0,r); });
  else (b.lines||[]).forEach(function(l){ var q=parseInt(l.qty)||0; if(q>0) receiveStock(l.code,l.loc,q,{}); });   // very old booking without rows
  for(var i=DB.history.length-1;i>=0;i--) if(rows.indexOf(DB.history[i])>=0) DB.history.splice(i,1);
  b.reserved=false; if(b.status==="Reserved") b.status="Booked"; }
/* issue a booking — reserved: its rows just become Done (stock is already out); otherwise FIFO, one history row per lot */
function bkFulfillM(b,cust,ship,note){
  if(!b||bkIssued(b)||b.status==="Cancelled") return {ok:true,skip:true};
  cust=cust||b.customer||""; ship=ship||b.shipping||"";
  if(b.reserved||b.status==="Reserved"){
    bkResRowsM(b).forEach(function(r){ r.status="Done"; if(cust) r.customer=cust; if(ship) r.shipping=ship;
      if(r.cogs==null) r.cogs=(parseFloat(r.cost)||0)*(parseInt(r.qty)||0); });
  } else {
    var lines=b.lines||[], need={};
    for(var i=0;i<lines.length;i++){ var l=lines[i], k=l.code+"@@"+l.loc; need[k]=(need[k]||0)+(parseInt(l.qty)||0); if(availAt(l.code,l.loc)<need[k]) return {ok:false,err:l.code+" @"+l.loc}; }
    lines.forEach(function(l){ var it=itemByCode(l.code)||{}, q=parseInt(l.qty)||0; if(q<=0) return;
      takeAt(l.code,l.loc,q).filter(function(c){return c.qty>0;}).forEach(function(c){
        hpush({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:l.code,name:it.name||l.name,qty:c.qty,unit:it.unit||l.unit,loc:l.loc,
          lotNo:c.lotNo||"",lotSup:c.lotSup||"",mfd:c.mfd||"",exp:c.exp||"",sn:c.sn||"",hu:c.hu||undefined,cost:c.cost||0,cogs:(c.cost||0)*c.qty,
          orderNo:(b.ref||b.id),bookingId:b.id,customer:cust,shipping:ship,note:note||"BOOKING",status:"Done"}); }); });
  }
  b.issued=true; b.customer=cust; b.shipping=ship; return {ok:true}; }
function setBkStatus(v){_bkStatus=v;bookingList();}
function bookingList(){

  var chipDefs=[["ALL",T("ทั้งหมด","All")],["Booked",T("จองแล้ว","Booked")],["Done",T("เบิกแล้ว","Issued")],["Cancelled",T("ยกเลิก","Cancelled")]];

  var rowHtml=rows.map(function(r){
    var b=r.b,l=r.l,it=itemByCode(l.code)||{};

    return '<div class="row" data-s="'+esc(ds)+'" onclick="bookingView('+jsa(String(b.id||b.ref))+')">'
      +'<div class="thumb">'+(imgSrc(it.img)?'<img src="'+esc(imgSrc(it.img))+'" onerror="imgFallback(this)">':IC.box)+'</div>'
      +'<div class="rt" style="flex:1"><b>'+esc(it.name||l.name||l.code)+'</b><small>'+esc(b.ref||b.id)+(b.customer?' · '+esc(b.customer):"")+' · '+(b.planDate?fmtDate(b.planDate):"")+'</small></div>'
      +'<div style="text-align:right"><div class="rv">'+num(l.qty)+' <small style="color:var(--sub);font-weight:500">'+esc(l.unit||it.unit||"")+'</small></div><div style="margin-top:3px">'+pill+'</div></div>'
      +'</div>';
  }).join("")||'<div class="empty">'+T("ยังไม่มีการจอง","No bookings")+'</div>';
  var body='<div class="grab"></div><div class="sh-h"><div class="thumb">'+IC.book+'</div><div style="flex:1"><b>'+T("รายการจอง","Bookings")+'</b><small>'+rows.length+' '+T("รายการ","items")+'</small></div></div>'
    +'<button class="btn primary" style="margin-bottom:12px" onclick="bookingAdd()">'+IC.plus.replace(/currentColor/g,"#fff")+' '+T("เพิ่มการจอง","Add Booking")+'</button>'
    +'<div class="search">'+IC.search+'<input class="inp" placeholder="'+T("ค้นหา ลูกค้า / วันที่ / สินค้า","Search customer / date / item")+'" oninput="filterList(this.value,\'bkList\')"></div>'
    +chips
    +'<div class="card" id="bkList" style="padding:4px 0">'+rowHtml+'</div>';
  openSheet(body);
}

function bookingForm(){

  if(!code) return '<option value="" disabled>'+T("-- เลือกสินค้าก่อน --","-- choose an item first --")+'</option>';

  var opts=Object.keys(by).filter(function(c){return by[c]>0;}).sort().map(function(c){return {c:c,q:by[c]};});

};

      +'</div>'

        +'<select class="inp" style="flex:1;padding:10px" onchange="bkSet('+i+',\'loc\',this.value)">'
          +'<option value="">'+T("เลือกตำแหน่ง *","Choose location *")+'</option>'+locSel(ln.loc,ln.code)+'</select>'
        +bkBalHtml(ln)

    +'<div class="field"><label>'+T("ลูกค้า","Customer")+'</label><input class="inp" value="'+esc(d.customer)+'" oninput="window._bookDraft.customer=this.value"></div>'
    +'<div class="field"><label>'+T("วันที่นัด","Plan Date")+'</label><input class="inp" type="date" value="'+esc(d.planDate)+'" onchange="window._bookDraft.planDate=this.value"></div>'

/* on-hand badge for the picked location (red when the booking exceeds it) */
function bkBalHtml(ln){
  if(!ln.code||!ln.loc) return "";
  var it=itemByCode(ln.code)||{}, have=getStockQty(ln.code,ln.loc), want=parseInt(ln.qty)||0, low=want>have;
  return '<div class="bkbal'+(low?" low":"")+'">'+T("คงเหลือ","On hand")+' '+num(have)+' '+esc(it.unit||"")+(low?" · "+T("ไม่พอ","not enough"):"")+'</div>';
}
function bkSet(i,k,v){if(!window._bookDraft)return;
  if(k==="qty"){ var bq=wholeQ(v); if(bq<0){ toast(T("ใส่จำนวนเต็มที่มากกว่า 0","Enter a whole number above 0"),"err"); bookingForm(); return; } v=bq; }
  window._bookDraft.lines[i][k]=v;
  if(k==="loc"||k==="qty") bookingForm();}   // refresh so the balance follows the choice
function bkSetCode(i,v){if(!window._bookDraft)return;window._bookDraft.lines[i].code=v;bookingForm();}
function bkAddLine(){window._bookDraft.lines.push({code:"",qty:1,loc:""});bookingForm();}
function bkDel(i){window._bookDraft.lines.splice(i,1);if(!window._bookDraft.lines.length)window._bookDraft.lines.push({code:"",qty:1,loc:""});bookingForm();}
function bookingSave(){
  if(!canFeat("booking")){ toast(T("ไม่มีสิทธิ์ใช้งานเมนูนี้","No permission for this menu"),"err"); return; }
  var d=window._bookDraft; if(!d)return;
  var used=d.lines.filter(function(l){return (l.code||"").trim()||(parseInt(l.qty)||0)>0;});
  if(!used.length){toast(T("ใส่รายการอย่างน้อย 1 รายการ","Add at least one line"),"err");return;}
  for(var vi=0;vi<used.length;vi++){                 // item + location are required
    var vl=used[vi], vn=vi+1;
    if(!itemByCode((vl.code||"").trim())){ toast(T("บรรทัดที่ ","Line ")+vn+T(": กรุณาเลือกสินค้า",": choose an item"),"err"); return; }
    if(!(vl.loc||"").trim()){ toast(T("บรรทัดที่ ","Line ")+vn+T(": กรุณาเลือกตำแหน่ง",": choose a location"),"err"); return; }
    if(!(DB.locationMaster||[]).some(function(x){return x.code===vl.loc;})){ toast(T("บรรทัดที่ ","Line ")+vn+T(": ไม่พบตำแหน่งนี้",": unknown location"),"err"); return; }
    if((parseInt(vl.qty)||0)<=0){ toast(T("บรรทัดที่ ","Line ")+vn+T(": จำนวนต้องมากกว่า 0",": quantity must be more than 0"),"err"); return; }
  }
  var lines=used.map(function(l){var it=itemByCode(l.code.trim())||{};return {code:it.code||l.code.trim(),name:it.name||l.code,qty:parseInt(l.qty)||0,loc:l.loc,unit:it.unit||"pcs"};});
  if(d.editId!=null){   // edit existing (no stock change)
    var b=(DB.bookings||[]).find(function(x){return String(x.id)===String(d.editId)||String(x.ref)===String(d.editId);});
    if(b&&bkState(b)!=="Booked"){ toast(T("การจองนี้เบิก/กันสต๊อก/ยกเลิกไปแล้ว แก้ไขไม่ได้","This booking was issued, reserved or cancelled — can't edit"),"err"); return; }
    if(!b){ toast(T("ไม่พบการจองนี้แล้ว (อาจถูกลบจากเครื่องอื่น)","This booking no longer exists (deleted on another device)"),"err"); window._bookDraft=null; bookingList(); return; }
    if(b){ b.customer=d.customer||""; b.planDate=d.planDate||today(); b.phone=d.phone||""; b.shipping=d.shipping||""; b.note=d.note||""; b.lines=lines; b.editedBy=whoName(); }
    mSave(); toast(T("แก้ไขการจองแล้ว","Booking updated"),"ok"); window._bookDraft=null; bookingList(); return;
  }
  // time-based id (two devices never pick the same one); the BK- number continues from the highest one in use
  var seq=Date.now()*1000+Math.floor(Math.random()*1000); while((DB.bookings||[]).some(function(x){return x.id===seq;})) seq++;
  var bkn=(DB.bookings||[]).reduce(function(m,x){ var r=/^BK-(\d+)$/.exec(x.ref||""); return r?Math.max(m,+r[1]):m; },0)+1;
  var ref="BK-"+String(bkn).padStart(4,"0");
  if(!DB.bookings) DB.bookings=[];
  DB.bookings.push({id:seq,ref:ref,customer:d.customer||"",planDate:d.planDate||today(),planTime:"",phone:d.phone||"",shipping:d.shipping||"",note:d.note||"",reduceStock:false,status:"Booked",reserved:false,by:whoName(),lines:lines});
  mSave(); toast(T("บันทึกการจองแล้ว","Booking saved")+" "+ref,"ok");
  window._bookDraft=null; bookingList();
}

function bookingDelete(id){
  if(!isMgrUpM()){toast(T("เฉพาะผู้จัดการขึ้นไป","Manager or above only"),"err");return;}
  var idx=(DB.bookings||[]).findIndex(function(x){return String(x.id)===String(id)||String(x.ref)===String(id);}); if(idx<0)return;
  var db=DB.bookings[idx];
  if(bkIssued(db)){toast(T("การจองที่เบิกแล้วลบไม่ได้","An issued booking can't be deleted"),"err");return;}
  if(!confirm(T("ลบการจองนี้?","Delete this booking?")+(bkState(db)==="Reserved"?T(" (สต๊อกที่กันไว้จะคืนเข้าคลัง)"," (its reserved stock goes back)"):"")))return;
  if(bkState(db)==="Reserved") bkUnreserveM(db);                     // the reserved stock goes back to its lots
  DB.bookings.splice(DB.bookings.indexOf(db),1); mSave(); toast(T("ลบการจองแล้ว","Booking deleted"),"ok"); bookingList();
}
function bookingCancel(id){
  if(!isMgrUpM()){toast(T("เฉพาะผู้จัดการขึ้นไป","Manager or above only"),"err");return;}
  var b=(DB.bookings||[]).find(function(x){return String(x.id)===String(id)||String(x.ref)===String(id);}); if(!b)return;
  if(bkIssued(b)){toast(T("การจองนี้เบิกแล้ว","Already issued"),"err");return;}
  if(!confirm(T("ยกเลิกการจองนี้?","Cancel this booking?")))return;
  if(bkState(b)==="Reserved") bkUnreserveM(b);                       // nothing to fulfil any more: stock back
  b.status="Cancelled"; mSave(); toast(T("ยกเลิกการจองแล้ว","Booking cancelled"),"ok"); bookingList();
}

function soLocNameM(id){return "SO-"+id;}

var SO_STEPS=["Draft","Dispatched","ClientReceived","ClientReturned","ReceivedBack"];
function soStatLabelM(s){var m={Draft:T("ร่าง","Draft"),Dispatched:T("ส่งแล้ว","Dispatched"),ClientReceived:T("ลูกค้ารับ","Client Recv"),ClientReturned:T("ลูกค้าคืน","Client Ret"),ReceivedBack:T("รับคืนคลัง","Recv Back")};return m[s]||s;}
function soStatClassM(s){return s==="ReceivedBack"?"ok":s==="Draft"?"ng":s==="ClientReturned"?"warn":"info";}
function soNextLabelM(s){var m={Draft:T("ส่งสินค้า","Dispatch"),Dispatched:T("ยืนยันลูกค้ารับ","Client Receive"),ClientReceived:T("ลูกค้าส่งคืน","Client Return"),ClientReturned:T("รับคืนเข้าคลัง","Receive Back")};return m[s]||"";}
function soUpdateStatusM(so){
  var its=so.items||[];if(!its.length)return;
  var anyDisp=its.some(function(i){return (i.qtyDispatched||0)>0;});
  var allCR=its.every(function(i){return (i.qtyClientRecv||0)>=(i.qtyDispatched||0);});
  var anyRet=its.some(function(i){return (i.qtyClientReturn||0)>0;});
  var allRetB=its.every(function(i){return (i.qtyRecvBack||0)>=(i.qtyClientReturn||0);});   // items kept by the client count as done
  if(allRetB&&anyRet)so.status="ReceivedBack";
  else if(anyRet)so.status="ClientReturned";
  else if(allCR&&anyDisp)so.status="ClientReceived";
  else if(anyDisp)so.status="Dispatched";
  else so.status="Draft";
}

var SO_TRANS=[
  {key:"dispatch",    step:"Draft",          label:function(){return T("ส่งสินค้า","Dispatch");},          remain:function(it){return (it.qty||0)-(it.qtyDispatched||0);}},

  }).join('<div style="flex:0 0 8px;height:2px;background:#e2e2dc;margin-top:13px"></div>');
  var itemRows=(so.items||[]).map(function(it){

      +'<div class="rv">'+(out>0?'<span style="color:var(--orange)">'+T("ค้าง ","out ")+num(out)+'</span>':'<span class="pill ok"><i></i>'+T("ครบ","done")+'</span>')+'</div></div>';
  }).join("");
  // ปุ่มแต่ละ transition ที่ยังมีของค้าง (รวมย้อนขั้นก่อนหน้า)

function soStepForm(id,key){
  var so=(DB.salesOrders||[]).find(function(s){return s.id===id;});if(!so)return;
  var tr=SO_TRANS.find(function(t){return t.key===key;});if(!tr)return;
  var head=homeLoc();
  var rows=(so.items||[]).map(function(it,idx){
    var rem=Math.max(0,tr.remain(it));if(rem<=0)return '';
    var cap=rem;
    if(key==="dispatch"){var av=getStockQty(it.code,head);cap=Math.min(rem,av);}
    return '<div class="row"><div class="rt"><b>'+esc(it.name)+'</b><small>'+esc(it.code)+' · '+T("ค้าง","remain")+' '+num(rem)+(key==="dispatch"?' · '+T("คลังมี","stock")+' '+num(getStockQty(it.code,head)):'')+'</small></div>'
      +'<input class="inp" type="number" min="0" max="'+cap+'" value="'+cap+'" data-idx="'+idx+'" style="width:76px;padding:8px" id="sf_'+idx+'"></div>';
  }).join("");
  var body='<div class="grab"></div><div class="sh-h"><div class="thumb" style="background:var(--orange-grad)">'+IC.trf.replace(/currentColor/g,"#fff")+'</div><div><b>'+tr.label()+'</b><small>'+esc(so.id)+' · '+esc(so.customer||"")+'</small></div></div>'
    +'<div class="sub" style="margin-bottom:8px">'+T("ระบุจำนวนที่จะดำเนินการในแต่ละรายการ","Set quantity for each item")+'</div>'
    +'<div class="card" style="margin-bottom:14px">'+(rows||'<div class="empty">'+T("ไม่มีของค้าง","Nothing pending")+'</div>')+'</div>'
    +'<button class="btn primary" onclick="soDoStep('+jsa(id)+',\''+key+'\')">'+T("ยืนยัน","Confirm")+' '+tr.label()+'</button>'
    +'<button class="btn ghost" style="margin-top:10px" onclick="openSODetailM('+jsa(id)+')">'+T("ยกเลิก","Back")+'</button>';
  openSheet(body);
}
function soDoStep(id,key){
  var so=(DB.salesOrders||[]).find(function(s){return s.id===id;});if(!so)return;
  var tr=SO_TRANS.find(function(t){return t.key===key;});if(!tr)return;
  var loc=soLocNameM(id), head=homeLoc(); soEnsureLocM(id);
  var any=false, errStock=false, badQty=false, partial=[];
  /* validate every line before anything moves */
  (so.items||[]).forEach(function(it,idx){ var e=document.getElementById("sf_"+idx); if(e&&wholeQ(e.value)<0) badQty=true; });
  if(badQty){ toast(T("ใส่จำนวนเต็มที่มากกว่า 0","Enter a whole number above 0"),"err"); return; }
  (so.items||[]).forEach(function(it,idx){
    var inp=document.getElementById("sf_"+idx); if(!inp)return;
    var q=wholeQ(inp.value); if(q<0){badQty=true;return;} var rem=Math.max(0,tr.remain(it)); if(q<=0)return; if(q>rem)q=rem;
    if(key==="dispatch"){
      var av=availAt(it.code,head), want=q; if(av<q){q=av;} if(q<=0){errStock=true;partial.push(it.code+" 0/"+want);return;}
      if(q<want) partial.push(it.code+" "+q+"/"+want);
      var dcs=moveAt(it.code,head,loc,q); q=sumQty(dcs); it.qtyDispatched=(it.qtyDispatched||0)+q;
      hpushLots({id:nextTxnId(),type:"OUT",subtype:"SO_DISPATCH",date:today(),time:nowTime(),code:it.code,name:it.name,qty:q,unit:it.unit,loc:head,toLoc:loc,soRef:id,customer:so.customer,note:"Mobile SO Dispatch"},dcs); any=true;
    } else if(key==="clientrecv"){
      it.qtyClientRecv=(it.qtyClientRecv||0)+q;
      hpush({id:nextTxnId(),type:"IN",subtype:"SO_CLIENT_RECV",date:today(),time:nowTime(),code:it.code,name:it.name,qty:q,unit:it.unit,loc:loc,soRef:id,customer:so.customer,note:"Mobile Client Recv"}); any=true;
    } else if(key==="clientreturn"){
      it.qtyClientReturn=(it.qtyClientReturn||0)+q;
      hpush({id:nextTxnId(),type:"OUT",subtype:"SO_CLIENT_RETURN",date:today(),time:nowTime(),code:it.code,name:it.name,qty:q,unit:it.unit,loc:loc,soRef:id,customer:so.customer,note:"Mobile Client Return"}); any=true;
    } else if(key==="recvback"){
      var rcs=moveAt(it.code,loc,head,Math.min(q,availAt(it.code,loc))); q=sumQty(rcs); if(q<=0){errStock=true;return;}
      it.qtyRecvBack=(it.qtyRecvBack||0)+q;
      hpushLots({id:nextTxnId(),type:"IN",subtype:"SO_RECV_BACK",date:today(),time:nowTime(),code:it.code,name:it.name,qty:q,unit:it.unit,loc:head,fromLoc:loc,soRef:id,customer:so.customer,note:"Mobile Recv Back"},rcs); any=true;
    }
  });
  if(!any){toast(errStock?T("สต๊อกคลังไม่พอ","Insufficient stock"):T("ไม่มีจำนวนที่จะดำเนินการ","Nothing to process"),"err");return;}
  soUpdateStatusM(so); mSave();
  if(partial.length) toast(T("ส่งได้ไม่ครบ (สต๊อกไม่พอ): ","Partly sent (not enough stock): ")+partial.join(", "),"warn");
  else toast(T("อัพเดทแล้ว: ","Updated: ")+tr.label(),"ok");
  openSODetailM(id);
}

/* search: a query opens every category and filters the items · empty query = back to the categories */
function pickFind(v){
  var q=String(v||"").toLowerCase().trim(), box=document.getElementById("pickList"); if(!box) return;
  [].forEach.call(box.querySelectorAll(".pcat"),function(g){ var hit=0;
    [].forEach.call(g.querySelectorAll(".row"),function(r){ var ok=!q||(r.dataset.s||"").indexOf(q)>=0; r.style.display=ok?"":"none"; if(ok) hit++; });
    var b=g.querySelector(".pcat-b");

function opConfirm(action,code){
  var it=itemByCode(code); if(!it)return;
  var entered=wholeQ((document.getElementById("op_qty")||{}).value);
  if(entered<=0){toast(T("ใส่จำนวนเต็มที่มากกว่า 0","Enter a whole number above 0"),"err");return;}
  var up=opUnitParts(); var mult=up.mult>0?up.mult:1; var qty=entered*mult;   // base-unit qty for stock
  var uLabel=up.label||it.unit||""; var pkgNote=(mult>1)?(entered+" "+uLabel+" × "+mult):"";
  if(action==="receive"){
    var to=(document.getElementById("op_to")||{}).value;
    var lot={lotSup:(val2("op_lotSup")||"").trim(),lotNo:(val2("op_lotNo")||"").trim(),mfd:val2("op_mfd")||"",exp:val2("op_exp")||"",sn:(val2("op_sn")||"").trim()};

    if(!capWarnM(to,qty))return;
    var huR=huPutM(to,"op"); if(!huR) return; lot.hu=huR.hu||"";      /* pallet / tote (when turned on) */
    receiveStock(code,to,qty,lot);
    hpush({id:nextTxnId(),type:"IN",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:to,hu:huR.hu||undefined,pallet:huR.pallet||undefined,tote:huR.tote||undefined,orderNo:"",lotNo:lot.lotNo,lotSup:lot.lotSup,mfd:lot.mfd,exp:lot.exp,sn:lot.sn,note:"Mobile Receive",status:"Stored"});
    mSave();toast(T("รับเข้าแล้ว","Received")+" +"+qty,"ok");
  } else if(action==="issue"){
    var from=(document.getElementById("op_from")||{}).value;
    var cust=(document.getElementById("op_customer")||{}).value||"";
    var ship=(document.getElementById("op_shipping")||{}).value||"";
    var ordr=(document.getElementById("op_order")||{}).value||"";
    var trk=(document.getElementById("op_tracking")||{}).value||"";
    var huSelI=val2("op_hu"), huFI=huSelI?(huSelI==="~"?"":huSelI):undefined;   /* "" any · "~" loose · a container */
    var avail=huFI!==undefined?stockAtHuM(code,from,huFI):(lotOn()?stockAtTotal(code,from):getStockQty(code,from));
    if(avail<qty){toast(T("สต๊อกไม่พอ","Not enough stock"),"err");return;}
    {                                                                // lots on or off: take from every row of code@loc (FIFO), never just the first one
      var preferKey=(document.getElementById("op_lot")||{}).value||"";
      var res=issueFIFO(code,from,qty,preferKey,huFI);
      res.consumed.forEach(function(c){ hpush({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:code,name:it.name,qty:c.qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:c.loc,hu:c.hu||undefined,orderNo:ordr,customer:cust,shipping:ship,tracking:trk,lotNo:c.lotNo,lotSup:c.lotSup,mfd:c.mfd,exp:c.exp,sn:c.sn,note:"Mobile Issue",status:"Done"}); });
    }
    mSave();toast(T("เบิกออกแล้ว","Issued")+" -"+qty,"ok");
  } else if(action==="qc"){
    var qf=(document.getElementById("op_from")||{}).value, qt=(document.getElementById("op_to")||{}).value||"NG";
    if(availAt(code,qf)<qty){toast(T("สต๊อกไม่พอ","Not enough stock"),"err");return;}
    var qcs=moveAt(code,qf,qt,qty,(document.getElementById("op_lot")||{}).value);
    hpushPairLots({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:qf,toLoc:qt,orderNo:"QC-NG",note:"Mobile QC",status:"Done"},
      {id:nextTxnId(),type:"NGIN",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:qt,fromLoc:qf,orderNo:"QC-NG",note:"Mobile QC hold",status:"NG"},qcs);
    mSave();toast(T("ย้ายเข้าของเสียแล้ว","Moved to NG")+" "+qty,"ok");
  } else if(action==="ngin"){
    var nto=(document.getElementById("op_to")||{}).value||"NG";
    receiveStock(code,nto,qty);
    hpush({id:nextTxnId(),type:"NGIN",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:nto,orderNo:"NG-RECEIVE",note:"Mobile NG Receive",status:"NG"});
    mSave();toast(T("รับเข้า NG แล้ว","Received to NG")+" +"+qty,"ok");
  } else if(action==="ngout"){
    var nfr=(document.getElementById("op_from")||{}).value||"NG";
    if(availAt(code,nfr)<qty){toast(T("สต๊อก NG ไม่พอ","Not enough NG stock"),"err");return;}
    var ngcs=takeAt(code,nfr,qty,(document.getElementById("op_lot")||{}).value);
    hpushLots({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:nfr,orderNo:"NG-ISSUE",note:"Mobile NG Issue",status:"Done"},ngcs);
    mSave();toast(T("เบิกจาก NG แล้ว","Issued from NG")+" -"+qty,"ok");
  } else {
    var f=(document.getElementById("op_from")||{}).value, t=(document.getElementById("op_to")||{}).value;
    if(!t){toast(T("เลือกปลายทาง","Select destination"),"err");return;}
    var huSelT=val2("op_hu"), huFT=huSelT?(huSelT==="~"?"":huSelT):undefined, huD=huPutM(t,"op",true); if(!huD) return;
    if(f===t&&(huFT===undefined||huFT===(huD.hu||""))){toast(T("ต้นทาง/ปลายทางซ้ำกัน","Same location"),"err");return;}
    if((huFT!==undefined?stockAtHuM(code,f,huFT):availAt(code,f))<qty){toast(T("สต๊อกไม่พอ","Not enough stock"),"err");return;}
    if(f!==t&&!mixWarnM(t,code)) return;                             // a different item is already there
    if(f!==t&&!capWarnM(t,qty)) return;                              // the destination would go over its capacity
    var huRT=huPutM(t,"op"); if(!huRT) return;
    var tcs=moveAt(code,f,t,qty,(document.getElementById("op_lot")||{}).value,huFT,huRT.hu);
    hpushPairLots({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:f,toLoc:t,orderNo:"TRANSFER",note:"Mobile Transfer",status:"Done"},
      {id:nextTxnId(),type:"IN",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:t,fromLoc:f,hu:huRT.hu||undefined,pallet:huRT.pallet||undefined,tote:huRT.tote||undefined,orderNo:"TRANSFER",note:"Mobile Transfer",status:"Stored"},tcs);
    mSave();toast(T("โอนย้ายแล้ว","Transferred")+" "+qty+" → "+t,"ok");
  }
  if(CUR==="home")renderHome();else if(CUR==="stock")renderStock();else if(CUR==="history")renderHistory();
  openManualPick(action);   // return to the scan/pick sheet of the same process to continue
}

function openBookingsWaveM(){ return (DB.bookings||[]).filter(function(b){ var s=bkState(b); return s==="Booked"||s==="Reserved"; }); }
function fulfillBookingSilentM(b,note){ return bkFulfillM(b,b&&b.customer,b&&b.shipping,note||"WAVE"); }
function waveListM(){

  }).join("");
  // consolidated preview
  var preview="";
  if(sel.length){ var chosen=bks.filter(function(b){return sel.indexOf(String(b.id))>=0;}); var agg={};
    chosen.forEach(function(b){ if(bkState(b)==="Reserved") return; (b.lines||[]).forEach(function(l){var k=l.code+"@@"+l.loc;if(!agg[k])agg[k]={code:l.code,loc:l.loc,name:(l.name||"")+(l.loc?" @"+l.loc:""),unit:l.unit||"",need:0};agg[k].need+=(parseInt(l.qty)||0);});});
    var items=Object.keys(agg).map(function(k){var x=agg[k];x.avail=availAt(x.code,x.loc);x.ok=x.avail>=x.need;return x;});
    var allOk=items.every(function(x){return x.ok;});
    preview='<div style="font-weight:800;font-size:12px;color:var(--sub);margin:10px 0 4px">'+T("รายการหยิบรวม","Consolidated")+' · '+sel.length+' '+T("ออเดอร์","orders")+'</div><div class="card" style="padding:4px 0">'
      +items.map(function(x){return '<div class="row"><div class="rt"><b>'+esc(x.code)+'</b><small>'+esc(x.name)+' · '+T("ต้องหยิบ","need")+' '+num(x.need)+'</small></div><div class="rv" style="color:'+(x.ok?'var(--ok)':'var(--danger)')+';font-weight:800">'+num(x.avail)+(x.ok?'':' '+XI.warn)+'</div></div>';}).join("")+'</div>'
      +'<button class="btn primary" style="margin-top:12px"'+(allOk?'':' disabled')+' onclick="waveConfirmM()">'+IC.iss.replace(/currentColor/g,"#fff")+' '+T("หยิบทั้งเวฟ","Pick wave")+' ('+sel.length+')</button>';
  }
  var body='<div class="grab"></div><div class="sh-h"><div class="thumb" style="background:linear-gradient(135deg,#ec4899,#be185d)">'+IC.iss.replace(/currentColor/g,"#fff")+'</div><div style="flex:1"><b>'+T("จัดหยิบรวม (Wave)","Wave Picking")+'</b><small>'+T("แตะเลือกออเดอร์","Tap to select")+'</small></div></div>'
    +'<div class="card" style="padding:4px 0">'+rowHtml+'</div>'+preview;

function waveToggleM(id){ id=String(id); if(!window._waveSelM)window._waveSelM=[]; var i=window._waveSelM.indexOf(id); if(i>=0)window._waveSelM.splice(i,1); else window._waveSelM.push(id); waveListM(); }
function waveConfirmM(){
  var sel=window._waveSelM||[]; if(!sel.length){ toast(T("เลือกออเดอร์","Select orders"),"warn"); return; }
  var bks=(DB.bookings||[]).filter(function(b){return sel.indexOf(String(b.id))>=0;});
  var need={}; bks.forEach(function(b){ if(bkState(b)!=="Booked") return; (b.lines||[]).forEach(function(l){var k=l.code+"@@"+l.loc;need[k]=(need[k]||0)+(parseInt(l.qty)||0);});});   // reserved ones already hold their stock
  for(var k in need){ var p=k.split("@@"); if(availAt(p[0],p[1])<need[k]){ toast(T("สต๊อกไม่พอ: ","Not enough: ")+p[0]+" @"+p[1],"err"); return; } }
