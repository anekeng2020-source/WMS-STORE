/* ═══ Kitting / Assembly (mobile) ═══ */
function computeAssemblyM(bomId,qty){ var b=(DB.bomMaster||[]).find(function(x){return String(x.id)===String(bomId);}); if(!b)return {components:[],allOk:false};
  /* the same component on several BOM lines is checked against its TOTAL need */
  var byCode={}, components=[];
  (b.lines||[]).filter(function(l){return l.code;}).forEach(function(l){ var n=Math.ceil((parseFloat(l.qty)||0)*qty-1e-9);   // stock is whole units
    if(byCode[l.code]){ byCode[l.code].need+=n; return; }
    byCode[l.code]={code:l.code,name:l.name||l.code,unit:l.unit||"",need:n}; components.push(byCode[l.code]); });
  components.forEach(function(c){ c.avail=totalStock(c.code); c.ok=c.avail>=c.need; });
  return {components:components,allOk:components.length>0&&components.every(function(c){return c.ok;}),product:b.product,name:b.name}; }
function consumeAcrossM(code,qty){ var remain=qty; var consumed=[];
  var locs=[]; (DB.stock||[]).forEach(function(s){ if(s.code===code&&!isNG(s.loc)&&(parseInt(s.qty)||0)>0&&locs.indexOf(s.loc)<0)locs.push(s.loc); });
  for(var i=0;i<locs.length;i++){ if(remain<=0)break; var loc=locs[i]; var av=getStockQty(code,loc); var take=Math.min(av,remain); if(take<=0)continue;
    var r=issueFIFO(code,loc,take); consumed=consumed.concat(r.consumed);   // every row of code@loc, lots on or off
    remain-=take; }
  return {consumed:consumed,short:remain}; }
function assemblyM(){
  var boms=(DB.bomMaster||[]).filter(function(b){return b.product;});
  if(!boms.length){ toast(T("ยังไม่มี BOM","No BOM defined"),"warn"); return; }
  var sel=window._asmSelM||boms[0].id; window._asmSelM=sel;
  var qty=window._asmQtyM||1;
  var destLocs=(DB.locationMaster||[]).map(function(l){return l.code;}).filter(function(c){return !isNG(c);});
  var dest=window._asmDestM||(destLocs[0]||""); window._asmDestM=dest;
  var b=boms.find(function(x){return String(x.id)===String(sel);})||boms[0]; window._asmSelM=sel=b.id;
  var comp=computeAssemblyM(b.id,qty);
  var bomOpts=boms.map(function(x){return '<option value="'+esc(x.id)+'"'+(String(x.id)===String(sel)?" selected":"")+'>'+esc(x.product)+' · '+esc(x.name||"")+'</option>';}).join("");
  var destOpts=destLocs.map(function(c){return '<option'+(c===dest?" selected":"")+'>'+esc(c)+'</option>';}).join("");
  var compRows=comp.components.map(function(c){return '<div class="row"><div class="rt"><b>'+esc(c.code)+'</b><small>'+esc(c.name)+' · '+T("ต้องใช้","need")+' '+num(c.need)+' '+esc(c.unit)+'</small></div><div class="rv" style="color:'+(c.ok?'var(--ok)':'var(--danger)')+';font-weight:800">'+num(c.avail)+(c.ok?' <span class="pill ok"><i></i>'+T("พอ","OK")+'</span>':' <span class="pill ng"><i></i>'+T("ไม่พอ","short")+'</span>')+'</div></div>';}).join("");
  var body='<div class="grab"></div><div class="sh-h"><div class="thumb" style="background:linear-gradient(135deg,#8b5cf6,#6d28d9)">'+IC.box.replace(/currentColor/g,"#fff")+'</div><div style="flex:1"><b>'+T("ประกอบชุด","Assembly")+'</b></div></div>'
    +'<div class="field"><label>'+T("เลือก BOM / สินค้า","Select BOM")+'</label><select class="inp" onchange="window._asmSelM=this.value;assemblyM()">'+bomOpts+'</select></div>'
    +'<div class="field"><label>'+T("จำนวนที่ผลิต","Produce qty")+'</label><input class="inp" type="number" inputmode="numeric" value="'+qty+'" onchange="window._asmQtyM=Math.max(1,parseInt(this.value)||1);assemblyM()"></div>'
    +'<div class="field"><label>'+T("ตำแหน่งสินค้าสำเร็จรูป","Finished goods location")+'</label><select class="inp" onchange="window._asmDestM=this.value">'+destOpts+'</select></div>'
    +'<div style="font-weight:800;font-size:12px;color:var(--sub);margin:8px 0 4px">'+T("ส่วนประกอบ","Components")+' → <b>'+esc(b.product)+'</b> ×'+num(qty)+'</div>'
    +'<div class="card" style="padding:4px 0">'+(compRows||'<div style="text-align:center;color:var(--sub);padding:16px">-</div>')+'</div>'
    +'<button class="btn primary" style="margin-top:12px"'+((comp.allOk&&comp.components.length)?'':' disabled')+' onclick="doAssemblyM()">✓ '+T("ประกอบ","Build")+' ×'+num(qty)+'</button>';
  openSheet(body);
}
function doAssemblyM(){
  var b=(DB.bomMaster||[]).find(function(x){return String(x.id)===String(window._asmSelM);}); if(!b)return;
  var qty=wholeQ(window._asmQtyM==null?1:window._asmQtyM); if(qty<=0){ toast(T("ใส่จำนวนเต็มที่มากกว่า 0","Enter a whole number above 0"),"err"); return; }
  var locsOk=(DB.locationMaster||[]).map(function(l){return l.code;});
  var dest=window._asmDestM||(locsOk.filter(function(c){return !isNG(c);})[0]||"");
  if(!dest||locsOk.indexOf(dest)<0){ window._asmDestM=null; toast(T("เลือกตำแหน่งจัดเก็บของสำเร็จก่อน (ตำแหน่งเดิมไม่มีแล้ว)","Pick where the finished goods go (the old location no longer exists)"),"err"); return; }
  var comp=computeAssemblyM(b.id,qty);
  if(!comp.components.length){ toast(T("ไม่มีส่วนประกอบ","No components"),"warn"); return; }
  if(!comp.allOk){ toast(T("ส่วนประกอบไม่พอ","Not enough components"),"err"); return; }
  if(!capWarnM(dest,qty))return;                         // ask BEFORE any component is consumed
  var ref="ASM-"+today().replace(/-/g,"")+"-"+nowTime().replace(/:/g,"").slice(0,4);
  var totalCost=0;

function stPostM(id){ var s=(DB.stocktake||[]).find(function(x){return String(x.id)===String(id);}); if(!s)return;
  if(s.status!=="Counting"){ toast(T("ใบนับนี้ปิดแล้ว","This count is already closed"),"err"); return; }
  if(!isMgrUpM()){ toast(T("เฉพาะผู้จัดการขึ้นไป","Manager or above only"),"err"); return; }
  var eq=function(a,b){return (a||"")===(b||"");};
  var rowOf=function(l){ return (DB.stock||[]).find(function(x){return x.code===l.code&&x.loc===l.loc&&eq(x.lotNo,l.lotNo)&&eq(x.lotSup,l.lotSup)&&eq(x.mfd,l.mfd)&&eq(x.exp,l.exp)&&eq(x.sn,l.sn)&&eq(x.hu,l.hu);}); };   // same container too
  var nowOf=function(l){ var r=rowOf(l); return r?(parseInt(r.qty)||0):0; };
  var uncounted=s.lines.filter(function(l){return l.cntQty==null;}).length;
  var moved=s.lines.filter(function(l){return l.cntQty!=null&&nowOf(l)!==l.sysQty;}).length;   // stock changed after the sheet was made
  if(!confirm(T("ยืนยันปรับปรุงสต๊อกตามยอดนับ?"+(uncounted?" (ยังไม่นับ "+uncounted+" รายการ จะใช้ยอดระบบ)":"")+(moved?" — คำเตือน: มี "+moved+" รายการที่สต๊อกเปลี่ยนระหว่างนับ — จะปรับจากยอดปัจจุบัน":""),
               "Post adjustments to stock?"+(uncounted?" ("+uncounted+" not counted, keep system qty)":"")+(moved?" — Warning: "+moved+" line(s) moved during the count — adjusting from current stock":""))))return;
  var adj=0;
  s.lines.forEach(function(l){ if(l.cntQty==null)return; var cur=nowOf(l), diff=l.cntQty-cur; if(diff===0)return;
    var row=rowOf(l);
    if(row){row.qty=l.cntQty;} else if(l.cntQty>0){var nr={code:l.code,loc:l.loc,qty:l.cntQty,lotNo:l.lotNo||"",lotSup:l.lotSup||"",mfd:l.mfd||"",exp:l.exp||"",sn:l.sn||"",cost:(l.cost||0)}; if(l.hu) nr.hu=l.hu; DB.stock.push(nr);}
    hpush({id:nextTxnId(),type:diff>0?"IN":"OUT",date:today(),time:nowTime(),code:l.code,name:l.name,loc:l.loc,qty:Math.abs(diff),hu:l.hu||undefined,unit:l.unit,unitQty:l.unit,lotNo:l.lotNo,lotSup:l.lotSup,mfd:l.mfd,exp:l.exp,sn:l.sn,orderNo:s.ref,note:T("ปรับจากนับสต๊อก","Cycle count")+" ("+num(cur)+"→"+num(l.cntQty)+")",status:"Count"});
    adj++; });
  for(var i=DB.stock.length-1;i>=0;i--){var x=DB.stock[i];if((parseInt(x.qty)||0)<=0&&(x.lotSup||x.lotNo||x.mfd||x.exp||x.sn||x.hu))DB.stock.splice(i,1);}
  s.status="Done"; s.approvedBy=whoName(); s.approvedAt=today()+" "+nowTime();
  mSave(); toast(T("ปรับปรุงแล้ว ","Posted ")+adj+" "+T("รายการ","lines"),"ok"); stocktakeList();
}

function holdScan(e){ if(e&&e.preventDefault)e.preventDefault(); startScan(); }

var _scanGen=0;
/* a camera that finishes starting after the user already let go is stopped right away */
function scanStarted(inst,gen){ if(gen!==_scanGen||!scanning){ try{ inst.stop().then(function(){try{inst.clear();}catch(e){}}).catch(function(){}); }catch(e){} } }
function startScan(){
  if(scanning)return; scanning=true; var gen=++_scanGen;
  try{ if(!_audioCtx)_audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(_audioCtx.state==="suspended")_audioCtx.resume(); }catch(e){}
  document.getElementById("scanOv").classList.add("show");
  if(typeof Html5Qrcode==="undefined"){toast(T("โหลดตัวสแกนไม่ได้ (ต้องต่อเน็ต)","Scanner not loaded"),"err");stopScan();return;}
  try{
    var inst=new Html5Qrcode("reader",{verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}}); qrScanner=inst;
    var cfg={fps:10,
      qrbox:function(vw,vh){var m=Math.floor(Math.min(vw||300,vh||300)*0.75);if(m<120)m=Math.floor(Math.min(vw||300,vh||300)*0.9);return {width:m,height:m};},
      experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
    inst.start({facingMode:"environment"},cfg,onScan,function(){})
      .then(function(){ scanStarted(inst,gen); })
      .catch(function(){
        if(gen!==_scanGen) return;                                    // already closed
        // fallback: pick a camera from the list (prefer the back camera)
        Html5Qrcode.getCameras().then(function(cams){
          if(!cams||!cams.length){toast(T("ไม่พบกล้อง","No camera found"),"err");stopScan();return;}
          var back=cams.filter(function(c){return /back|rear|environment|หลัง/i.test(c.label||"");})[0]||cams[cams.length-1];
          if(gen!==_scanGen) return;
          inst.start(back.id,cfg,onScan,function(){})
            .then(function(){ scanStarted(inst,gen); })
            .catch(function(err){ if(gen!==_scanGen) return; toast(T("เปิดกล้องไม่ได้","Camera error")+": "+err,"err");stopScan();});
        }).catch(function(err){ if(gen!==_scanGen) return; toast(T("เปิดกล้องไม่ได้","Camera error")+": "+err,"err");stopScan();});
      });
  }catch(e){toast(T("เปิดกล้องไม่ได้","Camera error"),"err");stopScan();}
}
function stopScan(){
  _scanGen++;
  document.getElementById("scanOv").classList.remove("show");
  if(qrScanner){var s=qrScanner;qrScanner=null;try{s.stop().then(function(){try{s.clear();}catch(e){}}).catch(function(){});}catch(e){}}
  scanning=false;
}
var _lastScan=0, _audioCtx=null;
var _lastBeepType="",_lastBeepAt=0;
function beep(type){
  try{
    if(!_audioCtx)_audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var ctx=_audioCtx; if(ctx.state==="suspended")ctx.resume();
    function tone(freq,start,dur,vol){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,ctx.currentTime+start);
      g.gain.exponentialRampToValueAtTime(vol||0.3,ctx.currentTime+start+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+start+dur);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur+0.03);
    }
    if((type==="ok"||type==="err"||type==="success")){ if(type===_lastBeepType && Date.now()-_lastBeepAt<160)return; _lastBeepType=type; _lastBeepAt=Date.now(); }
    if(type==="ok"){ tone(880,0,0.09); tone(1320,0.10,0.13); }               // ผ่าน: สองโน้ตขึ้น
    else if(type==="success"){ tone(660,0,0.08); tone(880,0.09,0.08); tone(1320,0.18,0.16); }  // เสร็จสิ้น: 3 โน้ตขึ้น
    else if(type==="tap"){ tone(1250,0,0.045,0.16); }                        // กดปุ่ม: คลิกสั้น
    else if(type==="del"){ tone(360,0,0.09,0.22); }                          // ลบ: ทุ้มสั้น
    else if(type==="nostock"){ tone(700,0,0.12); tone(700,0.16,0.12); }      // ไม่มีของ
    else { tone(300,0,0.30,0.35); }                                          // ไม่ผ่าน: เสียงต่ำยาว
  }catch(e){}
}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
function onScan(text){
  var now=Date.now(); if(now-_lastScan<1200)return; _lastScan=now;
  stopScan();
  if(_scanTarget&&/^(op_pal|op_tote|hm_src|hm_dst|hu_q)$/.test(_scanTarget)){ var hf=_scanTarget; _scanTarget=null; huScannedM(hf,text); return; }
  if(_scanTarget){   // scanning into a From/To location field
    var fid=_scanTarget; _scanTarget=null;
    var loc=matchLocation(text), sel=document.getElementById(fid);
    if(loc&&sel){ sel.value=loc.code; try{ sel.dispatchEvent(new Event("change",{bubbles:true})); }catch(e){} beep("ok"); vib(70); toast(T("ตำแหน่ง: ","Location: ")+loc.code,"ok");
      if(fid==="op_from"&&window._opCode){ opAvail(window._opCode); try{ opRefreshLots(window._opCode); }catch(e){} } }
    else { beep("fail"); vib([90,50,90]); toast(T("ไม่พบตำแหน่ง: ","Location not found: ")+text,"err"); }
    return;
  }
  if(_schedScan){   // scanning an item within a PO/SO detail
    var sid=_schedScan; _schedScan=null;
    var it2=findScanned(text), s2=findSched(sid);
    if(it2&&s2){
      var lidx=(s2.lines||[]).findIndex(function(l){return String(l.code).toUpperCase()===String(it2.code).toUpperCase();});
      if(lidx>=0){ var ln2=s2.lines[lidx], rem2=(parseInt(ln2.qty)||0)-(parseInt(ln2.done)||0);
        if(rem2<=0){beep("fail");vib([90,50,90]);toast(T("รายการนี้ครบแล้ว","Line already complete"),"err");openSchedule(sid);}
        else{beep("ok");vib(70);schedLineForm(sid,lidx);} }
      else {beep("fail");vib([90,50,90]);toast(T("สินค้านี้ไม่อยู่ในเอกสารนี้","Item not in this order"),"err");openSchedule(sid);}
    } else {beep("fail");vib([90,50,90]);toast(T("ไม่พบสินค้า: ","Not found: ")+text,"err");openSchedule(sid);}
    return;
  }
  if(_stScan){ var stid=_stScan; var iti=findScanned(text); var st=(DB.stocktake||[]).find(function(x){return String(x.id)===String(stid);});
    if(!iti&&st&&typeof huGetM==="function"&&huOnM()&&huGetM(text)){ window._stHu=huGetM(text).code; window._stHuSheet=String(stid); beep("ok"); vib(70); toast(T("นับในภาชนะ ","Counting inside ")+window._stHu,"ok"); stocktakeSheet(stid); return; }
    if(iti&&st){ var hits=[]; st.lines.forEach(function(l,i){ if(String(l.code).toUpperCase()===String(iti.code).toUpperCase()) hits.push(i); });
      if(hits.length>1&&window._stHu&&typeof huStInM==="function"){ var inH=hits.filter(function(i){ return huStInM(st.lines[i],window._stHu); }); if(inH.length) hits=inH; }
      if(hits.length>1){ beep("ok"); vib(70); stPickLineM(stid,hits); }                  // same item in several locations / lots: ask which one
      else if(hits.length===1){ var ln=st.lines[hits[0]]; ln.cntQty=(ln.cntQty==null?0:ln.cntQty)+1; stAutoSaveM(); beep("ok"); vib(70); toast(iti.code+" +1 = "+ln.cntQty,"ok"); stocktakeSheet(stid); }
      else { beep("fail"); vib([90,50,90]); toast(T("สินค้านี้ไม่อยู่ในใบนับ","Item not in count sheet"),"err"); stocktakeSheet(stid); } }
    else { beep("fail"); vib([90,50,90]); toast(T("ไม่พบสินค้า: ","Not found: ")+text,"err"); stocktakeSheet(stid); }
    return; }
  var it=findScanned(text);
  if(!it&&typeof huGetM==="function"&&huOnM()&&huGetM(text)){ beep("ok"); vib(70); huLookupM(String(text).trim()); return; }   /* a tote / pallet: what is in it, where it is */
  if(!it){ beep("fail"); vib([90,50,90]); toast(T("ไม่พบสินค้า: ","Not found: ")+text,"err"); openManualPick(_opAction||"receive"); return; }
  if(_opAction==="issue"||_opAction==="transfer"||_opAction==="qc"){
    var avail=totalStock(it.code);
    if(avail<=0){ beep("nostock"); vib([70,60,70]); toast(T("ไม่มีของในสต๊อก: ","No stock: ")+(it.name||it.code||""),"err"); }
    else { beep("ok"); vib(70); }
  } else { beep("ok"); vib(70); }
  if(_opAction){ opForm(_opAction,it.code); }
  else { openItemAction(it.code); }
}

/* resume a saved session (token still on this device) -> PIN lock screen or straight in */
function proceedAfterData(){

  session.user=u; activateCompany((sess&&sess.company&&(META.companies||[]).some(function(c){return c.id===sess.company;}))?sess.company:homeCompany(u));

function boot(){
  if(!authTok()){ try{localStorage.removeItem(DB_KEY);}catch(e){} screenLogin(); return; }   // no data on the device before sign-in

    if(remote&&remote.companies&&pendLoadM().base.length&&loadMETA()&&META.companies&&META.companies.length){
      proceedAfterData();         // unsent work on this device: keep its copy — auto-sync sends the queue, then pulls
    } else if(remote&&remote.companies){

    } else {

/* flush any unsaved changes to the server when the app is backgrounded / screen off / closed */
function flushSaveM(){ if(!_saveDirty&&!_saveChain) return Promise.resolve(true);
  return saveByTableM(true).then(function(res){ if(res&&res.ok) _saveDirty=false; return !!(res&&res.ok); },function(){ return false; });   // stays dirty (and queued) until the server confirms
}

function leaveSessionM(){ var done=false, fin=function(){ if(done) return; done=true; _lockedM=false; clearLocalSession(); screenLogin(); };
  Promise.resolve(flushSaveM()).then(fin,fin); setTimeout(fin,6000); }

function syncNow(){

      toast(T("ยังบันทึกขึ้นเซิร์ฟเวอร์ไม่ได้ — เก็บข้อมูลในเครื่องไว้ก่อน","Unsaved changes could not be uploaded — kept on this device")+(res.err?" · "+res.err:""),"err");
      return "KEPT"; }
    _saveDirty=false; var rev1=_saveRev; return loadFromServer().then(function(x){ return (_saveRev!==rev1||_saveDirty)?"EDITED":x; });
  }).then(function(remote){ if(remote==="KEPT") return;
    if(remote==="EDITED"){ if(b)b.classList.remove("spin"); toast(T("มีรายการใหม่ระหว่างซิงก์ — ลองอีกครั้ง","New changes during sync — try again"),"warn"); return; }
    if(remote==="UNAUTH"){ sessionExpiredM(); return; }
    if(remote&&remote.companies){
      var cid=session.company; META=remote; try{localStorage.setItem(DB_KEY,JSON.stringify(META));}catch(e){}
      session.user=curUserM()||session.user;
      if(cid)activateCompany(cid); txnSeq=META.txnSeq||0;
      toast(T("ซิงก์ข้อมูลแล้ว","Synced"),"ok"); go(CUR||"home");
    } else { if(b)b.classList.remove("spin"); toast(T("ซิงก์ไม่สำเร็จ","Sync failed")+(window.__syncErr?" · "+window.__syncErr:""),"err"); }
  });
}

<script>
(function(){
  function lbl(sel){ var o=sel.options[sel.selectedIndex]; return o?o.text:""; }
  function enhance(sel){
    if(!sel || sel.__enh || sel.multiple) return;
    if(sel.closest && sel.closest('.ssel')) return;
    sel.__enh=true;
    var wrap=document.createElement('div'); wrap.className='ssel';
    if(sel.parentNode){ sel.parentNode.insertBefore(wrap, sel); } else { return; }
    wrap.appendChild(sel); sel.style.display='none';
    var inp=document.createElement('input'); inp.type='text'; inp.className='inp ssel-in'; inp.setAttribute('autocomplete','off'); inp.setAttribute('inputmode','search');
    var car=document.createElement('div'); car.className='ssel-caret'; car.innerHTML='&#9662;';
    var pan=document.createElement('div'); pan.className='ssel-pan';
    wrap.appendChild(inp); wrap.appendChild(car); wrap.appendChild(pan);
    inp.disabled=sel.disabled;
    function build(f){ pan.innerHTML=''; f=(f||'').toLowerCase().trim(); var any=false;
      for(var i=0;i<sel.options.length;i++){ var o=sel.options[i];
        if(f && (o.text||'').toLowerCase().indexOf(f)<0) continue; any=true;
        var d=document.createElement('div'); d.className='ssel-opt'+(o.selected?' sel':''); d.textContent=o.text; d.setAttribute('data-i',i);
        d.addEventListener('mousedown', function(ev){ ev.preventDefault(); pick(+this.getAttribute('data-i')); });
        pan.appendChild(d);
      }
      if(!any){ var e=document.createElement('div'); e.className='ssel-empty'; e.textContent='—'; pan.appendChild(e); }
    }
    function open(){ if(sel.disabled)return; build(''); wrap.classList.add('open'); inp.value=''; try{inp.focus();}catch(e){} }
    function close(){ wrap.classList.remove('open'); inp.value=lbl(sel); }
    function pick(i){ sel.selectedIndex=i; try{ sel.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){} inp.value=lbl(sel); wrap.classList.remove('open'); }
    inp.value=lbl(sel);
    inp.addEventListener('focus', function(){ if(!wrap.classList.contains('open')) open(); });
    inp.addEventListener('input', function(){ wrap.classList.add('open'); build(inp.value); });
    car.addEventListener('mousedown', function(ev){ ev.preventDefault(); if(wrap.classList.contains('open')) close(); else open(); });
    inp.addEventListener('blur', function(){ setTimeout(function(){ if(document.activeElement!==inp && !wrap.contains(document.activeElement)) close(); }, 130); });
    sel.addEventListener('change', function(){ if(!wrap.classList.contains('open')) inp.value=lbl(sel); });
  }
  function all(root){ try{ (root||document).querySelectorAll('select:not([multiple])').forEach(enhance); }catch(e){} }
  document.addEventListener('click', function(ev){
    var open=document.querySelectorAll('.ssel.open'); for(var i=0;i<open.length;i++){ var w=open[i];
      if(!w.contains(ev.target)){ w.classList.remove('open'); var s=w.querySelector('select'),n=w.querySelector('.ssel-in'); if(s&&n){ var o=s.options[s.selectedIndex]; n.value=o?o.text:''; } } }
  });
  var pend=null;
  function boot(){ var mo=new MutationObserver(function(){ clearTimeout(pend); pend=setTimeout(function(){ all(document); }, 60); });
    try{ mo.observe(document.body,{childList:true,subtree:true}); }catch(e){} all(document); }
  if(document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
})();
</script>

<script>(function(){
  function stepFn(inp,delta){
    var mn=(inp.min!==""&&inp.min!=null)?parseFloat(inp.min):-Infinity;
    var mx=(inp.max!==""&&inp.max!=null)?parseFloat(inp.max):Infinity;
    var v=parseFloat(inp.value); if(isNaN(v))v=0; v+=delta; if(v<mn)v=mn; if(v>mx)v=mx;
    if(Math.abs(v%1)<1e-9)v=Math.round(v);
    inp.value=String(v);
    try{ inp.dispatchEvent(new Event("input",{bubbles:true})); }catch(e){}
    try{ inp.dispatchEvent(new Event("change",{bubbles:true})); }catch(e){}
  }
  function qenh(inp){
    if(!inp||inp.__qenh) return; if(inp.closest&&inp.closest(".qstep")) return;
    inp.__qenh=true;
    var wrap=document.createElement("div"); wrap.className="qstep";
    if(!inp.parentNode) return; inp.parentNode.insertBefore(wrap,inp);
    var minus=document.createElement("button"); minus.type="button"; minus.className="qs-btn"; minus.textContent="−"; minus.tabIndex=-1;
    var plus=document.createElement("button"); plus.type="button"; plus.className="qs-btn"; plus.textContent="+"; plus.tabIndex=-1;
    wrap.appendChild(minus); wrap.appendChild(inp); wrap.appendChild(plus);
    inp.classList.add("qs-in"); inp.style.width=""; inp.style.flex="1";
    var hold=null,rep=null;
    function start(d){ stepFn(inp,d); clearTimeout(hold); clearInterval(rep); hold=setTimeout(function(){ rep=setInterval(function(){stepFn(inp,d);},90); },420); }
    function stop(){ clearTimeout(hold); clearInterval(rep); }
    minus.addEventListener("mousedown",function(e){e.preventDefault();start(-1);});
    plus.addEventListener("mousedown",function(e){e.preventDefault();start(1);});
    minus.addEventListener("touchstart",function(e){e.preventDefault();start(-1);},{passive:false});
    plus.addEventListener("touchstart",function(e){e.preventDefault();start(1);},{passive:false});
    ["mouseup","mouseleave","touchend","touchcancel"].forEach(function(ev){ minus.addEventListener(ev,stop); plus.addEventListener(ev,stop); });
  }
  function allQ(root){ try{ (root||document).querySelectorAll('input[type=number]').forEach(qenh); }catch(e){} }
  var t=null;
  function boot(){ try{ new MutationObserver(function(){ clearTimeout(t); t=setTimeout(function(){allQ(document);},60); }).observe(document.body,{childList:true,subtree:true}); }catch(e){} allQ(document); }
  if(document.body) boot(); else document.addEventListener("DOMContentLoaded",boot);
})();</script>

  return '<div style="margin-top:3px">'+(pl?huTagM(pl,"pallet"):"")+(tt?huTagM(tt,"tote"):"")+'</div>'; };
window.huTagsM=function(s){ if(!s||!s.hu||!huShowM()) return "";
  var p=huPathM(s.hu)||{pallet:s.hu,tote:""};
  return '<div style="margin-top:3px">'+(p.pallet?huTagM(p.pallet,"pallet"):"")+(p.tote?huTagM(p.tote,"tote"):"")+'</div>'; };

/* put stock into a pallet / tote at a location; dry = only check; null = refused (message shown) */
window.huPutM=function(loc,pre,dry){
  var none={hu:"",pallet:"",tote:""}; if(!huOnM()) return none;
  var c=huCfgM(), pv=c.pallet!=="off"?String(val2(pre+"_pal")||"").trim():"", tv=c.tote!=="off"?String(val2(pre+"_tote")||"").trim():"";
  var no=function(m){ toast(m,"err"); return null; };
  var P=pv?huGetM(pv):null, T0=tv?huGetM(tv):null;
  if(P) pv=P.code; if(T0) tv=T0.code;
  if(c.pallet==="req"&&!pv&&!(T0&&T0.parent&&huLocOfM(T0)===loc)) return no(T("กรุณาสแกนรหัสพาเลท","Scan the pallet code"));
  if(c.tote==="req"&&!tv) return no(T("กรุณาสแกนรหัสตะกร้า","Scan the tote code"));
  if(pv&&tv&&pv===tv) return no(T("รหัสพาเลทกับตะกร้าต้องไม่ซ้ำกัน","Pallet and tote codes must differ"));
  if(P&&P.type!=="pallet") return no(pv+" "+T("เป็นรหัสตะกร้า ไม่ใช่พาเลท","is a tote, not a pallet"));
  if(T0&&T0.type!=="tote") return no(tv+" "+T("เป็นรหัสพาเลท ไม่ใช่ตะกร้า","is a pallet, not a tote"));
  if(!P&&T0&&T0.parent&&!pv&&huLocOfM(T0)===loc) P=huGetM(T0.parent);
  if(tv&&c.toteOnPallet&&!P&&!pv) return no(T("ตะกร้าต้องวางบนพาเลท — สแกนรหัสพาเลทด้วย","A tote must sit on a pallet — scan the pallet too"));
  if(P){ var pl=huLocOfM(P); if(pl&&pl!==loc&&huRowsM(P.code,true).length) return no(T("พาเลท "+P.code+" อยู่ที่ "+pl+" — เลือกตำแหน่งนี้ หรือย้ายพาเลทก่อน","Pallet "+P.code+" is at "+pl+" — pick that location or move it first")); }
  if(T0&&huRowsM(T0.code).length){ var tl=huLocOfM(T0);
    if(tl&&tl!==loc) return no(T("ตะกร้า "+T0.code+" อยู่ที่ "+tl+" — ย้ายตะกร้าก่อน","Tote "+T0.code+" is at "+tl+" — move it first"));
    if(P&&T0.parent&&T0.parent!==P.code) return no(T("ตะกร้า "+T0.code+" อยู่บนพาเลท "+T0.parent,"Tote "+T0.code+" is on pallet "+T0.parent)); }
  var res={hu:tv||pv||(P?P.code:""),pallet:pv||(P?P.code:""),tote:tv}; if(dry) return res;
  if(!DB.huMaster) DB.huMaster=[];
  var st={at:today()+" "+nowTime(),by:whoName()};
  if(pv&&!P){ P=Object.assign({code:pv,type:"pallet",parent:"",loc:loc},st); DB.huMaster.push(P); }
  if(tv&&!T0){ T0=Object.assign({code:tv,type:"tote",parent:"",loc:""},st); DB.huMaster.push(T0); }
  if(P){ P.parent=""; P.loc=loc; }
  if(T0){ if(P){ T0.parent=P.code; T0.loc=""; } else { T0.parent=""; T0.loc=loc; } }
  return res; };

/* move a whole container: pallet → location, tote → location or onto a pallet; everything in it moves too */
function huMoveToM(code,dest){
  var x=huGetM(code); if(!x){ toast(T("ไม่พบรหัส ","Not found: ")+code,"err"); return false; } dest=String(dest||"").trim(); if(!dest){ toast(T("สแกนปลายทาง","Scan the destination"),"warn"); return false; }
  var from=huLocOfM(x), D=huGetM(dest), toLoc, parent="";
  if(D){ if(x.type!=="tote"||D.type!=="pallet"){ toast(T("วางได้เฉพาะตะกร้าบนพาเลท","Only a tote can go onto a pallet"),"err"); return false; }
    toLoc=huLocOfM(D); parent=D.code; if(!toLoc){ toast(T("พาเลท "+D.code+" ยังไม่ได้วางที่ตำแหน่งใด","Pallet "+D.code+" is not at a location"),"err"); return false; } }
  else { var lm=matchLocation(dest); if(!lm||String(lm.code).toUpperCase()!==dest.toUpperCase()){ toast(T("ไม่พบตำแหน่ง ","Location not found: ")+dest,"err"); return false; }
    if(x.type==="tote"&&huCfgM().toteOnPallet){ toast(T("ตั้งค่าไว้ว่าตะกร้าต้องวางบนพาเลท","Totes must sit on a pallet (setting)"),"err"); return false; }
    toLoc=lm.code; }
  if(x.parent===parent&&from===toLoc&&(parent||x.loc===toLoc)){ toast(T("อยู่ที่นี่อยู่แล้ว","Already there"),"warn"); return false; }
  var rows=huRowsM(code,true);
  if(toLoc!==from&&rows.length){ if(!capWarnM(toLoc,huQtyM(rows))) return false;
    var codes=[]; rows.forEach(function(r){ if(codes.indexOf(r.code)<0) codes.push(r.code); });
    for(var i=0;i<codes.length;i++) if(!mixWarnM(toLoc,codes[i])) return false; }
  var oldP={}; rows.forEach(function(r){ oldP[r.hu]=oldP[r.hu]||huPathM(r.hu)||{}; });
  x.parent=parent; x.loc=parent?"":toLoc;
  if(toLoc!==from) rows.forEach(function(r){ var op=oldP[r.hu]||{}, np=huPathM(r.hu)||{}, q=parseInt(r.qty)||0, it=itemByCode(r.code)||{}, c={qty:q,lotNo:r.lotNo||"",lotSup:r.lotSup||"",mfd:r.mfd||"",exp:r.exp||"",sn:r.sn||""};
    hpushPairLots({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:r.code,name:it.name||r.code,qty:q,unit:it.unit,loc:from,toLoc:toLoc,hu:r.hu,pallet:op.pallet||undefined,tote:op.tote||undefined,orderNo:"HU-MOVE",note:"Mobile "+code+" → "+toLoc,status:"Done"},
      {id:nextTxnId(),type:"IN",date:today(),time:nowTime(),code:r.code,name:it.name||r.code,qty:q,unit:it.unit,loc:toLoc,fromLoc:from,hu:r.hu,pallet:np.pallet||undefined,tote:np.tote||undefined,orderNo:"HU-MOVE",note:"Mobile "+code+" ← "+from,status:"Stored"},[c]);
    var same=(DB.stock||[]).find(function(s){ return s!==r&&s.code===r.code&&s.loc===toLoc&&lotKey(s)===lotKey(r); });
    if(same){ same.qty=(parseInt(same.qty)||0)+q; r.qty=0; } else r.loc=toLoc; });
  for(var j=DB.stock.length-1;j>=0;j--) if(DB.stock[j].hu&&(parseInt(DB.stock[j].qty)||0)<=0) DB.stock.splice(j,1);
  return true; }

/* ── views ── */
function chipM(cls,lab,code){ if((cls==="pl"&&!huLvlM("pallet"))||(cls==="tt"&&!huLvlM("tote"))) return ""; return '<span class="'+cls+'">'+lab+' <b>'+esc(code)+'</b></span>'; }
function pathM(p){ var a=[]; if(p.wh) a.push(chipM("wh",T("คลัง","WH"),p.wh)); if(p.loc) a.push(chipM("lc",T("ตำแหน่ง","Loc"),p.loc)); if(p.pallet&&huLvlM("pallet")) a.push(chipM("pl",T("พาเลท","Pallet"),p.pallet)); if(p.tote&&huLvlM("tote")) a.push(chipM("tt",T("ตะกร้า","Tote"),p.tote));
  return '<div class="hu-path">'+(a.join("<i>›</i>")||"<span>-</span>")+'</div>'; }
function itemsM(rs){ return rs.map(function(s){ return '<li class="hu-it"><b>'+esc(s.code)+'</b> '+esc(itNameM(s.code))+' · <b>'+num(s.qty)+'</b>'+(s.lotNo?' · '+esc(s.lotNo):'')+'</li>'; }).join(""); }
function nodeM(x){ var kids=huKidsM(x.code), own=huRowsM(x.code);
  return '<li><span class="hu-tag '+(x.type==="pallet"?"pl":"tt")+'">'+(x.type==="pallet"?T("พาเลท","Pallet"):T("ตะกร้า","Tote"))+'</span><b>'+esc(x.code)+'</b>'+(x.ptype?' <small style="color:var(--sub)">'+esc(x.ptype)+'</small>':'')+' <small style="color:var(--sub)">· '+num(huQtyM(huRowsM(x.code,true)))+'</small>'
    +((kids.length||own.length)?'<ul>'+kids.map(nodeM).join("")+itemsM(own)+'</ul>':'')+'</li>'; }
function huInfoM(code){ var x=huGetM(code); if(!x) return '<div class="hu-box" style="color:var(--danger)">'+T("ไม่พบรหัส ","Not found: ")+esc(code)+'</div>';
  return '<div class="hu-box">'+pathM(huPathM(x.code))+'<ul class="hu-tree">'+nodeM(x)+'</ul></div>'; }
function scanField(label,id,ph){ return '<div class="field"><label>'+label+'</label><div class="loc-row"><input class="inp" id="'+id+'" autocomplete="off" placeholder="'+(ph||T("สแกน / พิมพ์รหัส","Scan / type"))+'" onchange="huScannedM(\''+id+'\',this.value,1)">'
  +'<button class="loc-scan" id="scan_'+id+'" type="button" title="'+T("กดค้างเพื่อสแกน","Hold to scan")+'">'+IC.scan.replace(/currentColor/g,"#fff")+'</button></div></div>'; }

/* look a tote / pallet up */
window.huLookupM=function(code){
  var body='<div class="grab"></div><div class="sh-h"><div class="thumb" style="background:var(--orange-grad)">'+IC.box+'</div><div><b>'+T("ตรวจสอบ"+huWordsM(),huWordsM()+" lookup")+'</b><small>'+T("สแกนเพื่อดูว่าอยู่ที่ไหน มีอะไรข้างใน","Scan to see where it is and what it holds")+'</small></div></div>'
    +scanField(T("รหัส"+huWordsM(),huWordsM()+" code"),"hu_q")+'<div id="hu_qInfo">'+(code?huInfoM(code):'')+'</div>'
    +(code&&huGetM(code)?'<button class="btn primary" onclick="huMoveSheetM('+jsa(huGetM(code).code)+')">'+T("ย้ายภาชนะนี้","Move this container")+'</button>':'');
  openSheet(body); bindLocScanButtons(); var q=document.getElementById("hu_q"); if(q&&code) q.value=code; };
/* move a whole tote / pallet */
window.huMoveSheetM=function(src){
  var body='<div class="grab"></div><div class="sh-h"><div class="thumb" style="background:var(--orange-grad)">'+IC.trf.replace(/currentColor/g,"#fff")+'</div><div><b>'+T("ย้าย"+huWordsM(),"Move a "+huWordsM())+'</b><small>'+T("สินค้าทั้งหมดในภาชนะย้ายตามไปด้วย","Everything inside moves with it")+'</small></div></div>'
    +scanField(T("1. สแกน"+huWordsM().replace(" / "," หรือ "),"1. Scan the "+huWordsM().replace(" / "," or ")),"hm_src")+'<div id="hm_srcInfo">'+(src?huInfoM(src):'')+'</div>'
    +scanField((huLvlM("pallet")&&huLvlM("tote")?T("2. ปลายทาง: ตำแหน่ง (หรือพาเลท สำหรับตะกร้า)","2. Destination: location (or a pallet, for a tote)"):T("2. ปลายทาง: ตำแหน่ง","2. Destination: location")),"hm_dst")+'<div id="hm_dstInfo"></div>'
    +'<button class="btn primary" onclick="huMoveGoM()">'+T("ยืนยันการย้าย","Confirm move")+'</button>';
  openSheet(body); bindLocScanButtons(); var s=document.getElementById("hm_src"); if(s&&src) s.value=src; };
window.huMoveGoM=function(){ var s=String(val2("hm_src")||"").trim(), d=String(val2("hm_dst")||"").trim(), x=huGetM(s), D=huGetM(d);
  if(!x){ toast(T("สแกน"+huWordsM()+"ก่อน","Scan the "+huWordsM()+" first"),"warn"); return; }
  if(huMoveToM(x.code,D?D.code:d)){ mSave(); toast(T("ย้ายแล้ว ","Moved ")+x.code+" → "+(D?D.code:d),"ok"); huMoveSheetM(""); } };
/* a scan (camera or typed) into one of the pallet / tote fields */
window.huScannedM=function(fid,text,typed){ text=String(text||"").trim(); var el=document.getElementById(fid); if(el) el.value=text; if(!text) return;
  var x=huGetM(text); if(x&&el) el.value=x.code;
  if(!typed){ beep(x||fid==="op_pal"||fid==="op_tote"?"ok":"fail"); vib(70); }
  if(fid==="hu_q"){ var b=document.getElementById("hu_qInfo"); if(b) b.innerHTML=huInfoM(text); if(x) huLookupM(x.code); return; }
  if(fid==="hm_src"){ var b2=document.getElementById("hm_srcInfo"); if(b2) b2.innerHTML=huInfoM(text); return; }
  if(fid==="hm_dst"){ var b3=document.getElementById("hm_dstInfo"); if(!b3) return; var lm=matchLocation(text);
    b3.innerHTML=x?huInfoM(text):(lm&&String(lm.code).toUpperCase()===text.toUpperCase()?'<div class="hu-box">'+pathM({wh:lm.warehouse||"",loc:lm.code})+'</div>':'<div class="hu-box" style="color:var(--danger)">'+T("ไม่พบ ","Not found: ")+esc(text)+'</div>'); return; }
  /* op_pal / op_tote: an existing container brings its location along */
  if(x){ var l=huLocOfM(x), to=document.getElementById("op_to");
    if(l&&to&&to.value!==l&&[].some.call(to.options,function(o){return o.value===l;})){ to.value=l; try{ to.dispatchEvent(new Event("change",{bubbles:true})); }catch(e){} toast(T("ตำแหน่งปลายทาง: ","Destination: ")+l+" ("+x.code+")","ok"); } }
  else if(!typed) toast(T("รหัสใหม่ — จะสร้างให้เมื่อยืนยัน: ","New code — created on confirm: ")+text,"ok"); };

/* source container list for issue / transfer */
function srcOptsM(code,loc){ var rows=(DB.stock||[]).filter(function(s){return s.code===code&&s.loc===loc&&(parseInt(s.qty)||0)>0;}), g={}, loose=0;
  rows.forEach(function(s){ var q=parseInt(s.qty)||0; if(s.hu) g[s.hu]=(g[s.hu]||0)+q; else loose+=q; });
  var ks=Object.keys(g).sort(); if(!ks.length) return "";
  return '<option value="">'+T("ทุกภาชนะ (FIFO)","Any (FIFO)")+'</option>'+(loose?'<option value="~">'+T("วางที่ตำแหน่งโดยตรง","Loose on the location")+' · '+num(loose)+'</option>':'')
    +ks.map(function(k){ var p=huPathM(k)||{}; return '<option value="'+esc(k)+'">'+esc(k)+(p.tote&&p.pallet?' ('+T("บน","on")+' '+esc(p.pallet)+')':'')+' · '+num(g[k])+'</option>'; }).join(""); }
window.huSrcRefreshM=function(){ var w=document.getElementById("op_huWrap"); if(!w) return; var code=window._opCode||"", from=val2("op_from"), cur=val2("op_hu"), o=srcOptsM(code,from);
  w.innerHTML=o?'<div class="field"><label>'+T("จากภาชนะ (พาเลท / ตะกร้า)","From container (pallet / tote)")+'</label><select class="inp" id="op_hu">'+o+'</select></div>':'';
  var s=document.getElementById("op_hu"); if(s&&cur&&[].some.call(s.options,function(x){return x.value===cur;})) s.value=cur; };
window.huDestFieldsM=function(t){ return destFieldsM(t); };
function destFieldsM(title){ var c=huCfgM(); return '<div style="font-size:12px;font-weight:800;color:var(--sub);margin:2px 0 6px">'+title+'</div>'
  +(c.pallet!=="off"?scanField(T("รหัสพาเลท","Pallet code")+(c.pallet==="req"?' <span style="color:var(--danger)">*</span>':''),"op_pal"):"")
  +(c.tote!=="off"?scanField(T("รหัสตะกร้า (QR)","Tote code (QR)")+(c.tote==="req"?' <span style="color:var(--danger)">*</span>':''),"op_tote"):""); }
var _of=opForm; opForm=function(action){ _of.apply(this,arguments); try{
  if(!huOnM()) return; var after=function(id,html){ var e=document.getElementById(id); e=e&&e.closest(".field"); if(e) e.insertAdjacentHTML("afterend",html); };
  if(action==="receive") after("op_to",destFieldsM(T("ภาชนะจัดเก็บ (เว้นว่าง = วางที่ตำแหน่งโดยตรง)","Container (blank = loose on the location)")));
  else if(action==="issue"){ after("op_from",'<div id="op_huWrap"></div>'); huSrcRefreshM(); }
  else if(action==="transfer"){ after("op_from",'<div id="op_huWrap"></div>'); after("op_to",destFieldsM(T("ปลายทาง: วางบนพาเลท / ใส่ตะกร้า (เว้นว่าง = วางที่ตำแหน่งโดยตรง)","Destination: onto a pallet / into a tote (blank = loose)"))); huSrcRefreshM(); }
  bindLocScanButtons(); }catch(e){} };
var _oa=opAvail; opAvail=function(){ var r=_oa.apply(this,arguments); try{ huSrcRefreshM(); }catch(e){} return r; };
/* scan menu: two more jobs */
var _sm=openScanMenu; openScanMenu=function(){ _sm.apply(this,arguments); try{ if(!huOnM()) return; var o=document.querySelector("#sheet .opts"); if(!o) return;
  o.insertAdjacentHTML("beforeend",'<div class="opt trf" onclick="huMoveSheetM(\'\')"><div class="oi">'+IC.trf.replace(/currentColor/g,"#fff")+'</div><div><b>'+T("ย้าย"+huWordsM(),"Move "+huWordsM())+'</b><small>'+T("ย้ายทั้งภาชนะ สินค้าข้างในย้ายตาม","Whole container, contents follow")+'</small></div></div>'
    +'<div class="opt rcv" onclick="huLookupM(\'\')"><div class="oi">'+IC.box.replace(/currentColor/g,"#fff")+'</div><div><b>'+T("ตรวจสอบ"+huWordsM(),huWordsM()+" lookup")+'</b><small>'+T("อยู่ที่ไหน มีอะไรข้างใน","Where it is, what is inside")+'</small></div></div>'); }catch(e){} };
})();
</script>

<script id="inq-m">
/* ═══ Inquiry (item / tote / pallet / location) + a More menu grouped like the web app, with each user's own
   show / hide list. Everything shown still passes the company menu settings made on the web (Super Admin),
   the per-user menus an Admin set, and the role rules — this list only hides more, never shows more. ═══ */
(function(){
var H=function(){ return window.huApiM||null; };
var huOn=function(){ return typeof huOnM==="function"&&huOnM(); };
var chev='<span style="color:var(--sub2);font-size:18px">›</span>';
function thumbOf(it){ var s=it&&imgSrc(it.img); return '<div class="thumb">'+(s?'<img src="'+esc(s)+'" onerror="imgFallback(this)">':IC.box)+'</div>'; }
function back(fn,lbl){ return '<button class="btn ghost" style="margin-top:12px" onclick="'+fn+'">‹ '+(lbl||T("กลับ","Back"))+'</button>'; }
function tile(v,l,col){ return '<div class="iq-tile"><b'+(col?' style="color:'+col+'"':'')+'>'+v+'</b><span>'+l+'</span></div>'; }
function kv(pairs){ var h=pairs.filter(function(p){ return p[1]!==""&&p[1]!=null; }).map(function(p){ return '<dt>'+p[0]+'</dt><dd>'+p[1]+'</dd>'; }).join("");
  return h?'<div class="card" style="padding:0"><dl class="iq-kv" style="margin:0">'+h+'</dl></div>':''; }
function head(icon,title,sub,grad){ return '<div class="grab"></div><div class="sh-h"><div class="thumb" style="background:'+(grad||"var(--orange-grad)")+'">'+icon+'</div><div style="flex:1;min-width:0"><b>'+title+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div></div>'; }
function costOn(){ return feat("costing"); }
function rowCostM(s){ var c=parseFloat(s.cost); if(c>0) return c; var it=itemByCode(s.code)||{}; return parseFloat(it.cost)||0; }
function bookedOf(code){ return (DB.bookings||[]).filter(function(b){ return !b.issued&&!b.reserved&&b.status!=="Fulfilled"&&b.status!=="Cancelled"&&b.status!=="Done"; })
  .reduce(function(a,b){ return a+(b.lines||[]).filter(function(l){ return l.code===code; }).reduce(function(s,l){ return s+(parseFloat(l.qty)||0); },0); },0); }
function lotTxt(s){ var t=[]; if(s.lotNo) t.push("Lot "+esc(s.lotNo)); if(s.lotSup) t.push("SUP "+esc(s.lotSup)); if(s.mfd) t.push("MFD "+fmtDate(s.mfd)); if(s.exp) t.push("EXP "+fmtDate(s.exp)); if(s.sn) t.push("S/N "+esc(s.sn)); return t.join(" · "); }
function expWarn(exp){ if(!exp) return ""; var d=Math.ceil((new Date(exp)-new Date())/86400000); if(isNaN(d)) return "";
  return d<0?' <span class="pill ng"><i></i>'+T("หมดอายุ","expired")+'</span>':(d<=30?' <span class="pill warn"><i></i>'+d+T(" วัน","d")+'</span>':''); }
/* one stock row: item, qty, lot, container */
function stockRowHtml(s,opt){ opt=opt||{}; var it=itemByCode(s.code)||{code:s.code,name:s.code}, lt=lotTxt(s);

/* what a code is: exact matches only, the asked-for kind first */
function itemExact(t){ var up=t.toUpperCase(); return (DB.itemMaster||[]).find(function(i){ return String(i.code).toUpperCase()===up||(i.barcode&&String(i.barcode).toUpperCase()===up)||(i.qr&&String(i.qr).toUpperCase()===up); })||null; }
function locExact(t){ var up=t.toUpperCase(); return (DB.locationMaster||[]).find(function(l){ return String(l.code).toUpperCase()===up||(l.barcode&&String(l.barcode).toUpperCase()===up)||(l.qr&&String(l.qr).toUpperCase()===up); })||null; }
function huExact(t,type){ if(!huOn()) return null; var x=huGetM(t); return x&&(!type||x.type===type)?x:null; }
function resolve(kind,t){
  var f={item:function(){ var i=itemExact(t); return i&&{kind:"item",ref:i.code}; },
         tote:function(){ var x=huExact(t,"tote"); return x&&{kind:"tote",ref:x.code}; },
         pallet:function(){ var x=huExact(t,"pallet"); return x&&{kind:"pallet",ref:x.code}; },
         loc:function(){ var l=locExact(t); return l&&{kind:"loc",ref:l.code}; }};
  var r=f[kind]&&f[kind](); if(r) return r;
  for(var k in f){ if(k!==kind){ r=f[k](); if(r){ r.other=true; return r; } } }
  if(kind==="item"){ var it=findScanned(t); if(it) return {kind:"item",ref:it.code}; }   // a part of the name / code
  return null; }

<script id="put-m">
/* ═══ Put-away suggestion on the receive forms: "แนะนำตำแหน่ง" next to the location field opens a card with the
   best location and a map of the warehouse layout made on the web (Warehouse layout), with the walking path
   from the receiving point (a start point / door on the layout) to that rack bay. ═══ */
(function(){
var STEP=25, SOLID={rack:1,wall:1,column:1,office:1,floor:1,pallet:1};
var PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
var MAP='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>';
/* the layout data the web stores (settings.whLayout[warehouse]) — read only; empty maps can arrive as [] */
function asObj(v){ if(v&&typeof v==="object"&&!Array.isArray(v)) return v; var o={}; if(v&&typeof v==="object") Object.keys(v).forEach(function(k){ o[k]=v[k]; }); return o; }
function plans(){ var st=asObj(DB&&DB.settings&&DB.settings.whLayout), out=[];
  Object.keys(st).forEach(function(wh){ var p=st[wh]; if(!p||typeof p!=="object"||!Array.isArray(p.objs)||!p.objs.length) return;
    out.push({wh:wh,w:+p.w||3000,d:+p.d||2000,objs:p.objs.filter(function(o){ return o&&typeof o==="object"&&!Array.isArray(o); })}); });
  return out; }
function box(o){ var r=(+o.rot||0)%180; return r===90?{w:+o.d||10,d:+o.w||10}:{w:+o.w||10,d:+o.d||10}; }
function flip(o){ return ((((+o.rot||0)%360)+360)%360)>=180; }
function cells(o){ var out=[], cs=asObj(o.cells);
  if(o.kind==="rack"){ var lv=Math.max(1,+o.levels||1), by=Math.max(1,+o.bays||1);
    if(o.top) for(var t=1;t<=by;t++) out.push({level:lv+1,bay:t,top:true,loc:cs["T-"+t]||""});
    for(var L=lv;L>=1;L--) for(var B=1;B<=by;B++) out.push({level:L,bay:B,loc:cs[L+"-"+B]||""}); }
  else out.push({level:1,bay:1,loc:o.loc||""});
  return out; }
/* where a location sits: {p, o, c} or null */
function whereIs(loc){ var ps=plans();
  for(var i=0;i<ps.length;i++) for(var j=0;j<ps[i].objs.length;j++){ var o=ps[i].objs[j], cs=cells(o);
    for(var k=0;k<cs.length;k++) if(cs[k].loc===loc) return {p:ps[i],o:o,c:cs[k]}; }
  return null; }
function bayPt(o,bay){ var b=box(o), rot=((+o.rot||0)%180===90), by=Math.max(1,+o.bays||1), span=rot?b.d:b.w, bw=span/by, bi=Math.max(1,bay), off=((flip(o)?(by-bi+1):bi)-0.5)*bw;
  return rot?{x:(+o.x||0)+b.w/2,y:(+o.y||0)+off}:{x:(+o.x||0)+off,y:(+o.y||0)+b.d/2}; }
function spotPt(o){ var b=box(o); return {x:(+o.x||0)+b.w/2,y:(+o.y||0)+b.d/2}; }

function path(p,from,to){ var cols=Math.max(1,Math.ceil(p.w/STEP)), rows=Math.max(1,Math.ceil(p.d/STEP)), g=new Uint8Array(cols*rows);
  p.objs.forEach(function(o){ if(!SOLID[o.kind]) return; var b=box(o), c0=Math.floor((+o.x||0)/STEP), c1=Math.ceil(((+o.x||0)+b.w)/STEP), r0=Math.floor((+o.y||0)/STEP), r1=Math.ceil(((+o.y||0)+b.d)/STEP);
    for(var r=Math.max(0,r0);r<Math.min(rows,r1);r++) for(var c=Math.max(0,c0);c<Math.min(cols,c1);c++) g[r*cols+c]=1; });
  var free=function(cx,cy){ if(cx>=0&&cy>=0&&cx<cols&&cy<rows&&!g[cy*cols+cx]) return [cx,cy];
    for(var rad=1;rad<=Math.max(cols,rows);rad++) for(var dy=-rad;dy<=rad;dy++) for(var dx=-rad;dx<=rad;dx++){ if(Math.max(Math.abs(dx),Math.abs(dy))!==rad) continue;
      var x=cx+dx,y=cy+dy; if(x>=0&&y>=0&&x<cols&&y<rows&&!g[y*cols+x]) return [x,y]; } return null; };
  var a=free(Math.floor(from.x/STEP),Math.floor(from.y/STEP)), b=free(Math.floor(to.x/STEP),Math.floor(to.y/STEP)); if(!a||!b) return null;
  var n=cols*rows, prev=new Int32Array(n).fill(-1), seen=new Uint8Array(n), q=new Int32Array(n), h=0, t=0, s0=a[1]*cols+a[0], g0=b[1]*cols+b[0];
  q[t++]=s0; seen[s0]=1; var D=[[1,0],[-1,0],[0,1],[0,-1]];
  while(h<t){ var cur=q[h++]; if(cur===g0) break; var cx=cur%cols, cy=(cur-cx)/cols;
    for(var i=0;i<4;i++){ var nx=cx+D[i][0], ny=cy+D[i][1]; if(nx<0||ny<0||nx>=cols||ny>=rows) continue; var ni=ny*cols+nx; if(seen[ni]||g[ni]) continue; seen[ni]=1; prev[ni]=cur; q[t++]=ni; } }
  if(!seen[g0]) return null;
  var pts=[], at=g0; while(at!==-1){ var x=at%cols, y=(at-x)/cols; pts.push([x*STEP+STEP/2,y*STEP+STEP/2]); at=prev[at]; } pts.reverse();
  var out=[pts[0]]; for(var k=1;k<pts.length-1;k++){ var p1=out[out.length-1], p2=pts[k], p3=pts[k+1]; if((p2[0]-p1[0])*(p3[1]-p1[1])!==(p2[1]-p1[1])*(p3[0]-p1[0])) out.push(p2); }
  if(pts.length>1) out.push(pts[pts.length-1]); out.unshift([from.x,from.y]); out.push([to.x,to.y]); return out; }
function len(pts){ var s=0; for(var i=1;i<pts.length;i++) s+=Math.abs(pts[i][0]-pts[i-1][0])+Math.abs(pts[i][1]-pts[i-1][1]); return s; }

<script id="update-notifier">
/* ═══ Software update notice ═══
   Every 2 minutes (and when the tab comes back) it checks two fingerprints:
     1) this page file itself (ETag / Last-Modified / size from a no-cache HEAD request)
     2) the backend: api_supabase.php?action=version (hash of the deployed files)
   When either changes while the page is open, a card appears top-right. "Updated — refresh" saves any
   pending work, clears the app caches and reloads from the server (same as Ctrl+Shift+R). */
(function(){
  "use strict";
  var EVERY=120000;
  // drop the cache-buster added by the last update so the address stays clean
  try{ var u0=new URL(location.href); if(u0.searchParams.has("_v")){ u0.searchParams.delete("_v"); history.replaceState(null,"",u0.pathname+(u0.search||"")+u0.hash); } }catch(e){}
  var api=""; try{ api=CONFIG.API_BASE; }catch(e){} if(!api){ try{ api=PHP_API; }catch(e){} }
  function th(){ try{ return (typeof lang!=="undefined"?lang:LANG)!=="en"; }catch(e){ return true; } }
  function T(a,b){ return th()?a:b; }

  function stampOf(r){ if(!r||!r.ok) return ""; return [r.headers.get("etag")||"",r.headers.get("last-modified")||"",r.headers.get("content-length")||""].join("~").replace(/^~+$/,""); }
  /* always the same method (HEAD): GET responses may carry a different ETag / length (compression) and look like an
     update. A host that can't answer HEAD is simply not watched this way — the backend version check still is. */
  var headOK=true;
  function pageStamp(){
    if(!headOK) return Promise.resolve("");
    return fetch(location.pathname+"?_upd="+Date.now(),{method:"HEAD",cache:"no-store"})
      .then(function(r){ if(r.status===405||r.status===501){ headOK=false; return ""; } return stampOf(r); })
      .catch(function(){ headOK=false; return ""; });            // unreadable HEAD on this host: stop asking (one console line, not one every check)
  }
  function apiStamp(){
    if(!api) return Promise.resolve("");
    return fetch(api+(api.indexOf("?")<0?"?":"&")+"action=version&_="+Date.now(),{cache:"no-store"})
      .then(function(r){ return r.ok?r.json():null; }).then(function(j){ return (j&&j.version)||""; })
      .catch(function(){ return ""; });
  }
  var base=["",""], seen=null, snoozeUntil=0, card=null, busy=false;
  function check(){
    if(busy) return;
    if(document.hidden&&(base[0]||base[1])) return;          // the first look (baseline) is taken even in a background tab
    Promise.all([pageStamp(),apiStamp()]).then(function(v){
      var changed=false;
      for(var i=0;i<2;i++){
        if(!v[i]) continue;                         // offline / not available: never counts as an update
        if(!base[i]) base[i]=v[i];
        else if(v[i]!==base[i]) changed=true;
      }
      if(!changed) return;
      if(Date.now()<snoozeUntil) return;                 // closed: quiet for 30 minutes, whatever the stamps do
      seen=v.join("|"); show();
    });
  }

  function show(){
    if(card) return;
    card=document.createElement("div");
    card.setAttribute("role","alertdialog");
    card.style.cssText="position:fixed;top:16px;right:16px;max-height:calc(100vh - 32px);overflow:auto;z-index:2147483000;width:min(340px,calc(100vw - 32px));background:#fff;color:#1f2329;"
      +"border:1px solid #e6e8eb;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:14px 14px 12px;font:14px/1.45 system-ui,-apple-system,'Segoe UI','Noto Sans Thai',sans-serif;"
      +"transform:translateY(-12px);opacity:0;transition:transform .25s ease,opacity .25s ease";
    card.innerHTML=
      '<div style="display:flex;gap:12px;align-items:flex-start">'
      +'<div style="flex:0 0 38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#fb923c,#ea580c);display:flex;align-items:center;justify-content:center">'
      +'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg></div>'
      +'<div style="flex:1;min-width:0"><div data-t style="font-weight:800;font-size:15px;margin-bottom:2px"></div><div data-d style="color:#5b6370;font-size:13px"></div></div>'
      +'<button data-x type="button" aria-label="close" style="border:0;background:transparent;color:#8a919c;font-size:18px;line-height:1;cursor:pointer;padding:2px 4px">✕</button></div>'
      +'<button data-ok type="button" style="margin-top:12px;width:100%;border:0;border-radius:10px;padding:10px 12px;background:#f97316;color:#fff;font-weight:800;font-size:14px;cursor:pointer"></button>';
    card.querySelector("[data-t]").textContent=T("มีการอัปเดตซอฟต์แวร์","Software update available");
    card.querySelector("[data-d]").textContent=T("ระบบมีเวอร์ชันใหม่ กดปุ่มด้านล่างเพื่อบันทึกงานที่ค้างและโหลดเวอร์ชันล่าสุด",
                                                  "A new version is available. Press the button to save pending work and load the latest version.");
    var ok=card.querySelector("[data-ok]"); ok.textContent=T("ยืนยันอัปเดตซอฟต์แวร์ และรีเฟรช","Confirm update & refresh");
    ok.onclick=update;
    card.querySelector("[data-x]").onclick=function(){ snoozeUntil=Date.now()+30*60000; hide(); };
    card.style.top=cardTop()+"px";
    document.body.appendChild(card);
    requestAnimationFrame(function(){ card.style.transform="none"; card.style.opacity="1"; });
  }
  /* sit just below the header / language buttons on the right, so they stay usable */
  function cardTop(){
    var top=16, zone=Math.max(0,window.innerWidth-Math.min(360,window.innerWidth));   // the strip the card covers
    var sel=".top,.topbar,.lang,.loginmode,header,[class*=lang]";
    [].forEach.call(document.querySelectorAll(sel),function(e){
      if(card&&card.contains(e)) return;
      var r=e.getBoundingClientRect(), cs=getComputedStyle(e);
      if(!r.width||!r.height||cs.visibility==="hidden"||cs.display==="none") return;
      if(r.top>200||r.bottom<=0||r.right<zone) return;            // only things in the top-right corner
      top=Math.max(top,Math.round(r.bottom+10));
    });
    return Math.min(top,220);
  }
  window.addEventListener("resize",function(){ if(card) card.style.top=cardTop()+"px"; });
  function hide(){ if(!card) return; var c=card; card=null; c.style.opacity="0"; c.style.transform="translateY(-12px)"; setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },260); }

  /* save pending work first (each page has its own save layer) */
  function flushAll(){
    var waits=[];
    try{ if(typeof Store!=="undefined"){
      if(typeof Store.flushNow==="function") waits.push(Promise.resolve(Store.flushNow(true)).catch(function(){}));      // POS
      else if(typeof Store.flushRemote==="function") waits.push(Promise.resolve(Store.flushRemote()).catch(function(){})); // web (resolves when the server confirmed)
    } }catch(e){}
    try{ if(typeof saveByTableM==="function"&&typeof _saveDirty!=="undefined"&&_saveDirty)                                // mobile
      waits.push(Promise.resolve(saveByTableM()).then(function(r){ if(r&&r.ok) _saveDirty=false; }).catch(function(){})); }catch(e){}
    waits.push(new Promise(function(r){ setTimeout(r,300); }));
    return Promise.race([Promise.all(waits),new Promise(function(r){ setTimeout(r,10000); })]);
  }
  /* anything still not confirmed by the server? then we must not reload */
  function pendingLeft(){
    try{ if(typeof Store!=="undefined"){
      if(typeof Store.hasPending==="function") return Store.hasPending();
      if(typeof Store._pendLoad==="function"){ var o=Store._pendLoad(); return !!(o&&(o.cur||(o.base&&o.base.length))); }
    } }catch(e){}
    try{ if(typeof _saveDirty!=="undefined") return !!_saveDirty; }catch(e){}
    return false;
  }
  /* like Ctrl+Shift+R: drop the cached app files and load everything again from the server */
  function update(){
    if(busy) return; busy=true;
    var ok=card&&card.querySelector("[data-ok]"); if(ok){ ok.disabled=true; ok.style.opacity=".7"; ok.textContent=T("กำลังอัปเดต…","Updating…"); }
    flushAll().then(function(){
      if(pendingLeft()){                                    // never reload with unsaved work
        busy=false; if(ok){ ok.disabled=false; ok.style.opacity=""; ok.textContent=T("ยืนยันอัปเดตซอฟต์แวร์ และรีเฟรช","Confirm update & refresh"); }
        var d=card&&card.querySelector("[data-d]"); if(d){ d.style.color="#c2410c"; d.textContent=T("ยังบันทึกงานขึ้นเซิร์ฟเวอร์ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต แล้วกดอีกครั้ง","Your work isn't saved to the server yet — check the connection and press again"); }
        return Promise.reject("pending");
      }
      var jobs=[];
      try{ if(window.caches&&caches.keys) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(e){}
      try{ if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.update().catch(function(){}); })); })); }catch(e){}
      return Promise.race([Promise.all(jobs),new Promise(function(r){ setTimeout(r,3000); })]);
    }).then(function(){
      var u=new URL(location.href); u.searchParams.set("_v",Date.now());   // bypass the HTTP cache for the page itself
      location.replace(u.toString());
    },function(e){ if(e!=="pending"){ var u=new URL(location.href); u.searchParams.set("_v",Date.now()); location.replace(u.toString()); } });
  }

  setTimeout(check,1500);                                    // baseline right after load
  setInterval(check,EVERY);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) check(); });
  window.addEventListener("focus",check);
  window.__checkForUpdate=check;          // handy for testing from the console
})();
</script>

<script id="rent-m">
/* ═══ RENTAL JOBS on the phone (same records as the web: DB.rentals / server table "rentals") ═══
   The warehouse / delivery steps: issue from stock → delivered → customer accepts (refusals come back) →
   picked up from the customer → checked in to the warehouse; plus "extend" into a new rental.
   The rental plan itself is created on the web (งานเช่า → สร้างงานเช่า). Same per-line fields as the web. */
(function(){
"use strict";
var n0=function(v){return parseFloat(v)||0;};
var STEPS=["PLANNED","ISSUED","SHIPPED","ONRENT","RETURNING","CLOSED"];
var ST={PLANNED:["วางแผน","Planned"],ISSUING:["กำลังเบิก","Issuing"],ISSUED:["เบิกเสร็จ รอส่ง","Issued"],SHIPPED:["ส่งถึงลูกค้า","Delivered"],ONRENT:["กำลังเช่า","On rent"],RETURNING:["รอเข้าคลัง","Returning"],CLOSED:["ปิดงาน","Closed"],CANCELLED:["ยกเลิก","Cancelled"]};
function stName(s){ var x=ST[s]||[s,s]; return T(x[0],x[1]); }
function rentals(){ if(!Array.isArray(DB.rentals)) DB.rentals=[]; return DB.rentals; }
try{ _MERGEM.rentals="id"; }catch(e){}
function rOf(id){ return rentals().find(function(r){return String(r.id)===String(id);}); }
function sum(r,f){ return (r.lines||[]).reduce(function(a,l){return a+f(l);},0); }
function atCust(l){ return Math.max(0,n0(l.accepted)-n0(l.extended)-n0(l.returned)-n0(l.lost)); }
function dueIn(l){ return Math.max(0,n0(l.rejected)+n0(l.returned)-n0(l.received)); }
function expBack(l){ return Math.max(0,n0(l.issued)-n0(l.extended)); }
function log(r,step,detail){ (r.log=r.log||[]).push({at:today()+" "+nowTime(),by:whoName(),step:step,detail:detail||""}); }
function uniqA(a){ return a.filter(function(x,i){return x&&a.indexOf(x)===i;}); }
function nextNo(){ var ym=today().slice(0,7).replace("-",""), pre="RT-"+ym+"-", n=0;
  rentals().forEach(function(r){ var s=String(r.no||""); if(s.indexOf(pre)===0){ var v=parseInt(s.slice(pre.length),10)||0; if(v>n) n=v; } });
  return pre+String(n+1).padStart(4,"0"); }
function hd(title,sub){ return '<div class="grab"></div><div class="sh-h"><div class="thumb">'+IC.iss+'</div><div style="flex:1;min-width:0"><b>'+title+'</b>'+(sub?'<small>'+sub+'</small>':"")+'</div></div>'; }

window._rtmF=window._rtmF||"OPEN";
window.rentListM=function(f){ if(f) window._rtmF=f; var F=window._rtmF, td=today();
  var all=rentals(), rows=all.filter(function(r){ var open=r.status!=="CLOSED"&&r.status!=="CANCELLED";
    return F==="ALL"||(F==="OPEN"&&open)||(F==="WH"&&(r.status==="PLANNED"||r.status==="ISSUING"||r.status==="RETURNING"))||(F==="DLV"&&(r.status==="ISSUED"||r.status==="SHIPPED"))||(F==="ONRENT"&&r.status==="ONRENT"); })
    .sort(function(a,b){ return String(b.no).localeCompare(String(a.no)); });
  var chip=function(k,lb){ return '<button class="'+(F===k?"on":"")+'" onclick="rentListM(\''+k+'\')">'+lb+'</button>'; };
  var list=rows.length?rows.map(function(r){ var late=r.status==="ONRENT"&&r.end&&r.end<td;
    return '<div class="row" onclick="rentViewM('+jsa(r.id)+')"><div class="rt"><b>'+esc(r.no)+'</b><small>'+esc(r.customer||"-")+(r.site?' · '+esc(r.site):'')+'</small>'
      +'<small style="'+(late?"color:var(--danger);font-weight:800":"")+'">'+T("คืน ","Return ")+fmtDate(r.end)+' · '+T("อยู่ที่ลูกค้า ","At customer ")+num(sum(r,atCust))+'</small></div>'
      +'<span class="pill">'+esc(stName(r.status))+'</span></div>'; }).join("")
    :'<div style="text-align:center;color:var(--sub);padding:24px">'+T("ไม่มีงานเช่า","No rental jobs")+'</div>';
  openSheet(hd(T("งานเช่า & อีเวนท์","Rentals & Events"),T("เบิก · ส่งลูกค้า · รับคืน · เช่าต่อ","Issue · deliver · return · extend"))
    +'<div class="rtm-chips">'+chip("OPEN",T("ยังไม่ปิด","Open"))+chip("WH",T("งานคลัง","Warehouse"))+chip("DLV",T("งานส่ง","Delivery"))+chip("ONRENT",T("กำลังเช่า","On rent"))+chip("ALL",T("ทั้งหมด","All"))+'</div>'
    +'<div class="card" style="padding:4px 0">'+list+'</div>'
    +'<p style="font-size:11.5px;color:var(--sub2);text-align:center;margin-top:10px">'+T("สร้างแผนงานเช่าได้ที่เว็บหลัก (งานเช่า → สร้างงานเช่า)","Rental plans are created on the web (Rentals → New rental)")+'</p>');
};
window.rentViewM=function(id){ var r=rOf(id); if(!r) return;
  var si=STEPS.indexOf(r.status==="ISSUING"?"PLANNED":r.status);
  var bar='<div class="rtm-st">'+STEPS.map(function(s,i){ return '<i class="'+(i<=si||r.status==="CLOSED"?"on":"")+'"></i>'; }).join("")+'</div>';
  var lines=(r.lines||[]).map(function(l){ return '<div class="row" style="display:block"><b>'+esc(l.code)+'</b> <small style="color:var(--sub)">'+esc(l.name||"")+'</small>'
    +'<div class="rtm-ln"><span><b>'+num(l.qty)+'</b>'+T("แผน","Plan")+'</span><span><b>'+num(l.issued)+'</b>'+T("เบิก","Issued")+'</span><span><b>'+num(atCust(l))+'</b>'+T("ที่ลูกค้า","At cust.")+'</span><span><b>'+num(l.received)+'</b>'+T("เข้าคลัง","In")+'</span></div>'
    +((n0(l.rejected)||n0(l.extended))?'<small style="color:var(--sub)">'+(n0(l.rejected)?T("ปฏิเสธ ","Refused ")+num(l.rejected)+" ":"")+(n0(l.extended)?T("เช่าต่อ ","Extended ")+num(l.extended):"")+'</small>':"")+'</div>'; }).join("");
  var b=function(fn,lb,cls){ return '<button class="btn '+(cls||"primary")+'" style="margin-bottom:8px" onclick="'+fn+'">'+lb+'</button>'; }, A="";
  if(r.status==="PLANNED"||r.status==="ISSUING"){ A+=b("rentStepM("+jsa(r.id)+",'issue')",T("เบิกตามงานเช่า","Issue from stock")); if(sum(r,function(l){return n0(l.issued);})>0) A+=b("rentIssueDoneM("+jsa(r.id)+")",T("ยืนยันเบิกเสร็จสิ้น","Confirm issue complete"),"ok"); }
  if(r.status==="ISSUED") A+=b("rentShipM("+jsa(r.id)+")",T("ส่งสินค้าถึงลูกค้าแล้ว","Delivered to customer"));
  if(r.status==="SHIPPED") A+=b("rentStepM("+jsa(r.id)+",'accept')",T("ยืนยันลูกค้ารับสินค้า","Confirm customer received"));
  if(r.status==="ONRENT"){ A+=b("rentStepM("+jsa(r.id)+",'pickup')",T("ยืนยันการรับคืนจากลูกค้า","Confirm return from customer")); A+=b("rentStepM("+jsa(r.id)+",'extend')",T("สร้างงานเช่าต่อ","Extend (new rental)"),"ghost"); }
  if(r.status==="RETURNING"){ if(sum(r,atCust)>0) A+=b("rentStepM("+jsa(r.id)+",'pickup')",T("รับคืนส่วนที่เหลือจากลูกค้า","Pick up the rest"),"ghost"); if(sum(r,dueIn)>0) A+=b("rentStepM("+jsa(r.id)+",'receive')",T("ยืนยันรับสินค้าเข้าคลัง","Check in to warehouse"),"ok"); A+=b("rentCloseM("+jsa(r.id)+")",T("ปิดงาน","Close job"),"ghost"); }
  var logs=(r.log||[]).slice(-6).reverse().map(function(e){ return '<div class="rtm-log">'+esc(e.at)+' · <b>'+esc(e.step)+'</b> '+esc(e.detail||"")+'</div>'; }).join("");
  openSheet(hd(esc(r.no),esc(stName(r.status))+(r.parentNo?" · "+T("ต่อจาก ","from ")+esc(r.parentNo):""))+bar
    +'<div class="card" style="padding:12px 14px;margin-bottom:10px;font-size:13px"><b>'+esc(r.customer||"-")+'</b>'+(r.site?'<div style="color:var(--sub)">'+esc(r.site)+'</div>':'')+(r.contact?'<div style="color:var(--sub)">'+esc(r.contact)+'</div>':'')
      +'<div style="color:var(--sub);margin-top:4px">'+fmtDate(r.start)+' → '+fmtDate(r.end)+'</div></div>'
    +'<div class="card" style="padding:4px 14px;margin-bottom:12px">'+lines+'</div>'+A
    +'<button class="btn ghost" style="margin-bottom:12px" onclick="rentListM()">'+T("กลับไปรายการ","Back to list")+'</button>'+logs);
};
function ngL(c){ return typeof isNG==="function"&&isNG(c); }
function outLocs(l){ var ls=(DB.stock||[]).filter(function(s){return s.code===l.code&&!ngL(s.loc)&&(parseInt(s.qty,10)||0)>0;}).map(function(s){return s.loc;}); return uniqA(ls); }
function inLocs(l){ var ms=(DB.locationMaster||[]).map(function(x){return x.code;}).filter(function(c){return !ngL(c);});
  return uniqA((l.fromLocs||[]).filter(function(c){return !ngL(c);}).concat(ms.length?ms:(DB.stock||[]).map(function(s){return s.loc;}).filter(function(c){return !ngL(c);}))); }
var CFG={
  issue:{t:["เบิกตามงานเช่า","Issue from stock"],col:["เบิก","Issue"],loc:outLocs,max:function(l){return Math.max(0,n0(l.qty)-n0(l.issued));}},
  accept:{t:["ยืนยันลูกค้ารับสินค้า","Customer received"],col:["รับ","Accepted"],max:function(l){return n0(l.issued);},note:["ส่วนที่ลูกค้าปฏิเสธ จะต้องนำกลับเข้าคลัง","Anything refused must come back to the warehouse"]},
  pickup:{t:["รับคืนจากลูกค้า","Return from customer"],col:["คืน","Back"],max:atCust},
  receive:{t:["รับสินค้าเข้าคลัง","Check in"],col:["เข้าคลัง","In"],loc:inLocs,max:dueIn,note:["รับเข้าได้เฉพาะของที่กลับมาจริง (ที่ลูกค้าปฏิเสธ + ที่รับคืนแล้ว) ส่วนที่ขาดจะถูกบันทึกในงาน","Only what came back (refused + picked up) can be checked in; any shortfall is recorded"]},
  extend:{t:["สร้างงานเช่าต่อ","Extend rental"],col:["เช่าต่อ","Extend"],max:atCust,note:["เลือกจำนวนที่ลูกค้าเช่าต่อ งานใหม่จะถือว่าลูกค้ารับสินค้าแล้ว","Choose what the customer keeps; the new job starts as accepted"]}
};
window.rentStepM=function(id,step){ var r=rOf(id), c=CFG[step]; if(!r||!c) return;
  var rows=(r.lines||[]).map(function(l,i){ return {i:i,l:l,max:c.max(l)}; }).filter(function(x){ return x.max>0; });
  if(!rows.length){ if(step==="pickup"){ afterCust(r); mSave(); rentViewM(id); return; } toast(T("ไม่มีรายการให้ทำ","Nothing to do"),"warn"); return; }
  var ext=step==="extend"?'<div class="field"><label>'+T("กำหนดคืนใหม่","New return date")+'</label><input class="inp" id="rtmXe" type="date" value=""></div>':"";
  openSheet(hd(T(c.t[0],c.t[1]),esc(r.no)+" · "+esc(r.customer||""))+(c.note?'<p style="font-size:12px;color:var(--sub);margin:0 0 8px">'+T(c.note[0],c.note[1])+'</p>':"")+ext
    +'<div class="card" style="padding:2px 14px;margin-bottom:12px">'+rows.map(function(x){ var locs=c.loc?c.loc(x.l):null;
      return '<div class="rtm-q"><div class="rt"><b>'+esc(x.l.code)+'</b><small style="display:block;color:var(--sub)">'+esc(x.l.name||"")+' · '+T("สูงสุด ","max ")+num(x.max)+'</small>'
        +(locs?'<select class="inp rtml" data-i="'+x.i+'" style="margin-top:6px;width:100%">'+(locs.length?locs.map(function(c2){ return '<option value="'+esc(c2)+'">'+esc(c2)+(step==="issue"?" ("+num(stockAtTotal(x.l.code,c2))+")":"")+'</option>'; }).join(""):'<option value="">'+T("ไม่มีสต๊อก","No stock")+'</option>')+'</select>':"")
        +'</div><input class="inp num rtmq" data-i="'+x.i+'" data-max="'+x.max+'" type="number" inputmode="numeric" min="0" value="'+x.max+'"></div>'; }).join("")+'</div>'
    +'<button class="btn primary" onclick="rentStepOkM('+jsa(id)+',\''+step+'\')">'+T("ยืนยัน","Confirm")+'</button>'
    +'<button class="btn ghost" style="margin-top:8px" onclick="rentViewM('+jsa(id)+')">'+T("ยกเลิก","Cancel")+'</button>');
};
function afterCust(r){ var atC=sum(r,atCust), due=sum(r,dueIn);
  if(atC<=0&&due<=0){ r.status="CLOSED"; r.closed=today(); log(r,T("ปิดงาน","Closed"),T("ไม่มีสินค้าต้องรับเข้าคลัง","Nothing to check in")); }
  else if(due>0||r.status==="RETURNING") r.status="RETURNING"; }
window.rentCloseM=function(id){ var r=rOf(id); if(!r) return; var atC=sum(r,atCust), due=sum(r,dueIn);
  if(!confirm(T("ปิดงาน "+r.no+"?"+(atC?"\n· ยังอยู่ที่ลูกค้า "+num(atC)+" ชิ้น จะบันทึกเป็นสูญหาย":"")+(due?"\n· ยังไม่รับเข้าคลัง "+num(due)+" ชิ้น จะบันทึกเป็นขาด":""),"Close "+r.no+"?"))) return;
  (r.lines||[]).forEach(function(l){ var a=atCust(l); if(a>0) l.lost=n0(l.lost)+a; });
  r.status="CLOSED"; r.closed=today(); log(r,T("ปิดงาน","Closed"),[atC?T("สูญหายที่ลูกค้า ","Lost at customer ")+num(atC):"",due?T("ไม่ได้รับเข้าคลัง ","Not checked in ")+num(due):""].filter(Boolean).join(" · ")||T("ครบ","complete"));
  mSave(); toast(T("บันทึกแล้ว","Saved"),"ok"); rentViewM(id); };
window.rentStepOkM=function(id,step){ var r=rOf(id); if(!r) return;
  var vals=[].map.call(document.querySelectorAll(".rtmq"),function(e){ var s=String(e.value).trim(), v=s===""?0:Number(s); var le=document.querySelector('.rtml[data-i="'+e.dataset.i+'"]');
    return {i:+e.dataset.i,max:n0(e.dataset.max),v:(isFinite(v)&&v>=0&&Math.floor(v)===v)?v:-1,loc:le?le.value:""}; });
  if(vals.some(function(x){return x.v<0;})){ toast(T("ใส่จำนวนเต็มตั้งแต่ 0","Enter whole numbers from 0"),"err"); return; }
  var over=vals.find(function(x){return x.v>x.max;}); if(over){ toast(T("เกินจำนวนสูงสุด: ","Above the maximum: ")+r.lines[over.i].code,"err"); return; }
  var tot=vals.reduce(function(a,x){return a+x.v;},0), detail="";
  if(step==="issue"){
    var need={};
    for(var k=0;k<vals.length;k++){ var x=vals[k]; if(!x.v) continue; if(!x.loc){ toast(T("เลือกตำแหน่ง","Choose a location"),"warn"); return; }
      var nk=r.lines[x.i].code+"@"+x.loc; need[nk]=(need[nk]||0)+x.v;
      if(stockAtTotal(r.lines[x.i].code,x.loc)<need[nk]){ toast(T("สต๊อกไม่พอ: ","Not enough stock: ")+r.lines[x.i].code+" @ "+x.loc,"err"); return; } }
    if(!tot){ toast(T("ใส่จำนวน","Enter a quantity"),"warn"); return; }
    vals.forEach(function(x){ if(!x.v) return; var l=r.lines[x.i]; var res=issueFIFO(l.code,x.loc,x.v);
      var base={type:"OUT",date:today(),time:nowTime(),code:l.code,name:l.name,loc:x.loc,orderNo:r.no,customer:r.customer,dept:"RENT",status:"Done",rentalId:r.id,note:T("เบิกงานเช่า ","Rental issue ")+r.no};
      (res.consumed||[]).filter(function(c){return c.qty>0;}).forEach(function(c){ hpush(Object.assign({id:nextTxnId(),qty:c.qty,lotSup:c.lotSup,lotNo:c.lotNo,mfd:c.mfd,exp:c.exp,sn:c.sn,hu:c.hu||undefined,cost:c.cost||0},base)); });
      l.issued=n0(l.issued)+x.v; l.fromLocs=uniqA((l.fromLocs||[]).concat([x.loc])); });
    r.status="ISSUING"; log(r,T("เบิกตามงานเช่า","Issued"),num(tot)+T(" ชิ้น"," units"));
  } else if(step==="accept"){
    var rej=0; vals.forEach(function(x){ var l=r.lines[x.i]; l.accepted=x.v; l.rejected=n0(l.issued)-x.v; rej+=l.rejected; });
    r.status="ONRENT"; r.acceptDate=today(); log(r,T("ลูกค้ารับสินค้า","Customer accepted"),num(tot)+T(" ชิ้น"," units")+(rej?T(" · ปฏิเสธ "," · refused ")+num(rej):T(" · ครบทุกรายการ"," · all items")));
  } else if(step==="pickup"){
    var miss=0; vals.forEach(function(x){ var l=r.lines[x.i]; miss+=x.max-x.v; l.returned=n0(l.returned)+x.v; });
    log(r,T("รับคืนจากลูกค้า","Picked up from customer"),num(tot)+T(" ชิ้น"," units")+(miss?T(" · ยังไม่ได้คืน "," · not returned ")+num(miss):T(" · ครบทุกรายการ"," · all items"))); afterCust(r);
  } else if(step==="receive"){
    for(var j=0;j<vals.length;j++){ if(vals[j].v&&!vals[j].loc){ toast(T("เลือกตำแหน่ง","Choose a location"),"warn"); return; } }
    var short=0; vals.forEach(function(x){ var l=r.lines[x.i]; short+=x.max-x.v; if(!x.v) return; receiveStock(l.code,x.loc,x.v,{});
      hpush({id:nextTxnId(),type:"IN",date:today(),time:nowTime(),code:l.code,name:l.name,loc:x.loc,qty:x.v,orderNo:r.no,customer:r.customer,dept:"RENT",status:"Stored",rentalId:r.id,note:T("รับคืนงานเช่า ","Rental return ")+r.no});
      l.received=n0(l.received)+x.v; });
    var atCx=sum(r,atCust); if(!atCx){ r.status="CLOSED"; r.closed=today(); }
    log(r,T("รับสินค้าเข้าคลัง","Checked in"),num(tot)+T(" ชิ้น"," units")+(short?T(" · ขาด "," · short ")+num(short)+T(" (สูญหาย/เสียหาย)"," (lost / damaged)"):T(" · ครบตามที่รับคืนมา"," · all that came back"))+(atCx?T(" · ยังอยู่ที่ลูกค้า "," · still at the customer ")+num(atCx):""));
  } else if(step==="extend"){
    var pick=vals.filter(function(x){return x.v>0;}); if(!pick.length){ toast(T("ใส่จำนวน","Enter a quantity"),"warn"); return; }
    var xe=(document.getElementById("rtmXe")||{}).value||"";
    var c={id:"RT"+Date.now().toString(36),no:nextNo(),customer:r.customer,contact:r.contact,site:r.site,start:r.end||today(),end:xe,sales:whoName(),note:"",parentId:r.id,parentNo:r.no,status:"ONRENT",created:today(),acceptDate:today(),log:[],
      lines:pick.map(function(x){ var l=r.lines[x.i]; return {code:l.code,name:l.name,unit:l.unit,price:l.price,qty:x.v,issued:x.v,accepted:x.v,rejected:0,extended:0,returned:0,received:0,fromLine:x.i,fromLocs:l.fromLocs||[]}; })};
    pick.forEach(function(x){ r.lines[x.i].extended=n0(r.lines[x.i].extended)+x.v; });
    log(c,T("สร้างงานเช่าต่อ","Created as extension"),T("ต่อจาก ","From ")+r.no+" · "+num(tot)+T(" ชิ้น · ลูกค้ารับสินค้าอัตโนมัติ"," units · accepted automatically"));
    log(r,T("เช่าต่อ","Extended"),T("ไปยัง ","To ")+c.no+" · "+num(tot)+T(" ชิ้น"," units"));
    rentals().push(c); if(sum(r,atCust)<=0) afterCust(r);
    mSave(); toast(T("สร้างงานเช่าต่อแล้ว ","Extension created ")+c.no,"ok"); rentViewM(c.id); return;
  }
  mSave(); toast(T("บันทึกแล้ว","Saved"),"ok"); rentViewM(id);
};
window.rentIssueDoneM=function(id){ var r=rOf(id); if(!r) return; var short=sum(r,function(l){return Math.max(0,n0(l.qty)-n0(l.issued));});
  if(short&&!confirm(T("ยังเบิกไม่ครบตามแผน ("+num(short)+") ยืนยันเท่าที่เบิกได้?","Not everything planned was issued ("+num(short)+"). Confirm?"))) return;
  r.status="ISSUED"; log(r,T("ยืนยันเบิกเสร็จสิ้น","Issue complete"),num(sum(r,function(l){return n0(l.issued);}))+T(" ชิ้น"," units")); mSave(); toast(T("บันทึกแล้ว","Saved"),"ok"); rentViewM(id); };
window.rentShipM=function(id){ var r=rOf(id); if(!r) return; if(!confirm(T("ยืนยันส่งสินค้าถึงลูกค้า ","Confirm delivered: ")+r.no+"?")) return;
  r.status="SHIPPED"; r.shipDate=today(); log(r,T("ส่งถึงลูกค้า","Delivered"),fmtDate(today())); mSave(); toast(T("บันทึกแล้ว","Saved"),"ok"); rentViewM(id); };
/* the "More" menu entry, right after Schedule */
try{ if(Array.isArray(MORE_ITEMS)&&!MORE_ITEMS.some(function(x){return x.id==="mob-rent";})){ var si=MORE_ITEMS.findIndex(function(x){return x.id==="mob-schedule";});
  MORE_ITEMS.splice(si<0?MORE_ITEMS.length:si+1,0,{id:"mob-rent",g:"ops",ic:"iss",th:"งานเช่า & อีเวนท์",en:"Rentals & Events",sth:"เบิก · ส่งลูกค้า · รับคืน · เช่าต่อ",sen:"Issue · deliver · return · extend",fn:"rentListM()"}); } }catch(e){}
})();
