  var up=opUnitParts(), qty=parseInt((document.getElementById("op_qty")||{}).value)||0;
  el.textContent = up.mult>1 ? ("= "+num(qty*up.mult)+" "+(itemByCode(window._opCode||"")&&itemByCode(window._opCode).unit||"")) : "";
}
function opAvail(code){
  var from=(document.getElementById("op_from")||{}).value;
  var el=document.getElementById("op_av");if(!el||!from)return;
  el.textContent="("+T("คงเหลือ","avail")+" "+num(getStockQty(code,from))+")";
}
function opConfirm(action,code){
  var it=itemByCode(code); if(!it)return;
  var entered=wholeQ((document.getElementById("op_qty")||{}).value);
  if(entered<=0){toast(T("ใส่จำนวนเต็มที่มากกว่า 0","Enter a whole number above 0"),"err");return;}
  var up=opUnitParts(); var mult=up.mult>0?up.mult:1; var qty=entered*mult;   // base-unit qty for stock
  var uLabel=up.label||it.unit||""; var pkgNote=(mult>1)?(entered+" "+uLabel+" × "+mult):"";
  if(action==="receive"){
    var to=(document.getElementById("op_to")||{}).value;
    var lot={lotSup:(val2("op_lotSup")||"").trim(),lotNo:(val2("op_lotNo")||"").trim(),mfd:val2("op_mfd")||"",exp:val2("op_exp")||"",sn:(val2("op_sn")||"").trim()};
    if(!to){toast(T("เลือกตำแหน่งที่จะรับเข้า (ยังไม่มีตำแหน่ง — เพิ่มที่ข้อมูลตำแหน่งบนเว็บ)","Select a location (none yet — add one in Location Master on the web)"),"err");return;}
    if(!capWarnM(to,qty))return;
    receiveStock(code,to,qty,lot);
    hpush({id:nextTxnId(),type:"IN",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:to,orderNo:"",lotNo:lot.lotNo,lotSup:lot.lotSup,mfd:lot.mfd,exp:lot.exp,sn:lot.sn,note:"Mobile Receive",status:"Stored"});
    mSave();toast(T("รับเข้าแล้ว","Received")+" +"+qty,"ok");
  } else if(action==="issue"){
    var from=(document.getElementById("op_from")||{}).value;
    var cust=(document.getElementById("op_customer")||{}).value||"";
    var ship=(document.getElementById("op_shipping")||{}).value||"";
    var ordr=(document.getElementById("op_order")||{}).value||"";
    var trk=(document.getElementById("op_tracking")||{}).value||"";
    var avail=lotOn()?stockAtTotal(code,from):getStockQty(code,from);
    if(avail<qty){toast(T("สต๊อกไม่พอ","Not enough stock"),"err");return;}
    {                                                                // lots on or off: take from every row of code@loc (FIFO), never just the first one
      var preferKey=(document.getElementById("op_lot")||{}).value||"";
      var res=issueFIFO(code,from,qty,preferKey);
      res.consumed.forEach(function(c){ hpush({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:code,name:it.name,qty:c.qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:c.loc,orderNo:ordr,customer:cust,shipping:ship,tracking:trk,lotNo:c.lotNo,lotSup:c.lotSup,mfd:c.mfd,exp:c.exp,sn:c.sn,note:"Mobile Issue",status:"Done"}); });
    }
    mSave();toast(T("เบิกออกแล้ว","Issued")+" -"+qty,"ok");
  } else if(action==="qc"){
    var qf=(document.getElementById("op_from")||{}).value, qt=(document.getElementById("op_to")||{}).value||"NG";
    if(availAt(code,qf)<qty){toast(T("สต๊อกไม่พอ","Not enough stock"),"err");return;}
    var qcs=moveAt(code,qf,qt,qty,(document.getElementById("op_lot")||{}).value);
    hpushPairLots({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:qf,toLoc:qt,orderNo:"QC-NG",note:"Mobile QC",status:"Done"},
      {id:nextTxnId(),type:"NGIN",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:qt,fromLoc:qf,orderNo:"QC-NG",note:"Mobile QC hold",status:"NG"},qcs);
    mSave();toast(T("ย้ายเข้าของเสียแล้ว","Moved to NG")+" "+qty,"ok");
  } else if(action==="ngin"){
    var nto=(document.getElementById("op_to")||{}).value||"NG";
    receiveStock(code,nto,qty);
    hpush({id:nextTxnId(),type:"NGIN",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:nto,orderNo:"NG-RECEIVE",note:"Mobile NG Receive",status:"NG"});
    mSave();toast(T("รับเข้า NG แล้ว","Received to NG")+" +"+qty,"ok");
  } else if(action==="ngout"){
    var nfr=(document.getElementById("op_from")||{}).value||"NG";
    if(availAt(code,nfr)<qty){toast(T("สต๊อก NG ไม่พอ","Not enough NG stock"),"err");return;}
    var ngcs=takeAt(code,nfr,qty,(document.getElementById("op_lot")||{}).value);
    hpushLots({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:nfr,orderNo:"NG-ISSUE",note:"Mobile NG Issue",status:"Done"},ngcs);
    mSave();toast(T("เบิกจาก NG แล้ว","Issued from NG")+" -"+qty,"ok");
  } else {
    var f=(document.getElementById("op_from")||{}).value, t=(document.getElementById("op_to")||{}).value;
    if(!t){toast(T("เลือกปลายทาง","Select destination"),"err");return;}
    if(f===t){toast(T("ต้นทาง/ปลายทางซ้ำกัน","Same location"),"err");return;}
    if(availAt(code,f)<qty){toast(T("สต๊อกไม่พอ","Not enough stock"),"err");return;}
    if(!mixWarnM(t,code)) return;                                    // a different item is already there
    if(!capWarnM(t,qty)) return;                                     // the destination would go over its capacity
    var tcs=moveAt(code,f,t,qty,(document.getElementById("op_lot")||{}).value);
    hpushPairLots({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:f,toLoc:t,orderNo:"TRANSFER",note:"Mobile Transfer",status:"Done"},
      {id:nextTxnId(),type:"IN",date:today(),time:nowTime(),code:code,name:it.name,qty:qty,unit:it.unit,unitQty:uLabel,pkg:pkgNote,loc:t,fromLoc:f,orderNo:"TRANSFER",note:"Mobile Transfer",status:"Stored"},tcs);
    mSave();toast(T("โอนย้ายแล้ว","Transferred")+" "+qty+" → "+t,"ok");
  }
  if(CUR==="home")renderHome();else if(CUR==="stock")renderStock();else if(CUR==="history")renderHistory();
  openManualPick(action);   // return to the scan/pick sheet of the same process to continue
}

/* ═══ Wave / Batch Picking (mobile) ═══ */
function openBookingsWaveM(){ return (DB.bookings||[]).filter(function(b){ var s=bkState(b); return s==="Booked"||s==="Reserved"; }); }
function fulfillBookingSilentM(b,note){ return bkFulfillM(b,b&&b.customer,b&&b.shipping,note||"WAVE"); }
function waveListM(){
  if(!window._waveSelM)window._waveSelM=[];
  var bks=openBookingsWaveM();
  var sel=window._waveSelM;
  if(!bks.length){ openSheet('<div class="grab"></div><div class="sh-h"><div class="thumb" style="background:linear-gradient(135deg,#ec4899,#be185d)">'+IC.iss.replace(/currentColor/g,"#fff")+'</div><div style="flex:1"><b>'+T("จัดหยิบรวม (Wave)","Wave Picking")+'</b></div></div><div style="text-align:center;color:var(--sub);padding:24px">'+T("ไม่มีการจองที่รอหยิบ","No open bookings")+'</div>'); return; }
  var rowHtml=bks.map(function(b){ var picked=sel.indexOf(String(b.id))>=0; var q=(b.lines||[]).reduce(function(a,l){return a+(parseInt(l.qty)||0);},0);
    return '<div class="row" onclick="waveToggleM('+jsn(b.id)+')" style="'+(picked?'background:rgba(236,72,153,.08)':'')+'"><div class="thumb" style="background:'+(picked?'#ec4899':'#e5e7eb')+';color:#fff;font-weight:900">'+(picked?'✓':'')+'</div><div class="rt"><b>'+esc(b.ref)+'</b><small>'+esc(b.customer||"-")+' · '+(b.lines||[]).length+' '+T("รายการ","items")+'</small></div><div class="rv">'+num(q)+'</div></div>';
  }).join("");
  // consolidated preview
  var preview="";
  if(sel.length){ var chosen=bks.filter(function(b){return sel.indexOf(String(b.id))>=0;}); var agg={};
    chosen.forEach(function(b){ if(bkState(b)==="Reserved") return; (b.lines||[]).forEach(function(l){var k=l.code+"@@"+l.loc;if(!agg[k])agg[k]={code:l.code,loc:l.loc,name:(l.name||"")+(l.loc?" @"+l.loc:""),unit:l.unit||"",need:0};agg[k].need+=(parseInt(l.qty)||0);});});
    var items=Object.keys(agg).map(function(k){var x=agg[k];x.avail=availAt(x.code,x.loc);x.ok=x.avail>=x.need;return x;});
    var allOk=items.every(function(x){return x.ok;});
    preview='<div style="font-weight:800;font-size:12px;color:var(--sub);margin:10px 0 4px">'+T("รายการหยิบรวม","Consolidated")+' · '+sel.length+' '+T("ออเดอร์","orders")+'</div><div class="card" style="padding:4px 0">'
      +items.map(function(x){return '<div class="row"><div class="rt"><b>'+esc(x.code)+'</b><small>'+esc(x.name)+' · '+T("ต้องหยิบ","need")+' '+num(x.need)+'</small></div><div class="rv" style="color:'+(x.ok?'var(--ok)':'var(--danger)')+';font-weight:800">'+num(x.avail)+(x.ok?'':' ⚠️')+'</div></div>';}).join("")+'</div>'
      +'<button class="btn primary" style="margin-top:12px"'+(allOk?'':' disabled')+' onclick="waveConfirmM()">'+IC.iss.replace(/currentColor/g,"#fff")+' '+T("หยิบทั้งเวฟ","Pick wave")+' ('+sel.length+')</button>';
  }
  var body='<div class="grab"></div><div class="sh-h"><div class="thumb" style="background:linear-gradient(135deg,#ec4899,#be185d)">'+IC.iss.replace(/currentColor/g,"#fff")+'</div><div style="flex:1"><b>'+T("จัดหยิบรวม (Wave)","Wave Picking")+'</b><small>'+T("แตะเลือกออเดอร์","Tap to select")+'</small></div></div>'
    +'<div class="card" style="padding:4px 0">'+rowHtml+'</div>'+preview;
  openSheet(body);
}
function waveToggleM(id){ id=String(id); if(!window._waveSelM)window._waveSelM=[]; var i=window._waveSelM.indexOf(id); if(i>=0)window._waveSelM.splice(i,1); else window._waveSelM.push(id); waveListM(); }
function waveConfirmM(){
  var sel=window._waveSelM||[]; if(!sel.length){ toast(T("เลือกออเดอร์","Select orders"),"warn"); return; }
  var bks=(DB.bookings||[]).filter(function(b){return sel.indexOf(String(b.id))>=0;});
  var need={}; bks.forEach(function(b){ if(bkState(b)!=="Booked") return; (b.lines||[]).forEach(function(l){var k=l.code+"@@"+l.loc;need[k]=(need[k]||0)+(parseInt(l.qty)||0);});});   // reserved ones already hold their stock
  for(var k in need){ var p=k.split("@@"); if(availAt(p[0],p[1])<need[k]){ toast(T("สต๊อกไม่พอ: ","Not enough: ")+p[0]+" @"+p[1],"err"); return; } }
  var done=0; bks.forEach(function(b){ var wr=fulfillBookingSilentM(b,"WAVE"); if(wr.ok&&!wr.skip)done++; });
  window._waveSelM=[]; mSave(); toast(T("หยิบเวฟเสร็จ","Wave picked")+" · "+done+" "+T("ออเดอร์","orders"),"ok"); waveListM();
}
/* ═══ Kitting / Assembly (mobile) ═══ */
function computeAssemblyM(bomId,qty){ var b=(DB.bomMaster||[]).find(function(x){return String(x.id)===String(bomId);}); if(!b)return {components:[],allOk:false};
  /* the same component on several BOM lines is checked against its TOTAL need */
  var byCode={}, components=[];
  (b.lines||[]).filter(function(l){return l.code;}).forEach(function(l){ var n=Math.ceil((parseFloat(l.qty)||0)*qty-1e-9);   // stock is whole units
    if(byCode[l.code]){ byCode[l.code].need+=n; return; }
    byCode[l.code]={code:l.code,name:l.name||l.code,unit:l.unit||"",need:n}; components.push(byCode[l.code]); });
  components.forEach(function(c){ c.avail=totalStock(c.code); c.ok=c.avail>=c.need; });

function doAssemblyM(){
  var b=(DB.bomMaster||[]).find(function(x){return String(x.id)===String(window._asmSelM);}); if(!b)return;

  var locsOk=(DB.locationMaster||[]).map(function(l){return l.code;});
  var dest=window._asmDestM||(locsOk.filter(function(c){return !isNG(c);})[0]||"");
  if(!dest||locsOk.indexOf(dest)<0){ window._asmDestM=null; toast(T("เลือกตำแหน่งจัดเก็บของสำเร็จก่อน (ตำแหน่งเดิมไม่มีแล้ว)","Pick where the finished goods go (the old location no longer exists)"),"err"); return; }
  var comp=computeAssemblyM(b.id,qty);
  if(!comp.components.length){ toast(T("ไม่มีส่วนประกอบ","No components"),"warn"); return; }
  if(!comp.allOk){ toast(T("ส่วนประกอบไม่พอ","Not enough components"),"err"); return; }

  var totalCost=0;

    r.consumed.forEach(function(cs){ totalCost+=(cs.cost||0)*cs.qty;
      hpush({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:c.code,name:c.name,loc:cs.loc,qty:cs.qty,unit:c.unit,unitQty:c.unit,lotNo:cs.lotNo,lotSup:cs.lotSup,mfd:cs.mfd,exp:cs.exp,sn:cs.sn,cost:(cs.cost||0),orderNo:ref,note:T("ประกอบชุด","Assembly")+" → "+b.product,status:"Assembly"}); }); });
  var prod=(DB.itemMaster||[]).find(function(i){return i.code===b.product;})||{};
  var unitCost=feat("costing")?(qty>0?totalCost/qty:0):0;
  receiveStock(b.product,dest,qty,{lotNo:ref,cost:unitCost});
  hpush({id:nextTxnId(),type:"IN",date:today(),time:nowTime(),code:b.product,name:b.name||prod.name||b.product,loc:dest,qty:qty,unit:prod.unit||"",unitQty:prod.unit||"",lotNo:ref,orderNo:ref,cost:unitCost,value:totalCost,note:T("ประกอบชุด","Assembly"),status:"Assembled"});
  mSave(); toast(T("ประกอบเสร็จ","Assembled")+" "+b.product+" ×"+qty,"ok"); closeSheet();
}

function stPostM(id){ var s=(DB.stocktake||[]).find(function(x){return String(x.id)===String(id);}); if(!s)return;
  if(s.status!=="Counting"){ toast(T("ใบนับนี้ปิดแล้ว","This count is already closed"),"err"); return; }
  if(!isMgrUpM()){ toast(T("เฉพาะผู้จัดการขึ้นไป","Manager or above only"),"err"); return; }
  var eq=function(a,b){return (a||"")===(b||"");};
  var rowOf=function(l){ return (DB.stock||[]).find(function(x){return x.code===l.code&&x.loc===l.loc&&eq(x.lotNo,l.lotNo)&&eq(x.lotSup,l.lotSup)&&eq(x.mfd,l.mfd)&&eq(x.exp,l.exp)&&eq(x.sn,l.sn);}); };
  var nowOf=function(l){ var r=rowOf(l); return r?(parseInt(r.qty)||0):0; };
  var uncounted=s.lines.filter(function(l){return l.cntQty==null;}).length;
  var moved=s.lines.filter(function(l){return l.cntQty!=null&&nowOf(l)!==l.sysQty;}).length;   // stock changed after the sheet was made
  if(!confirm(T("ยืนยันปรับปรุงสต๊อกตามยอดนับ?"+(uncounted?" (ยังไม่นับ "+uncounted+" รายการ จะใช้ยอดระบบ)":"")+(moved?" ⚠️ มี "+moved+" รายการที่สต๊อกเปลี่ยนระหว่างนับ — จะปรับจากยอดปัจจุบัน":""),
               "Post adjustments to stock?"+(uncounted?" ("+uncounted+" not counted, keep system qty)":"")+(moved?" ⚠️ "+moved+" line(s) moved during the count — adjusting from current stock":""))))return;
  var adj=0;
  s.lines.forEach(function(l){ if(l.cntQty==null)return; var cur=nowOf(l), diff=l.cntQty-cur; if(diff===0)return;
    var row=rowOf(l);
    if(row){row.qty=l.cntQty;} else if(l.cntQty>0){DB.stock.push({code:l.code,loc:l.loc,qty:l.cntQty,lotNo:l.lotNo||"",lotSup:l.lotSup||"",mfd:l.mfd||"",exp:l.exp||"",sn:l.sn||"",cost:(l.cost||0)});}
    hpush({id:nextTxnId(),type:diff>0?"IN":"OUT",date:today(),time:nowTime(),code:l.code,name:l.name,loc:l.loc,qty:Math.abs(diff),unit:l.unit,unitQty:l.unit,lotNo:l.lotNo,lotSup:l.lotSup,mfd:l.mfd,exp:l.exp,sn:l.sn,orderNo:s.ref,note:T("ปรับจากนับสต๊อก","Cycle count")+" ("+num(cur)+"→"+num(l.cntQty)+")",status:"Count"});
    adj++; });
  for(var i=DB.stock.length-1;i>=0;i--){var x=DB.stock[i];if((parseInt(x.qty)||0)<=0&&(x.lotSup||x.lotNo||x.mfd||x.exp||x.sn))DB.stock.splice(i,1);}
  s.status="Done"; s.approvedBy=whoName(); s.approvedAt=today()+" "+nowTime();
  mSave(); toast(T("ปรับปรุงแล้ว ","Posted ")+adj+" "+T("รายการ","lines"),"ok"); stocktakeList();
}

function holdScan(e){ if(e&&e.preventDefault)e.preventDefault(); startScan(); }

var _scanGen=0;
/* a camera that finishes starting after the user already let go is stopped right away */
function scanStarted(inst,gen){ if(gen!==_scanGen||!scanning){ try{ inst.stop().then(function(){try{inst.clear();}catch(e){}}).catch(function(){}); }catch(e){} } }
function startScan(){
  if(scanning)return; scanning=true; var gen=++_scanGen;
  try{ if(!_audioCtx)_audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(_audioCtx.state==="suspended")_audioCtx.resume(); }catch(e){}
  document.getElementById("scanOv").classList.add("show");
  if(typeof Html5Qrcode==="undefined"){toast(T("โหลดตัวสแกนไม่ได้ (ต้องต่อเน็ต)","Scanner not loaded"),"err");stopScan();return;}
  try{
    var inst=new Html5Qrcode("reader",{verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}}); qrScanner=inst;
    var cfg={fps:10,
      qrbox:function(vw,vh){var m=Math.floor(Math.min(vw||300,vh||300)*0.75);if(m<120)m=Math.floor(Math.min(vw||300,vh||300)*0.9);return {width:m,height:m};},
      experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
    inst.start({facingMode:"environment"},cfg,onScan,function(){})
      .then(function(){ scanStarted(inst,gen); })
      .catch(function(){
        if(gen!==_scanGen) return;                                    // already closed
        // fallback: pick a camera from the list (prefer the back camera)
        Html5Qrcode.getCameras().then(function(cams){
          if(!cams||!cams.length){toast(T("ไม่พบกล้อง","No camera found"),"err");stopScan();return;}
          var back=cams.filter(function(c){return /back|rear|environment|หลัง/i.test(c.label||"");})[0]||cams[cams.length-1];
          if(gen!==_scanGen) return;
          inst.start(back.id,cfg,onScan,function(){})
            .then(function(){ scanStarted(inst,gen); })
            .catch(function(err){ if(gen!==_scanGen) return; toast(T("เปิดกล้องไม่ได้","Camera error")+": "+err,"err");stopScan();});
        }).catch(function(err){ if(gen!==_scanGen) return; toast(T("เปิดกล้องไม่ได้","Camera error")+": "+err,"err");stopScan();});
      });
  }catch(e){toast(T("เปิดกล้องไม่ได้","Camera error"),"err");stopScan();}
}
function stopScan(){
  _scanGen++;
  document.getElementById("scanOv").classList.remove("show");
  if(qrScanner){var s=qrScanner;qrScanner=null;try{s.stop().then(function(){try{s.clear();}catch(e){}}).catch(function(){});}catch(e){}}
  scanning=false;
}
var _lastScan=0, _audioCtx=null;
var _lastBeepType="",_lastBeepAt=0;
function beep(type){
  try{
    if(!_audioCtx)_audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var ctx=_audioCtx; if(ctx.state==="suspended")ctx.resume();
    function tone(freq,start,dur,vol){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,ctx.currentTime+start);
      g.gain.exponentialRampToValueAtTime(vol||0.3,ctx.currentTime+start+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+start+dur);
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur+0.03);
    }
    if((type==="ok"||type==="err"||type==="success")){ if(type===_lastBeepType && Date.now()-_lastBeepAt<160)return; _lastBeepType=type; _lastBeepAt=Date.now(); }
    if(type==="ok"){ tone(880,0,0.09); tone(1320,0.10,0.13); }               // ผ่าน: สองโน้ตขึ้น
    else if(type==="success"){ tone(660,0,0.08); tone(880,0.09,0.08); tone(1320,0.18,0.16); }  // เสร็จสิ้น: 3 โน้ตขึ้น
    else if(type==="tap"){ tone(1250,0,0.045,0.16); }                        // กดปุ่ม: คลิกสั้น
    else if(type==="del"){ tone(360,0,0.09,0.22); }                          // ลบ: ทุ้มสั้น
    else if(type==="nostock"){ tone(700,0,0.12); tone(700,0.16,0.12); }      // ไม่มีของ
    else { tone(300,0,0.30,0.35); }                                          // ไม่ผ่าน: เสียงต่ำยาว
  }catch(e){}
}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
function onScan(text){
  var now=Date.now(); if(now-_lastScan<1200)return; _lastScan=now;
  stopScan();
  if(_scanTarget){   // scanning into a From/To location field
    var fid=_scanTarget; _scanTarget=null;
    var loc=matchLocation(text), sel=document.getElementById(fid);
    if(loc&&sel){ sel.value=loc.code; beep("ok"); vib(70); toast(T("ตำแหน่ง: ","Location: ")+loc.code,"ok");
      if(fid==="op_from"&&window._opCode) opAvail(window._opCode); }
    else { beep("fail"); vib([90,50,90]); toast(T("ไม่พบตำแหน่ง: ","Location not found: ")+text,"err"); }
    return;
  }
  if(_schedScan){   // scanning an item within a PO/SO detail
    var sid=_schedScan; _schedScan=null;
    var it2=findScanned(text), s2=findSched(sid);
    if(it2&&s2){
      var lidx=(s2.lines||[]).findIndex(function(l){return String(l.code).toUpperCase()===String(it2.code).toUpperCase();});
      if(lidx>=0){ var ln2=s2.lines[lidx], rem2=(parseInt(ln2.qty)||0)-(parseInt(ln2.done)||0);
        if(rem2<=0){beep("fail");vib([90,50,90]);toast(T("รายการนี้ครบแล้ว","Line already complete"),"err");openSchedule(sid);}
        else{beep("ok");vib(70);schedLineForm(sid,lidx);} }
      else {beep("fail");vib([90,50,90]);toast(T("สินค้านี้ไม่อยู่ในเอกสารนี้","Item not in this order"),"err");openSchedule(sid);}
    } else {beep("fail");vib([90,50,90]);toast(T("ไม่พบสินค้า: ","Not found: ")+text,"err");openSchedule(sid);}
    return;
  }
  if(_stScan){ var stid=_stScan; var iti=findScanned(text); var st=(DB.stocktake||[]).find(function(x){return String(x.id)===String(stid);});
    if(iti&&st){ var hits=[]; st.lines.forEach(function(l,i){ if(String(l.code).toUpperCase()===String(iti.code).toUpperCase()) hits.push(i); });
      if(hits.length>1){ beep("ok"); vib(70); stPickLineM(stid,hits); }                  // same item in several locations / lots: ask which one
      else if(hits.length===1){ var ln=st.lines[hits[0]]; ln.cntQty=(ln.cntQty==null?0:ln.cntQty)+1; stAutoSaveM(); beep("ok"); vib(70); toast(iti.code+" +1 = "+ln.cntQty,"ok"); stocktakeSheet(stid); }
      else { beep("fail"); vib([90,50,90]); toast(T("สินค้านี้ไม่อยู่ในใบนับ","Item not in count sheet"),"err"); stocktakeSheet(stid); } }
    else { beep("fail"); vib([90,50,90]); toast(T("ไม่พบสินค้า: ","Not found: ")+text,"err"); stocktakeSheet(stid); }
    return; }
  var it=findScanned(text);
  if(!it){ beep("fail"); vib([90,50,90]); toast(T("ไม่พบสินค้า: ","Not found: ")+text,"err"); openManualPick(_opAction||"receive"); return; }
  if(_opAction==="issue"||_opAction==="transfer"||_opAction==="qc"){
    var avail=totalStock(it.code);

  } else { beep("ok"); vib(70); }
  if(_opAction){ opForm(_opAction,it.code); }
  else { openItemAction(it.code); }
}

function proceedAfterData(){
  ensureMeta(); txnSeq=META.txnSeq||0;
  var sess=null; try{sess=JSON.parse(localStorage.getItem(SESS_KEY)||"null");}catch(e){}
  var me=META.me||(sess&&sess.user);
  if(!me||!me.username){ screenLogin(); return; }
  var u=(META.users||[]).find(function(x){return String(x.username).toLowerCase()===String(me.username).toLowerCase();})||me;
  session.user=u; activateCompany((sess&&sess.company&&(META.companies||[]).some(function(c){return c.id===sess.company;}))?sess.company:homeCompany(u));
  if(u.hasPin){ screenPin(u); } else { go("home"); }
}
function boot(){
  if(!authTok()){ try{localStorage.removeItem(DB_KEY);}catch(e){} screenLogin(); return; }   // no data on the device before sign-in
  showLoading();
  window._loadReady = loadFromServer().then(function(remote){
    if(remote==="UNAUTH"){ clearLocalSession(); screenLogin(); return; }
    if(remote&&remote.companies){
      META=remote; saveMETA();
      proceedAfterData();
    } else if(loadMETA()&&META.companies&&META.companies.length){
      proceedAfterData();         // offline: continue with this device's cached data
    } else {
      showNoData();
    }
  });
}
boot();
/* flush any unsaved changes to the server when the app is backgrounded / screen off / closed */
function flushSaveM(){ if(!_saveDirty&&!_saveChain) return Promise.resolve(true);
  return saveByTableM(true).then(function(res){ if(res&&res.ok) _saveDirty=false; return !!(res&&res.ok); },function(){ return false; });   // stays dirty (and queued) until the server confirms
}
/* sign out only after the last changes were handed to the server (or 6 s passed: they stay queued for this user) */
function leaveSessionM(){ var done=false, fin=function(){ if(done) return; done=true; _lockedM=false; clearLocalSession(); screenLogin(); };
  Promise.resolve(flushSaveM()).then(fin,fin); setTimeout(fin,6000); }
startAutoSyncM();
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="hidden") flushSaveM(); });

function syncNow(){

  toast(T("กำลังซิงก์…","Syncing…"));

    if(!res.ok){ if(b)b.classList.remove("spin"); _saveDirty=true;
      toast(T("ยังบันทึกขึ้นเซิร์ฟเวอร์ไม่ได้ — เก็บข้อมูลในเครื่องไว้ก่อน","Unsaved changes could not be uploaded — kept on this device")+(res.err?" · "+res.err:""),"err");
      return "KEPT"; }
    _saveDirty=false; var rev1=_saveRev; return loadFromServer().then(function(x){ return (_saveRev!==rev1||_saveDirty)?"EDITED":x; });
  }).then(function(remote){ if(remote==="KEPT") return;
    if(remote==="EDITED"){ if(b)b.classList.remove("spin"); toast(T("มีรายการใหม่ระหว่างซิงก์ — ลองอีกครั้ง","New changes during sync — try again"),"warn"); return; }
    if(remote==="UNAUTH"){ sessionExpiredM(); return; }
    if(remote&&remote.companies){
      var cid=session.company; META=remote; try{localStorage.setItem(DB_KEY,JSON.stringify(META));}catch(e){}
      session.user=curUserM()||session.user;
      if(cid)activateCompany(cid); txnSeq=META.txnSeq||0;
      toast(T("ซิงก์ข้อมูลแล้ว","Synced"),"ok"); go(CUR||"home");
    } else { if(b)b.classList.remove("spin"); toast(T("ซิงก์ไม่สำเร็จ","Sync failed")+(window.__syncErr?" · "+window.__syncErr:""),"err"); }
  });
}

<script>
(function(){
  function lbl(sel){ var o=sel.options[sel.selectedIndex]; return o?o.text:""; }
  function enhance(sel){
    if(!sel || sel.__enh || sel.multiple) return;
    if(sel.closest && sel.closest('.ssel')) return;
    sel.__enh=true;
    var wrap=document.createElement('div'); wrap.className='ssel';
    if(sel.parentNode){ sel.parentNode.insertBefore(wrap, sel); } else { return; }
    wrap.appendChild(sel); sel.style.display='none';
    var inp=document.createElement('input'); inp.type='text'; inp.className='inp ssel-in'; inp.setAttribute('autocomplete','off'); inp.setAttribute('inputmode','search');
    var car=document.createElement('div'); car.className='ssel-caret'; car.innerHTML='&#9662;';
    var pan=document.createElement('div'); pan.className='ssel-pan';
    wrap.appendChild(inp); wrap.appendChild(car); wrap.appendChild(pan);
    inp.disabled=sel.disabled;
    function build(f){ pan.innerHTML=''; f=(f||'').toLowerCase().trim(); var any=false;
      for(var i=0;i<sel.options.length;i++){ var o=sel.options[i];
        if(f && (o.text||'').toLowerCase().indexOf(f)<0) continue; any=true;
        var d=document.createElement('div'); d.className='ssel-opt'+(o.selected?' sel':''); d.textContent=o.text; d.setAttribute('data-i',i);
        d.addEventListener('mousedown', function(ev){ ev.preventDefault(); pick(+this.getAttribute('data-i')); });
        pan.appendChild(d);
      }
      if(!any){ var e=document.createElement('div'); e.className='ssel-empty'; e.textContent='—'; pan.appendChild(e); }
    }
    function open(){ if(sel.disabled)return; build(''); wrap.classList.add('open'); inp.value=''; try{inp.focus();}catch(e){} }
    function close(){ wrap.classList.remove('open'); inp.value=lbl(sel); }
    function pick(i){ sel.selectedIndex=i; try{ sel.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){} inp.value=lbl(sel); wrap.classList.remove('open'); }
    inp.value=lbl(sel);
    inp.addEventListener('focus', function(){ if(!wrap.classList.contains('open')) open(); });
    inp.addEventListener('input', function(){ wrap.classList.add('open'); build(inp.value); });
    car.addEventListener('mousedown', function(ev){ ev.preventDefault(); if(wrap.classList.contains('open')) close(); else open(); });
    inp.addEventListener('blur', function(){ setTimeout(function(){ if(document.activeElement!==inp && !wrap.contains(document.activeElement)) close(); }, 130); });
    sel.addEventListener('change', function(){ if(!wrap.classList.contains('open')) inp.value=lbl(sel); });
  }
  function all(root){ try{ (root||document).querySelectorAll('select:not([multiple])').forEach(enhance); }catch(e){} }
  document.addEventListener('click', function(ev){
    var open=document.querySelectorAll('.ssel.open'); for(var i=0;i<open.length;i++){ var w=open[i];
      if(!w.contains(ev.target)){ w.classList.remove('open'); var s=w.querySelector('select'),n=w.querySelector('.ssel-in'); if(s&&n){ var o=s.options[s.selectedIndex]; n.value=o?o.text:''; } } }
  });
  var pend=null;
  function boot(){ var mo=new MutationObserver(function(){ clearTimeout(pend); pend=setTimeout(function(){ all(document); }, 60); });
    try{ mo.observe(document.body,{childList:true,subtree:true}); }catch(e){} all(document); }
  if(document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
})();
</script>

<script>(function(){
  function stepFn(inp,delta){
    var mn=(inp.min!==""&&inp.min!=null)?parseFloat(inp.min):-Infinity;
    var mx=(inp.max!==""&&inp.max!=null)?parseFloat(inp.max):Infinity;
    var v=parseFloat(inp.value); if(isNaN(v))v=0; v+=delta; if(v<mn)v=mn; if(v>mx)v=mx;
    if(Math.abs(v%1)<1e-9)v=Math.round(v);
    inp.value=String(v);
    try{ inp.dispatchEvent(new Event("input",{bubbles:true})); }catch(e){}
    try{ inp.dispatchEvent(new Event("change",{bubbles:true})); }catch(e){}
  }
  function qenh(inp){

    wrap.appendChild(minus); wrap.appendChild(inp); wrap.appendChild(plus);
    inp.classList.add("qs-in"); inp.style.width=""; inp.style.flex="1";
    var hold=null,rep=null;
    function start(d){ stepFn(inp,d); clearTimeout(hold); clearInterval(rep); hold=setTimeout(function(){ rep=setInterval(function(){stepFn(inp,d);},90); },420); }
    function stop(){ clearTimeout(hold); clearInterval(rep); }
    minus.addEventListener("mousedown",function(e){e.preventDefault();start(-1);});
    plus.addEventListener("mousedown",function(e){e.preventDefault();start(1);});
    minus.addEventListener("touchstart",function(e){e.preventDefault();start(-1);},{passive:false});
    plus.addEventListener("touchstart",function(e){e.preventDefault();start(1);},{passive:false});
    ["mouseup","mouseleave","touchend","touchcancel"].forEach(function(ev){ minus.addEventListener(ev,stop); plus.addEventListener(ev,stop); });
  }
  function allQ(root){ try{ (root||document).querySelectorAll('input[type=number]').forEach(qenh); }catch(e){} }
  var t=null;
  function boot(){ try{ new MutationObserver(function(){ clearTimeout(t); t=setTimeout(function(){allQ(document);},60); }).observe(document.body,{childList:true,subtree:true}); }catch(e){} allQ(document); }
  if(document.body) boot(); else document.addEventListener("DOMContentLoaded",boot);
})();</script>

<script id="update-notifier">
/* ═══ Software update notice ═══
   Every 2 minutes (and when the tab comes back) it checks two fingerprints:
     1) this page file itself (ETag / Last-Modified / size from a no-cache HEAD request)
     2) the backend: api_supabase.php?action=version (hash of the deployed files)
   When either changes while the page is open, a card appears top-right. "Updated — refresh" saves any
   pending work, clears the app caches and reloads from the server (same as Ctrl+Shift+R). */
(function(){
  "use strict";
  var EVERY=120000;
  // drop the cache-buster added by the last update so the address stays clean
  try{ var u0=new URL(location.href); if(u0.searchParams.has("_v")){ u0.searchParams.delete("_v"); history.replaceState(null,"",u0.pathname+(u0.search||"")+u0.hash); } }catch(e){}
  var api=""; try{ api=CONFIG.API_BASE; }catch(e){} if(!api){ try{ api=PHP_API; }catch(e){} }
  function th(){ try{ return (typeof lang!=="undefined"?lang:LANG)!=="en"; }catch(e){ return true; } }
  function T(a,b){ return th()?a:b; }

  function stampOf(r){ if(!r||!r.ok) return ""; return [r.headers.get("etag")||"",r.headers.get("last-modified")||"",r.headers.get("content-length")||""].join("~").replace(/^~+$/,""); }
  /* always the same method (HEAD): GET responses may carry a different ETag / length (compression) and look like an
     update. A host that can't answer HEAD is simply not watched this way — the backend version check still is. */
  var headOK=true;
  function pageStamp(){
    if(!headOK) return Promise.resolve("");
    return fetch(location.pathname+"?_upd="+Date.now(),{method:"HEAD",cache:"no-store"})
      .then(function(r){ if(r.status===405||r.status===501){ headOK=false; return ""; } return stampOf(r); })
      .catch(function(){ headOK=false; return ""; });            // unreadable HEAD on this host: stop asking (one console line, not one every check)
  }
  function apiStamp(){
    if(!api) return Promise.resolve("");
    return fetch(api+(api.indexOf("?")<0?"?":"&")+"action=version&_="+Date.now(),{cache:"no-store"})
      .then(function(r){ return r.ok?r.json():null; }).then(function(j){ return (j&&j.version)||""; })
      .catch(function(){ return ""; });
  }
  var base=["",""], seen=null, snoozeUntil=0, card=null, busy=false;
  function check(){
    if(busy) return;
    if(document.hidden&&(base[0]||base[1])) return;          // the first look (baseline) is taken even in a background tab
    Promise.all([pageStamp(),apiStamp()]).then(function(v){
      var changed=false;
      for(var i=0;i<2;i++){
        if(!v[i]) continue;                         // offline / not available: never counts as an update
        if(!base[i]) base[i]=v[i];
        else if(v[i]!==base[i]) changed=true;
      }
      if(!changed) return;
      if(Date.now()<snoozeUntil) return;                 // closed: quiet for 30 minutes, whatever the stamps do
      seen=v.join("|"); show();
    });
  }

  function show(){
    if(card) return;
    card=document.createElement("div");
    card.setAttribute("role","alertdialog");
    card.style.cssText="position:fixed;top:16px;right:16px;max-height:calc(100vh - 32px);overflow:auto;z-index:2147483000;width:min(340px,calc(100vw - 32px));background:#fff;color:#1f2329;"
      +"border:1px solid #e6e8eb;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:14px 14px 12px;font:14px/1.45 system-ui,-apple-system,'Segoe UI','Noto Sans Thai',sans-serif;"
      +"transform:translateY(-12px);opacity:0;transition:transform .25s ease,opacity .25s ease";
    card.innerHTML=
      '<div style="display:flex;gap:12px;align-items:flex-start">'
      +'<div style="flex:0 0 38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#fb923c,#ea580c);display:flex;align-items:center;justify-content:center">'
      +'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg></div>'
      +'<div style="flex:1;min-width:0"><div data-t style="font-weight:800;font-size:15px;margin-bottom:2px"></div><div data-d style="color:#5b6370;font-size:13px"></div></div>'
      +'<button data-x type="button" aria-label="close" style="border:0;background:transparent;color:#8a919c;font-size:18px;line-height:1;cursor:pointer;padding:2px 4px">✕</button></div>'
      +'<button data-ok type="button" style="margin-top:12px;width:100%;border:0;border-radius:10px;padding:10px 12px;background:#f97316;color:#fff;font-weight:800;font-size:14px;cursor:pointer"></button>';
    card.querySelector("[data-t]").textContent=T("มีการอัปเดตซอฟต์แวร์","Software update available");
    card.querySelector("[data-d]").textContent=T("ระบบมีเวอร์ชันใหม่ กดปุ่มด้านล่างเพื่อบันทึกงานที่ค้างและโหลดเวอร์ชันล่าสุด",
                                                  "A new version is available. Press the button to save pending work and load the latest version.");
    var ok=card.querySelector("[data-ok]"); ok.textContent=T("ยืนยันอัปเดตซอฟต์แวร์ และรีเฟรช","Confirm update & refresh");
    ok.onclick=update;

    card.style.top=cardTop()+"px";

  }
  /* sit just below the header / language buttons on the right, so they stay usable */
  function cardTop(){
    var top=16, zone=Math.max(0,window.innerWidth-Math.min(360,window.innerWidth));   // the strip the card covers
    var sel=".top,.topbar,.lang,.loginmode,header,[class*=lang]";
    [].forEach.call(document.querySelectorAll(sel),function(e){
      if(card&&card.contains(e)) return;
      var r=e.getBoundingClientRect(), cs=getComputedStyle(e);
      if(!r.width||!r.height||cs.visibility==="hidden"||cs.display==="none") return;
      if(r.top>200||r.bottom<=0||r.right<zone) return;            // only things in the top-right corner
      top=Math.max(top,Math.round(r.bottom+10));
    });
    return Math.min(top,220);
  }
  window.addEventListener("resize",function(){ if(card) card.style.top=cardTop()+"px"; });
  function hide(){ if(!card) return; var c=card; card=null; c.style.opacity="0"; c.style.transform="translateY(-12px)"; setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },260); }

  /* save pending work first (each page has its own save layer) */
  function flushAll(){
    var waits=[];
    try{ if(typeof Store!=="undefined"){
      if(typeof Store.flushNow==="function") waits.push(Promise.resolve(Store.flushNow(true)).catch(function(){}));      // POS
      else if(typeof Store.flushRemote==="function") waits.push(Promise.resolve(Store.flushRemote()).catch(function(){})); // web (resolves when the server confirmed)
    } }catch(e){}
    try{ if(typeof saveByTableM==="function"&&typeof _saveDirty!=="undefined"&&_saveDirty)                                // mobile
      waits.push(Promise.resolve(saveByTableM()).then(function(r){ if(r&&r.ok) _saveDirty=false; }).catch(function(){})); }catch(e){}
    waits.push(new Promise(function(r){ setTimeout(r,300); }));
    return Promise.race([Promise.all(waits),new Promise(function(r){ setTimeout(r,10000); })]);
  }
  /* anything still not confirmed by the server? then we must not reload */
  function pendingLeft(){
    try{ if(typeof Store!=="undefined"){
      if(typeof Store.hasPending==="function") return Store.hasPending();
      if(typeof Store._pendLoad==="function"){ var o=Store._pendLoad(); return !!(o&&(o.cur||(o.base&&o.base.length))); }
    } }catch(e){}
    try{ if(typeof _saveDirty!=="undefined") return !!_saveDirty; }catch(e){}
    return false;
  }
  /* like Ctrl+Shift+R: drop the cached app files and load everything again from the server */
  function update(){
    if(busy) return; busy=true;
    var ok=card&&card.querySelector("[data-ok]"); if(ok){ ok.disabled=true; ok.style.opacity=".7"; ok.textContent=T("กำลังอัปเดต…","Updating…"); }
    flushAll().then(function(){
      if(pendingLeft()){                                    // never reload with unsaved work
        busy=false; if(ok){ ok.disabled=false; ok.style.opacity=""; ok.textContent=T("ยืนยันอัปเดตซอฟต์แวร์ และรีเฟรช","Confirm update & refresh"); }
        var d=card&&card.querySelector("[data-d]"); if(d){ d.style.color="#c2410c"; d.textContent=T("ยังบันทึกงานขึ้นเซิร์ฟเวอร์ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต แล้วกดอีกครั้ง","Your work isn't saved to the server yet — check the connection and press again"); }
        return Promise.reject("pending");
      }
      var jobs=[];
      try{ if(window.caches&&caches.keys) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(e){}
      try{ if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.update().catch(function(){}); })); })); }catch(e){}
      return Promise.race([Promise.all(jobs),new Promise(function(r){ setTimeout(r,3000); })]);
    }).then(function(){
      var u=new URL(location.href); u.searchParams.set("_v",Date.now());   // bypass the HTTP cache for the page itself
      location.replace(u.toString());
    },function(e){ if(e!=="pending"){ var u=new URL(location.href); u.searchParams.set("_v",Date.now()); location.replace(u.toString()); } });
  }

  setTimeout(check,1500);                                    // baseline right after load
  setInterval(check,EVERY);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) check(); });
  window.addEventListener("focus",check);
  window.__checkForUpdate=check;          // handy for testing from the console
})();
</script>
<script id="thai-font">
/* Thai font chosen for the company (settings.font) — the same five choices in web, mobile and POS.
   No choice = each app keeps its own default font. */
var THAI_FONTS=[
  {k:"noto",   n:"Noto Sans Thai",     css:"Noto+Sans+Thai:wght@400;500;600;700;800"},
  {k:"sarabun",n:"Sarabun",            css:"Sarabun:wght@400;500;600;700;800"},
  {k:"prompt", n:"Prompt",             css:"Prompt:wght@400;500;600;700;800"},
  {k:"kanit",  n:"Kanit",              css:"Kanit:wght@400;500;600;700;800"},
  {k:"plex",   n:"IBM Plex Sans Thai", css:"IBM+Plex+Sans+Thai:wght@400;500;600;700"}
];
function thaiFontOf(k){ for(var i=0;i<THAI_FONTS.length;i++) if(THAI_FONTS[i].k===k) return THAI_FONTS[i]; return null; }
function thaiFontFamily(f){ return "'"+f.n+"','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"; }
function applyThaiFont(k){
  var f=thaiFontOf(k), st=document.getElementById("thFontStyle"), ln=document.getElementById("thFontLink");
  if(!f){ if(st) st.remove(); if(ln) ln.remove(); return; }
  if(!ln){ ln=document.createElement("link"); ln.id="thFontLink"; ln.rel="stylesheet"; document.head.appendChild(ln); }
  var href="https://fonts.googleapis.com/css2?family="+f.css+"&display=swap"; if(ln.getAttribute("href")!==href) ln.setAttribute("href",href);
  if(!st){ st=document.createElement("style"); st.id="thFontStyle"; document.head.appendChild(st); }
  var fam=thaiFontFamily(f);
  st.textContent=":root{--font:"+fam+" !important}body{font-family:"+fam+" !important}button,input,select,textarea{font-family:inherit}";
}
/* every time a company's data is (re)loaded, its font follows */
(function(){ if(typeof activateCompany!=="function") return; var _ac=activateCompany;
  activateCompany=function(cid){ var r=_ac.apply(this,arguments);
    try{ var s=(typeof META!=="undefined"&&META&&META.settings)?META.settings[cid]:null; applyThaiFont(s&&s.font); }catch(e){}
    return r; }; })();
/* the company already open when this loads */
try{ var _fc=(typeof CID!=="undefined"&&CID)||(typeof session!=="undefined"&&session&&session.company);
  if(_fc&&typeof META!=="undefined"&&META&&META.settings) applyThaiFont((META.settings[_fc]||{}).font); }catch(e){}
</script>
