function computeAssembly(bomId,qty){
  const b=(DB.bomMaster||[]).find(x=>x.id===bomId); if(!b) return {components:[],allOk:false};
  const byCode={}, components=[];                                    // the same part on several BOM lines: check the TOTAL
  (b.lines||[]).filter(l=>l.code).forEach(l=>{ const n=Math.ceil((parseFloat(l.qty)||0)*qty-1e-9);   // stock is whole units
    if(byCode[l.code]){ byCode[l.code].need+=n; return; }
    byCode[l.code]={code:l.code,name:l.name||l.code,unit:l.unit||"",need:n}; components.push(byCode[l.code]); });
  components.forEach(c=>{ c.avail=stockTotal(c.code); c.ok=c.avail>=c.need; });
  return {components,allOk:components.length>0&&components.every(c=>c.ok),product:b.product,productName:b.name};
}
function consumeAcross(code,qty){
  let remain=qty; const consumed=[];
  const locs=[...new Set((DB.stock||[]).filter(s=>s.code===code&&!isNG(s.loc)&&(parseInt(s.qty,10)||0)>0).map(s=>s.loc))];
  for(const loc of locs){ if(remain<=0)break;
    const av=stockAt(code,loc); const take=Math.min(av,remain); if(take<=0)continue;
    const {consumed:cs}=issueFIFO(code,loc,take); consumed.push(...cs);           // FIFO in both modes (keeps lot cost)
    remain-=take;
  }
  return {consumed,short:remain};
}
function doAssembly(){
  const b=(DB.bomMaster||[]).find(x=>x.id===window._asmSel); if(!b){ toast(t("selectItem"),"warn"); return; }
  const qty=Math.max(1,parseInt(window._asmQty,10)||1);
  const dest=window._asmDest||(locList().filter(c=>!isNG(c))[0]||"");
  const comp=computeAssembly(b.id,qty);
  if(!comp.components.length){ toast(t("noData"),"warn"); return; }
  if(!comp.allOk){ toast(t("notEnoughComp"),"err"); return; }
  if(!capWarn(dest,qty)){ toast(t("cancel"),"warn"); return; }      // ask BEFORE any component is consumed
  const ref="ASM-"+today().replace(/-/g,"")+"-"+String((typeof txnSeq!=="undefined"?txnSeq:0)+1).slice(-4);
  let totalCost=0;
  comp.components.forEach(c=>{ const {consumed}=consumeAcross(c.code,c.need);
    consumed.forEach(cs=>{ totalCost+=(cs.cost||0)*cs.qty;
      hpush({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code:c.code,name:c.name,loc:cs.loc,qty:cs.qty,
        unitQty:c.unit,pkg:c.unit,lotNo:cs.lotNo,lotSup:cs.lotSup,mfd:cs.mfd,exp:cs.exp,sn:cs.sn,cost:(cs.cost||0),cogs:(cs.cost||0)*cs.qty,
        orderNo:ref,note:t("assembly")+" → "+b.product,status:"Assembly"}); }); });   // stored as text; escaped where shown
  const prod=DB.itemMaster.find(i=>i.code===b.product)||{};
  ensureItem(b.product,{name:b.name||prod.name||b.product,unit:prod.unit||""});
  const unitCost=feat("costing")?(qty>0?totalCost/qty:0):0;
  receiveStock(b.product,dest,qty,{lotNo:ref,cost:unitCost});
  hpush({id:nextTxnId(),type:"IN",date:today(),time:nowTime(),code:b.product,name:b.name||prod.name||b.product,loc:dest,qty,

  Store.save(); toast(t("assemblyDone")+" · "+b.product+" ×"+num(qty)+" → "+ref,"ok"); route("assembly");
}

function rowCost(s){ const c=parseFloat(s.cost); if(c>0) return c; const it=DB.itemMaster.find(i=>i.code===s.code)||{}; return parseFloat(it.cost)||0; }
function abcData(){
  const q={}; DB.stock.forEach(s=>{ if(!isNG(s.loc)){ const v=(parseInt(s.qty,10)||0); q[s.code]=q[s.code]||{qty:0,value:0}; q[s.code].qty+=v; q[s.code].value+=v*rowCost(s); } });
  let rows=DB.itemMaster.filter(m=>q[m.code]).map(m=>({code:m.code,name:m.name,cat:m.cat,qty:q[m.code].qty,value:q[m.code].value}));
  const totalValue=rows.reduce((a,x)=>a+x.value,0);
  const byValue=totalValue>0;
  rows.forEach(x=>{ x.basis=byValue?x.value:x.qty; });
  const totalBasis=rows.reduce((a,x)=>a+x.basis,0)||1;
  rows.sort((a,b)=>b.basis-a.basis);
  let cum=0; rows.forEach(x=>{ x.pct=x.basis/totalBasis*100; cum+=x.pct; x.cum=cum; x.cls=cum<=80?"A":(cum<=95?"B":"C"); });
  return {rows,byValue,totalValue,totalBasis};
}

function stockTableAgg(key,rows,opts){
  const byCode={};
  rows.forEach(r=>{ const k=r.code; if(!byCode[k]) byCode[k]={code:r.code,name:r.name,cat:r.cat,sup:r.sup,unit:r.unit,barcode:r.barcode,qtyPackage:r.qtyPackage,unitPackage:r.unitPackage,qty:0,value:0,entries:[]};
    byCode[k].qty += (parseInt(r.qty,10)||0); byCode[k].value += (parseInt(r.qty,10)||0)*(parseFloat(r.cost)||0); byCode[k].entries.push(r); });
  const aggRows=Object.values(byCode);
  const cols=[
    {k:"_exp",label:"",sort:false,toggle:false,render:r=>`<span class="caret">▸</span>`},
    {k:"code",label:"itemCode",render:r=>`<b>${esc(r.code)}</b>`},
    {k:"name",label:"itemName"},
    {k:"cat",label:"category",render:r=>esc(r.cat||"-")},
    {k:"sup",label:"supplier",render:r=>esc(r.sup||"-")},
    {k:"qty",label:"qtyBase",num:true,render:r=>{const q=r.qty;
      const cls=q<=0?'style="color:var(--danger);font-weight:900"':(q<=10?'style="color:var(--orange);font-weight:900"':'');
      return `<span ${cls}>${num(q)}</span> <span style="color:var(--sub);font-size:12px">${esc(r.unit||"")}</span>`;}},
    {k:"unit",label:"unit",render:r=>esc(r.unit||"-")},
    {k:"_lots",label:"lotsCol",sort:false,render:r=>{const n=r.entries.length;
      return `<span class="pill ${n>1?'warn':'ok'}"><i class="pdot"></i>${n}</span>`;}}
  ];
  if(feat("costing")) cols.push({k:"value",label:"stockValue",num:true,sortVal:r=>r.value,render:r=>`<b>${num(Math.round(r.value*100)/100)}</b>`});
  if(opts.booking) cols.push({k:"_bk",label:"booked",sort:false,toggle:true,render:r=>{
    const bq=bookedQtyOf(r.code);
    const badge = bq>0 ? `<span class="pill warn" onclick="event.stopPropagation();bookingsForItem(${jsa(r.code)})" style="cursor:pointer" title="${t("manageBookings")}"><i class="pdot"></i>${num(bq)}</span>` : `<span style="color:var(--sub2)">—</span>`;
    return `<div style="display:flex;align-items:center;gap:2px">${badge}<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();bookItem(${jsa(r.code)})" title="${t("addBooking")}" style="margin-left:6px;padding:4px 8px">${IC.booking}</button></div>`;
  }});
  return dataTable({
    key, rows:aggRows, defaultSize:50, colToggle:true, defaultSort:"code",
    expand:r=>stockLotSubtable(r.entries,r.unit,opts),
    search:(r,q)=>[r.code,r.name,r.cat,r.sup].some(v=>String(v||"").toLowerCase().includes(q))
      || r.entries.some(e=>[e.loc,e.lotSup,e.lotNo,e.sn].some(v=>String(v||"").toLowerCase().includes(q))),
    toolbarRight:`${opts.selectPrint?`<button class="btn btn-dark btn-sm" onclick="printSelectedStock()">${IC.tag}${t("printLabels")}</button>`:""}<button class="btn btn-ok btn-sm" onclick="exportStock('${key}')">${IC.excel}Excel</button>`,
    columns:cols});
}
/* sub-table: one row per lot/stock entry, FIFO-sorted */
function stockLotSubtable(entries,unit,opts){
  const fifoT=v=>{ const x=v?localDate(v).getTime():NaN; return isNaN(x)?Infinity:x; };   // no / bad date = last
  const es=entries.slice().sort((a,b)=>{const ax=fifoT(a.exp),bx=fifoT(b.exp);if(ax!==bx)return ax-bx;const am=fifoT(a.mfd),bm=fifoT(b.mfd);if(am!==bm)return am-bm;return String(a.lotNo||"").localeCompare(String(b.lotNo||""),undefined,{numeric:true});});
  const mg=isMgrUp();
  const head=`<tr>${opts.selectPrint?'<th></th>':''}<th>${t("location")}</th>`
    +(fcol("lotSup")?`<th>${t("lotSup")}</th>`:"")+(feat("lot")?`<th>${t("lotNo")}</th>`:"")
    +(fcol("mfd")?`<th>${t("mfdCol")}</th>`:"")+(fcol("exp")?`<th>${t("expCol")}</th>`:"")+(fcol("sn")?`<th>${t("snCol")}</th>`:"")
    +`<th class="num">${t("qtyBase")}</th>`+(mg?`<th>${t("actions")}</th>`:"")+`</tr>`;
  const body=es.map(r=>`<tr>
    ${opts.selectPrint?`<td><input type="checkbox" class="sbChk" value="${esc(r.code)}@@${esc(r.loc)}" onclick="event.stopPropagation()"></td>`:""}
    <td><span class="pill ${isNG(r.loc)?'ng':'ok'}"><i class="pdot"></i>${esc(r.loc)}</span></td>
    ${fcol("lotSup")?`<td>${esc(r.lotSup||"—")}</td>`:""}${feat("lot")?`<td>${esc(r.lotNo||"—")}</td>`:""}
    ${fcol("mfd")?`<td>${r.mfd?fmtDate(r.mfd):"—"}</td>`:""}${fcol("exp")?`<td>${expCell(r.exp)}</td>`:""}${fcol("sn")?`<td>${esc(r.sn||"—")}</td>`:""}
    <td class="num">${num(r.qty)} <span style="color:var(--sub);font-size:12px">${esc(unit||"")}</span></td>
    ${mg?`<td><div class="rowact" onclick="event.stopPropagation()">
      <button class="btn btn-ghost btn-sm" onclick="editStockRow(${jsa(r.code)},${jsa(r.loc)},${jsa(lotKey(r))})" title="${t("adjustStock")}">${IC.pencil}</button>
      ${(parseInt(r.qty,10)||0)===0?`<button class="btn btn-ghost btn-sm danger" onclick="deleteStockRow(${jsa(r.code)},${jsa(r.loc)})" title="${t("delete")}">${IC.trash}</button>`:""}</div></td>`:""}
  </tr>`).join("");
  return `<div class="subwrap"><table class="dt subdt"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
function deleteStockRow(code,loc){ if(!confirm(t("confirmDelete")))return;
  if(DB.stock.some(x=>x.code===code&&x.loc===loc&&(parseInt(x.qty,10)||0)<0)&&!DB.stock.some(x=>x.code===code&&x.loc===loc&&(parseInt(x.qty,10)||0)===0)){
    toast(lang==="th"?"สต๊อกติดลบ — ปรับยอดให้เป็น 0 ก่อน จึงจะลบได้":"Negative stock — adjust it to 0 before deleting","err"); return; }
  const i=DB.stock.findIndex(x=>x.code===code&&x.loc===loc&&(parseInt(x.qty,10)||0)===0);
  if(i>=0){ DB.stock.splice(i,1); Store.save(); toast(t("tDeleted"),"ok"); route(current); } }
function editStockRow(code,loc,lk){
  const m=DB.itemMaster.find(i=>i.code===code)||{};
  const lotRow=lk?DB.stock.find(x=>x.code===code&&x.loc===loc&&lotKey(x)===lk):null;   // a lot row was clicked: adjust exactly that lot
  const cur=lotRow?(parseInt(lotRow.qty,10)||0):stockAt(code,loc);
  const lotTxt=lotRow&&(lotRow.lotNo||lotRow.exp||lotRow.lotSup)?" · "+[lotRow.lotNo,lotRow.lotSup,lotRow.exp].filter(Boolean).join(" · "):"";
  modal2Shell(IC.pencil, t("adjustStock"), `${esc(code)} · ${esc(loc)}${esc(lotTxt)}`,
    `<div class="kv" style="margin-bottom:12px"><span class="k">${t("currentQty")}</span><span class="v"><b>${num(cur)} ${esc(m.unit||"")}</b></span></div>
     <div class="grid2">
       ${field("adjDir",`<select class="inp" id="adjMode"><option value="add">${t("adjAdd")}</option><option value="reduce">${t("adjReduce")}</option></select>`)}
       ${field("adjAmount",`<input class="inp num" id="adjAmt" type="number" value="0" min="0">`,true)}
     </div>
     ${field("adjReason",`<input class="inp" id="adjNote" placeholder="${t("adjReason")}">`)}`,
    `<button class="btn btn-ghost" onclick="closeModal2()">${t("cancel")}</button>
     <button class="btn btn-primary" onclick="applyStockAdjust(${jsa(code)},${jsa(loc)},${jsa(lotRow?lk:"")})">${IC.check}${t("confirm")}</button>`);
}
function applyStockAdjust(code,loc,lk){ if(!isMgrUp()){ toast(lang==="th"?"เฉพาะผู้จัดการขึ้นไป":"Manager or above only","err"); return; }
  const m=DB.itemMaster.find(i=>i.code===code)||{};
  const mode=val("adjMode"); const amt=wholeQ(val("adjAmt"));
  if(amt<0){ toast((lang==="th"?"ใส่จำนวนเต็มที่มากกว่า 0":"Enter a whole number above 0"),"err"); return; }
  if(amt<=0){ toast(t("adjAmount")+" ?","warn"); return; }
  const delta = mode==="reduce" ? -amt : amt;
  const lotRow=lk?DB.stock.find(x=>x.code===code&&x.loc===loc&&lotKey(x)===lk):null;
  const cur=lotRow?(parseInt(lotRow.qty,10)||0):stockAt(code,loc);
  if(delta<0 && cur+delta<0){ toast(t("notEnough"),"err"); return; }
  const lotRec=lotRow?{lotSup:lotRow.lotSup,lotNo:lotRow.lotNo,mfd:lotRow.mfd,exp:lotRow.exp,sn:lotRow.sn,cost:lotRow.cost}:null;
  const note=val("adjNote");
  const base={ type: delta>0?"IN":"OUT", date:today(), time:nowTime(), code,
    name:m.name||code, loc, orderNo:"ADJUST", dept:"", supplier:m.sup||"",
    pkg:m.unit||"", unitQty:m.unit||"", note:note||t("adjustStock"), status: delta>0?"Stored":"Done" };
  // log the adjustment so it appears in Inquiry / Report (increase -> IN, decrease -> OUT) — on the lot(s) it really touched
  if(lotRec){ changeStockFor(code,loc,delta,lotRec);
    hpush(Object.assign({id:nextTxnId(),qty:amt,lotSup:lotRec.lotSup||"",lotNo:lotRec.lotNo||"",mfd:lotRec.mfd||"",exp:lotRec.exp||"",sn:lotRec.sn||""},base)); }
  else if(delta>0){ adjustStockAt(code,loc,delta); hpush(Object.assign({id:nextTxnId(),qty:amt},base)); }
  else { const {consumed,remain}=issueFIFO(code,loc,amt);
    consumed.filter(c=>c.qty>0).forEach(c=>hpush(Object.assign({id:nextTxnId(),qty:c.qty,lotSup:c.lotSup,lotNo:c.lotNo,mfd:c.mfd,exp:c.exp,sn:c.sn},base)));
    if(remain>0){ const r=plainStockRow(code,loc); r.qty=(parseInt(r.qty,10)||0)-remain; hpush(Object.assign({id:nextTxnId(),qty:remain},base)); } }
  Store.save(); closeModal2(); toast(t("tSaved"),"ok"); route(current);
}

function addBom(){ bomForm(null); }
function editBom(id){ bomForm(DB.bomMaster.find(b=>b.id===id)); }
function bomForm(b){
  const isNew=!b;
  b=b||{product:"",name:"",note:"",lines:[{code:"",name:"",qty:1,unit:"pcs"}]};
  window._bomDraft=JSON.parse(JSON.stringify(b));
  modalShell(IC.stock, isNew?t("add"):t("edit"), t("bomMaster"),
    `<div class="grid2">
      ${field("bomProduct",`<input class="inp" id="bmProd" value="${esc(b.product)}" list="bmItemCodes" oninput="bomProdName(this.value)">`,true)}
      ${field("itemName",`<input class="inp" id="bmName" value="${esc(b.name||"")}">`)}
    </div>
    ${field("note",`<input class="inp" id="bmNote" value="${esc(b.note||"")}">`)}
    <div class="field"><label>${t("bomComponents")}</label><div id="bmLines"></div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="bomAddLine()">${IC.plus}${t("bomComponents")}</button></div>
    <datalist id="bmItemCodes">${DB.itemMaster.map(it=>`<option value="${esc(it.code)}">${esc(it.name)}</option>`).join("")}</datalist>`,
    `<button class="btn btn-ghost" onclick="closeModal()">${t("cancel")}</button>
     <button class="btn btn-primary" onclick="saveBom(${isNew?"null":jsn(b.id)})">${IC.check}${t("save")}</button>`, true);
  renderBomLines();
}
function bomProdName(v){ const it=findItem(v); if(it){ const n=document.getElementById("bmName"); if(n&&!n.value)n.value=it.name; } }
function renderBomLines(){
  const d=window._bomDraft; const box=document.getElementById("bmLines"); if(!box)return;
  box.innerHTML=d.lines.map((l,i)=>`<div class="linerow">
    <input class="inp" placeholder="${t("itemCode")}" value="${esc(l.code)}" oninput="bomLine(${i},'code',this.value)" list="bmItemCodes" style="flex:1.1">
    <input class="inp" placeholder="${t("itemName")}" value="${esc(l.name)}" oninput="bomLine(${i},'name',this.value)" style="flex:1.5">
    <input class="inp num" type="number" placeholder="${t("qty")}" value="${esc(l.qty)}" oninput="bomLine(${i},'qty',this.value)" style="width:80px">
    <input class="inp" placeholder="${t("unit")}" value="${esc(l.unit||"")}" oninput="bomLine(${i},'unit',this.value)" style="width:80px">
    <button class="btn btn-ghost btn-sm danger" onclick="bomDelLine(${i})">${IC.trash}</button></div>`).join("");
}
function bomLine(i,k,v){ const d=window._bomDraft; d.lines[i][k]=k==="qty"?(parseFloat(v)||0):v;
  if(k==="code"){ const it=findItem(v); if(it){ d.lines[i].code=it.code; d.lines[i].name=it.name; d.lines[i].unit=it.unit||d.lines[i].unit; renderBomLines(); } } }
function bomAddLine(){ window._bomDraft.lines.push({code:"",name:"",qty:1,unit:"pcs"}); renderBomLines(); }
function bomDelLine(i){ const d=window._bomDraft; if(d.lines.length>1)d.lines.splice(i,1); renderBomLines(); }
function saveBom(id){ if(!isMgrUp()){ toast(lang==="th"?"เฉพาะผู้จัดการขึ้นไป":"Manager or above only","err"); return; }
  const d=window._bomDraft;
  const prod0=document.getElementById("bmProd").value.trim(), pIt=prod0?findItem(prod0):null, product=pIt?pIt.code:prod0;   // a barcode becomes the item code
  if(!product){ toast(t("bomProduct")+" ?","warn"); return; }
  const lines=d.lines.filter(l=>l.code||l.name).map(l=>({code:l.code,name:l.name||l.code,qty:parseFloat(l.qty)||0,unit:l.unit||"pcs"}));
  const rec={ id:id||uidNum(DB.bomMaster), product, name:document.getElementById("bmName").value.trim(),
    note:document.getElementById("bmNote").value.trim(), lines };
  if(id){ const idx=DB.bomMaster.findIndex(b=>b.id===id); DB.bomMaster[idx]=rec; }
  else DB.bomMaster.push(rec);
  Store.save(); closeModal(); toast(t("tSaved"),"ok"); route("m-bom");
}
function delBom(id){ if(!isMgrUp()){ toast(lang==="th"?"เฉพาะผู้จัดการขึ้นไป":"Manager or above only","err"); return; } if(!confirm(t("confirmDelete")))return; const _i=DB.bomMaster.findIndex(b=>b.id===id); if(_i>=0) DB.bomMaster.splice(_i,1); Store.save(); toast(t("tDeleted"),"ok"); route("m-bom"); }

  const b=DB.bomMaster.find(x=>x.id===id); if(!b)return;
  const rows=(b.lines||[]).map(l=>`<tr><td><b>${esc(l.code)}</b></td><td>${esc(l.name)}</td><td class="num">${num(l.qty)}</td><td>${esc(l.unit||"-")}</td></tr>`).join("");
  modalShell(IC.stock, `${esc(b.product)}`, esc(b.name||""),
    `<div class="kv" style="margin-bottom:8px"><span class="k">${t("note")}</span><span class="v">${esc(b.note||"-")}</span></div>
     <div class="tablewrap"><table class="dt tnum"><thead><tr><th>${t("itemCode")}</th><th>${t("itemName")}</th>
       <th class="num">${t("qty")}</th><th>${t("unit")}</th></tr></thead><tbody>${rows}</tbody></table></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">${t("close")}</button>`, true);
}
function masterPage(mkey){
  const M=MASTERS[mkey];
  let src=DB[M.key];
  if(mkey==="user") src = isSuper() ? META.users : src.filter(u=>(u.company||"C1")===session.company);   // company isolation (super sees all)
  const rows=src.map(r=>Object.assign({__i:DB[M.key].indexOf(r)},r));
  const cols=M.fields.filter(f=>f.type!=="image").map(f=>({k:f.k,label:f.label,num:f.num,
    render:f.k==="password"?(r=>"••••"):
      (f.k==="company"?(r=>{const c=META.companies.find(x=>x.id===(r.company||"C1"));return esc(c?c.name:r.company||"-");}):
      (f.k==="position"?(r=>`<span class="tag ${r.position==="Admin"?"NGIN":r.position==="Manager"?"MOVE":"IN"}">${esc(r.position)}</span>`):
      (r=>esc(r[f.k]==null||r[f.k]===""?"-":r[f.k]))))}));

function reportRange(fkey,type,title){
  const f=filters[fkey];
  const rows=DB.history.filter(h=>h.type===type).filter(h=>(!f.from||h.date>=f.from)&&(!f.to||h.date<=f.to));
  const tot=rows.reduce((s,h)=>s+h.qty,0);
  const fb=`<div class="panel filterbar"><div class="fb-grid">
    <div class="field fb-date"><label>${t("dateRange")}</label><div class="inwrap">
      <input class="inp" type="date" id="${fkey}From" value="${f.from}"><input class="inp" type="date" id="${fkey}To" value="${f.to}"></div></div>
    <div class="fb-act"><button class="btn btn-dark" onclick="applyRpt('${fkey}')">${IC.search}${t("search")}</button>
      <button class="btn btn-ghost" onclick="resetRpt('${fkey}')">${IC.refresh}${t("reset")}</button>
      <button class="btn btn-ok" onclick="exportReport('${fkey}','${type}')">${IC.excel}Excel</button></div>
  </div></div>`;
  return fb + dataTable({
    key:"rpt_"+fkey, rows, defaultSize:50, colToggle:true,
    search:(r,q)=>[r.code,r.name,r.loc,r.dept].some(v=>String(v||"").toLowerCase().includes(q)),
    foot:(rs,cs)=>{ const vis=cs||[], qi=vis.findIndex(c=>c.k==="qty"), n=vis.length;   // the total sits under Qty, whatever columns are shown
      const tot=`<td class="num" style="font-weight:900;color:var(--orange)">${num(rs.reduce((s,h)=>s+(parseFloat(h.qty)||0),0))}</td>`;
      if(qi<0) return `<tr><td colspan="${Math.max(1,n-1)}" style="text-align:right;font-weight:800">${t("total")}</td>${tot}</tr>`;
      return `<tr>${qi>0?`<td colspan="${qi}" style="text-align:right;font-weight:800">${t("total")}</td>`:""}${tot}${n-qi-1>0?`<td colspan="${n-qi-1}"></td>`:""}</tr>`; },
    columns:[
      {k:"date",label:"date",render:r=>dtFull(r),sortVal:r=>r.date+(r.time||"")},
      {k:"code",label:"itemCode",render:r=>`<b>${esc(r.code)}</b>`},
      {k:"name",label:"itemName"},
      ...(type==="OUT"?[
        {k:"orderNo",label:"orderNo",render:r=>esc(r.orderNo||"-")},
        {k:"customer",label:"customer",render:r=>esc(r.customer||"-")}]:[]),
      {k:"loc",label:"location"},
      {k:"qty",label:"qty",num:true,render:r=>num(r.qty)},
      {k:"dept",label:"department",render:r=>esc(r.dept||"-")},
      ...(type==="OUT"?[
        ...(feat("shipping")?[{k:"shipping",label:"shipping",render:r=>esc(r.shipping||"-")}]:[]),
        {k:"note",label:"remark",render:r=>esc(r.note||"-")}]:[])
    ]});
}

const TUT_KEY="wms_tutorial";
function tutState(){ try{ return JSON.parse(localStorage.getItem(TUT_KEY)||"{}")||{}; }catch(e){ return {}; } }
function tutSave(s){ try{ localStorage.setItem(TUT_KEY,JSON.stringify(s)); }catch(e){} }
function tutDone(){ const s=tutState(); return s.done||{}; }
function startTutorial(i){ const s=tutState(); s.open=true; s.step=(typeof i==="number")?i:(s.step||0); tutSave(s); tutRender(); route(TUTORIAL[s.step].page); }
function tutClose(){ const s=tutState(); s.open=false; tutSave(s); tutRender(); }
function tutGo(d){ const s=tutState(); s.step=Math.max(0,Math.min(TUTORIAL.length-1,(s.step||0)+d)); tutSave(s); tutRender(); route(TUTORIAL[s.step].page); }
function tutMark(){ const s=tutState(); s.done=s.done||{}; s.done[s.step||0]=true; tutSave(s);
  if((s.step||0)<TUTORIAL.length-1) tutGo(1); else { tutRender(); toast(lang==="th"?"เรียนรู้ครบทุกขั้นตอนแล้ว 🎉":"Tutorial complete 🎉","ok"); } }
function tutRender(){
  const s=tutState(); let el=document.getElementById("tutbox");
  if(!s.open){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement("div"); el.id="tutbox"; document.body.appendChild(el); }
  const th=lang==="th", i=Math.min(s.step||0,TUTORIAL.length-1), st=TUTORIAL[i], txt=th?st.th:st.en, done=(s.done||{})[i];
  el.innerHTML=`<div class="tut-h"><b>${th?"โหมดสอนใช้งาน":"Tutorial mode"}</b>
      <span class="tut-count">${i+1}/${TUTORIAL.length}</span>
      <button class="tut-x" onclick="tutClose()" title="${th?"ปิด":"Close"}">✕</button></div>
    <div class="tut-b">
      <div class="tut-t">${esc(txt[0])}${done?' <span class="tut-ok">✓</span>':''}</div>
      <div class="tut-d">${esc(txt[1])}</div>
      <div class="tut-how">${IC.bolt||""}<span>${esc(txt[2])}</span></div>
      <div class="tut-bar"><i style="width:${Math.round((i+1)/TUTORIAL.length*100)}%"></i></div>
    </div>
    <div class="tut-f">
      <button class="btn btn-ghost btn-sm" onclick="tutGo(-1)" ${i===0?"disabled":""}>${th?"ก่อนหน้า":"Back"}</button>
      <button class="btn btn-ghost btn-sm" onclick="route(${jsa(st.page)})">${th?"ไปหน้านี้":"Open page"}</button>
      <button class="btn btn-primary btn-sm" onclick="tutMark()">${i===TUTORIAL.length-1?(th?"เสร็จสิ้น":"Finish"):(th?"ถัดไป":"Next")}</button>
    </div>`;
}

function guideToHtml(text){
  return esc(text).split(/\n/).map(line=>{ const s=line.trim();
    if(!s) return "";
    if(/^#{1,3}\s/.test(s)) return `<h3>${s.replace(/^#{1,3}\s/,"")}</h3>`;
    if(/^[-*]\s/.test(s)) return `<p style="margin-left:14px">• ${s.replace(/^[-*]\s/,"")}</p>`;
    return `<p>${s}</p>`;
  }).join("");
}

function editGuide(){

    `<textarea class="inp" id="guideTxt" style="min-height:320px;font-family:inherit;line-height:1.6;resize:vertical">${esc(cur)}</textarea>`,
    `<button class="btn btn-ghost" onclick="closeModal()">${t("cancel")}</button>
     <button class="btn btn-danger" onclick="resetGuide()">${IC.refresh}${t("resetData")}</button>
     <button class="btn btn-primary" onclick="saveGuide()">${IC.check}${t("save")}</button>`, true);
}
function saveGuide(){ DB.settings.guide=document.getElementById("guideTxt").value; Store.save(); closeModal(); toast(t("tSaved"),"ok"); route("guide"); }

/* Menu-visibility (WMS CON style): one box per sidebar section, every menu a ticked tile, "select all / none" per box.
   menus = {id:true} for hidden ones. chkClass=null -> live (Settings page, saves on click);
   chkClass="umChk"/"cmChk" -> form inside a dialog, read by its Save button (data-id on every box). */
function menuVisGrid(menus,chkClass){
  menus=menus||{}; const vis=id=>menus[id]!==true, th=lang==="th";
  const secs=sbSections(); secs.forEach(x=>x.tiles=[]); let last=secs[0];
  NAV.forEach(n=>{                                                   // same placement as the sidebar
    if(n.sec!==undefined&&!n.id&&!n.group) return;
    const key=n.group||n.id, sc=secs.find(x=>x.keys.indexOf(key)>=0)||last; last=sc;
    if(n.children&&n.children.length) n.children.filter(c=>c.id).forEach(c=>sc.tiles.push({id:c.id,label:c.label,grp:n.label}));
    else if(n.id&&n.id!=="home"&&n.id!=="settings") sc.tiles.push({id:n.id,label:n.label});
  });
  const tile=x=>`<label class="mv-tile"><input type="checkbox" ${chkClass?`class="${chkClass}" data-id="${esc(x.id)}"`:""} data-mv="${esc(x.id)}" ${vis(x.id)?"checked":""}
      onchange="${chkClass?"":`setMenuVis(${jsa(x.id)},this.checked);`}mvSync()"><span class="mv-tl"><b>${esc(t(x.label))}</b>${x.grp&&t(x.grp)!==t(x.label)?`<small>${esc(t(x.grp))}</small>`:""}</span></label>`;
  setTimeout(()=>{ try{ mvSync(); }catch(e){} },30);
  return `<div class="mv-wrap">`+secs.filter(x=>x.tiles.length).map(x=>{ const ids=x.tiles.map(y=>y.id), on=ids.filter(vis).length;
    return `<div class="mv-box" data-ids="${esc(ids.join(","))}"><div class="mv-bh"><span class="mv-bt">${esc(th?x.th:x.en)}</span><span class="mv-n">${on}/${ids.length}</span>
      <span class="mv-acts"><button type="button" class="mv-pill" onclick="mvSecPick(this,true,${chkClass?1:0})">${th?"เลือกทั้งหมด":"Select all"}</button><button type="button" class="mv-pill" onclick="mvSecPick(this,false,${chkClass?1:0})">${th?"ไม่เลือก":"None"}</button></span></div>
      <div class="mv-tiles">${x.tiles.map(tile).join("")}</div></div>`; }).join("")+`</div>`;
}
const mvBox=(wrap,id)=>wrap.querySelector('input[data-mv="'+String(id).replace(/"/g,'')+'"]');
/* "select all" / "none" for one section box — live: saved at once; dialog: only ticks (its Save button stores) */
function mvSecPick(btn,on,local){
  const box=btn.closest(".mv-box"); if(!box) return;
  const ids=String(box.dataset.ids||"").split(",").filter(Boolean);
  ids.forEach(id=>{ const c=mvBox(box,id); if(c) c.checked=on; });
  if(!local){ DB.settings.menus=DB.settings.menus||{}; ids.forEach(id=>{ if(on) delete DB.settings.menus[id]; else DB.settings.menus[id]=true; }); Store.save(); renderSidebar(); }
  mvSync(); }
/* keep each box's n/total in step with its tiles */
function mvSync(){
  document.querySelectorAll(".mv-box").forEach(box=>{
    const all=box.querySelectorAll(".mv-tile input"), on=[].filter.call(all,c=>c.checked).length;
    const n=box.querySelector(".mv-n"); if(n) n.textContent=on+"/"+all.length;
    box.classList.toggle("mv-none",on===0); });
}

/* ═══ real PDF files (instead of the print dialog) ═══
   makePdf(html, fileName): renders a full HTML document (the same one the Print buttons use) in an off-screen
   frame — so its styles never touch the app — and downloads it as an A4 PDF (portrait, or landscape when the
   document asks for "@page{size:A4 landscape}"). Library: html2pdf.js (jsPDF + html2canvas), loaded on first use.
   If it can't load (offline), the print dialog opens instead — choose "Save as PDF" there. */
let _pdfLib=null;
function loadPdfLib(){
  if(window.html2pdf) return Promise.resolve(window.html2pdf);
  if(_pdfLib) return _pdfLib;
  _pdfLib=new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
    s.onload=()=>window.html2pdf?res(window.html2pdf):rej(new Error("html2pdf missing")); s.onerror=()=>{ _pdfLib=null; rej(new Error("load failed")); };
    document.head.appendChild(s); });
  return _pdfLib;
}
async function makePdf(html,fileName){
  const th=lang==="th", name=String(fileName||"document.pdf").replace(/[\\/:*?"<>|]+/g,"_");
  const land=/@page\s*\{[^}]*landscape/i.test(html);
  toast(th?"กำลังสร้างไฟล์ PDF…":"Creating PDF…","ok");
  let lib; try{ lib=await loadPdfLib(); }
  catch(e){ toast(th?"สร้าง PDF ไม่ได้ (ต้องต่ออินเทอร์เน็ต) — เปิดหน้าพิมพ์แทน เลือก “บันทึกเป็น PDF”":"Can't create a PDF offline — opening print; choose “Save as PDF”","warn"); printDoc(html); return; }
  const fr=document.createElement("iframe");
  fr.style.cssText="position:fixed;left:-10000px;top:0;border:0;background:#fff;width:"+(land?1123:794)+"px;height:1200px";
  document.body.appendChild(fr);
  try{
    await new Promise(r=>{ fr.onload=r; fr.srcdoc=html; });
    try{ if(fr.contentDocument.fonts&&fr.contentDocument.fonts.ready) await fr.contentDocument.fonts.ready; }catch(e){}
    await new Promise(r=>setTimeout(r,150));                        // let images / QR codes paint
    const body=fr.contentDocument.body;
    await lib().set({margin:[8,8,8,8],filename:name,image:{type:"jpeg",quality:0.95},
      html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",windowWidth:land?1123:794},
      jsPDF:{unit:"mm",format:"a4",orientation:land?"landscape":"portrait"},
      pagebreak:{mode:["css","legacy"],avoid:["tr",".nobreak"]}}).from(body).save();
    toast(th?"ดาวน์โหลด PDF แล้ว":"PDF downloaded","ok");
  }catch(e){ console.warn("pdf failed",e); toast(th?"สร้าง PDF ไม่สำเร็จ — เปิดหน้าพิมพ์แทน":"PDF failed — opening print instead","err"); printDoc(html); }
  finally{ setTimeout(()=>{ if(fr.parentNode) fr.parentNode.removeChild(fr); },500); }
}
window.makePdf=makePdf;

function locOccupancy(loc){ return (DB.stock||[]).filter(s=>s.loc===loc).reduce((a,s)=>a+(parseInt(s.qty,10)||0),0); }
function capacityCheck(loc,add){ const l=(DB.locationMaster||[]).find(x=>x.code===loc); const cap=parseFloat(l&&l.capacity)||0;
  if(cap<=0) return {ok:true,cap:0}; const occ=locOccupancy(loc); const after=occ+add;
  return {ok:after<=cap, cap, occ, add, after, over:after-cap}; }
function capWarn(loc,add){ const c=capacityCheck(loc,add); if(c.ok) return true;
  return confirm(t("capExceedMsg").replace("%loc",loc).replace("%cap",num(c.cap)).replace("%occ",num(c.occ)).replace("%add",num(add)).replace("%after",num(c.after))); }
function capWarnMulti(adds){ const byLoc={}; adds.forEach(a=>{ if(a.loc)byLoc[a.loc]=(byLoc[a.loc]||0)+(parseFloat(a.qty)||0); });
  const overs=[]; Object.keys(byLoc).forEach(loc=>{ const c=capacityCheck(loc,byLoc[loc]); if(!c.ok) overs.push({loc,cap:c.cap,after:c.after}); });
  if(!overs.length) return true;
  return confirm(t("capExceedHead")+"\n"+overs.map(o=>"• "+o.loc+": "+t("capacityF")+" "+num(o.cap)+" → "+num(o.after)).join("\n")+"\n\n"+t("continueQ")); }
function putawayReason(k){ return t({consolidate:"rsConsolidate",zone:"rsZone",empty:"rsEmpty"}[k]||k); }
function suggestPutaway(code){
  const it=DB.itemMaster.find(i=>i.code===code)||{};
  return (DB.locationMaster||[]).filter(l=>!isNG(l.code)).map(l=>{
    const occ=locOccupancy(l.code); const cap=parseFloat(l.capacity)||0; const free=cap>0?(cap-occ):Infinity;
    const hasItem=(DB.stock||[]).some(s=>s.code===code&&s.loc===l.code&&(parseInt(s.qty,10)||0)>0);
    const catMatch=l.cat&&it.cat&&(l.cat===it.cat);
    let score=0; const reasons=[];
    if(hasItem&&free>0){ score+=100; reasons.push("consolidate"); }
    if(catMatch){ score+=50; reasons.push("zone"); }
    if(occ===0){ score+=20; reasons.push("empty"); }
    score += Math.max(0,10-occ/100);
    return {loc:l.code,cap,occ,free,score,reasons,full:(cap>0&&free<=0)};
  }).filter(c=>!c.full).sort((a,b)=>b.score-a.score);
}

function regCalcExp(){ // auto EXP = MFD + item shelfLifeDays (if configured & EXP empty)
  const code=(val("regCode")||"").trim(); const it=DB.itemMaster.find(i=>i.code===code)||{};
  const sl=parseInt(it.shelfLifeDays,10)||0; const mfd=val("regMfd"); const expEl=document.getElementById("regExp");

/* lot-aware receive: split stock rows by lot when any FIFO column is on; else merge by code+loc (legacy) */
function receiveStock(code,loc,qty,lot){ lot=lot||{};
  const hasLot = !!(lot.lotSup||lot.lotNo||lot.mfd||lot.exp||lot.sn);      // a lot that exists stays a lot (moves / cancels put it back where it was)
  if(!hasLot){ if(qty>0){ const r=plainStockRow(code,loc); r.qty=(parseInt(r.qty,10)||0)+qty; } else adjustStockAt(code,loc,qty); return; }
  const eq=(a,b)=>(a||"")===(b||"");
  let s=DB.stock.find(x=>x.code===code&&x.loc===loc&&eq(x.lotSup,lot.lotSup)&&eq(x.lotNo,lot.lotNo)&&eq(x.mfd,lot.mfd)&&eq(x.exp,lot.exp)&&eq(x.sn,lot.sn));
  if(s){ s.qty=(parseInt(s.qty,10)||0)+qty; }
  else DB.stock.push({code,loc,qty,lotSup:lot.lotSup||"",lotNo:lot.lotNo||"",mfd:lot.mfd||"",exp:lot.exp||"",sn:lot.sn||"",cost:(lot.cost!=null?lot.cost:0)}); }

/* other items already stored at a location (not counting the ones being moved there) */
function mixedAt(loc,codes){
  const mine={}; (codes||[]).forEach(c=>{ mine[c]=1; });
  const other={}; (DB.stock||[]).forEach(s=>{ const q=parseInt(s.qty)||0; if(s.loc===loc&&q>0&&!mine[s.code]) other[s.code]=(other[s.code]||0)+q; });
  return Object.keys(other).map(c=>({code:c,qty:other[c]}));
}
/* moving into a location that holds a different item: confirm first (mixed storage) — true = go ahead */
function mixWarn(loc,codes){
  const o=mixedAt(loc,codes); if(!o.length) return true;
  const th=lang==="th", nm=c=>{ const m=DB.itemMaster.find(i=>i.code===c); return c+(m&&m.name&&m.name!==c?" "+m.name:""); };
  const list=o.slice(0,5).map(x=>"• "+nm(x.code)+" ("+num(x.qty)+")").join("\n")+(o.length>5?"\n• … +"+(o.length-5):"");
  return confirm(th?("ตำแหน่ง "+loc+" มีสินค้าอื่นจัดเก็บอยู่แล้ว:\n"+list+"\n\nยืนยันจะวางสินค้าปนกันในตำแหน่งนี้ใช่ไหม?")
                   :("Location "+loc+" already holds other items:\n"+list+"\n\nStore mixed items at this location?"));
}
function doMove(){

  const qty=wholeQ(document.getElementById("mvQty").value);
  if(!code){ toast(t("selectItem"),"err"); return; }
  if(from===to){ toast(t("sameLoc"),"err"); return; }
  if(qty<=0){ toast(qty<0?(lang==="th"?"ใส่จำนวนเต็มที่มากกว่า 0":"Enter a whole number above 0"):t("tNoData"),"warn"); return; }
  if(stockAt(code,from)<qty){ toast(t("tNoStock"),"err"); return; }
  const m=DB.itemMaster.find(i=>i.code===code)||{name:code};
  // E: transfer = Outbound from source + Inbound at destination (keeps C = A - B per location)
  if(!capWarn(to,qty)) return;
  if(!mixWarn(to,[code])) return;                                  // a different item is already there
  const mv=moveStock(code,from,to,qty);                            // lots travel with the quantity
  const ref="TRANSFER";
  pushMovePairs({ id:nextTxnId(), type:"OUT", date:today(), time:nowTime(), code, name:m.name, loc:from, qty,
    orderNo:ref, dept:"", note:`${t("changeLoc")} → ${to}`, status:"Done" },

    orderNo:ref, dept:"", note:`${t("changeLoc")} ← ${from}`, pkg:m.unit||"", pkgQty:qty, unitQty:m.unit||"", status:"Stored" },mv);
  Store.save(); toast(t("tMoved"),"ok"); route("stock-bal");
}

    const stockLocs=uniq(DB.stock.filter(s=>s.code===code&&!isNG(s.loc)&&(parseInt(s.qty,10)||0)>0).map(s=>s.loc));

function doQc(dir){
  const code=document.getElementById(dir==="in"?"qiCode":"qoCode").value.trim();
  const loc=document.getElementById(dir==="in"?"qiLoc":"qoLoc").value;
  const qty=wholeQ(document.getElementById(dir==="in"?"qiQty":"qoQty").value);
  if(!code){ toast(t("selectItem"),"err"); return; }
  if(!loc){ toast(t("location")+" ?","warn"); return; }
  if(qty<=0){ toast(qty<0?(lang==="th"?"ใส่จำนวนเต็มที่มากกว่า 0":"Enter a whole number above 0"):t("tNoData"),"warn"); return; }
  const def=DB.itemMaster.find(i=>i.code===code)||{name:code};
  const unit=(document.getElementById(dir==="in"?"qiUnit":"qoUnit")||{}).value||"";
  if(dir==="in"){
    const reason=String((document.getElementById("qiReason")||{}).value||"").trim();
    if(isNG(loc)){                       // chose an NG location -> log defective directly into it
      adjustStockAt(code,loc,qty);
      hpush({id:nextTxnId(),type:"NGIN",date:today(),time:nowTime(),code,name:def.name,loc,qty,unitQty:unit,pkg:unit,note:reason,orderNo:reason?("NG:"+reason):"",status:"NG"});
    } else {                             // chose a normal stock location -> move that stock into NG hold
      if(stockAt(code,loc)<qty){ toast(t("tNoStock"),"err"); return; }
      const ngDest=ngLocList()[0]||"NG";
      const qm=moveStock(code,loc,ngDest,qty);
      pushMovePairs({id:nextTxnId(),type:"OUT",date:today(),time:nowTime(),code,name:def.name,loc,qty,unitQty:unit,pkg:unit,orderNo:"QC-NG",note:"→ "+ngDest,status:"Done"},
        {id:nextTxnId(),type:"NGIN",date:today(),time:nowTime(),code,name:def.name,loc:ngDest,qty,unitQty:unit,pkg:unit,note:reason,orderNo:reason?("NG:"+reason):"",status:"NG"},qm);
    }
    ngReasonRemember(reason);                                       // a new reason typed here joins the NG Master
    Store.save(); toast(t("tReceived"),"ok");
  } else { if(stockAt(code,loc)<qty){ toast(t("tNoStock"),"err"); return; }
    const {consumed}=issueFIFO(code,loc,qty);                          // FIFO, one history row per lot used
    consumed.filter(c=>c.qty>0).forEach(c=>hpush({id:nextTxnId(),type:"NGOUT",date:today(),time:nowTime(),code,name:def.name,loc,qty:c.qty,unitQty:unit,pkg:unit,
      lotSup:c.lotSup,lotNo:c.lotNo,mfd:c.mfd,exp:c.exp,sn:c.sn,status:"Done"}));
    Store.save(); toast(t("tIssued"),"ok"); }
  route("qc");
}

function downscaleImg(dataURI, maxPx, q){ return new Promise(function(res){
  var fin=false; function done(v){ if(fin)return; fin=true; res(v); }
  try{ if(!dataURI || String(dataURI).slice(0,5)!=="data:"){ done(dataURI); return; }
    var to=setTimeout(function(){ done(dataURI); }, 5000);
    const img=new Image();
    img.onload=function(){ clearTimeout(to); try{ let w=img.width,h=img.height; const s=Math.min(1,(maxPx||1000)/Math.max(w,h));
      const nw=Math.max(1,Math.round(w*s)), nh=Math.max(1,Math.round(h*s));
      const c=document.createElement("canvas"); c.width=nw; c.height=nh;
      c.getContext("2d").drawImage(img,0,0,nw,nh);
      done(c.toDataURL("image/jpeg", q||0.8)); }catch(e){ done(dataURI); } };
    img.onerror=function(){ clearTimeout(to); done(dataURI); };
    img.src=dataURI;
  }catch(e){ done(dataURI); }
}); }
function pickItemImage(inp){ const f=inp.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=async e=>{ const small=await downscaleImg(e.target.result,1000,0.8); window._imgDraft=small;
    const p=document.getElementById("mf_imgprev"); if(p)p.innerHTML=`<img src="${small}">`; };
  rd.readAsDataURL(f); }

function decodeCSVText(buf){
  const bytes=new Uint8Array(buf);
  let utf8=""; try{ utf8=new TextDecoder("utf-8",{fatal:false}).decode(bytes); }catch(e){ utf8=""; }
  if(utf8 && utf8.indexOf("\uFFFD")<0) return utf8.replace(/^\uFEFF/,"");   // clean UTF-8
  try{ const t874=new TextDecoder("windows-874",{fatal:false}).decode(bytes); if(t874) return t874.replace(/^\uFEFF/,""); }catch(e){}  // Thai ANSI (Excel)
  return (utf8||"").replace(/^\uFEFF/,"");
}
/* checks + normalises one imported user row; returns a problem text, or "" when it can be added */
function userImportProblem(rec){
  const th=lang==="th";
  rec.username=String(rec.username||"").trim();
  const ok=["Admin","Manager","Worker"].concat(isSuper()?["Super Admin"]:[]);
  if(!rec.position) rec.position="Worker";
  if(ok.indexOf(rec.position)<0) return (th?"ตำแหน่งไม่ถูกต้อง/ไม่มีสิทธิ์ตั้ง: ":"position not allowed: ")+rec.position;
  if(rec.position==="Super Admin") rec.company="*";
  else if(!isSuper()||!META.companies.some(c=>c.id===rec.company)) rec.company=session.company;   // Admins import into their own company only
  if(CONFIG.USE_BACKEND){
    if(!rec.password||String(rec.password).length<8) return th?"รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร":"password must be at least 8 characters";
    if(rec.pin&&!/^\d{4,6}$/.test(rec.pin)) return th?"PIN ต้องเป็นตัวเลข 4–6 หลัก":"PIN must be 4–6 digits";
    if(!rec.pin) delete rec.pin;
  }
  return "";
}
function importMaster(mkey,inp){
  const file=inp.files[0]; if(!file)return; const M=MASTERS[mkey]; const th=(lang==="th");
  if(!isMgrUp()||(mkey==="user"&&!isAdmin())){ toast(t("adminOnly"),"err"); inp.value=""; return; }
  const reader=new FileReader();
  reader.onload=async ()=>{
    inp.value="";
    try{
      const text=decodeCSVText(reader.result);
      const rows=parseCSV(text);
      if(rows.length<2){ toast(t("tNoData"),"warn"); return; }
      const head=rows[0].map(h=>h.trim().replace(/^\uFEFF/,""));
      if(M.keyField && head.indexOf(M.keyField)<0){
        toast((th?"ไม่พบคอลัมน์ที่ต้องมี \"":"Missing required column \"")+M.keyField+"\" — "+(th?"หัวตาราง: ":"headers: ")+head.join(", "),"err"); return;
      }
      let added=0,dup=0; const errs=[]; const seen={};
      for(let r=1;r<rows.length;r++){
        const raw=rows[r];
        if(raw.length===1 && String(raw[0]).trim()==="") continue;                       // blank line
        const rec={}; const allowed=M.fields.map(f=>f.k);
        head.forEach((h,c)=>{ if(allowed.indexOf(h)>=0) rec[h]=(raw[c]||"").trim(); });   // unknown columns (qty, loc, …) are ignored — they would corrupt the master
        if(mkey==="item") delete rec.img;                                   // images are uploaded in the form, never taken from a file
        if(mkey==="user"){                                                  // the same rules as the user form
          const bad=userImportProblem(rec);
          if(bad){ errs.push({row:r+1,msg:bad}); continue; }
        }
        if(raw.length!==head.length) errs.push({row:r+1,msg:(th?"จำนวนคอลัมน์ไม่ตรง (มี ":"column count ")+raw.length+(th?" ควรมี ":" expected ")+head.length+")"});
        M.fields.forEach(f=>{ if(f.num){ const v=rec[f.k];
          if(v!==""&&v!==undefined&&isNaN(parseFloat(v))) errs.push({row:r+1,msg:(th?"ตัวเลขไม่ถูกต้อง คอลัมน์ ":"bad number in ")+f.k+"=\""+v+"\""});
          rec[f.k]=parseFloat(String(v).replace(/,/g,""))||0; } });   // Excel thousands separators
        if(M.keyField){
          const kv=String(rec[M.keyField]||"").trim();
          if(!kv){ errs.push({row:r+1,msg:(th?"ไม่มีค่า ":"empty ")+M.keyField}); continue; }
          const nk=mkey==="user"?kv.toLowerCase():kv;                       // usernames are case-insensitive at sign-in
          if(seen[nk] || DB[M.key].some(x=>(mkey==="user"?String(x[M.keyField]).toLowerCase():String(x[M.keyField]))===nk)){ dup++; continue; }
          seen[nk]=1;
        }
        if(mkey==="item"){ if(!rec.name) rec.name=rec.code; if(!rec.unit) rec.unit="pcs"; }   // a file without these columns must not break lookups
        DB[M.key].push(rec); added++;
      }
      let ok=true;
      if(CONFIG.USE_BACKEND){ Store._dirty=true; clearTimeout(Store._t); ok=await Store._saveBatch(); if(ok)Store._dirty=false; }
      else { Store.save(); }
      route(current);
      if(!ok){
        toast((th?"เพิ่มในเครื่องแล้ว ("+added+") แต่บันทึกขึ้นเซิร์ฟเวอร์ไม่สำเร็จ":"Added "+added+" locally but server save failed")+(Store._lastErr?(" · "+Store._lastErr):""),"err");
      } else if(errs.length){
        const preview=errs.slice(0,8).map(e=>(th?"แถว ":"row ")+e.row+": "+e.msg).join("\n");
        alert((th?"นำเข้าสำเร็จ ":"Imported ")+added+(th?" รายการ · ข้ามซ้ำ ":" · dup ")+dup+"\n\n"+(th?"พบปัญหารูปแบบ ":"format issues: ")+errs.length+":\n"+preview+(errs.length>8?("\n… +"+(errs.length-8)+(th?" รายการ":"")):""));
      } else {

  };
  reader.readAsArrayBuffer(file);
}

/* =====================================================================
   PURCHASE ORDERS (supplier) & SALES ORDERS + INVOICE (customer)
   Saving an order also creates its Schedule:
     PO -> Schedule type "PO" (receiving)      SO -> Schedule type "SO" (picking)
   ===================================================================== */
function poList(){ if(!Array.isArray(DB.purchaseOrders)) DB.purchaseOrders=[]; return DB.purchaseOrders; }
function soList(){ if(!Array.isArray(DB.salesOrders)) DB.salesOrders=[]; return DB.salesOrders; }
function docNo(prefix,list){                       // PO-202609-0001
  const ym=today().slice(0,7).replace("-","");
  const pre=prefix+"-"+ym+"-";
  let n=0; list.forEach(x=>{ const s=String(x.no||""); if(s.indexOf(pre)===0){ const v=parseInt(s.slice(pre.length),10)||0; if(v>n)n=v; } });
  return pre+String(n+1).padStart(4,"0");
}
function ordLineAmt(l){ const q=parseFloat(l.qty)||0, p=parseFloat(l.price)||0, d=parseFloat(l.disc)||0; return Math.max(0,q*p-d); }
function ordTotals(o){
  const sub=(o.lines||[]).reduce((a,l)=>a+ordLineAmt(l),0);
  const vatRate=parseFloat(o.vat)||0;
  const vat=Math.round(sub*vatRate)/100;
  return {sub, vat, net:sub+vat};
}
function ordStatusPill(st){ const m={Draft:"",Ordered:"MOVE",Confirmed:"MOVE",Received:"IN",Delivered:"IN",Cancelled:"NGIN"};
  return `<span class="tag ${m[st]||""}">${esc(st||"Draft")}</span>`; }
/* progress of the linked schedule (how much has been received / picked) */
function ordProgress(o){
  const s=(DB.schedule||[]).find(x=>x.id===o.scheduleId); if(!s) return null;
  const plan=(s.lines||[]).reduce((a,l)=>a+(parseFloat(l.qty)||0),0);
  const done=(s.lines||[]).reduce((a,l)=>a+(parseFloat(l.done)||0),0);
  return {plan, done, pct: plan?Math.round(done/plan*100):0, sched:s};
}

/* create (or refresh) the Schedule this order feeds */
function ordSyncSchedule(o,kind){
  const isPO=kind==="po";
  let s=(DB.schedule||[]).find(x=>x.id===o.scheduleId);
  const match=ordMatchLines(s,o.lines);                              // same position first, then the first unused line of that code
  const lines=o.lines.map((l,i)=>{ const old=match[i];
    return {code:l.code,name:l.name,qty:parseFloat(l.qty)||0,done:old?(parseFloat(old.done)||0):0,unit:l.unit||"pcs",lot:"",price:parseFloat(l.price)||0}; });
  if(!s){
    s={ id:uidNum(DB.schedule), type:isPO?"PO":"SO", ref:o.no, supplier:o.supplier||"", customer:o.customer||"",
        due:o.due||today(), dept:"", status:"Planned", lines, invoices:[], srcKind:kind, srcId:o.id };
    DB.schedule.push(s); o.scheduleId=s.id;
  } else {
    s.ref=o.no; s.supplier=o.supplier||""; s.customer=o.customer||""; s.due=o.due||today(); s.lines=lines;
    if(s.status!=="Cancelled"&&!s.manualDone) s.status=schedDone(s)>=schedQty(s)&&schedQty(s)>0?"Done":(schedDone(s)>0?"Pending":"Planned");
  }
  return s;
}
/* old schedule line for each new order line (or null) */
function ordMatchLines(s,newLines){
  const old=s?(s.lines||[]):[], used=new Set();
  const out=newLines.map((l,i)=>{ if(old[i]&&old[i].code===l.code){ used.add(i); return old[i]; } return null; });
  newLines.forEach((l,i)=>{ if(out[i]) return; let j=-1;
    old.forEach((x,k)=>{ if(!used.has(k)&&x.code===l.code&&(j<0||(parseFloat(x.done)||0)>(parseFloat(old[j].done)||0))) j=k; });
    if(j>=0){ used.add(j); out[i]=old[j]; } });
  old.forEach((x,k)=>{ if(used.has(k)||!((parseFloat(x.done)||0)>0)) return;          // a moved line left over: take the place of a same-code line with less progress
    let bi=-1; out.forEach((o,i)=>{ if(o&&o.code===x.code&&(parseFloat(o.done)||0)<(parseFloat(x.done)||0)&&(bi<0||(parseFloat(o.done)||0)<(parseFloat(out[bi].done)||0))) bi=i; });
    if(bi>=0){ used.delete(old.indexOf(out[bi])); used.add(k); out[bi]=x; } });
  out.unused=old.filter((x,k)=>!used.has(k));
  return out; }
function ordDelete(kind,id){
  if(!isMgrUp()){ toast(lang==="th"?"เฉพาะผู้จัดการขึ้นไป":"Manager or above only","err"); return; }
  if(!confirm(t("confirmDelete")))return;
  const list=kind==="po"?poList():soList(), i=list.findIndex(x=>x.id===id); if(i<0)return;
  const o=list[i];
  const si=(DB.schedule||[]).findIndex(x=>x.id===o.scheduleId);
  if(si>=0){ const sc=DB.schedule[si];
    const started=(sc.lines||[]).some(l=>(parseFloat(l.done)||0)>0);
    if(started){ toast(lang==="th"?"ลบไม่ได้ — มีการรับ/จ่ายไปแล้ว":"Cannot delete — the schedule already has movements","err"); return; }
    DB.schedule.splice(si,1);
  }
  list.splice(i,1); Store.save(); toast(t("tDeleted"),"ok"); route(kind);
}

function mvReadFile(inp){
  const file=inp.files[0]; if(!file) return; const th=lang==="th";
  const reader=new FileReader();
  reader.onload=()=>{
    inp.value="";
    try{
      const rows=parseCSV(decodeCSVText(reader.result));
      if(rows.length<2){ toast(t("tNoData"),"warn"); return; }
      const head=rows[0].map(h=>h.trim().replace(/^﻿/,"").toLowerCase());
      const need=["code","qty","loc"];
      const missing=need.filter(c=>head.indexOf(c)<0);
      if(missing.length){ toast((th?"ไม่พบคอลัมน์: ":"Missing columns: ")+missing.join(", "),"err"); return; }
      const sim={};                                   // running balance so several rows on one location are checked together
      const bal=(code,loc)=>{ const k=code+"@@"+loc; if(sim[k]==null) sim[k]=stockAtTotal(code,loc); return sim[k]; };
      const out=[];
      for(let r=1;r<rows.length;r++){
        const raw=rows[r]; if(raw.length===1 && String(raw[0]).trim()==="") continue;
        const rec={}; head.forEach((h,c)=>rec[h]=(raw[c]||"").trim());
        const line={n:r, type:(rec.type||window._mvKind).toUpperCase(), code:rec.code, qty:wholeQ(rec.qty),
          loc:rec.loc, date:csvDate(rec.date)===""?today():csvDate(rec.date), time:rec.time||nowTime(), orderNo:rec.orderno||rec.orderNo||"",
          lotNo:rec.lotno||"", lotSup:rec.lotsup||"", mfd:csvDate(rec.mfd), exp:csvDate(rec.exp), sn:rec.sn||"", note:rec.note||"", err:""};
        const it=findItem(line.code);
        if(!it) line.err=th?"ไม่พบรหัสสินค้า":"unknown item code";
        else if(line.type!=="IN" && line.type!=="OUT") line.err=th?"type ต้องเป็น IN หรือ OUT":"type must be IN or OUT";
        else if(line.qty<=0) line.err=th?"จำนวนต้องเป็นจำนวนเต็มที่มากกว่า 0":"qty must be a whole number above 0";
        else if(line.date===null) line.err=(th?"วันที่ไม่ถูกต้อง: ":"invalid date: ")+rec.date;
        else if(line.date>today()) line.err=th?"วันที่อยู่ในอนาคต":"date is in the future";
        else if(line.mfd===null||line.exp===null) line.err=th?"วันที่ MFD/EXP ไม่ถูกต้อง":"invalid MFD/EXP date";
        else if(rec.time&&!/^\d{1,2}:\d{2}(:\d{2})?$/.test(rec.time)) line.err=(th?"เวลาไม่ถูกต้อง: ":"invalid time: ")+rec.time;
        else if(!line.loc) line.err=th?"ไม่ได้ระบุตำแหน่ง":"location missing";
        else if(!locList().includes(line.loc)) line.err=th?"ไม่พบตำแหน่งนี้":"unknown location";
        else if(line.type==="OUT" && bal(line.code,line.loc)<line.qty) line.err=(th?"สต๊อกไม่พอ (คงเหลือ ":"not enough stock (on hand ")+num(bal(line.code,line.loc))+")";
        if(!line.err){ line.name=it.name; line.unit=it.unit||"";
          sim[line.code+"@@"+line.loc]=bal(line.code,line.loc)+(line.type==="IN"?line.qty:-line.qty); }
        out.push(line);
      }
      window._mvImport=out;
      renderMvPreview();
    }catch(e){ toast((th?"อ่านไฟล์ไม่สำเร็จ: ":"Import error: ")+((e&&e.message)||e),"err"); }
  };
  reader.readAsArrayBuffer(file);
}
/* a date from a CSV cell -> "YYYY-MM-DD", or null when it isn't a real date. "" -> "" */
function csvDate(v){ v=String(v||"").trim(); if(!v) return ""; let y,m,d,x;
  if((x=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))){ y=+x[1]; m=+x[2]; d=+x[3]; }
  else if((x=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))){ d=+x[1]; m=+x[2]; y=+x[3]; }
  else return null;
  if(y>2400) y-=543;                                                  // พ.ศ.
  const dt=new Date(Date.UTC(y,m-1,d)); if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d) return null;
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }

function applyMoveImport(){
  if(!isMgrUp()) return;
  const th=lang==="th", list=(window._mvImport||[]).filter(l=>!l.err);
  if(!list.length) return;
  let inN=0,outN=0;
  list.forEach(l=>{
    if(l.type==="IN"){
      receiveStock(l.code,l.loc,l.qty,{lotNo:l.lotNo,lotSup:l.lotSup,mfd:l.mfd,exp:l.exp,sn:l.sn});
      hpush({id:nextTxnId(),type:"IN",date:l.date,time:l.time,code:l.code,name:l.name,qty:l.qty,unit:l.unit,
        loc:l.loc,orderNo:l.orderNo,lotNo:l.lotNo,lotSup:l.lotSup,mfd:l.mfd,exp:l.exp,sn:l.sn,
        note:(l.note||"")+" [CSV]",status:"Stored"});
      inN++;
    } else {
      const res=issueFIFO(l.code,l.loc,l.qty);           // consume across lots like a normal issue (never leaves a negative row)
      const parts=(res.consumed&&res.consumed.length)?res.consumed:[{qty:l.qty,lotNo:l.lotNo,lotSup:l.lotSup,mfd:l.mfd,exp:l.exp,sn:l.sn}];
      parts.forEach(c=>hpush({id:nextTxnId(),type:"OUT",date:l.date,time:l.time,code:l.code,name:l.name,qty:c.qty,unit:l.unit,
        loc:l.loc,orderNo:l.orderNo,lotNo:c.lotNo||"",lotSup:c.lotSup||"",mfd:c.mfd||"",exp:c.exp||"",sn:c.sn||"",
        note:(l.note||"")+" [CSV]",status:"Done"}));
      outN++;
    }
  });
  Store.save(); closeModal();
  toast((th?"นำเข้าแล้ว: รับเข้า ":"Imported: in ")+num(inN)+(th?" · จ่ายออก ":" · out ")+num(outN),"ok");
  window._mvImport=null; route(current);
}

function saveSchedule(id){
  if(!isMgrUp()){ toast(lang==="th"?"เฉพาะผู้จัดการขึ้นไป":"Manager or above only","err"); return; }
  const d=window._schedDraft;
  const rec={ id:id||uidNum(DB.schedule), type:document.getElementById("scType").value,
    ref:document.getElementById("scRef").value.trim(), supplier:document.getElementById("scSup").value.trim(),
    customer:(document.getElementById("scCust")||{}).value? document.getElementById("scCust").value.trim():"",
    due:document.getElementById("scDue").value, dept:document.getElementById("scDept").value.trim(),
    status:"Planned", lines:d.lines.filter(l=>l.code||l.name), invoices:d.invoices||[] };
  if(!rec.lines.length){ toast(t("lines")+" ?", "warn"); return; }
  if(rec.lines.some(l=>wholeQ(l.qty)<0)){ toast(lang==="th"?"จำนวนต้องเป็นจำนวนเต็ม":"Quantities must be whole numbers","err"); return; }
  if(id){ const ex=DB.schedule.find(s=>s.id===id);
    if(ex){ const moved=(ex.lines||[]).some(l=>(parseFloat(l.done)||0)>0);
      if(moved&&rec.type!==ex.type){ toast(lang==="th"?"เปลี่ยนประเภทไม่ได้ — มีการรับ/จ่ายแล้ว":"Can't change the type — goods already moved","err"); return; }
      const m=ordMatchLines(ex,rec.lines);                           // progress stays on its line; moved lines can't vanish or shrink below what moved
      rec.lines=rec.lines.map((l,i)=>Object.assign({},l,{done:m[i]?(parseFloat(m[i].done)||0):0}));
      const lost=m.unused.filter(x=>(parseFloat(x.done)||0)>0), short=rec.lines.filter(l=>(parseFloat(l.qty)||0)<(parseFloat(l.done)||0));
      if(lost.length||short.length){ toast((lang==="th"?"แก้ไม่ได้ — มีรายการที่รับ/จ่ายไปแล้ว: ":"Can't save — already moved: ")+lost.concat(short).map(x=>x.code).join(", "),"err"); return; }
      const st0=ex.status;
      Object.assign(ex,rec,{invoices:ex.invoices||rec.invoices});     // keeps srcKind / srcId and anything else on the record
      if(st0==="Cancelled") ex.status="Cancelled";                    // editing never brings a cancelled schedule back
      else if(ex.manualDone) ex.status="Done";                        // nor undoes "Mark done"
      else ex.status=schedDone(ex)>=schedQty(ex)&&schedQty(ex)>0?"Done":(schedDone(ex)>0?"Pending":"Planned"); } }
  else DB.schedule.push(rec);
  Store.save(); closeModal(); toast(t("tSaved"),"ok"); route("schedule");
}

function schedLineAction(id,idx){
  const s=DB.schedule.find(x=>x.id===id); if(!s)return; const l=s.lines[idx];

      ${field("qty",`<input class="inp num" id="laQty" type="number" value="${rem}" max="${rem}">`,true)}
      ${field("location",`<select class="inp" id="laLoc">${selOpts(inMode?locList().filter(c=>!isNG(c)):locStockList(l.code), inMode?"":"")}</select>`,true)}
      ${(inMode&&lotOn)?field("lotNoCol",`<input class="inp" id="laLot" value="${esc(l.lot||today())}">`):""}
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal2()">${t("cancel")}</button>
     <button class="btn btn-primary" onclick="applySchedLine(${jsn(id)},${idx})">${IC.check}${t("confirm")}</button>`);

function locStockList(code){ const ls=DB.stock.filter(s=>s.code===code&&!isNG(s.loc)&&(parseInt(s.qty,10)||0)>0).map(s=>s.loc);
  return ls.length?uniq(ls):locList().filter(c=>!isNG(c)); }
function applySchedLine(id,idx){
  const s=DB.schedule.find(x=>x.id===id); const l=s.lines[idx]; const inMode=schedIsIn(s.type);
  const qty=wholeQ(document.getElementById("laQty").value); const loc=document.getElementById("laLoc").value;
  const lotEl=document.getElementById("laLot"); const lot=lotEl?lotEl.value:"";
  if(qty<=0){ toast(qty<0?(lang==="th"?"ใส่จำนวนเต็มที่มากกว่า 0":"Enter a whole number above 0"):t("qty")+" ?","warn"); return; }
  if(!loc){ toast(t("location")+" ?","warn"); return; }
  const rem=(parseFloat(l.qty)||0)-(parseFloat(l.done)||0);
  if(qty>rem&&!confirm((lang==="th"?"จำนวนเกินที่ค้าง ("+num(rem)+") ดำเนินการต่อ?":"More than remaining ("+num(rem)+"). Continue?"))) return;
  if(!inMode&&stockAt(l.code,loc)<qty){ toast(t("tNoStock")+": "+l.code+" @ "+loc+" ("+num(stockAt(l.code,loc))+")","err"); return; }
  ensureItem(l.code,{name:l.name,unit:l.unit});
  if(inMode){ receiveStock(l.code,loc,qty,{lotNo:lot});
    hpush({id:nextTxnId(),type:"IN",date:today(),time:nowTime(),code:l.code,name:l.name,loc,qty,
      orderNo:s.ref,lotNo:lot,supplier:s.supplier||"",dept:s.dept||"",pkg:l.unit||"",pkgQty:qty,unitQty:l.unit||"",status:"Stored",schedId:s.id,schedLineCode:l.code,schedLineIdx:idx});
  } else {                                                           // FIFO, one history row per lot used
    const {consumed,remain}=issueFIFO(l.code,loc,qty);
    const base={type:"OUT",date:today(),time:nowTime(),code:l.code,name:l.name,loc,orderNo:s.ref,dept:s.dept||"",status:"Done",schedId:s.id,schedLineCode:l.code,schedLineIdx:idx};
    consumed.filter(c=>c.qty>0).forEach(c=>hpush(Object.assign({id:nextTxnId(),qty:c.qty,lotSup:c.lotSup,lotNo:c.lotNo,mfd:c.mfd,exp:c.exp,sn:c.sn,cost:c.cost||0,cogs:(c.cost||0)*c.qty},base)));
    if(remain>0){ const r=plainStockRow(l.code,loc); r.qty=(parseInt(r.qty,10)||0)-remain; hpush(Object.assign({id:nextTxnId(),qty:remain},base)); }
  }
  l.done=(parseFloat(l.done)||0)+qty;
  if(schedDone(s)>=schedQty(s)) s.status="Done"; else if(s.status==="Planned") s.status="Pending";
  Store.save(); closeModal2(); toast(t("tSaved"),"ok"); openSchedule(id);
}

    hpush({id:nextTxnId(),type:"IN",date:date,time:nowTime(),code:l.code,name:l.name,loc,qty,

/* Import schedule from CSV: columns type,ref,supplier,due,dept,code,name,qty,unit (one row per line; grouped by ref) */
function importSchedule(){
  if(!isMgrUp()){ toast(lang==="th"?"เฉพาะผู้จัดการขึ้นไป":"Manager or above only","err"); return; }
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".csv,text/csv";
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=ev=>{ try{ const rows=parseCSV(decodeCSVText(ev.target.result)); if(rows.length<2){toast("CSV ?","warn");return;}
      const head=rows[0].map(h=>h.trim().toLowerCase()); const ix=n=>head.indexOf(n);
      const groups={}, bad=[]; let rowNo=1;
      rows.slice(1).filter(r=>r.length&&r.join("").trim()).forEach(r=>{ rowNo++;
        const ref=(r[ix("ref")]||"").trim()||"IMP-"+String(uidNum(DB.schedule)).slice(-8);
        const tp=((r[ix("type")]||"PO").trim().toUpperCase()); const type=SCH_TYPES.includes(tp)?tp:"PO";
        const key=type+"|"+ref;
        groups[key]=groups[key]||{id:uidNum(DB.schedule.concat(Object.values(groups))),type,ref,supplier:(r[ix("supplier")]||"").trim(),
          customer:(r[ix("customer")]||"").trim(),
          due:csvDate(r[ix("due")])||today(),dept:(r[ix("dept")]||"").trim(),status:"Planned",lines:[],invoices:[]};
        const code=(r[ix("code")]||"").trim(); if(!code)return; const it=findItem(code);
        const q=wholeQ(String(r[ix("qty")]||"").replace(/,/g,""));
        if(!it){ bad.push(rowNo+": "+code+(lang==="th"?" ไม่พบรหัสสินค้า":" unknown item")); return; }
        if(q<=0){ bad.push(rowNo+": "+code+(lang==="th"?" จำนวนไม่ถูกต้อง":" bad qty")); return; }
        if(String(r[ix("due")]||"").trim()&&csvDate(r[ix("due")])===null) bad.push(rowNo+": "+(lang==="th"?"วันที่ไม่ถูกต้อง ใช้วันนี้แทน":"bad date, today used"));
        groups[key].lines.push({code:it.code,name:(r[ix("name")]||(it&&it.name)||"").trim(),
          qty:q,done:0,unit:(r[ix("unit")]||(it&&it.unit)||"pcs").trim(),lot:"",price:parseFloat(r[ix("price")])||0});
      });
      const all=Object.values(groups).filter(g=>g.lines.length);
      const dup=all.filter(g=>DB.schedule.some(s=>s.type===g.type&&s.ref===g.ref)), added=all.filter(g=>dup.indexOf(g)<0);   // same file twice: no copies
      DB.schedule.push(...added);
      Store.save(); toast(added.length+" "+t("importSchedule")+(dup.length?(lang==="th"?" · ข้ามเลขที่ซ้ำ ":" · skipped existing refs ")+dup.map(g=>g.ref).join(", "):""),"ok");
      if(bad.length) setTimeout(()=>toast((lang==="th"?"แถวที่ข้าม/มีปัญหา: ":"Rows skipped / with problems: ")+bad.slice(0,6).join(" | ")+(bad.length>6?" …+"+(bad.length-6):""),"warn"),900);
      route("schedule");
    }catch(err){ toast("CSV error","err"); } };
    rd.readAsArrayBuffer(f); };
  inp.click();
}

/* update the schedule line that a history record came from, by delta */
function syncSchedFromHistory(h, deltaDone){
  if(!deltaDone) return;
  const isIn=(h.type==="IN"||h.type==="NGIN");
  let s=null;
  if(h.schedId!=null) s=DB.schedule.find(x=>x.id===h.schedId);
  else if(h.orderNo&&/ (Receive|Issue)$/.test(h.note||""))           // older mobile rows: only real schedule postings, same direction
    s=DB.schedule.find(x=>x.ref===h.orderNo&&schedIsIn(x.type)===isIn&&(x.lines||[]).some(x2=>x2.code===h.code));
  if(!s) return;                                                     // a manual receipt / pick that only shares the order no.: not the schedule's
  const code=h.schedLineCode||h.code, lines=s.lines||[];
  let left=deltaDone;
  if(h.schedLineIdx!=null&&lines[h.schedLineIdx]&&lines[h.schedLineIdx].code===code){ const l=lines[h.schedLineIdx];
    const nv=Math.max(0,(parseFloat(l.done)||0)+left); left-=nv-(parseFloat(l.done)||0); l.done=nv; }
  lines.filter(l=>l.code===code).forEach(l=>{ if(!left) return;     // older rows (no line index): spread over the lines of that code
    const cur=parseFloat(l.done)||0, nv=left<0?Math.max(0,cur+left):cur+left; left-=nv-cur; l.done=nv; });
  if(s.status!=="Cancelled") s.status = schedDone(s)>=schedQty(s)&&schedQty(s)>0 ? "Done" : (schedDone(s)>0?"Pending":"Planned");
}
function saveHistory(id){ if(!isMgrUp()){ toast(lang==="th"?"เฉพาะผู้จัดการขึ้นไป":"Manager or above only","err"); return; } const h=DB.history.find(x=>x.id===id); if(!h)return;
  const oldQty=parseFloat(h.qty)||0, oldLoc=h.loc;
  const newQty=wholeQ(document.getElementById("hQty").value);
  const newLoc=document.getElementById("hLoc").value.trim();
  if(newQty<=0){ toast((lang==="th"?"ใส่จำนวนเต็มที่มากกว่า 0 (ถ้าจะลบรายการให้กดยกเลิก)":"Enter a whole number above 0 (to remove the record, cancel it)"),"err"); return; }
  if(!newLoc){ toast(t("location")+" ?","warn"); return; }
  if(histLocked(h)) return;
  if(newLoc!==oldLoc&&!locList().includes(newLoc)){ toast(lang==="th"?"ไม่พบตำแหน่งนี้: "+newLoc:"Unknown location: "+newLoc,"err"); return; }
  const sign=(h.type==="IN"||h.type==="NGIN")?1:-1;
  const oldLot={lotSup:h.lotSup,lotNo:h.lotNo,mfd:h.mfd,exp:h.exp,sn:h.sn,cost:h.cost}, newLot=Object.assign({},oldLot);
  if(h.type==="IN"&&anyFifoCol()){ const gv=id2=>{const el=document.getElementById(id2);return el?el.value.trim():undefined;};
    let v; if((v=gv("hLotSup"))!==undefined)newLot.lotSup=v;
    if((v=gv("hMfd"))!==undefined)newLot.mfd=v; if((v=gv("hExp"))!==undefined)newLot.exp=v; if((v=gv("hSn"))!==undefined)newLot.sn=v; }
  if(sign>0&&lotKey(newLot)!==lotKey(oldLot)){                       // re-labelling a receipt's lot: only while all of it is still in that lot
    const row=DB.stock.find(x=>x.code===h.code&&x.loc===oldLoc&&lotKey(x)===lotKey(oldLot));
    if(!row||(parseInt(row.qty,10)||0)<oldQty){ toast(lang==="th"?"เปลี่ยนข้อมูลล็อตไม่ได้ — ของล็อตนี้ถูกจ่ายไปแล้วบางส่วน":"Can't change the lot — part of it was already issued","err"); return; } }
  if(sign<0){ const have=stockAt(h.code,newLoc)+(newLoc===oldLoc?oldQty:0);    // an issue can only take what is there
    if(have<newQty){ toast(t("tNoStock")+": "+h.code+" @ "+newLoc+" ("+num(have)+")","err"); return; } }
  else { const left=stockAt(h.code,oldLoc)-oldQty+(newLoc===oldLoc?newQty:0);  // a receipt whose stock was already issued
    if(left<0&&!confirm(lang==="th"?"สต๊อกที่ "+oldLoc+" จะติดลบ ("+num(left)+") เพราะของชุดนี้ถูกจ่ายไปแล้ว ดำเนินการต่อ?":"Stock at "+oldLoc+" would go negative ("+num(left)+") because this receipt was already issued. Continue?")) return; }
  // reverse old stock effect on the old lot, apply the new one on the new lot -> keeps Stock Balance correct
  changeStockFor(h.code, oldLoc, -sign*oldQty, oldLot);
  changeStockFor(h.code, newLoc,  sign*newQty, newLot);
  // keep the source Schedule's Done / Remaining in sync
  syncSchedFromHistory(h, newQty-oldQty);
  if(oldQty>0&&newQty!==oldQty){ const f=newQty/oldQty, r2h=v=>Math.round((parseFloat(v)||0)*f*100)/100;   // cost / value follow the quantity
    if(h.cogs!=null) h.cogs=r2h(h.cogs); if(h.value!=null) h.value=r2h(h.value); }
  h.qty=newQty; h.loc=newLoc;
  h.dept=document.getElementById("hDept").value.trim();
  h.status=document.getElementById("hStatus").value;
  ["lotSup","mfd","exp","sn"].forEach(k=>{ if(newLot[k]!==oldLot[k]) h[k]=newLot[k]; });
  Store.save(); closeModal(); toast(t("tSaved"),"ok"); route(current); }
/* after a history row was removed: if it was the last issue row of a booking, that booking is no longer issued */
function bkAfterHistGone(h){
  if(!h||h.bookingId==null||h.status==="Reserved") return false;
  const b=(DB.bookings||[]).find(x=>String(x.id)===String(h.bookingId)); if(!b||!(b.issued||b.status==="Done"||b.status==="Fulfilled")) return false;
  if((DB.history||[]).some(x=>x.bookingId!=null&&String(x.bookingId)===String(b.id)&&x.status!=="Reserved")) return false;
  b.issued=false; b.reserved=false;                                  // its stock came back with the deleted rows
  if(b.status==="Reserved"||b.status==="Done"||b.status==="Fulfilled") b.status="Booked";
  return true;
}
function cancelHistory(id){ if(!isMgrUp()){ toast(lang==="th"?"เฉพาะผู้จัดการขึ้นไป":"Manager or above only","err"); return; } if(histLocked(DB.history.find(x=>x.id===id))) return;
  const h=DB.history.find(x=>x.id===id), mate=histMate(h);
  if(mate){ const inR=(mate.type==="IN"||mate.type==="NGIN")?mate:h;  // a move: both halves go, or neither
    if(stockAt(inR.code,inR.loc)<(parseFloat(inR.qty)||0)){ toast((lang==="th"?"ยกเลิกไม่ได้ — ของที่ย้ายไป ":"Can't cancel — the moved stock at ")+inR.loc+(lang==="th"?" ถูกใช้ไปแล้ว":" was already used"),"err"); return; }
    if(!confirm(lang==="th"?"ยกเลิกรายการย้ายนี้ทั้งคู่ (ออก + เข้า) และย้อนสต๊อก?":"Cancel both halves of this move (out + in) and reverse stock?")) return; }
  else if(!confirm(t("confirmDelete")))return;
  [h].concat(mate?[mate]:[]).forEach(r=>{ if(!r) return; const sign=(r.type==="IN"||r.type==="NGIN")?1:-1;
    changeStockFor(r.code, r.loc, -sign*(parseFloat(r.qty)||0), r);   // reverse stock effect on its own lot
    syncSchedFromHistory(r, -(parseFloat(r.qty)||0));             // reverse Schedule Done
    const _i=DB.history.indexOf(r); if(_i>=0) DB.history.splice(_i,1); });   // mutate in place -> persists to partition
  const bkBack=bkAfterHistGone(h);
  if(h&&h.mp&&!(DB.history||[]).some(x=>x.mp&&x.type==="OUT"&&String(x.orderNo||"")===String(h.orderNo||""))){   // nothing of that order left picked
    const mo=(DB.mpOrders||[]).find(o=>String(o.orderNo)===String(h.orderNo)); if(mo) mo.picked=false; }
  Store.save(); toast(bkBack?(lang==="th"?"ยกเลิกแล้ว — การจองกลับเป็น “จองแล้ว” เบิกใหม่ได้":"Cancelled — the booking is back to Booked"):t("tCancelled"),"ok"); route(current); }

function lbEls(it,c,runNo,vals){

function lbPreview(){
  const prev=document.getElementById("lbPrev"); if(!prev)return;

function labelHTML(it,img,c,opts){
  opts=opts||{}; const PX=3.78, w=c.w*PX, h=c.h*PX, qr=Math.min(w,h)*0.42;
  const L=c.layout||{}; const pos=k=>{const p=L[k]||{x:50,y:50};return `left:${p.x}%;top:${p.y}%;transform:translate(-50%,-50%)`;};
  const drag=opts.drag?'class="lblel" ':''; const dk=k=>opts.drag?`data-k="${k}"`:'';
  let inner="";
  if(img) inner+=`<div ${drag}${dk("qr")} style="position:absolute;${pos("qr")}"><img src="${img}" style="width:${qr}px;height:${qr}px;display:block" alt="QR"></div>`;
  lbEls(it,c,opts.runNo||1,opts.vals||{}).forEach(el=>{
    inner+=`<div ${drag}${dk(el.k)} style="position:absolute;${pos(el.k)};white-space:nowrap;text-align:center">${el.html}</div>`;
  });
  const grid=opts.drag?`background-image:linear-gradient(#eee 1px,transparent 1px),linear-gradient(90deg,#eee 1px,transparent 1px);background-size:${w/12.5}px ${h/12.5}px;`:"";
  return `<div id="lblBox" style="position:relative;border:1px solid var(--line);border-radius:8px;width:${w}px;height:${h}px;background:#fff;${grid}overflow:hidden">${inner}</div>`;
}
function lbInitDrag(box,c){
  box.querySelectorAll(".lblel").forEach(el=>{
    el.style.cursor="move";
    el.addEventListener("mousedown",e=>{ e.preventDefault(); const k=el.getAttribute("data-k");
      const move=ev=>{ const r=box.getBoundingClientRect();
        let x=((ev.clientX-r.left)/r.width)*100, y=((ev.clientY-r.top)/r.height)*100;
        x=Math.max(3,Math.min(97,Math.round(x/4)*4)); y=Math.max(3,Math.min(97,Math.round(y/4)*4));
        c.layout[k]={x,y}; el.style.left=x+"%"; el.style.top=y+"%"; };
      const up=()=>{ document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up); Store.save(); };
      document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
    });
  });
}

/* logo: resized in the browser to max 256px and kept as a small PNG in the company settings */
let _pendingLogo;                                   // undefined = unchanged, "" = back to default
function pickLogo(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/png,image/jpeg,image/svg+xml,image/webp";
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f)return;
    if(f.size>5*1024*1024){ toast(lang==="th"?"ไฟล์ใหญ่เกิน 5MB":"File is larger than 5MB","err"); return; }
    const rd=new FileReader();
    rd.onload=()=>{ const img=new Image();
      img.onload=()=>{ const w=img.naturalWidth||256, hh=img.naturalHeight||256, k=Math.min(1,256/Math.max(w,hh));
        const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(hh*k));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        _pendingLogo=c.toDataURL("image/png");                  // PNG keeps transparency
        const p=document.querySelector("#setLogoPrev img"); if(p){ p.src=_pendingLogo; p.style.display=""; }
        toast(lang==="th"?"เลือกโลโก้แล้ว — กดบันทึก":"Logo selected — press Save","ok"); };
      img.onerror=()=>toast(lang==="th"?"อ่านรูปไม่ได้":"Could not read the image","err");
      img.src=rd.result; };
    rd.readAsDataURL(f); };
  inp.click();
}

/* ---- scanner (camera: BarcodeDetector, fallback ZXing CDN; USB acts as keyboard) ---- */
let _scanStream=null,_scanRAF=null,_zxing=null,_scanCb=null;
function openScanModal(cb){
  _scanCb=cb;
  openModal2(`<div class="modal-h"><div class="mh-ic">${IC.scan}</div>
    <div class="mh-tx"><b>${t("scan")||"Scan"}</b><span>${t("noScanner")}</span></div>
    <button class="x" onclick="stopScan();closeModal2()">✕</button></div>
    <div class="modal-b">
      <div class="scanner" id="scanBox">
        <video id="scanVid" playsinline muted></video>
        <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <div class="laser"></div>
        <div class="camnote" id="camNote" style="display:none"></div>
      </div>
      <div class="scancap">${t("manualEntry")}</div>
      <div class="inwrap"><input class="inp" id="scanManual" placeholder="${t("enterCode")}"
        onkeydown="if(event.key==='Enter')_scanDone(this.value)">
        <button class="btn btn-primary" onclick="_scanDone(document.getElementById('scanManual').value)">${t("confirm")}</button></div>
    </div>`);
  setTimeout(()=>{ const m=document.getElementById("scanManual"); if(m)m.focus(); },60);
  startScan();
}
function _scanDone(v){ v=(v||"").trim(); if(!v)return; const cb=_scanCb; stopScan(); closeModal2(); if(cb)cb(v); }
function _camNote(msg){ const n=document.getElementById("camNote"); if(n){ n.style.display="flex";
  n.innerHTML=`${IC.scan}<div style="margin-top:8px">${esc(msg)}</div>`; } }
function loadZXing(){ return new Promise((res,rej)=>{ if(window.ZXing)return res(window.ZXing);
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js";
  s.onload=()=>res(window.ZXing); s.onerror=rej; document.head.appendChild(s); }); }
async function startScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ _camNote(t("tCamNo")); return; }
  if(location.protocol!=="https:"&&location.hostname!=="localhost"&&location.hostname!=="127.0.0.1"){ _camNote(t("tCamHttps")); return; }
  try{
    _scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const vid=document.getElementById("scanVid"); if(!vid){ stopScan(); return; }
    vid.srcObject=_scanStream; await vid.play();
    if("BarcodeDetector" in window){
      const det=new window.BarcodeDetector();
      const tick=async()=>{ if(!_scanStream)return;
        try{ const codes=await det.detect(vid); if(codes&&codes.length){ _scanDone(codes[0].rawValue); return; } }catch(e){}
        _scanRAF=requestAnimationFrame(tick); };
      tick();
    } else {
      const ZX=await loadZXing(); _zxing=new ZX.BrowserMultiFormatReader();
      _zxing.decodeFromVideoElement(vid,(result)=>{ if(result)_scanDone(result.getText()); });
    }
  }catch(e){ _camNote(e&&e.name==="NotAllowedError"?t("tCamDenied"):t("tCamNo")); }
}
function stopScan(){
  if(_scanRAF){ cancelAnimationFrame(_scanRAF); _scanRAF=null; }
  if(_zxing){ try{_zxing.reset();}catch(e){} _zxing=null; }
  if(_scanStream){ try{_scanStream.getTracks().forEach(tr=>tr.stop());}catch(e){} _scanStream=null; }
}

    const g=document.getElementById("gsearch"); if(g)g.focus(); }

document.addEventListener("click",e=>{ // close open autocompletes on outside click
