function wlBagsSVG(x,y,w,h,cols,rows){

function wlBarsSVG(x,y,w,h,rows){

/* ของในช่องหนึ่ง: เลือกวิธีวาดตามชนิด แล้วปรับความสูงกองตามปริมาณ */
function wlCargoSVG(kind,x,y,w,h,ratio){
  if(h<=4||w<=4) return "";
  ratio=Math.max(0.3,Math.min(1,ratio||1));
  var usedH=h*ratio, top=y+(h-usedH);
  var onPallet=(kind==="pbox"||kind==="pdrum"||kind==="pcrate");
  var ph=onPallet?Math.min(usedH*0.22,Math.max(6,h*0.14)):0;
  var gy=top, gh=usedH-ph;
  if(gh<3) return onPallet?wlPalletSVG(x,y+h-ph,w,ph):"";
  var body="";
  if(kind==="pbox"||kind==="box")      body=wlBoxesSVG(x,gy,w,gh,  (w>160?3:2), Math.max(1,Math.round(gh/Math.max(28,w/3))));
  else if(kind==="pdrum"||kind==="drum") body=wlDrumsSVG(x,gy,w,gh, (w>160?3:2));
  else if(kind==="pcrate")             body=wlCratesSVG(x,gy,w,gh, (w>160?3:2), Math.max(1,Math.round(gh/Math.max(30,w/3))));
  else if(kind==="bag")                body=wlBagsSVG(x,gy,w,gh,   2, Math.max(1,Math.round(gh/Math.max(26,w/4))));
  else if(kind==="bar")                body=wlBarsSVG(x,gy,w,gh,   Math.max(2,Math.round(gh/Math.max(12,w/10))));
  else                                 body=wlBoxesSVG(x,gy,w,gh,  2, 2);
  return body+(onPallet?wlPalletSVG(x,y+h-ph,w,ph):"");
}

function wlRackElevSVG(one,idx,maxQ){

  var UW=Math.max(16,Math.min(42,W*0.045));     /* เสา */
  var BH=Math.max(9, Math.min(26,H*0.032));     /* คาน */

  out+=upright(0)+upright(W-UW);

  /* ── แต่ละระดับ: ของวางบนคาน แล้ววาดคานทับขอบล่าง ── */

  var TH=one.top?wlTopH(one,lh):0, lvList=[]; for(var Li=1;Li<=lv;Li++) lvList.push(Li); if(one.top) lvList.push("T");

    /* ชั้นล่างสุดวางบนพื้น ไม่มีคานรอง — ของจึงวางลงได้ถึงพื้นเลย · แถว "T" = ของที่วางบนคานบนสุด */
    var isTop=(L==="T"), y0=isTop?-TH:H-L*lh, y1=isTop?0:H-(L-1)*lh, hasBeam=(!isTop&&L>1), beamY=hasBeam?(y1-BH):y1;
    for(var B=1;B<=by;B++){

        }
      }
      /* รหัส Location วางกลางช่อง — มุมบนซ้ายเดิมโดนเสาและตัวของบังจนอ่านยาก
         อยู่กลางช่องแล้วได้ความกว้างเต็ม ไม่ต้องแย่งที่กับตัวเลขจำนวน รหัสจึงไม่ถูกตัดทิ้ง */

      var codeY=ccy+(showQty?-fs1*0.18:fs1*0.36);

      var plW=Math.max(codeTxt.length*fs1*0.58, qtyTxt.length*fs2*0.58)+16;
      var plH=showQty?fs1*2.5:fs1*1.5;
      var plY=showQty?(ccy-fs1*1.25):(ccy-fs1*0.71);
      var lab=((loc&&q>0)
          /* มีของอยู่ในช่อง ตัวอักษรจะไปทับกล่อง — รองด้วยแผ่นขาวโปร่งให้ยังอ่านออก */
          ?'<rect x="'+(ccx-plW/2)+'" y="'+plY+'" width="'+plW+'" height="'+plH+'" rx="'+Math.min(plH/2,fs1*0.75)+'"'

        +(showQty?'<text x="'+ccx+'" y="'+qtyY+'" text-anchor="middle" font-size="'+fs2+'" font-weight="700" fill="'

      var mixN=wlMixN(idx,loc), mixTxt=mixN?(th?("ปน "+mixN+" รายการ"):(mixN+" items mixed")):"";

      var mix=(mixN&&mW<bw-6)
        ?'<g style="pointer-events:none"><rect x="'+(cx+bw-mW-4)+'" y="'+(y0+5)+'" width="'+mW+'" height="'+mH+'" rx="'+(mH/2)+'" fill="#f59e0b"/>'
          +'<text x="'+(cx+bw-mW/2-4)+'" y="'+(y0+5+mH*0.7)+'" text-anchor="middle" font-size="'+mfs+'" font-weight="800" fill="#fff">'+esc(mixTxt)+'</text></g>'

        +art+lab+mix+hit

          +'<text x="'+(cx+bw/2)+'" y="'+(y0-6)+'" text-anchor="middle" font-size="36" font-weight="800" fill="#e8720c">\u25bc</text>':'')
        +'</g>';
    }
    if(hasBeam) out+=beam(beamY);
    /* เส้นแบ่งช่องบาง ๆ ให้เห็นว่าแบ่งเป็นกี่ช่อง */

/* ── ไอโซเมตริก: ฉายแบบ 2:1 เห็นทรงของจริงทั้งโกดังในภาพเดียว ── */
function wlShade(hex,f){
  var h=String(hex||"").replace("#","");
  if(h.length===3) h=h.split("").map(function(c){ return c+c; }).join("");
  var n=parseInt(h,16); if(isNaN(n)) return hex;
  var cc=function(v){ return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0"); };
  return "#"+cc(((n>>16)&255)*f)+cc(((n>>8)&255)*f)+cc((n&255)*f);
}
/* ── ชิ้นส่วนสามมิติพื้นฐาน ──
   P = ฟังก์ชันฉายพิกัดโลก (x,y,z) ลงจอ · z ชี้ขึ้น · x+y มาก = อยู่ใกล้ผู้ดู */
function wlIsoPts(a){ return a.map(function(q){ return q[0].toFixed(1)+","+q[1].toFixed(1); }).join(" "); }
/* กล่องสี่เหลี่ยมหนึ่งใบ — เห็นสามหน้า: บน · หน้าที่หัน y มาก · หน้าที่หัน x มาก */
function wlIso3(P,x,y,z,dx,dy,dz,col,sw,op){
  var tp=[P(x,y,z+dz),P(x+dx,y,z+dz),P(x+dx,y+dy,z+dz),P(x,y+dy,z+dz)];
  var fa=[P(x,y+dy,z+dz),P(x+dx,y+dy,z+dz),P(x+dx,y+dy,z),P(x,y+dy,z)];
  var fb=[P(x+dx,y,z+dz),P(x+dx,y+dy,z+dz),P(x+dx,y+dy,z),P(x+dx,y,z)];
  var st='stroke="rgba(0,0,0,.26)" stroke-width="'+(sw||1.5)+'" stroke-linejoin="round"'
        +(op?' fill-opacity="'+op+'"':'');
  return '<polygon points="'+wlIsoPts(fa)+'" fill="'+wlShade(col,.78)+'" '+st+'/>'
        +'<polygon points="'+wlIsoPts(fb)+'" fill="'+wlShade(col,.60)+'" '+st+'/>'
        +'<polygon points="'+wlIsoPts(tp)+'" fill="'+col+'" '+st+'/>';
}
/* ทรงกระบอกตั้ง (ถัง/แกลลอน) — วงกลมในระนาบพื้นฉายเป็นวงรี กว้าง 1.22r สูง 0.71r */
function wlIsoCyl(P,cx,cy,z,r,dz,col){
  var t=P(cx,cy,z+dz), b=P(cx,cy,z), rx=r*1.224, ry=r*0.707;
  return '<path d="M '+(t[0]-rx).toFixed(1)+','+t[1].toFixed(1)
       +' L '+(b[0]-rx).toFixed(1)+','+b[1].toFixed(1)
       +' A '+rx.toFixed(1)+','+ry.toFixed(1)+' 0 0 0 '+(b[0]+rx).toFixed(1)+','+b[1].toFixed(1)
       +' L '+(t[0]+rx).toFixed(1)+','+t[1].toFixed(1)+' Z" fill="'+wlShade(col,.70)+'"'
       +' stroke="rgba(0,0,0,.22)" stroke-width="1.2"/>'
    +'<ellipse cx="'+t[0].toFixed(1)+'" cy="'+t[1].toFixed(1)+'" rx="'+rx.toFixed(1)+'" ry="'+ry.toFixed(1)
       +'" fill="'+col+'" stroke="'+wlShade(col,.58)+'" stroke-width="1.4"/>';
}
/* พาเลทไม้ — แผ่นบนสีอ่อน ขาสีเข้ม */
function wlIsoPallet(P,x,y,z,dx,dy,dz){
  return wlIso3(P,x,y,z,dx,dy,dz*0.42,"#b5802c",1.2)
        +wlIso3(P,x,y,z+dz*0.42,dx,dy,dz*0.58,"#e5a948",1.2);
}
/* ของที่วางในช่องหนึ่ง วาดตามชนิดบรรจุภัณฑ์ — ชิ้นไกลวาดก่อนชิ้นใกล้ */
var WL_PACK3={
  pbox:  {pal:1, mode:"box", col:"#c8823f", c:2, r:2},
  pdrum: {pal:1, mode:"cyl", col:"#3f87d6", c:2, r:2},
  pcrate:{pal:1, mode:"box", col:"#2e3748", c:1, r:1},
  box:   {pal:0, mode:"box", col:"#c8823f", c:2, r:2},
  drum:  {pal:0, mode:"cyl", col:"#3f87d6", c:2, r:2},
  bag:   {pal:0, mode:"box", col:"#cdb894", c:2, r:2},
  bar:   {pal:0, mode:"bar", col:"#9aa6b2", c:1, r:3}
};
function wlIsoCargo(P,kind,x,y,z,dx,dy,dz){
  var m=WL_PACK3[kind]||WL_PACK3.pbox, out="";
  if(m.pal){
    var ph=Math.max(2,Math.min(dz*0.22,13));

/* พื้นที่รับคลิกของทั้งก้อน — ใส (fill="transparent" ยังรับคลิกได้ ต่างจาก fill="none") */
function wlIsoHit(P,x,y,z,dx,dy,dz){

  var fa=[P(x,y+dy,z+dz),P(x+dx,y+dy,z+dz),P(x+dx,y+dy,z),P(x,y+dy,z)];
  var fb=[P(x+dx,y,z+dz),P(x+dx,y+dy,z+dz),P(x+dx,y+dy,z),P(x+dx,y,z)];

/* ชั้นวางทั้งใบในมุมไอโซ — เสา คาน และของบนชั้น */
function wlIsoRack(P,o,b,x0,y0,h,idx,maxQ,tgtKey){
  var lv=Math.max(1,+o.levels||1), by=Math.max(1,+o.bays||1), lh=h/lv;
  var alongX=(b.w>=b.d), len=alongX?b.w:b.d;
  var UW=Math.max(4,Math.min(15,Math.min(b.w,b.d)*0.14));
  var BH=Math.max(3,Math.min(13,h*0.03));
  var FR="#4f93c6", BM="#ee6c1f", FTC="#f7c948";
  var ftH=Math.min(h*0.09,24);
  var out="";

  /* เสา: แยกหน้า/หลังด้วยระยะ x+y เสาหน้าต้องวาดทีหลังสุด ไม่งั้นของจะไปทับเสา */
  var posts=[[x0,y0],[x0+b.w-UW,y0],[x0,y0+b.d-UW],[x0+b.w-UW,y0+b.d-UW]];
  posts.sort(function(a,c){ return (a[0]+a[1])-(c[0]+c[1]); });
  var post=function(q){
    return wlIso3(P,q[0],q[1],0,UW,UW,h,FR,1.3)
          +wlIso3(P,q[0]-UW*0.09,q[1]-UW*0.09,0,UW*1.18,UW*1.18,ftH,FTC,1.2);
  };
  out+=post(posts[0])+post(posts[1]);

  /* คานทุกระดับ ยกเว้นระดับพื้น — ชั้นล่างสุดวางกับพื้น เหมือนมุมมองด้าน */
  var rail=function(z,far){
    var t=UW*0.85;
    return alongX ? wlIso3(P,x0, far?y0:(y0+b.d-t), z-BH, b.w, t, BH, BM,1.3)
                  : wlIso3(P, far?x0:(x0+b.w-t), y0, z-BH, t, b.d, BH, BM,1.3);
  };
  for(var Lf=1;Lf<=lv;Lf++) out+=rail(Lf*lh,true);

  var usable=Math.max(8,len-UW*2), bayLen=usable/by;
  for(var L=1;L<=lv;L++){
    var zb=(L-1)*lh, availZ=Math.max(5,L*lh-BH-zb);
    for(var B=1;B<=by;B++){
      var key=L+"-"+B, loc=(o.cells&&o.cells[key])||"", q=wlCellQty(idx,loc);
      if(!loc||!q) continue;
      var ratio=maxQ>0?(0.42+0.58*Math.min(1,q/maxQ)):1;
      var ch=Math.max(5,availZ*Math.min(0.94,ratio));
      var cx0,cy0,cdx,cdy;
      if(alongX){
        cx0=x0+UW+(B-1)*bayLen+bayLen*0.06; cdx=bayLen*0.88;
        cy0=y0+UW*0.7;                      cdy=Math.max(6,b.d-UW*1.4);
      } else {
        cy0=y0+UW+(B-1)*bayLen+bayLen*0.06; cdy=bayLen*0.88;
        cx0=x0+UW*0.7;                      cdx=Math.max(6,b.w-UW*1.4);
      }
      out+=wlIsoCargo(P,wlPackOf(o,key),cx0,cy0,zb,cdx,cdy,ch);
      if(key===tgtKey)
        out+='<polygon points="'+wlIsoPts([P(cx0,cy0,zb+ch),P(cx0+cdx,cy0,zb+ch),
              P(cx0+cdx,cy0+cdy,zb+ch),P(cx0,cy0+cdy,zb+ch)])
          +'" fill="none" stroke="#e8720c" stroke-width="5" stroke-linejoin="round"/>';
    }
    out+=rail(L*lh,false);
  }
  if(o.top) for(var Bt=1;Bt<=by;Bt++){                           /* goods sitting on top of the rack */
    var kt="T-"+Bt, lt=(o.cells&&o.cells[kt])||"", qt=wlCellQty(idx,lt);
    if(!lt||!qt) continue;
    var rt=maxQ>0?(0.42+0.58*Math.min(1,qt/maxQ)):1, cht=Math.max(5,wlTopH(o,lh)*Math.min(0.94,rt)), tx0,ty0,tdx,tdy;
    if(alongX){ tx0=x0+UW+(Bt-1)*bayLen+bayLen*0.06; tdx=bayLen*0.88; ty0=y0+UW*0.7; tdy=Math.max(6,b.d-UW*1.4); }
    else      { ty0=y0+UW+(Bt-1)*bayLen+bayLen*0.06; tdy=bayLen*0.88; tx0=x0+UW*0.7; tdx=Math.max(6,b.w-UW*1.4); }
    out+=wlIsoCargo(P,wlPackOf(o,kt),tx0,ty0,h,tdx,tdy,cht);
    if(kt===tgtKey)
      out+='<polygon points="'+wlIsoPts([P(tx0,ty0,h+cht),P(tx0+tdx,ty0,h+cht),P(tx0+tdx,ty0+tdy,h+cht),P(tx0,ty0+tdy,h+cht)])
        +'" fill="none" stroke="#e8720c" stroke-width="5" stroke-linejoin="round"/>';
  }
  out+=post(posts[2])+post(posts[3]);
  return out;
}
function wlIsoSVG(p,idx){

  var lblW=P(p.w/2,0,0), lblD=P(p.w,p.d/2,0);
  var cap=WL.dash?'':'<text x="'+lblW[0].toFixed(1)+'" y="'+(lblW[1]-26).toFixed(1)+'" text-anchor="middle" font-size="34" font-weight="700" fill="#6f6960">'

  var W=(maxX-minX)+PAD*2, H=(maxY-minY)+PAD*2;

/* ═══════════ ค้นหาสินค้า → เดินไปหา ═══════════ */
/* ช่องกลางของ bay ในพิกัดผัง — ใช้ตรรกะการหมุนชุดเดียวกับที่วาดมุมบน */
function wlBayCenter(o,bay){
  var b=wlBox(o), rot=((+o.rot||0)%180===90), by=Math.max(1,+o.bays||1);
  var span=rot?b.d:b.w, bw=span/by, off=(Math.max(1,bay)-0.5)*bw;
  return rot ? {x:(+o.x||0)+b.w/2, y:(+o.y||0)+off}
             : {x:(+o.x||0)+off,   y:(+o.y||0)+b.d/2};
}
/* loc -> อยู่ที่อ็อบเจกต์ไหน ช่องไหน */
function wlLocMap(p){
  var m={};
  p.objs.forEach(function(o){ wlCells(o).forEach(function(c){ if(c.loc&&!m[c.loc]) m[c.loc]={o:o,c:c}; }); });
  return m;
}
/* ค้นสินค้าจากรหัสหรือชื่อ — เอาเฉพาะที่อยู่ในผังของคลังนี้ */
function wlFindHits(q){
  q=String(q||"").trim().toLowerCase();
  if(!q) return [];
  var p=wlPlan(WL.wh), idx=wlStockIndex(), map=wlLocMap(p), out=[];
  Object.keys(idx).forEach(function(loc){
    var m=map[loc]; if(!m) return;
    idx[loc].items.forEach(function(it){
      var code=String(it.code||""), name=String(it.name||"");
      if(code.toLowerCase().indexOf(q)<0 && name.toLowerCase().indexOf(q)<0) return;
      out.push({code:code, name:name, qty:it.qty, unit:it.unit||"", loc:loc,
                oid:m.o.id, key:m.c.key, level:m.c.level, bay:m.c.bay, top:!!m.c.top});
    });
  });
  out.sort(function(a,b){ return (b.qty||0)-(a.qty||0); });
  return out.slice(0,40);
}
/* จุดยืนที่วางไว้ในผัง */
function wlSpots(p){ return p.objs.filter(function(o){ return o.kind==="spot"; }); }
function wlFromPt(p){
  var sp=wlSpots(p), id=(WL.find&&WL.find.from)||"";
  var o=(id&&sp.filter(function(x){ return x.id===id; })[0])||sp[0];
  if(o){ var b=wlBox(o); return {x:(+o.x||0)+b.w/2, y:(+o.y||0)+b.d/2, name:o.code||(lang==="th"?"จุดยืน":"Start")}; }
  var dr=p.objs.filter(function(x){ return x.kind==="door"; })[0];
  if(dr){ var bb=wlBox(dr); return {x:(+dr.x||0)+bb.w/2, y:(+dr.y||0)+bb.d/2, name:dr.code||(lang==="th"?"ประตู":"Door")}; }
  return {x:Math.min(60,p.w/2), y:Math.max(0,p.d-60), name:(lang==="th"?"มุมผัง":"Corner")};
}
/* ตารางสิ่งกีดขวาง — ชั้นวาง ผนัง เสา สำนักงาน กองพื้น พาเลท เดินทะลุไม่ได้ */
var WL_SOLID={rack:1, wall:1, column:1, office:1, floor:1, pallet:1};
function wlGrid(p){
  var cols=Math.max(1,Math.ceil(p.w/WL_STEP)), rows=Math.max(1,Math.ceil(p.d/WL_STEP));
  var g=new Uint8Array(cols*rows);
  p.objs.forEach(function(o){
    if(!WL_SOLID[o.kind]) return;
    var b=wlBox(o), c0=Math.floor((+o.x||0)/WL_STEP), c1=Math.ceil(((+o.x||0)+b.w)/WL_STEP);
    var r0=Math.floor((+o.y||0)/WL_STEP), r1=Math.ceil(((+o.y||0)+b.d)/WL_STEP);
    for(var r=Math.max(0,r0);r<Math.min(rows,r1);r++)
      for(var c=Math.max(0,c0);c<Math.min(cols,c1);c++) g[r*cols+c]=1;
  });
  return {g:g, cols:cols, rows:rows};
}
/* ช่องว่างที่ใกล้จุดนี้ที่สุด — จุดหมายอยู่ในชั้นวางซึ่งเดินเข้าไม่ได้ ต้องจอดข้าง ๆ */
function wlNearFree(G,cx,cy){
  if(cx>=0&&cx<G.cols&&cy>=0&&cy<G.rows&&!G.g[cy*G.cols+cx]) return [cx,cy];
  for(var rad=1;rad<=Math.max(G.cols,G.rows);rad++){
    for(var dy=-rad;dy<=rad;dy++) for(var dx=-rad;dx<=rad;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==rad) continue;
      var x=cx+dx, y=cy+dy;
      if(x<0||y<0||x>=G.cols||y>=G.rows) continue;
      if(!G.g[y*G.cols+x]) return [x,y];
    }
  }
  return null;
}
/* ไล่หาทางแบบกว้างก่อน (BFS) — ได้เส้นทางสั้นที่สุดบนตาราง */
function wlPath(p,from,to){
  var G=wlGrid(p);
  var a=wlNearFree(G,Math.floor(from.x/WL_STEP),Math.floor(from.y/WL_STEP));
  var b=wlNearFree(G,Math.floor(to.x/WL_STEP),Math.floor(to.y/WL_STEP));
  if(!a||!b) return null;
  var n=G.cols*G.rows, prev=new Int32Array(n).fill(-1), seen=new Uint8Array(n);
  var s0=a[1]*G.cols+a[0], g0=b[1]*G.cols+b[0];
  var qq=new Int32Array(n), head=0, tail=0;
  qq[tail++]=s0; seen[s0]=1;
  var D=[[1,0],[-1,0],[0,1],[0,-1]];
  while(head<tail){
    var cur=qq[head++];
    if(cur===g0) break;
    var cx=cur%G.cols, cy=(cur-cx)/G.cols;
    for(var i=0;i<4;i++){
      var nx=cx+D[i][0], ny=cy+D[i][1];
      if(nx<0||ny<0||nx>=G.cols||ny>=G.rows) continue;
      var ni=ny*G.cols+nx;
      if(seen[ni]||G.g[ni]) continue;
      seen[ni]=1; prev[ni]=cur; qq[tail++]=ni;
    }
  }
  if(!seen[g0]) return null;
  var pts=[], at=g0;
  while(at!==-1){ var x=at%G.cols, y=(at-x)/G.cols; pts.push([x*WL_STEP+WL_STEP/2, y*WL_STEP+WL_STEP/2]); at=prev[at]; }
  pts.reverse();
  /* ตัดจุดที่อยู่บนเส้นตรงเดียวกันทิ้ง จะได้เส้นหักน้อย ๆ อ่านง่าย */
  var out=[pts[0]];
  for(var k=1;k<pts.length-1;k++){
    var a1=out[out.length-1], b1=pts[k], c1=pts[k+1];
    if((b1[0]-a1[0])*(c1[1]-a1[1])!==(b1[1]-a1[1])*(c1[0]-a1[0])) out.push(b1);
  }
  if(pts.length>1) out.push(pts[pts.length-1]);
  out.unshift([from.x,from.y]);
  out.push([to.x,to.y]);
  return out;
}
/* ── ควบคุมจากหน้าจอ ── */
function wlFindType(v){
  WL.find.q=String(v||"");
  WL.find.open=!!WL.find.q.trim();
  wlFindDropdown();
}
function wlFindDropdown(){
  var box=document.getElementById("wlFres"); if(!box) return;
  var th=lang==="th";
  if(!WL.find.open){ box.innerHTML=""; box.style.display="none"; return; }
  var hits=wlFindHits(WL.find.q);
  box.style.display="";
  if(!hits.length){
    box.innerHTML='<div class="wl-fnone">'+(th?"ไม่พบสินค้านี้ในผังของคลัง "+esc(WL.wh)+" — ของอาจอยู่คลังอื่น หรือช่องนั้นยังไม่ได้ผูก Location"
                                              :"Not found in this warehouse layout")+'</div>';
    return;
  }
  box.innerHTML=hits.map(function(h,i){
    return '<button onclick="wlFindGo('+i+')">'
      +'<span style="min-width:0"><b>'+esc(h.code)+'</b><em>'+esc(h.name)+' · '+esc(h.loc)
        +(h.level?' · '+(h.top?(th?"บนชั้นวาง":"Top"):((th?"ระดับ ":"L")+h.level))+' '+(th?"ช่อง ":"bay ")+h.bay:'')+'</em></span>'
      +'<span class="wl-fqy">'+num(h.qty)+' '+esc(h.unit||(th?"ชิ้น":"pcs"))+'</span></button>';
  }).join("");
}
function wlFindClose(){ WL.find.open=false; wlFindDropdown(); }
function wlFindClear(){
  wlWalkStop();
  WL.find={ q:"", open:false, pick:null, from:WL.find.from, path:null, arrived:false, raf:0 };
  WL.view="top"; WL.side="ALL";
  wlRoute();
}
function wlFindFrom(v){ WL.find.from=v||""; if(WL.find.pick) wlFindGo(-1); }
/* i = ดัชนีในรายการผลค้นหา · -1 = เดินซ้ำจุดเดิม */
function wlFindGo(i){
  var th=lang==="th";
  if(i>=0){
    var hits=wlFindHits(WL.find.q);
    if(!hits[i]) return;
    WL.find.pick=hits[i];
  }
  var pick=WL.find.pick; if(!pick) return;
  WL.find.open=false; WL.find.arrived=false;
  var p=wlPlan(WL.wh), o=wlObj(pick.oid);
  if(!o){ toast(th?"ไม่พบจุดนี้ในผังแล้ว":"That spot is gone from the layout","err"); return; }
  var from=wlFromPt(p), to=(o.kind==="rack")?wlBayCenter(o,pick.bay):(function(){ var b=wlBox(o); return {x:(+o.x||0)+b.w/2,y:(+o.y||0)+b.d/2}; })();
  var path=wlPath(p,from,to);
  if(!path){ path=[[from.x,from.y],[to.x,to.y]]; }     /* หาทางไม่เจอ ลากตรงให้พอเห็นทิศ */
  WL.find.path=path; WL.find.fromName=from.name;
  WL.view="top"; WL.side="ALL";
  wlRoute();
  /* รอให้หน้าวาดเสร็จก่อน ถ้ายังไม่มี SVG ก็วาดเองแล้วค่อยเริ่มเดิน */
  setTimeout(function(){
    if(!document.getElementById("wlSvg")){ try{ wlPaint(); }catch(e){} }
    wlWalkStart();
  },60);
}
/* ── วาดเส้นทาง + เดิน ── */
function wlWalkStop(){
  if(WL.find&&WL.find.raf){ cancelAnimationFrame(WL.find.raf); WL.find.raf=0; }
}
function wlRouteDraw(){
  var svg=document.getElementById("wlSvg"); if(!svg) return;
  var old=svg.querySelector("#wlRouteFx"); if(old) old.remove();
  var f=WL.find;
  if(WL.view!=="top"||!f||!f.path||f.path.length<2) return;
  var d=f.path.map(function(pt,i){ return (i?"L":"M")+pt[0].toFixed(0)+" "+pt[1].toFixed(0); }).join(" ");
  var last=f.path[f.path.length-1];
  var g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("id","wlRouteFx");
  g.setAttribute("style","pointer-events:none");
  g.innerHTML=
     '<path d="'+d+'" fill="none" stroke="#0e8a53" stroke-opacity=".30" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="26 22"/>'
    +'<path id="wlTrail" d="'+d+'" fill="none" stroke="#0e8a53" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+f.path[0][0]+'" cy="'+f.path[0][1]+'" r="20" fill="#0e8a53" stroke="#fff" stroke-width="6"/>'
    +'<g transform="translate('+last[0]+' '+last[1]+')">'
      +'<circle r="34" fill="#e8720c" fill-opacity=".18"/>'
      +'<circle r="19" fill="#e8720c" stroke="#fff" stroke-width="6"/></g>'
    +'<g class="wl-walker" id="wlWalker"><circle class="pulse" r="26" fill="#0e8a53" fill-opacity=".35"/>'
      +'<circle r="26" fill="#fff" stroke="#0e8a53" stroke-width="8"/></g>';
  svg.appendChild(g);
  var trail=g.querySelector("#wlTrail");
  try{ var L=trail.getTotalLength(); trail.style.strokeDasharray=L; trail.style.strokeDashoffset=L; trail.dataset.len=L; }catch(e){}
}
function wlWalkStart(){
  wlWalkStop();
  var svg=document.getElementById("wlSvg"); if(!svg) return;
  var trail=svg.querySelector("#wlTrail"), man=svg.querySelector("#wlWalker");
  if(!trail||!man) return;
  var L=0; try{ L=trail.getTotalLength(); }catch(e){ return; }
  var dur=Math.max(900,Math.min(9000, L/WL_SPEED*1000));
  var t0=0;
  var step=function(ts){
    if(!t0) t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    trail.style.strokeDashoffset=L*(1-k);
    try{ var pt=trail.getPointAtLength(L*k); man.setAttribute("transform","translate("+pt.x+" "+pt.y+")"); }catch(e){}
    if(k<1){ WL.find.raf=requestAnimationFrame(step); }
    else { WL.find.raf=0; wlArrive(); }
  };
  WL.find.raf=requestAnimationFrame(step);
}
/* ถึงที่หมาย → สลับเป็นมุมด้านของชั้นนั้น แล้วบอกว่าอยู่ระดับไหน */
function wlArrive(){
  if(current!=="wh-dash"&&current!=="wh-layout") return;          /* left the page while walking */
  var f=WL.find, o=f&&f.pick?wlObj(f.pick.oid):null;
  if(!o){ return; }
  f.arrived=true;
  if(o.kind==="rack"){
    WL.view=(((+o.rot||0)%180===90)?"side":"front");
    WL.side=o.id;
  }
  wlRoute();
}
/* แถบค้นหา + แถบผลลัพธ์ */
function wlFindBar(p,th){

  var fromSel=sp.length

      +sp.map(function(o){ return '<option value="'+esc(o.id)+'"'+(WL.find.from===o.id?" selected":"")+'>'
          +esc(o.code||wlKindName("spot"))+'</option>'; }).join("")
      +'</select></label>'
    : '<span class="wl-flb">'+(th?"ยังไม่ได้วาง “จุดยืน” ในผัง — ใช้ประตูเป็นจุดเริ่มไปก่อน":"No start point placed — using a door")+'</span>';
  return '<div class="wl-find">'
    +'<div class="wl-fq">'
      +'<input class="inp" id="wlFq" value="'+esc(WL.find.q||"")+'" autocomplete="off"'
        +' placeholder="'+(th?"ค้นหาสินค้าในคลัง — รหัสหรือชื่อ แล้วระบบจะพาเดินไปหา":"Find an item — code or name, and we walk you there")+'"'
        +' oninput="wlFindType(this.value)" onfocus="wlFindType(this.value)">'
      +'<div class="wl-fres" id="wlFres" style="display:none"></div>'
    +'</div>'
    +fromSel
    +(WL.find.pick?'<button class="btn btn-ghost btn-sm" onclick="wlFindGo(-1)">'+(th?"เดินอีกครั้ง":"Replay")+'</button>'
      +'<button class="btn btn-ghost btn-sm" onclick="wlFindClear()">'+(th?"ล้าง":"Clear")+'</button>':'')
    +'</div>'
    +(WL.find.pick?wlFindHitBar(th):'');
}
function wlFindHitBar(th){
  var h=WL.find.pick, o=wlObj(h.oid);
  var lv=(o&&o.kind==="rack")?h.level:0;
  return '<div class="wl-hit">'
    +'<span class="v">'+esc(h.code)+'</span>'
    +'<span class="k">'+esc(h.name)+'</span>'
    +'<span class="k">'+(th?"อยู่ที่":"at")+' <b style="color:var(--text)">'+esc(h.loc)+'</b></span>'
    +(o?'<span class="k">'+(th?"ชั้นวาง":"rack")+' <b style="color:var(--text)">'+esc(o.code||wlKindName(o.kind))+'</b></span>':'')
    +(lv?'<span class="lvl">'+(h.top?(th?"บนชั้นวาง":"Top of rack"):((th?"ชั้นที่ ":"Level ")+lv))+'</span>'
        +'<span class="k">'+(th?"ช่องที่":"bay")+' '+h.bay+'</span>':'')

    +(WL.find.arrived?'':'<span class="k">'+(th?"กำลังเดินจาก ":"walking from ")+esc(WL.find.fromName||"")+'…</span>')

/* ═══════════ การกระทำ ═══════════ */
/* หน้าไหนกำลังแสดงผังอยู่ ก็วาดใหม่ที่หน้านั้น (ใช้ทั้งหน้าออกแบบและแดชบอร์ด) */
/* ══ ดูผังเต็มจอ — เหลือแค่การ์ดสรุปกับตัวผัง ══ */
function wlFullIsOn(){ return document.body.classList.contains("wl-full"); }
/* แถบลอย: สลับมุมมอง · เลือกชั้น · ซูม · ออก — วางทับมุมขวาบนของผัง ไม่กินแถวของตัวเอง */
function wlFullBarHTML(){
  var th=lang==="th", p=wlPlan(WL.wh), pick=wlPickSel(p,th);
  return '<div class="wl-fbar" id="wlFbar">'
    +'<div class="wl-fcap">'+(th?"มุมมอง":"View")+'</div>'
    +wlViewSeg(th)
    +(pick?'<div class="wl-fcap">'+(th?"ชั้นวางที่ดู":"Rack")+'</div>'+pick:'')
    +'<div class="wl-fcap">'+(th?"ย่อ–ขยาย":"Zoom")+'</div>'
    +'<div class="wl-zoom">'
      +'<button onclick="wlZoom(-1)">−</button><span class="wl-zlb">'+Math.round(WL.zoom*100)+'%</span>'
      +'<button onclick="wlZoom(1)">+</button>'
      +'<button class="wl-fit" onclick="wlFit()">'+(th?"พอดีจอ":"Fit")+'</button>'
    +'</div>'
    +'<button class="fx" onclick="wlFullOff()">'+(th?"ออก (Esc)":"Exit (Esc)")+'</button>'
    +'</div>';
}
function wlFullBarMount(){
  var st=document.getElementById("wlStage"); if(!st) return;
  var old=document.getElementById("wlFbar"); if(old) old.remove();
  if(!wlFullIsOn()) return;
  st.insertAdjacentHTML("afterbegin", wlFullBarHTML());
}
function wlFullOn(){
  if(wlFullIsOn()) return;
  document.body.classList.add("wl-full");
  try{ if(typeof fsOn==="function" && !fsOn() && typeof fsEnter==="function") fsEnter(); }catch(e){}
  try{ window.scrollTo(0,0); }catch(e){}
  /* รอให้เลย์เอาต์ยุบเสร็จก่อนค่อยวัดพื้นที่ใหม่ ไม่งั้นได้ขนาดของหน้าเดิม */
  setTimeout(function(){ WL._fitKey=null; WL._autoH=true; wlRoute(); },80);
}
function wlFullOff(){
  if(!wlFullIsOn()) return;
  document.body.classList.remove("wl-full");
  var b=document.getElementById("wlFbar"); if(b) b.remove();
  try{ if(typeof fsOn==="function" && fsOn() && typeof fsExit==="function") fsExit(); }catch(e){}
  setTimeout(function(){ WL._fitKey=null; WL._autoH=true; wlRoute(); },80);
}
/* กด Esc ออกจากโหมดนี้ — และถ้าออกจากเต็มจอเบราว์เซอร์ด้วยวิธีอื่น ก็ออกตามไปด้วย */
try{
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape" && wlFullIsOn()) wlFullOff();
  });
  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(wlFullIsOn() && typeof fsOn==="function" && !fsOn()) wlFullOff();
    });
  });
}catch(e){}

/* ปรับขนาดหน้าต่าง (รวมทั้งตอนเข้า-ออกเต็มจอ) แล้วจัดให้พอดีใหม่ */
function wlOnResize(){
  if(!document.getElementById("wlSvg")) return;
  clearTimeout(WL._rsT);
  WL._rsT=setTimeout(function(){
    if(!document.getElementById("wlSvg")) return;
    WL._fitKey=wlFitKey(); WL._autoH=true; wlAutoFit(); wlPaint();
  },180);
}
try{ window.addEventListener("resize", wlOnResize); }catch(e){}
function wlZoomLbSet(z){ [].forEach.call(document.querySelectorAll(".wl-zlb"),function(el){ el.textContent=Math.round(z*100)+"%"; }); }
function wlRoute(){
  var c=current;
  /* อยู่หน้าไหนก็วาดหน้านั้นใหม่ — แดชบอร์ดผังคือ wh-dash · ออกไปหน้าอื่นแล้วไม่ดึงกลับมา (timer ที่ค้างอยู่) */
  if(c!=="wh-dash"&&c!=="wh-layout") return;
  route(c);
}
function wlSetWh(w){ WL.wh=w; WL.sel=null; WL.side="ALL"; wlRoute(); }
function wlSetView(v){ WL.view=v; wlRoute(); }
function wlSetMode(m){ WL.mode=m; wlRoute(); }
function wlSetSide(v){ WL.side=v; wlPaint(); }
function wlSetGrid(g){ wlPlan(WL.wh).grid=Math.max(1,parseInt(g,10)||10); wlTouch(); wlPaint(); }
function wlZoom(d){
  WL._fitKey=wlFitKey();
  WL._autoH=false;                       /* ผู้ใช้กดซูมเอง อย่าไปย่อคืนให้ */
  WL.zoom=Math.min(3,Math.max(0.3,+(WL.zoom+d*0.2).toFixed(2)));
  wlZoomLbSet(WL.zoom);
  wlPaint();
}
function wlAdd(k){
  var pr=wlPresetOf(k); if(!pr) return;
  var p=wlPlan(WL.wh);
  var o={ id:wlNewId(), kind:pr.kind, x:p.grid*2, y:p.grid*2, w:pr.w, d:pr.d, h:pr.h, rot:0, code:"" };
  if(pr.kind==="rack"){ o.bays=pr.bays||1; o.levels=pr.levels||1; o.cells={}; o.code=wlNextRackCode(p); }
  /* หาที่ว่างแถวบนสุดที่ยังไม่ชนใคร */
  var step=Math.max(10,p.grid), placed=false;
  for(var yy=step; yy<p.d-o.d && !placed; yy+=step)
    for(var xx=step; xx<p.w-o.w; xx+=step){
      if(!wlHits(p,{x:xx,y:yy,w:o.w,d:o.d},null)){ o.x=xx; o.y=yy; placed=true; break; }
    }
  p.objs.push(o); WL.sel=o.id; wlTouch(); route("wh-layout");
}
function wlHits(p,r,skipId){
  return p.objs.some(function(z){
    if(z.id===skipId) return false;
    if(z.kind==="zone"||z.kind==="aisle") return false;
    var b=wlBox(z);
    return !(r.x+r.w<=z.x || z.x+b.w<=r.x || r.y+r.d<=z.y || z.y+b.d<=r.y);
  });
}
function wlNextRackCode(p){
  var used={}; p.objs.forEach(function(o){ if(o.kind==="rack"&&o.code) used[o.code]=1; });
  for(var i=0;i<26;i++){ var c=String.fromCharCode(65+i); if(!used[c]) return c; }
  return "R"+(p.objs.length+1);
}
function wlSet(k,v){
  var o=WL.sel?wlObj(WL.sel):null; if(!o) return;
  if(k==="code"||k==="loc") o[k]=String(v||"").trim();
  else if(k==="top") o.top=!!v;
  else {
    var n=Math.max(k==="bays"||k==="levels"?1:0, Math.round(parseFloat(v)||0));
    if(k==="bays") n=Math.min(20,n);
    if(k==="levels") n=Math.min(12,n);
    o[k]=n;
  }
  if(k==="bays"||k==="levels"||k==="top") wlPruneCells(o);
  wlClamp(o,wlPlan(WL.wh));
  wlTouch(); wlPaint();
  if(k==="top") wlRoute();                                      /* the cell table gains / loses its top row */
}
function wlPruneCells(o){
  if(o.kind!=="rack"||!o.cells) return;
  var lv=Math.max(1,+o.levels||1), by=Math.max(1,+o.bays||1);
  Object.keys(o.cells).forEach(function(k){
    var m=k.split("-");
    if(m[0]==="T"){ if(!o.top||+m[1]>by) delete o.cells[k]; return; }
    if(+m[0]>lv||+m[1]>by) delete o.cells[k];
  });
}
/* รายการสำหรับดรอปดาวน์เลือก Location — cur = ค่าที่ใช้อยู่ตอนนี้
   ใส่ "ไม่ผูก" ไว้บนสุด และถ้าค่าปัจจุบันไม่มีในทะเบียนก็ใส่เพิ่มเข้าไป ไม่งั้นค่าจะหายตอนวาดใหม่ */
function wlLocSelOpts(cur,th,short){
  cur=String(cur||"");
  var list=wlLocsOf(WL.wh), seen={}, out="";
  /* ช่องในตารางแคบมาก ข้อความยาวจะโดนตัดจนอ่านไม่ออก — โหมดสั้นใช้ขีดเดียว */
  out+='<option value=""'+(cur?"":" selected")+'>'
      +(short?"—":(th?"— ไม่ผูกช่องนี้ —":"— not linked —"))+'</option>';
  list.forEach(function(c){
    if(seen[c]) return; seen[c]=1;
    out+='<option value="'+esc(c)+'"'+(c===cur?" selected":"")+'>'+esc(c)+'</option>';
  });
  /* รหัสที่ตั้งไว้แล้วแต่ยังไม่มีในทะเบียน (เช่นที่ได้จากปุ่มสร้างรหัสอัตโนมัติ) ต้องไม่หายไป */
  if(cur&&!seen[cur])
    out+='<option value="'+esc(cur)+'" selected>'+esc(cur)
        +(short?" *":" "+(th?"(ยังไม่มีในทะเบียน)":"(not registered)"))+'</option>';
  out+='<option value="__new__">'+(short?(th?"+ รหัสใหม่…":"+ new…"):(th?"+ พิมพ์รหัสใหม่…":"+ type a new code…"))+'</option>';
  return out;
}
/* เลือกจากดรอปดาวน์ — ค่าว่าง = ยกเลิกการผูก · __new__ = ขอให้พิมพ์รหัสเอง */
async function wlPickCell(key,v,el){
  if(v==="__new__"){
    var o0=WL.sel?wlObj(WL.sel):null;
    var cur0=(o0&&o0.cells&&o0.cells[key])||"";
    var nv=await __prompt(lang==="th"?"รหัส Location ของช่องนี้:":"Location code for this cell:", cur0);
    if(nv===null||nv===undefined){ if(el) el.value=cur0; return; }   /* กดยกเลิก = ไม่เปลี่ยนอะไร */
    wlSetCell(key,nv);
    return;
  }
  wlSetCell(key,v);
}
/* ช่อง Location ของอ็อบเจกต์ที่ไม่ใช่ชั้นวาง (พาเลท · จุดวางพื้น) — ใช้ตรรกะเดียวกัน */
async function wlPickLoc(v,el){
  if(v==="__new__"){
    var o1=WL.sel?wlObj(WL.sel):null, cur1=(o1&&o1.loc)||"";
    var nv2=await __prompt(lang==="th"?"รหัส Location ของจุดนี้:":"Location code:", cur1);
    if(nv2===null||nv2===undefined){ if(el) el.value=cur1; return; }
    wlSet("loc",nv2);
    return;
  }
  wlSet("loc",v);
}
/* ซ่อนอยู่ไหม */
function wlIsHidden(o){ return !!(o&&o.hide); }
/* รายการที่ต้องวาดในมุมมองนั้น — หน้าดูผังตัดของที่ซ่อนออก หน้าออกแบบเก็บไว้ให้เห็นเป็นเงา */
function wlDrawList(objs){

}
/* ความโปร่งของเงาของที่ซ่อนไว้ในหน้าออกแบบ */
function wlHideOpacity(o){ return wlIsHidden(o)?' opacity=".22"':''; }
function wlToggleHide(){

  wlTouch(); wlRoute();

                  :"Hidden — still in the layout and still blocks routes")
             :(th?("แสดง "+(o.code||wlKindName(o.kind))+" อีกครั้ง"):"Shown again"),"ok");

function wlShowAll(){
  var p=wlPlan(WL.wh), n=0;

  toast(lang==="th"?("แสดงของที่ซ่อนไว้ทั้งหมดแล้ว "+n+" ชิ้น"):("Unhid "+n+" objects"),"ok");
}
function wlHiddenCount(){
  return wlPlan(WL.wh).objs.filter(function(o){ return o.hide; }).length;
}
function wlSetCell(key,v){
  var o=WL.sel?wlObj(WL.sel):null; if(!o) return;
  if(!o.cells) o.cells={};
  v=String(v||"").trim();
  if(v) o.cells[key]=v; else delete o.cells[key];
  wlTouch(); wlPaint();
}
function wlAutoCode(){
  var o=WL.sel?wlObj(WL.sel):null; if(!o||o.kind!=="rack") return;
  var pre=String(o.code||"R").trim().toUpperCase().replace(/\s+/g,"");
  var lv=Math.max(1,+o.levels||1), by=Math.max(1,+o.bays||1);
  o.cells=o.cells||{};
  for(var L=1;L<=lv;L++) for(var B=1;B<=by;B++)
    o.cells[L+"-"+B]=pre+"-"+String(B).padStart(2,"0")+"-"+String(L).padStart(2,"0");
  if(o.top) for(var Bt=1;Bt<=by;Bt++) o.cells["T-"+Bt]=pre+"-"+String(Bt).padStart(2,"0")+"-"+String(lv+1).padStart(2,"0");
  var nCodes=lv*by+(o.top?by:0);
  wlTouch(); wlPaint(); wlRoute();
  toast(lang==="th"?("สร้างรหัสแล้ว "+nCodes+" ช่อง — รูปแบบ "+pre+"-ช่อง-ระดับ")
                   :("Generated "+nCodes+" codes"),"ok");
}
function wlRotate(){
  var o=WL.sel?wlObj(WL.sel):null; if(!o) return;
  o.rot=((+o.rot||0)+90)%180;
  wlClamp(o,wlPlan(WL.wh)); wlTouch(); wlPaint();
}
function wlDup(){
  var o=WL.sel?wlObj(WL.sel):null; if(!o) return;
  var p=wlPlan(WL.wh), b=wlBox(o);

  c.id=wlNewId();

  c.y=o.y;
  if(c.kind==="rack"){ c.code=wlNextRackCode(p); c.cells={}; }
  p.objs.push(c); WL.sel=c.id; wlTouch(); route("wh-layout");
}

/* สร้าง Location ที่ผังอ้างถึงแต่ยังไม่มีใน Location Master */
function wlCreateMissingLocs(){

/* ตัวเลือกปลายทาง — จัดกลุ่มตามคลัง ตัดจุดต้นทางออก */
function wlLocOpts(exclude){
  var g={};
  (DB.locationMaster||[]).forEach(function(l){
    if(l.code===exclude) return;
    (g[l.warehouse||"-"]=g[l.warehouse||"-"]||[]).push(l.code);
  });
  return Object.keys(g).sort().map(function(w){
    return '<optgroup label="'+esc(w)+'">'
      +g[w].sort().map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join("")
      +'</optgroup>';
  }).join("");
}

function wlMoveDo(){
  var th=lang==="th", m=window._wlMove||{};
  var to=(document.getElementById("wlMvTo")||{}).value||"";
  var note=(document.getElementById("wlMvNote")||{}).value||(th?"ย้ายจากผังคลัง":"Moved from warehouse layout");
  if(!to||to===m.loc){ toast(th?"เลือกปลายทางก่อน":"Pick a destination","err"); return; }

  var moved=0, fail=0;
  var mvCodes=m.code?[m.code]:(((wlStockIndex()[m.loc]||{}).items)||[]).map(function(it){ return it.code; });
  if(!mixWarn(to,mvCodes)) return;                                 /* a different item is already at the destination */
  var mvQty=m.code?Math.floor(parseFloat((document.getElementById("wlMvQty")||{}).value)||0):(+m.max||0);
  if(mvQty>0&&!capWarn(to,mvQty)) return;                          /* the destination would go over its capacity */
  if(m.code){
    var qEl=document.getElementById("wlMvQty");
    var q=Math.floor(parseFloat(qEl?qEl.value:0)||0);
    if(q<=0){ toast(th?"จำนวนต้องมากกว่า 0":"Qty must be > 0","err"); return; }
    if(q>m.max){ toast(th?("มีแค่ "+num(m.max)+" ชิ้น"):("Only "+num(m.max)+" available"),"err"); return; }
    if(doTransferStock(m.code,m.loc,to,q,"",note)) moved=q; else fail++;
  } else {
    var e=wlStockIndex()[m.loc];
    (e?e.items:[]).forEach(function(it){
      if(doTransferStock(it.code,m.loc,to,it.qty,"",note)) moved+=it.qty; else fail++;
    });
  }
  if(!moved){ toast(th?"ย้ายไม่สำเร็จ — ยอดคงเหลือไม่พอ":"Move failed — not enough stock","err"); return; }

  var back=window._wlBack;
  window._wlMove=null;
  saveAll(); closeModal2(); closeModal();
  try{ if(current==="wh-dash"||current==="wh-layout") wlRoute(); else route(current); }catch(e2){}
  toast(th?("ย้าย "+num(moved)+" ชิ้น ไป "+to+(fail?(" · ข้าม "+fail+" รายการ"):""))
          :("Moved "+num(moved)+" pcs to "+to+(fail?(", skipped "+fail):"")),"ok");
  /* เปิดกล่องเดิมกลับมา จะได้ย้ายรายการอื่นต่อได้โดยไม่ต้องหาใหม่ */
  if(back) setTimeout(function(){
    try{ if(back.t==="cell") wlCellInfo(back.loc); else wlBayInfo(back.oid,back.bay); }catch(e3){}
  },260);
}

    +'<div class="modal-f"><div class="grow"></div>'
    +'<button class="btn btn-ghost" onclick="closeModal()">'+(th?"ปิด":"Close")+'</button></div>', true);

/* ═══════════ ลาก / ปรับขนาด ═══════════ */
function wlBind(){
  var svg=document.getElementById("wlSvg"); if(!svg) return;
  svg.addEventListener("pointerdown", wlDown);
}
function wlCm(ev,svg){
  var r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
  if(!r.width||!r.height) return {x:0,y:0};
  return { x:vb.x+(ev.clientX-r.left)*(vb.width/r.width),
           y:vb.y+(ev.clientY-r.top)*(vb.height/r.height) };
}
function wlDown(ev){
  var svg=document.getElementById("wlSvg"); if(!svg) return;
  var hEl=ev.target.closest?ev.target.closest("[data-handle]"):null;
  var cEl=ev.target.closest?ev.target.closest("[data-cell]"):null;
  var bEl=ev.target.closest?ev.target.closest("[data-bay]"):null;
  var gEl=ev.target.closest?ev.target.closest("[data-oid]"):null;

  if(cEl){ /* ช่องในมุมด้านข้าง → เปิดรายการสินค้า */
    var o1=wlObj(cEl.getAttribute("data-oid"));
    var lc=o1&&o1.cells?o1.cells[cEl.getAttribute("data-cell")]:"";
    if(lc) wlCellInfo(lc); else { WL.sel=o1?o1.id:null; wlPaint(); }
    return;
  }
  if(!gEl){ if(WL.sel){ WL.sel=null; wlPaint(); } return; }

  var id=gEl.getAttribute("data-oid")||gEl.getAttribute("data-handle");
  var o=wlObj(id); if(!o) return;

  if(WL.mode==="stock"){
    /* คลิกช่องในมุมบนแล้วมีรหัสเดียว → เปิดรายการเลย ไม่งั้นเลือกไว้ดูในแผงขวา */
    if(bEl&&o.kind==="rack"){
      var bay=+bEl.getAttribute("data-bay");
      var locs=wlCells(o).filter(function(c){ return c.bay===bay&&c.loc; });
      if(locs.length===1){ wlCellInfo(locs[0].loc); return; }
      if(locs.length){ wlBayInfo(o.id,bay); return; }
    }
    if(o.kind==="rack"){ wlBayInfo(o.id,"*"); return; }
    if(o.loc){ wlCellInfo(o.loc); return; }
    WL.sel=id; wlPaint(); return;
  }
  if(WL.view!=="top"){ WL.sel=id; wlPaint(); return; }   /* แก้ไขได้เฉพาะมุมบน */

  var p=wlPlan(WL.wh), st=wlCm(ev,svg), b=wlBox(o);
  var mode=hEl?"size":"move";
  var start={ x:o.x, y:o.y, w:+o.w||10, d:+o.d||10 };
  WL.sel=id;
  if(mode==="move") wlPaint();            /* วาดใหม่ให้เห็นกรอบที่เลือก ก่อนเริ่มลาก */
  svg=document.getElementById("wlSvg");
  var gNow=svg.querySelector('g[data-oid="'+id+'"]');
  var snap=function(v){ var g=Math.max(1,p.grid); return Math.round(v/g)*g; };

  var move=function(e2){
    var cur=wlCm(e2,svg), dx=cur.x-st.x, dy=cur.y-st.y;
    if(mode==="move"){
      var bb=wlBox(o);
      o.x=Math.max(0,Math.min(snap(start.x+dx), p.w-bb.w));
      o.y=Math.max(0,Math.min(snap(start.y+dy), p.d-bb.d));
      if(gNow) gNow.setAttribute("transform", (o.kind==="spot")
        ? ("translate("+(o.x+bb.w/2)+" "+(o.y+bb.d/2)+")")
        : ("translate("+o.x+" "+o.y+")"));
    } else {
      var rot=(+o.rot||0)%180===90;
      var nw=Math.max(20,snap(start.w+(rot?dy:dx)));
      var nd=Math.max(20,snap(start.d+(rot?dx:dy)));
      o.w=Math.min(nw, rot?(p.d-o.y):(p.w-o.x));
      o.d=Math.min(nd, rot?(p.w-o.x):(p.d-o.y));
      wlPaint(); svg=document.getElementById("wlSvg");
    }
  };
  var up=function(){
    window.removeEventListener("pointermove",move);
    window.removeEventListener("pointerup",up);
    wlClamp(o,p); wlTouch(); wlPaint();
  };
  window.addEventListener("pointermove",move);
  window.addEventListener("pointerup",up);
  ev.preventDefault();
}

  return head+kpis+wlFindBar(p,th)+bar
    +'<div class="wl-dash">'
      +'<div class="wl-stage" id="wlStage"></div>'
      +'<div class="panel wl-rank">'
        +'<div class="panel-h"><span class="ph-ic">'+IC.report+'</span><b>'+(th?"จุดที่มีของมากที่สุด":"Busiest locations")+'</b></div>'
        +'<div class="panel-b" id="wlDashRank">'+wlDashRank(p,idx)+'</div>'
      +'</div>'
    +'</div>';
};
/* ตัวเลขสรุปของผัง — เรียกซ้ำได้ ใช้ตอนอัปเดตสดโดยไม่วาดหน้าใหม่ */
function wlDashKpis(p,idx){
  var th=lang==="th";
  var cells=0, linked=0, used=0, qty=0, racks=0, plts=0, mixed=0;
  p.objs.forEach(function(o){
    if(o.kind==="rack") racks++;
    if(o.kind==="pallet") plts++;
    if(o.kind!=="rack"&&o.kind!=="pallet"&&o.kind!=="floor") return;
    wlCells(o).forEach(function(c){
      cells++;
      if(!c.loc) return;
      linked++;
      var q=wlCellQty(idx,c.loc);
      if(q){ used++; qty+=q; }
      if(wlMixN(idx,c.loc)) mixed++;
    });
  });
  var util=cells?Math.round(used/cells*100):0;
  var kpi=function(ic,v,lb){
    return '<div class="nstat" style="cursor:default" title="'+esc(lb)+'"><div class="ns-ic">'+ic+'</div>'
      +'<div class="ns-body"><div class="ns-val">'+v+'</div><div class="ns-lb">'+esc(lb)+'</div></div></div>';
  };
  return kpi(IC.warehouse, num(racks),                 th?"ชั้นวาง":"Racks")
    +kpi(IC.box,       num(plts),                      th?"พาเลท":"Pallets")
    +kpi(IC.link,      num(linked)+"/"+num(cells),     th?"ช่องที่ผูก Location":"Linked cells")
    +kpi(IC.check,     num(used),                      th?"ช่องที่มีของ":"Occupied")
    +kpi(IC.report,    util+"%",                       th?"อัตราใช้พื้นที่":"Utilisation")
    +kpi(IC.warn,      num(mixed),                     th?"ช่องที่เก็บสินค้าปนกัน":"Mixed-item cells")
    +kpi(IC.box,       num(qty),                       th?"ชิ้นรวมในผัง":"Total pcs");
}
/* อันดับจุดที่มีของมากสุด — เรียกซ้ำได้เช่นกัน */
function wlDashRank(p,idx){
  var th=lang==="th", rank=[], linked=0, used=0;
  p.objs.forEach(function(o){ wlCells(o).forEach(function(c){
    if(o.kind!=="rack"&&o.kind!=="pallet"&&o.kind!=="floor") return;
    if(!c.loc) return;
    linked++;
    var q=wlCellQty(idx,c.loc); if(!q) return;
    used++;
    rank.push({loc:c.loc, qty:q, owner:o.code||wlKindName(o.kind), n:((idx[c.loc]||{}).items||[]).length});
  }); });
  rank.sort(function(a,b){ return b.qty-a.qty; });
  var maxQ=rank.length?rank[0].qty:1;
  var rows=rank.slice(0,10).map(function(r){
    return '<div class="wl-rk" data-l="'+esc(r.loc)+'" onclick="wlCellInfo(this.dataset.l)" title="'+(th?"ดูรายการสินค้า":"View items")+'">'
      +'<b>'+esc(r.loc)+'</b>'
      +'<span>'+esc(r.owner)+' · '+num(r.n)+(th?" รายการ":" items")
        +(r.n>1?' <em class="wl-mixtag">'+(th?"ปนกัน":"mixed")+'</em>':'')+'</span>'
      +'<i><u style="width:'+Math.max(4,Math.round(r.qty/maxQ*100))+'%"></u></i>'
      +'<em>'+num(r.qty)+'</em></div>';
  }).join("")||'<p class="wl-hint">'+(th?"ยังไม่มีสินค้าในจุดที่ผูกไว้":"No stock in bound locations")+'</p>';
  return rows+'<p class="wl-hint">'+(th?("ช่องที่ผูกไว้แล้วแต่ยังว่าง "+num(linked-used)+" ช่อง"):(num(linked-used)+" linked cells are empty"))+'</p>';
}

/* ═══ ไลฟ์แดชบอร์ดผังคลัง ═══
   เฝ้ายอดคงเหลือรายโลเคชัน ถ้ามีของเข้า/ออกจะเด้งป้าย +N / −N ลอยอยู่เหนือจุดนั้นบนผัง
   ข้อมูลจากเครื่องนี้เห็นทันที ส่วนของคนอื่นเห็นภายในรอบ sync (ค่าเริ่มต้น 5 วิ) */
var WLD={ prev:null, badges:[], timer:null, lastAt:0, raf:0, wh:"" };
var WL_BADGE_MS=9000;     /* ป้ายอยู่บนจอ 9 วิแล้วจางหาย */
var WL_LIVE_MS=1200;      /* รอบตรวจความเปลี่ยนแปลง */

function wlLiveStop(){
  if(WLD.timer){ clearInterval(WLD.timer); WLD.timer=null; }
  WLD.badges.forEach(function(b){ if(b.el&&b.el.parentNode) b.el.remove(); });
  WLD.badges=[]; WLD.prev=null; WLD.wh="";
}
function wlLiveAlive(){
  return !!document.getElementById("wlStage")
    && current==="wh-dash";
}
function wlLiveStart(){
  if(WLD.timer){ clearInterval(WLD.timer); WLD.timer=null; }
  /* เปลี่ยนคลังค่อยเริ่มนับใหม่ — ถ้าเป็นการวาดหน้าใหม่หลัง sync ต้องเก็บค่าเดิมไว้เทียบ
     ไม่งั้นของที่คนอื่นทำจะโดนกลืนไปกับการรีเซ็ต แล้วป้ายไม่เด้งสักที */
  var fresh=(WLD.wh!==WL.wh);
  if(fresh){
    WLD.badges.forEach(function(b){ if(b.el&&b.el.parentNode) b.el.remove(); });
    WLD.badges=[]; WLD.prev=null;
  }
  WLD.wh=WL.wh;
  wlLiveTick(fresh||!WLD.prev);
  WLD.timer=setInterval(wlLiveTick, WL_LIVE_MS);
  var st=document.getElementById("wlStage");
  if(st && !st._wlFxScroll){
    st._wlFxScroll=true;
    st.addEventListener("scroll", function(){
      if(WLD.raf) return;
      WLD.raf=requestAnimationFrame(function(){ WLD.raf=0; wlLiveBadges(); });
    });
  }
}
function wlLiveSnap(idx){
  var m={}; Object.keys(idx).forEach(function(l){ m[l]=idx[l].qty||0; }); return m;
}
function wlLiveTick(first){
  if(!wlLiveAlive()){ wlLiveStop(); return; }
  var idx=wlStockIndex(), now=wlLiveSnap(idx);
  if(first||!WLD.prev){ WLD.prev=now; wlLiveBadges(); return; }

  var seen={}, ch=[];
  Object.keys(now).forEach(function(k){ seen[k]=1; });
  Object.keys(WLD.prev).forEach(function(k){ seen[k]=1; });
  Object.keys(seen).forEach(function(l){
    var d=(now[l]||0)-(WLD.prev[l]||0);
    if(d) ch.push({loc:l, d:d});
  });
  WLD.prev=now;
  if(!ch.length){ wlLiveBadges(); return; }

  var t=Date.now();
  ch.forEach(function(c){
    /* จุดเดิมที่เพิ่งเด้งไป ให้รวมยอดเข้ากับป้ายเดิมแทนที่จะซ้อนกันหลายใบ */
    var old=WLD.badges.filter(function(b){ return b.loc===c.loc; })[0];
    if(old){ old.d+=c.d; old.t=t; old.dirty=true; }
    else WLD.badges.push({loc:c.loc, d:c.d, t:t, dirty:true});
  });
  WLD.lastAt=t;

  /* ตัวเลขสรุปกับอันดับอัปเดตในที่ ไม่ต้องวาดหน้าใหม่ทั้งหน้า (ซูม/สกรอลล์จะได้ไม่เด้ง) */
  var p=wlPlan(WL.wh);
  var k=document.getElementById("wlDashKpis"); if(k) k.innerHTML=wlDashKpis(p,idx);
  var r=document.getElementById("wlDashRank"); if(r) r.innerHTML=wlDashRank(p,idx);
  wlPaint();                 /* ไล่สีใหม่ตามยอดล่าสุด (ป้ายไม่ถูกลบ) */
  wlLiveBadges();
  wlLiveStamp();
}
function wlLiveStamp(){
  var e=document.getElementById("wlLiveAt"); if(!e) return;
  var th=lang==="th";
  e.textContent=WLD.lastAt
    ? (th?"อัปเดตล่าสุด ":"updated ")+new Date(WLD.lastAt).toLocaleTimeString(th?"th-TH":"en-GB")
    : (th?"กำลังเฝ้าดู":"watching");
}
/* หา element บนผังที่ตรงกับ Location นี้ */
function wlLocEl(loc){
  var p=wlPlan(WL.wh), svg=document.getElementById("wlSvg");
  if(!svg) return null;
  for(var i=0;i<p.objs.length;i++){
    var o=p.objs[i];
    if(o.kind==="rack"&&o.cells){
      var keys=Object.keys(o.cells);
      for(var j=0;j<keys.length;j++){
        if(o.cells[keys[j]]!==loc) continue;
        var cell=svg.querySelector('[data-oid="'+o.id+'"][data-cell="'+keys[j]+'"]');
        if(cell) return cell;
        var bay=keys[j].split("-")[1];
        var b=svg.querySelector('g[data-oid="'+o.id+'"] [data-bay="'+bay+'"]');
        return b||svg.querySelector('g[data-oid="'+o.id+'"]');
      }
    } else if(o.loc===loc){
      return svg.querySelector('g[data-oid="'+o.id+'"]');
    }
  }
  return null;
}
function wlLiveBadges(){
  var stage=document.getElementById("wlStage"); if(!stage) return;
  var ov=stage.querySelector(".wl-fx");
  if(!ov){ ov=document.createElement("div"); ov.className="wl-fx"; stage.appendChild(ov); }
  var t=Date.now(), sr=stage.getBoundingClientRect(), th=lang==="th";
  WLD.badges=WLD.badges.filter(function(b){
    if(t-b.t>=WL_BADGE_MS){ if(b.el&&b.el.parentNode) b.el.remove(); return false; }
    return true;
  });
  WLD.badges.forEach(function(b){
    if(!b.el){
      b.el=document.createElement("div");
      b.el.className="wl-fxi";
      b.el.innerHTML='<i class="wl-ring"></i><span class="wl-bg"></span>';
      b.dirty=true;
    }
    if(b.el.parentNode!==ov) ov.appendChild(b.el);
    if(b.dirty){
      b.el.className="wl-fxi "+(b.d>0?"up":"dn");
      b.el.querySelector(".wl-bg").innerHTML=
        '<b>'+(b.d>0?"+":"−")+num(Math.abs(b.d))+'</b><em>'+esc(b.loc)+'</em>';
      /* เล่นอนิเมชันใหม่ทุกครั้งที่ยอดเปลี่ยน จะได้สังเกตเห็น */
      b.el.style.animation="none"; void b.el.offsetWidth; b.el.style.animation="";
      var rg=b.el.querySelector(".wl-ring");
      rg.style.animation="none"; void rg.offsetWidth; rg.style.animation="";
      b.dirty=false;
    }
    var el=wlLocEl(b.loc);
    if(!el){ b.el.style.display="none"; return; }
    var er=el.getBoundingClientRect();
    if(!er.width&&!er.height){ b.el.style.display="none"; return; }
    b.el.style.display="";
    /* วางกรอบทับช่องนั้นพอดี ป้ายตัวเลขเกาะอยู่ด้านบน (ชนขอบบนก็พลิกลงล่าง) */
    b.el.style.left  =(er.left-sr.left+stage.scrollLeft).toFixed(0)+"px";
    b.el.style.top   =(er.top -sr.top +stage.scrollTop ).toFixed(0)+"px";
    b.el.style.width =Math.max(10,er.width ).toFixed(0)+"px";
    b.el.style.height=Math.max(10,er.height).toFixed(0)+"px";
    b.el.classList.toggle("below", (er.top-sr.top)<54);
  });
}


/* ---- menus, pages, rights ---- */
Object.assign(I18N.en,{whMap:"Warehouse Layout",whDash:"Current Layout",whDashSub:"Floor plan shaded by stock — click a cell to see its items",

Object.assign(I18N.th,{whMap:"ผังคลังสินค้า",whDash:"ดูผังคลัง (ปัจจุบัน)",whDashSub:"ผังโกดังไล่สีตามปริมาณของ — กดที่ช่องเพื่อดูสินค้าในช่องนั้น",
  whLayout:"ออกแบบผังคลัง",whLayoutSub:"วาดชั้นวาง · พาเลท · โซน แล้วผูกแต่ละช่องกับรหัส Location"});
PAGE["wh-dash"]={crumb:["whMap","whDash"],title:"whDash",sub:"whDashSub",icon:IC.warehouse};
PAGE["wh-layout"]={crumb:["whMap","whLayout"],title:"whLayout",sub:"whLayoutSub",icon:IC.warehouse};
GROUP_OF["wh-dash"]="whmap"; GROUP_OF["wh-layout"]="whmap";

  var grp={group:"whmap",icon:IC.warehouse,label:"whMap",children:[{id:"wh-dash",label:"whDash"},{id:"wh-layout",label:"whLayout"}]};
  [NAV, window.NAV_ORIG].forEach(function(arr){ if(!Array.isArray(arr)||arr.some(function(n){ return n.group==="whmap"; })) return;

    if(w&&w.keys.indexOf("whmap")<0) w.keys=w.keys.concat("whmap"); return s; };
})();
var _canSeeWl=canSee; canSee=function(id){
  if(id==="wh-layout"&&!isMgrUp()) return false;                     // designing the layout: Manager or above
  return _canSeeWl(id); };
/* leaving the designer saves unsaved work once; leaving the layout pages ends full-screen */
/* a refresh / tab close while designing: unsaved layout work joins the save queue first (sent now, or replayed next load) */
var _flushWl=Store.flushRemote; Store.flushRemote=function(){ try{ if(WL.dirty) wlFlush(); }catch(e){} return _flushWl.apply(Store,arguments); };
var _routeWl=route; route=function(page,params){
  var leaving=page&&page!=="wh-layout"&&page!=="wh-dash";
  try{ if(current==="wh-layout"&&page&&page!=="wh-layout") wlFlush(); }catch(e){}
  try{ if(leaving) wlWalkStop(); }catch(e){}                       /* the walk animation ends with the page */
  try{ if(leaving&&wlFullIsOn()) wlFullOff(); }catch(e){}
  return _routeWl(page,params); };
/* the 10-second background pull redraws from server data — while the designer has unsaved work it waits */
var _pullWl=Store.loadRemoteSilent; Store.loadRemoteSilent=function(){ if(WL.dirty) return Promise.resolve(false); return _pullWl.apply(Store,arguments); };
/* "sync now" and switching company: the unsaved layout joins the save queue first (it belongs to the current company) */
var _syncWl=syncFromServer; syncFromServer=function(){ try{ if(WL.dirty) wlFlush(); }catch(e){} return _syncWl.apply(this,arguments); };
var _swWl=switchCompany; switchCompany=function(){ try{ if(WL.dirty) wlFlush(); }catch(e){} return _swWl.apply(this,arguments); };

<script id="loc-bulk">
/* ── Location Master › Add: many codes under one warehouse at once — type the first code, + continues the numbering ── */
(function(){
var L=function(th,en){ return lang==="th"?th:en; };
/* next code: +1 on the last number, keeping its width (A-01-01 → A-01-02, RACK-9 → RACK-10) */
function locNextCode(c){
  c=String(c||"").trim();
  var m=c.match(/^(.*?)(\d+)(\D*)$/);
  if(!m) return c?c+"-02":"";
  var w=m[2].length, n=String(parseInt(m[2],10)+1);
  if(n.length<w) n=n.padStart(w,"0");
  return m[1]+n+m[3];
}
function rowsHtml(){
  var rows=window._lcRows||[];
  return rows.map(function(c,i){
    return '<div class="lc-ln">'
      +'<span class="lc-no">'+(i+1)+'</span>'
      +'<input class="inp" value="'+esc(c)+'" spellcheck="false" placeholder="'+L("เช่น A-01-01","e.g. A-01-01")+'" oninput="locRowSet('+i+',this.value)">'
      +'<em class="lc-st" id="lc_st'+i+'"></em>'
      +'<button class="btn btn-ghost btn-sm danger" onclick="locDelRow('+i+')"'+(rows.length<=1?' disabled':'')+'>'+IC.trash+'</button>'
    +'</div>';
  }).join("");
}
function render(focusLast){
  var box=document.getElementById("lc_rows"); if(!box) return;
  box.innerHTML=rowsHtml(); sync();
  box.scrollTop=box.scrollHeight;
  if(focusLast){ var ins=box.querySelectorAll("input"); if(ins.length) ins[ins.length-1].focus(); }
}
/* each row: new / duplicate in the list / already in the system */
function sync(){
  var rows=window._lcRows||[], seen={}, ok=0, have={};
  (DB.locationMaster||[]).forEach(function(l){ have[String(l.code).trim().toUpperCase()]=1; });
  rows.forEach(function(c,i){
    var el=document.getElementById("lc_st"+i); if(!el) return;
    var k=String(c||"").trim().toUpperCase(), msg="", cls="";
    if(!k){ msg=""; }
    else if(seen[k]){ msg=L("ซ้ำในรายการ","duplicate"); cls="bad"; }
    else if(have[k]){ msg=L("มีอยู่แล้ว","exists"); cls="bad"; }
    else { msg=L("ใหม่","new"); cls="ok"; ok++; }
    if(k) seen[k]=1;
    el.textContent=msg; el.className="lc-st "+cls;
  });
  var cEl=document.getElementById("lc_count"); if(cEl) cEl.textContent=L("จะสร้าง "+ok+" รายการ",ok+" to create");
  var bEl=document.getElementById("lc_saveBtn"); if(bEl) bEl.disabled=!ok;
}
window.locRowSet=function(i,v){ (window._lcRows||[])[i]=v; sync(); };
window.locDelRow=function(i){ var r=window._lcRows||[]; if(r.length<=1) return; r.splice(i,1); render(); };
window.locAddRows=function(n){
  var rows=window._lcRows||[""], last=String(rows[rows.length-1]||"").trim();
  if(!last){ toast(L("ใส่รหัสแรกก่อน แล้วกด + ระบบจะไล่เลขต่อให้","Enter the first code, then press +"),"warn");
    var f=document.querySelector("#lc_rows input"); if(f) f.focus(); return; }
  for(var i=0;i<n;i++){ last=locNextCode(last); rows.push(last); }
  window._lcRows=rows; render(true);
};
window.locWhChange=function(){
  var sel=document.getElementById("lc_wh"), nw=document.getElementById("lc_whNew"); if(!sel||!nw) return;
  var isNew=(sel.value==="__NEW__"); nw.style.display=isNew?"":"none"; if(isNew) nw.focus();
};
window.openAddLocations=function(){
  if(!isMgrUp()){ toast(t("adminOnly"),"err"); return; }
  var whs=[...new Set((DB.locationMaster||[]).map(function(x){ return x.warehouse; }).filter(Boolean))].sort();
  var pre=whs.length===1?whs[0]:"";
  var whOpts='<option value="">-- '+L("เลือกคลัง","Select warehouse")+' --</option>'
    +whs.map(function(w){ return '<option value="'+esc(w)+'"'+(w===pre?" selected":"")+'>'+esc(w)+'</option>'; }).join("")
    +'<option value="__NEW__">+ '+L("สร้างคลังใหม่","New warehouse")+'</option>';
  window._lcRows=[""];
  modalShell(IC.pin, L("เพิ่ม Location","Add Locations"), L("เพิ่มได้หลายรหัสในครั้งเดียว ภายใต้คลังเดียวกัน","Add many codes at once under one warehouse"),
    '<div class="grid2">'
      +field("warehouse",'<select class="inp" id="lc_wh" data-nocbx onchange="locWhChange()">'+whOpts+'</select>'
        +'<input class="inp" id="lc_whNew" style="display:none;margin-top:8px" spellcheck="false" placeholder="'+L("ชื่อคลังใหม่ เช่น WH-02","New warehouse e.g. WH-02")+'">',true)
      +field("locZone",'<input class="inp" id="lc_cat">')
      +field("locCapacity",'<input class="inp" id="lc_cap" type="number" min="0" value="">')
      +field("desc",'<input class="inp" id="lc_desc">')

<script id="update-notifier">
/* ═══ Software update notice ═══
   Every 2 minutes (and when the tab comes back) it checks two fingerprints:
     1) this page file itself (ETag / Last-Modified / size from a no-cache HEAD request)
     2) the backend: api_supabase.php?action=version (hash of the deployed files)
   When either changes while the page is open, a card appears top-right. "Updated — refresh" saves any
   pending work, clears the app caches and reloads from the server (same as Ctrl+Shift+R). */
(function(){
  "use strict";
  var EVERY=120000;
  // drop the cache-buster added by the last update so the address stays clean
  try{ var u0=new URL(location.href); if(u0.searchParams.has("_v")){ u0.searchParams.delete("_v"); history.replaceState(null,"",u0.pathname+(u0.search||"")+u0.hash); } }catch(e){}
  var api=""; try{ api=CONFIG.API_BASE; }catch(e){} if(!api){ try{ api=PHP_API; }catch(e){} }
  function th(){ try{ return (typeof lang!=="undefined"?lang:LANG)!=="en"; }catch(e){ return true; } }
  function T(a,b){ return th()?a:b; }

  function stampOf(r){ if(!r||!r.ok) return ""; return [r.headers.get("etag")||"",r.headers.get("last-modified")||"",r.headers.get("content-length")||""].join("~").replace(/^~+$/,""); }
  /* always the same method (HEAD): GET responses may carry a different ETag / length (compression) and look like an
     update. A host that can't answer HEAD is simply not watched this way — the backend version check still is. */
  var headOK=true;
  function pageStamp(){
    if(!headOK) return Promise.resolve("");
    return fetch(location.pathname+"?_upd="+Date.now(),{method:"HEAD",cache:"no-store"})
      .then(function(r){ if(r.status===405||r.status===501){ headOK=false; return ""; } return stampOf(r); })
      .catch(function(){ headOK=false; return ""; });            // unreadable HEAD on this host: stop asking (one console line, not one every check)
  }
  function apiStamp(){
    if(!api) return Promise.resolve("");
    return fetch(api+(api.indexOf("?")<0?"?":"&")+"action=version&_="+Date.now(),{cache:"no-store"})
      .then(function(r){ return r.ok?r.json():null; }).then(function(j){ return (j&&j.version)||""; })
      .catch(function(){ return ""; });
  }
  var base=["",""], seen=null, snoozeUntil=0, card=null, busy=false;
  function check(){
    if(busy) return;
    if(document.hidden&&(base[0]||base[1])) return;          // the first look (baseline) is taken even in a background tab
    Promise.all([pageStamp(),apiStamp()]).then(function(v){
      var changed=false;
      for(var i=0;i<2;i++){
        if(!v[i]) continue;                         // offline / not available: never counts as an update
        if(!base[i]) base[i]=v[i];
        else if(v[i]!==base[i]) changed=true;
      }
      if(!changed) return;
      if(Date.now()<snoozeUntil) return;                 // closed: quiet for 30 minutes, whatever the stamps do
      seen=v.join("|"); show();
    });
  }

  function show(){
    if(card) return;
    card=document.createElement("div");
    card.setAttribute("role","alertdialog");
    card.style.cssText="position:fixed;top:16px;right:16px;max-height:calc(100vh - 32px);overflow:auto;z-index:2147483000;width:min(340px,calc(100vw - 32px));background:#fff;color:#1f2329;"
      +"border:1px solid #e6e8eb;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:14px 14px 12px;font:14px/1.45 system-ui,-apple-system,'Segoe UI','Noto Sans Thai',sans-serif;"
      +"transform:translateY(-12px);opacity:0;transition:transform .25s ease,opacity .25s ease";
    card.innerHTML=
      '<div style="display:flex;gap:12px;align-items:flex-start">'
      +'<div style="flex:0 0 38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#fb923c,#ea580c);display:flex;align-items:center;justify-content:center">'
      +'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg></div>'
      +'<div style="flex:1;min-width:0"><div data-t style="font-weight:800;font-size:15px;margin-bottom:2px"></div><div data-d style="color:#5b6370;font-size:13px"></div></div>'
      +'<button data-x type="button" aria-label="close" style="border:0;background:transparent;color:#8a919c;font-size:18px;line-height:1;cursor:pointer;padding:2px 4px">✕</button></div>'
      +'<button data-ok type="button" style="margin-top:12px;width:100%;border:0;border-radius:10px;padding:10px 12px;background:#f97316;color:#fff;font-weight:800;font-size:14px;cursor:pointer"></button>';
    card.querySelector("[data-t]").textContent=T("มีการอัปเดตซอฟต์แวร์","Software update available");
    card.querySelector("[data-d]").textContent=T("ระบบมีเวอร์ชันใหม่ กดปุ่มด้านล่างเพื่อบันทึกงานที่ค้างและโหลดเวอร์ชันล่าสุด",
                                                  "A new version is available. Press the button to save pending work and load the latest version.");
    var ok=card.querySelector("[data-ok]"); ok.textContent=T("ยืนยันอัปเดตซอฟต์แวร์ และรีเฟรช","Confirm update & refresh");
    ok.onclick=update;
    card.querySelector("[data-x]").onclick=function(){ snoozeUntil=Date.now()+30*60000; hide(); };
    card.style.top=cardTop()+"px";
    document.body.appendChild(card);
    requestAnimationFrame(function(){ card.style.transform="none"; card.style.opacity="1"; });
  }
  /* sit just below the header / language buttons on the right, so they stay usable */
  function cardTop(){
    var top=16, zone=Math.max(0,window.innerWidth-Math.min(360,window.innerWidth));   // the strip the card covers
    var sel=".top,.topbar,.lang,.loginmode,header,[class*=lang]";
    [].forEach.call(document.querySelectorAll(sel),function(e){
      if(card&&card.contains(e)) return;
      var r=e.getBoundingClientRect(), cs=getComputedStyle(e);
      if(!r.width||!r.height||cs.visibility==="hidden"||cs.display==="none") return;
      if(r.top>200||r.bottom<=0||r.right<zone) return;            // only things in the top-right corner
      top=Math.max(top,Math.round(r.bottom+10));
    });
    return Math.min(top,220);
  }
  window.addEventListener("resize",function(){ if(card) card.style.top=cardTop()+"px"; });
  function hide(){ if(!card) return; var c=card; card=null; c.style.opacity="0"; c.style.transform="translateY(-12px)"; setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },260); }

  /* save pending work first (each page has its own save layer) */
  function flushAll(){
    var waits=[];
    try{ if(typeof Store!=="undefined"){
      if(typeof Store.flushNow==="function") waits.push(Promise.resolve(Store.flushNow(true)).catch(function(){}));      // POS
      else if(typeof Store.flushRemote==="function") waits.push(Promise.resolve(Store.flushRemote()).catch(function(){})); // web (resolves when the server confirmed)
    } }catch(e){}
    try{ if(typeof saveByTableM==="function"&&typeof _saveDirty!=="undefined"&&_saveDirty)                                // mobile
      waits.push(Promise.resolve(saveByTableM()).then(function(r){ if(r&&r.ok) _saveDirty=false; }).catch(function(){})); }catch(e){}
    waits.push(new Promise(function(r){ setTimeout(r,300); }));
    return Promise.race([Promise.all(waits),new Promise(function(r){ setTimeout(r,10000); })]);
  }
  /* anything still not confirmed by the server? then we must not reload */
  function pendingLeft(){
    try{ if(typeof Store!=="undefined"){
      if(typeof Store.hasPending==="function") return Store.hasPending();
      if(typeof Store._pendLoad==="function"){ var o=Store._pendLoad(); return !!(o&&(o.cur||(o.base&&o.base.length))); }
    } }catch(e){}
    try{ if(typeof _saveDirty!=="undefined") return !!_saveDirty; }catch(e){}
    return false;
  }
  /* like Ctrl+Shift+R: drop the cached app files and load everything again from the server */
  function update(){
    if(busy) return; busy=true;
    var ok=card&&card.querySelector("[data-ok]"); if(ok){ ok.disabled=true; ok.style.opacity=".7"; ok.textContent=T("กำลังอัปเดต…","Updating…"); }
    flushAll().then(function(){
      if(pendingLeft()){                                    // never reload with unsaved work
        busy=false; if(ok){ ok.disabled=false; ok.style.opacity=""; ok.textContent=T("ยืนยันอัปเดตซอฟต์แวร์ และรีเฟรช","Confirm update & refresh"); }
        var d=card&&card.querySelector("[data-d]"); if(d){ d.style.color="#c2410c"; d.textContent=T("ยังบันทึกงานขึ้นเซิร์ฟเวอร์ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต แล้วกดอีกครั้ง","Your work isn't saved to the server yet — check the connection and press again"); }
        return Promise.reject("pending");
      }
      var jobs=[];
      try{ if(window.caches&&caches.keys) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(e){}
      try{ if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.update().catch(function(){}); })); })); }catch(e){}
      return Promise.race([Promise.all(jobs),new Promise(function(r){ setTimeout(r,3000); })]);
    }).then(function(){
      var u=new URL(location.href); u.searchParams.set("_v",Date.now());   // bypass the HTTP cache for the page itself
      location.replace(u.toString());
    },function(e){ if(e!=="pending"){ var u=new URL(location.href); u.searchParams.set("_v",Date.now()); location.replace(u.toString()); } });
  }

  setTimeout(check,1500);                                    // baseline right after load
  setInterval(check,EVERY);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) check(); });
  window.addEventListener("focus",check);
  window.__checkForUpdate=check;          // handy for testing from the console
})();
</script>
