<script>
(function(){
  function lbl(sel){ var o=sel.options[sel.selectedIndex]; return o?o.text:""; }
  function enhance(sel){
    if(!sel || sel.__enh || sel.multiple) return;
    if(sel.hasAttribute('data-nocbx')) return;                      // small selects inside grids (e.g. warehouse-layout cells) stay native
    if(sel.closest && sel.closest('.ssel')) return;
    sel.__enh=true;
    var wrap=document.createElement('div'); wrap.className='ssel';
    var _st=sel.getAttribute('style'); if(_st) wrap.setAttribute('style',_st);
    if(sel.parentNode){ sel.parentNode.insertBefore(wrap, sel); } else { return; }
    wrap.appendChild(sel); sel.style.display='none';
    var inp=document.createElement('input'); inp.type='text'; inp.className='inp ssel-in'; inp.setAttribute('autocomplete','off'); inp.setAttribute('inputmode','search');
    var car=document.createElement('div'); car.className='ssel-caret'; car.innerHTML='&#9662;';
    var pan=document.createElement('div'); pan.className='ssel-pan';
    wrap.appendChild(inp); wrap.appendChild(car); wrap.appendChild(pan);
    inp.disabled=sel.disabled;
    function build(f){ pan.innerHTML=''; f=(f||'').toLowerCase().trim(); var any=false;
      for(var i=0;i<sel.options.length;i++){ var o=sel.options[i];
        if(f && (o.text||'').toLowerCase().indexOf(f)<0) continue; any=true;
        var d=document.createElement('div'); d.className='ssel-opt'+(o.selected?' sel':''); d.textContent=o.text; d.setAttribute('data-i',i);
        d.addEventListener('mousedown', function(ev){ ev.preventDefault(); pick(+this.getAttribute('data-i')); });
        pan.appendChild(d);
      }
      if(!any){ var e=document.createElement('div'); e.className='ssel-empty'; e.textContent='—'; pan.appendChild(e); }
    }
    function open(){ if(sel.disabled)return; build(''); wrap.classList.add('open'); inp.value=''; try{inp.focus();}catch(e){} }
    function close(){ wrap.classList.remove('open'); inp.value=lbl(sel); }
    function pick(i){ sel.selectedIndex=i; try{ sel.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){} inp.value=lbl(sel); wrap.classList.remove('open'); }
    inp.value=lbl(sel);
    inp.addEventListener('focus', function(){ if(!wrap.classList.contains('open')) open(); });
    inp.addEventListener('input', function(){ wrap.classList.add('open'); build(inp.value); });
    car.addEventListener('mousedown', function(ev){ ev.preventDefault(); if(wrap.classList.contains('open')) close(); else open(); });
    inp.addEventListener('blur', function(){ setTimeout(function(){ if(document.activeElement!==inp && !wrap.contains(document.activeElement)) close(); }, 130); });
    sel.addEventListener('change', function(){ if(!wrap.classList.contains('open')) inp.value=lbl(sel); });
  }
  function enhanceList(inp){
    if(!inp || inp.__enh) return;
    if(inp.closest && inp.closest('.ssel')) return;
    var dlId=inp.getAttribute('list'); var dl=dlId?document.getElementById(dlId):null; if(!dl) return;
    inp.__enh=true;
    var opts=[].slice.call(dl.querySelectorAll('option')).map(function(o){ return {v:o.value||o.textContent, t:(o.textContent&&o.textContent!==o.value)?(o.value+' · '+o.textContent):(o.value||o.textContent)}; });
    inp.removeAttribute('list');   // hide native datalist dropdown
    var wrap=document.createElement('div'); wrap.className='ssel';
    var _st=inp.getAttribute('style'); if(_st) wrap.setAttribute('style',_st);
    if(!inp.parentNode) return; inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
    inp.classList.add('ssel-in'); inp.style.paddingRight='34px';
    var car=document.createElement('div'); car.className='ssel-caret'; car.innerHTML='&#9662;';
    var pan=document.createElement('div'); pan.className='ssel-pan';
    wrap.appendChild(car); wrap.appendChild(pan);
    function build(f){ pan.innerHTML=''; f=(f||'').toLowerCase().trim(); var any=false;
      opts.forEach(function(o){ if(f && o.t.toLowerCase().indexOf(f)<0) return; any=true;
        var d=document.createElement('div'); d.className='ssel-opt'; d.textContent=o.t; d.setAttribute('data-v',o.v);
        d.addEventListener('mousedown', function(ev){ ev.preventDefault(); inp.value=this.getAttribute('data-v');
          try{ inp.dispatchEvent(new Event('input',{bubbles:true})); }catch(e){} try{ inp.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){}
          wrap.classList.remove('open'); });
        pan.appendChild(d); });
      if(!any){ var e=document.createElement('div'); e.className='ssel-empty'; e.textContent='—'; pan.appendChild(e); }
    }
    inp.addEventListener('focus', function(){ build(inp.value); wrap.classList.add('open'); });
    inp.addEventListener('input', function(){ wrap.classList.add('open'); build(inp.value); });   // keep typed value (custom allowed)
    car.addEventListener('mousedown', function(ev){ ev.preventDefault(); if(wrap.classList.contains('open')) wrap.classList.remove('open'); else { build(''); wrap.classList.add('open'); inp.focus(); } });
    inp.addEventListener('blur', function(){ setTimeout(function(){ if(document.activeElement!==inp && !wrap.contains(document.activeElement)) wrap.classList.remove('open'); }, 130); });
  }
  function all(root){ try{ (root||document).querySelectorAll('select:not([multiple])').forEach(enhance); (root||document).querySelectorAll('input[list]').forEach(enhanceList); }catch(e){} }
  document.addEventListener('click', function(ev){
    var open=document.querySelectorAll('.ssel.open'); for(var i=0;i<open.length;i++){ var w=open[i];
      if(!w.contains(ev.target)){ w.classList.remove('open'); var s=w.querySelector('select'),n=w.querySelector('.ssel-in'); if(s&&n){ var o=s.options[s.selectedIndex]; n.value=o?o.text:''; } } }
  });
  var pend=null;
  /* let the app upgrade selects IN THE SAME FRAME as a re-render; otherwise this runs ~60ms
     later and pushes everything below it down — that is the stutter after every click */
  window.__enhanceNow=function(root){ clearTimeout(pend); all(root||document); };
  function boot(){ var mo=new MutationObserver(function(){ clearTimeout(pend); pend=setTimeout(function(){ all(document); }, 60); });
    try{ mo.observe(document.body,{childList:true,subtree:true}); }catch(e){} all(document); }
  if(document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);
})();
</script>

<script>
/* ---- install as an app (PWA): service worker + install button ---- */
(function(){
  var TH=function(){ try{ return (window.lang||window.LANG||"th")==="th"; }catch(e){ return true; } };
  window.__pwaPrompt=null;
  if("serviceWorker" in navigator) window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault(); window.__pwaPrompt=e; document.body.classList.add("can-install");
    try{ if(typeof renderTopbar==="function") renderTopbar(); }catch(_){}
  });
  window.addEventListener("appinstalled",function(){
    window.__pwaPrompt=null; document.body.classList.remove("can-install");
    try{ toast(TH()?"ติดตั้งแอปแล้ว":"App installed","ok"); }catch(_){}
  });
  window.pwaInstalled=function(){
    return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
  };
  window.pwaCanInstall=function(){ return !!window.__pwaPrompt; };
  /* iOS has no install prompt — it needs Share ▸ Add to Home Screen */
  window.pwaIsIOS=function(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; };
  window.installApp=function(){
    var th=TH();
    if(window.pwaInstalled()){ try{ toast(th?"กำลังใช้งานแบบแอปอยู่แล้ว":"Already running as an app","ok"); }catch(_){} return; }
    if(window.__pwaPrompt){
      window.__pwaPrompt.prompt();
      window.__pwaPrompt.userChoice.then(function(c){
        if(c && c.outcome==="accepted"){ window.__pwaPrompt=null; }
        else { try{ toast(th?"ยกเลิกการติดตั้ง":"Install cancelled","warn"); }catch(_){} }
      });
      return;
    }
    var msg = window.pwaIsIOS()
      ? (th?"iPhone/iPad: แตะปุ่มแชร์ (⬆) ด้านล่าง แล้วเลือก \"เพิ่มไปยังหน้าจอโฮม\""
           :"iPhone/iPad: tap the Share button (⬆) then \"Add to Home Screen\"")
      : (th?"เปิดเมนูเบราว์เซอร์ (⋮) แล้วเลือก \"ติดตั้งแอป\" / \"Add to Home screen\"\n(ต้องเปิดผ่าน https และรีเฟรชหน้าหนึ่งครั้งก่อน)"
           :"Open the browser menu (⋮) and choose \"Install app\" / \"Add to Home screen\"\n(needs https, and one page refresh first)");
    try{ alert(msg); }catch(_){}
  };
})();

<script id="popover-fix">
/* ═══ Dropdown / popover un-clipping ═══
   Searchable-select panels (.ssel-pan), autocomplete menus (.acmenu) and column menus (.colmenu) are
   absolutely positioned inside containers that scroll or clip (modal body, .tablewrap, .formtbl …), so
   they were cut off at the container edge. While open, they are switched to position:fixed at the
   anchor's on-screen position (flipping above the field when there is no room below) and restored
   when closed. Purely visual — the components' own logic is untouched. */
(function(){
  "use strict";
  var SEL='.ssel.open > .ssel-pan, .acmenu.open, .colmenu.open';
  var fixed=new Set();
  function anchorOf(p){ return p.parentNode; }
  function place(p){
    var a=anchorOf(p); if(!a||!a.getBoundingClientRect) return;
    var r=a.getBoundingClientRect(); if(!r.width&&!r.height) return;
    var vh=window.innerHeight, vw=window.innerWidth, isCol=p.classList.contains('colmenu');
    var w=isCol?Math.max(p.offsetWidth||0,190):Math.max(r.width,180);
    var below=vh-r.bottom-10, above=r.top-10, want=Math.min(260, p.scrollHeight||260);
    p.style.position='fixed'; p.style.zIndex='9999'; p.style.margin='0';
    if(isCol){ p.style.left='auto'; p.style.right=Math.max(8,vw-r.right)+'px'; p.style.width=''; }
    else { p.style.right='auto'; p.style.left=Math.max(8,Math.min(r.left, vw-8-w))+'px'; p.style.width=w+'px'; }
    if(below>=Math.min(want,160) || below>=above){ p.style.top=(r.bottom+4)+'px'; p.style.bottom='auto'; p.style.maxHeight=Math.max(120,Math.min(260,below))+'px'; }
    else { p.style.top='auto'; p.style.bottom=(vh-r.top+4)+'px'; p.style.maxHeight=Math.max(120,Math.min(260,above))+'px'; }
    fixed.add(p);
  }
  function reset(p){ ['position','left','right','top','bottom','width','maxHeight','zIndex','margin'].forEach(function(k){ p.style[k]=''; }); fixed.delete(p); }
  function sync(){
    var open=document.querySelectorAll(SEL); var live=new Set();
    for(var i=0;i<open.length;i++){ place(open[i]); live.add(open[i]); }
    fixed.forEach(function(p){ if(!live.has(p)) reset(p); });
  }
  var raf=null; function schedule(){ if(raf) return; raf=requestAnimationFrame(function(){ raf=null; sync(); }); }
  try{ new MutationObserver(schedule).observe(document.body,{attributes:true,attributeFilter:['class'],subtree:true,childList:true}); }catch(e){}
  window.addEventListener('scroll', function(){ if(fixed.size) schedule(); }, true);
  window.addEventListener('resize', function(){ if(fixed.size) schedule(); });
  document.addEventListener('input', function(ev){ if(fixed.size && ev.target && ev.target.closest && ev.target.closest('.ssel,.inwrap,.field')) schedule(); }, true);
})();
</script>
<script id="rail-tip">
/* ═══ Icon-rail tooltips ═══ Hovering an icon in the collapsed sidebar shows a floating card with the
   icon + menu name; for a group it lists the sub-menus (clickable). Desktop only (>900px). */
(function(){
  "use strict";
  var tip=null, hideT=null, curEl=null;
  function isRail(){ return window.innerWidth>900 && document.getElementById("sidebar") && document.getElementById("sidebar").classList.contains("mini"); }
  function ensure(){ if(!tip){ tip=document.createElement("div"); tip.className="sb-tip"; tip.style.display="none"; document.body.appendChild(tip);
      tip.addEventListener("mouseenter",function(){ clearTimeout(hideT); }); tip.addEventListener("mouseleave",scheduleHide); } return tip; }
  function hide(){ clearTimeout(hideT); if(tip){ tip.style.display="none"; tip.innerHTML=""; } curEl=null; }
  function scheduleHide(){ clearTimeout(hideT); hideT=setTimeout(hide,160); }
  function navFor(el){ var oc=el.getAttribute("onclick")||""; var m=oc.match(/toggleGroup\('([^']+)'\)/); if(m) return {group:m[1],n:NAV.find(function(x){return x.group===m[1];})};
    m=oc.match(/route\((?:'([^']+)'|"([^"]+)")\)/); if(m) return {id:m[1]||m[2]}; return null; }
  function show(el){
    if(!isRail()) return; var info=navFor(el); if(!info) return; var tp=ensure(); clearTimeout(hideT); curEl=el;
    var ic=(el.querySelector(".ni-ic")||{}).innerHTML||""; var label=el.getAttribute("title")||el.getAttribute("data-title")||(el.querySelector(".ni-lb")||{}).textContent||"";
    var html="";

      html='<div class="sb-tip-h">'+ic+'<span>'+esc(label)+'</span></div><div class="sb-tip-c">'+
        info.n.children.filter(function(c){ return canSee(c.id); }).map(function(c){ return '<div class="'+(current===c.id?"on":"")+'" onclick="route('+jsa(c.id)+')">'+esc(t(c.label))+'</div>'; }).join("")+'</div>';
    } else if(info.id){
      html='<div class="sb-tip-h clk" onclick="route('+jsa(info.id)+')">'+ic+'<span>'+esc(label)+'</span></div>';
    }
    tp.innerHTML=html; tp.style.display="block";
    var r=el.getBoundingClientRect(); var top=r.top-4; tp.style.left=(r.right+10)+"px"; tp.style.top=top+"px";
    var h=tp.offsetHeight; if(top+h>window.innerHeight-10) tp.style.top=Math.max(10,window.innerHeight-10-h)+"px";

    var el=ev.target.closest?ev.target.closest(".sidebar .nav-item"):null;

    else if(!(tip&&tip.contains(ev.target))) scheduleHide();
  });
  document.addEventListener("click",function(ev){ if(tip&&tip.style.display!=="none"&&!tip.contains(ev.target)) hide(); });
  window.addEventListener("resize",hide); window.addEventListener("scroll",hide,true);
  /* remove the native title tooltip while in rail mode so only ours shows */
  var _rs=renderSidebar; renderSidebar=function(){ var r=_rs.apply(this,arguments); try{ if(isRail()) document.querySelectorAll("#sidebar .nav-item[title]").forEach(function(n){ n.setAttribute("data-title",n.getAttribute("title")); n.removeAttribute("title"); }); }catch(e){} hide(); return r; };
})();
</script>

function r2(n){ return Math.round((parseFloat(n)||0)*100)/100; }
function pct(a,b){ return b?Math.round(a/b*1000)/10:0; }
function docTotals(d){ const sub=(d.lines||[]).reduce((a,l)=>a+Math.max(0,(parseFloat(l.qty)||0)*(parseFloat(l.price)||0)-(parseFloat(l.disc)||0)),0);
  const disc=Math.min(sub,parseFloat(d.discount)||0), base=sub-disc, rate=parseFloat(d.vatRate)||0, mode=d.vatMode||"none";
  const vat=mode==="excl"?base*rate/100:(mode==="incl"?base*rate/(100+rate):0);
  return {sub:r2(sub),disc:r2(disc),base:r2(mode==="incl"?base-vat:base),vat:r2(vat),total:r2(mode==="excl"?base+vat:base)}; }
/* Thai baht text */
function bahtText(n0){ n0=r2(n0); if(!n0) return "ศูนย์บาทถ้วน";
  const TH=["ศูนย์","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"], UN=["","สิบ","ร้อย","พัน","หมื่น","แสน"];
  function six(str,hi){ let o=""; const len=str.length; for(let i=0;i<len;i++){ const d=+str[i], pos=len-i-1; if(!d) continue;
      if(pos===1&&d===1) o+="สิบ"; else if(pos===1&&d===2) o+="ยี่สิบ"; else if(pos===0&&d===1&&((len>1&&(+str.slice(0,-1))>0)||hi)) o+="เอ็ด"; else o+=TH[d]+UN[pos]; } return o; }
  function rd(num){ let str=String(num), o=""; const gs=[]; while(str.length>6){ gs.unshift(str.slice(-6)); str=str.slice(0,-6); } gs.unshift(str);
    gs.forEach((g,i)=>{ o+=six(String(+g),i>0); if(i<gs.length-1) o+="ล้าน"; }); return o; }   // below a million: a lone 1 is still "เอ็ด"
  const b=Math.floor(n0), st=Math.round((n0-b)*100); return (b?rd(b):"ศูนย์")+"บาท"+(st?rd(st)+"สตางค์":"ถ้วน"); }

/* ---------- transactions: every sale with its cost ---------- */
function accTxns(from,to){
  const out=[], inR=d=>(!from||d>=from)&&(!to||d<=to);
  const soSched={}; (DB.schedule||[]).forEach(s=>{ if(s.type==="SO") soSched[s.id]=s; });
  const soRefs={}; Object.keys(soSched).forEach(id=>{ soRefs[soSched[id].ref]=soSched[id]; });
  const pos=posSales().filter(s=>s.status==="Paid"); const usePosTable=pos.length>0;
  /* cost of what a POS sale actually took (lot cost written on its history rows), per bill + item */
  const posCogs={}; (DB.history||[]).forEach(h=>{ if(h.type==="OUT"&&(h.status==="Sale"||h.note==="POS")&&h.cogs!=null){ const k=(h.orderNo||"")+"|"+h.code; posCogs[k]=(posCogs[k]||0)+(parseFloat(h.cogs)||0); } });
  if(usePosTable) pos.filter(s=>inR(s.date)).forEach(s=>{ const lines=s.lines||[]; const gross=lines.reduce((a,l)=>a+Math.max(0,(parseFloat(l.price)||0)*(parseFloat(l.qty)||0)-(parseFloat(l.disc)||0)),0);
    const rate=parseFloat(s.vatRate)||0;   // incl: VAT is always inside the total (older POS builds stored vatAmt 0 for it)
    const vat=s.vatEnabled?((s.vatMode!=="excl"||s.vatAmt==null)?(parseFloat(s.total)||0)*rate/(100+rate):parseFloat(s.vatAmt)||0):0;
    const net=(parseFloat(s.total)||0)-vat, f=gross?net/gross:0;
    lines.forEach(l=>{ const q=parseFloat(l.qty)||0, g=Math.max(0,(parseFloat(l.price)||0)*q-(parseFloat(l.disc)||0));
      const ck=s.ref+"|"+l.code, cost=posCogs[ck]!=null?posCogs[ck]:(l.cost!=null?(parseFloat(l.cost)||0)*q:itemCost(l.code)*q);   // actual lot cost, else cost at the time of sale
      if(posCogs[ck]!=null) posCogs[ck]=0;                               // the same item on two lines: count its cost once
      const rq=Math.min(q,parseFloat(l.returnedQty)||0), keep=q?(q-rq)/q:0;   // items returned at the POS are not sales
      if(q-rq<=0) return;
      out.push({date:s.date,time:s.time||"",kind:"goods",src:"POS",ref:s.ref,customer:s.customerName||"",code:l.code,name:l.name||itemOf(l.code).name||l.code,qty:q-rq,sales:r2(g*f*keep),cost:r2(cost*keep)}); }); });
  const svc={};
  (DB.history||[]).forEach(h=>{ if(h.type!=="OUT"||!inR(h.date)) return; const q=parseFloat(h.qty)||0;
    if(h.svc){ const k=h.svc.id+"#"+h.svc.session; const c=(DB.schedule||[]).find(s=>s.id===h.svc.id)||{}; const pr=(c.svc&&parseFloat(c.svc.price))||0, ss=(c.svc&&c.svc.sessions)||h.svc.of||1;
      const r=svc[k]||(svc[k]={date:h.date,time:h.time||"",kind:"service",src:"SVC",ref:h.orderNo||c.ref||"",customer:h.customer||c.customer||"",code:h.svc.code,name:h.svc.name+" #"+h.svc.session+"/"+(h.svc.of||ss),qty:1,sales:r2(pr/ss),cost:0});
      r.cost=r2(r.cost+hCost(h)); return; }
    if(h.sandbox) return;                                            // a TEST (sandbox) order picked for practice: not a sale
    if(h.mp||h.note==="SHOPEE"||h.note==="LAZADA"){                 // marketplace order picked (Shopee / Lazada): the order's own price
      out.push({date:h.date,time:h.time||"",kind:"goods",src:"MP",ref:h.orderNo||"",customer:h.customer||String(h.platform||h.note||"").toUpperCase(),code:h.code,name:h.name||h.code,qty:q,
        sales:r2(h.value!=null?h.value:(parseFloat(h.price)||itemPrice(h.code))*q),cost:r2(hCost(h))}); return; }
    if(h.note==="POS"||h.status==="Sale"){ if(!usePosTable) out.push({date:h.date,time:h.time||"",kind:"goods",src:"POS",ref:h.orderNo||"",customer:h.customer||"",code:h.code,name:h.name||h.code,qty:q,sales:r2(h.value!=null?h.value:(parseFloat(h.price)||itemPrice(h.code))*q),cost:r2(hCost(h))}); return; }
    const sc=(h.schedId!=null&&soSched[h.schedId])||soRefs[h.orderNo];
    if(sc){ const ln=(sc.lines||[]).find(l=>l.code===h.code)||{};
      const pr=(parseFloat(ln.price)||itemPrice(h.code))-(parseFloat(ln.disc)||0)/(parseFloat(ln.qty)||1);   // net of the line discount
      out.push({date:h.date,time:h.time||"",kind:"goods",src:"SO",ref:sc.ref,customer:sc.customer||h.customer||"",code:h.code,name:h.name||h.code,qty:q,sales:r2(pr*q),cost:r2(hCost(h))}); return; }
    if(h.customer && !h.room && h.orderNo!=="TRANSFER" && h.status!=="Withdraw" && h.status!=="Count"){
      out.push({date:h.date,time:h.time||"",kind:"goods",src:"DISP",ref:h.orderNo||String(h.id||""),customer:h.customer,code:h.code,name:h.name||h.code,qty:q,sales:r2(h.value!=null?h.value:itemPrice(h.code)*q),cost:r2(hCost(h))}); }
  });
  Object.keys(svc).forEach(k=>out.push(svc[k]));
  return out.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}

function accGroups(){ const a=window._acc; let tx=accTxns(a.from,a.to); if(a.kind!=="all") tx=tx.filter(x=>x.kind===a.kind);

    r.qty+=x.qty; r.n++; if(x.kind==="goods"){ r.gs+=x.sales; r.gc+=x.cost; } else { r.ss+=x.sales; r.sc+=x.cost; } });

<script id="lineform-noflicker">
/* ═══ Line forms: update the row in place instead of redrawing the table ═══
   Picking an item code, or typing a quantity / price, no longer rebuilds the whole <tbody>.
   Follows SAMPLE.html's principle: wrap the existing handlers, change nothing below. */
(function(){
"use strict";
function rowOf(boxId,i){ var b=document.getElementById(boxId); return (b&&b.children[i])||null; }
/* handlers are written as  fn(3,'name',this.value)  — match on that exact prefix */
function pre(fn,i,key){ return fn+"("+i+",'"+key+"'"; }
function setInput(row,fn,i,key,val){
  if(!row) return false;
  var el=row.querySelector('input[oninput^="'+pre(fn,i,key)+'"]');
  if(!el) return false;
  if(document.activeElement!==el) el.value=(val==null?"":val);   // never fight the field being typed in
  return true;
}
function setSelect(row,fn,i,key,val){
  if(!row) return false;
  var s=row.querySelector('select[onchange^="'+pre(fn,i,key)+'"]');
  if(!s) return false;
  s.value=val;
  var w=s.closest?s.closest('.ssel'):null;                        // searchable-select widget keeps its own visible input
  if(w){ var inp=w.querySelector('.ssel-in'), o=s.options[s.selectedIndex]; if(inp) inp.value=o?o.text:''; }
  return true;
}

/* ---- Schedule ---- */
if(typeof schedLine==="function"){
  var _sched=schedLine;
  window.schedLine=schedLine=function(i,k,v){
    var d=window._schedDraft;
    if(k!=="code"||!d||!d.lines||!d.lines[i]) return _sched(i,k,v);
    d.lines[i].code=v;
    var it=(typeof findItem==="function")?findItem(v):null;
    if(it){ d.lines[i].name=it.name; d.lines[i].unit=it.unit||d.lines[i].unit; }
    var row=rowOf("scLines",i);
    if(!(row && setInput(row,"schedLine",i,"name",d.lines[i].name))) return renderSchedLines();
    setSelect(row,"schedLine",i,"unit",d.lines[i].unit);
  };
}

/* ---- BOM ---- */
if(typeof bomLine==="function"){
  var _bom=bomLine;
  window.bomLine=bomLine=function(i,k,v){
    var d=window._bomDraft;
    if(k!=="code"||!d||!d.lines||!d.lines[i]) return _bom(i,k,v);
    d.lines[i].code=v;
    var it=(typeof findItem==="function")?findItem(v):null;
    if(it){ d.lines[i].name=it.name; d.lines[i].unit=it.unit||d.lines[i].unit; }
    var row=rowOf("bomLines",i);
    if(!(row && setInput(row,"bomLine",i,"name",d.lines[i].name))) return renderBomLines();
    setSelect(row,"bomLine",i,"unit",d.lines[i].unit);
  };
}

/* ---- Purchase / Sales order ---- */
if(typeof ordLine==="function"){
  var _ord=ordLine;
  function ordRefresh(i){
    var d=window._ordDraft, row=rowOf("ordLines",i);
    if(row && typeof ordLineAmt==="function" && typeof money==="function"){
      var amt=row.querySelector("td.num:not(.rn)");             // the Amount cell (text only, no input)
      if(amt && !amt.querySelector("input")) amt.textContent=money(ordLineAmt(d.lines[i]));
    }
    var foot=document.getElementById("ordFoot");
    if(foot && typeof ordTotals==="function" && typeof money==="function"){
      var vatEl=document.getElementById("ordVat");
      var tt=ordTotals(Object.assign({},d,{vat:parseFloat(vatEl&&vatEl.value)||0}));
      foot.innerHTML='<tr><td colspan="7" class="num">'+t("subtotal")+'</td><td class="num">'+money(tt.sub)+'</td><td></td></tr>'
        +'<tr><td colspan="7" class="num">'+t("vat")+'</td><td class="num">'+money(tt.vat)+'</td><td></td></tr>'
        +'<tr><td colspan="7" class="num"><b>'+t("grandTotal")+'</b></td><td class="num"><b>'+money(tt.net)+'</b></td><td></td></tr>';
    }
  }
  window.ordLine=ordLine=function(i,k,v){
    var d=window._ordDraft;
    if(!d||!d.lines||!d.lines[i]) return _ord(i,k,v);
    if(k==="qty"||k==="price"||k==="disc"){                      // typing: keep the field and its caret alive
      d.lines[i][k]=parseFloat(v)||0; ordRefresh(i); return;
    }
    if(k!=="code") return _ord(i,k,v);
    d.lines[i].code=v;
    var it=(typeof findItem==="function")?findItem(v):null;
    if(it){ d.lines[i].name=it.name; d.lines[i].unit=it.unit||d.lines[i].unit;
      if(window._ordKind==="po" && !d.lines[i].price) d.lines[i].price=parseFloat(it.cost)||0;

    if(!(row && setInput(row,"ordLine",i,"name",d.lines[i].name))) return renderOrdLines();
    setSelect(row,"ordLine",i,"unit",d.lines[i].unit);
    setInput(row,"ordLine",i,"price",d.lines[i].price);
    ordRefresh(i);
  };
}
})();

  sku=String(sku||"");
  var m=skuMap()[sku]; if(m) return m;
  if(findItem(sku)) return sku;                                   // the SKU already is an item code
  return "";
}
function platPill(p,test){ return '<span class="mp-plat '+esc(p)+'">'+esc(String(p||"").toUpperCase())+'</span>'+(test?' <span class="mp-sbx" style="margin-left:4px">TEST</span>':""); }
function ordQty(o){ return (o.lines||[]).reduce(function(a,l){ return a+(parseFloat(l.qty)||0); },0); }

function findOrder(id){ return orders().find(function(o){ return String(o.id)===String(id); }); }

window.mpPull=async function(){
  var f=window.mpFilter;
  var to=f.to||today();
  var from=f.from||dayShift(today(),-7);                                   // global local-date helper (addDaysLocal is private to the accounting module)
  toast(L("กำลังดึงออเดอร์…","Fetching orders…"));
  try{
    var cid0=session.company;
    var r=await Auth.call("mp_pull",{company:cid0,from:from,to:to,platform:f.platform==="ALL"?"all":f.platform});
    if(session.company!==cid0){ toast(L("เปลี่ยนบริษัทระหว่างดึงออเดอร์ — ไม่ได้บันทึก กรุณาดึงใหม่","Company changed while fetching — nothing saved, please fetch again"),"warn"); return; }
    var got=r.orders||[];
    var cur=orders();
    got.forEach(function(o){
      var i=cur.findIndex(function(x){ return x.id===o.id; });
      if(i>=0){ o.picked=cur[i].picked||o.picked;               // never undo a local stock deduction
        if(!o.tracking&&cur[i].tracking) o.tracking=cur[i].tracking; }
      if(i>=0) cur[i]=o; else cur.push(o);
    });
    Store.save();
    if((r.errors||[]).length) toast((r.errors||[]).join(" · "),"err");
    else toast(L("ดึงมา "+got.length+" ออเดอร์","Fetched "+got.length+" order(s)"),"ok");
    route("mp-orders");
  }catch(e){ toast((e&&e.message)||L("ดึงออเดอร์ไม่สำเร็จ","Fetch failed"),"err"); }
};

window.mpPickSave=function(id){
  var o=findOrder(id); if(!o) return;
  if(/cancel|unpaid|to_return|returned/i.test(String(o.status||""))&&!confirm(L("ออเดอร์นี้สถานะ ","This order is ")+o.status+L(" — ยังต้องการตัดสต๊อกหรือไม่?"," — deduct stock anyway?"))) return;
  if(o.sandbox&&!confirm(L("นี่คือออเดอร์ทดสอบ (TEST) — ต้องการตัดสต๊อกจริงหรือไม่?","This is a TEST order — deduct real stock anyway?"))) return;
  var lines=o.lines||[], plan=[], need={};                             // need: total per code@loc across lines
  for(var i=0;i<lines.length;i++){
    var code=(document.getElementById("mpc"+i)||{}).value||"";
    var qty=wholeQ((document.getElementById("mpq"+i)||{}).value);
    var loc=(document.getElementById("mpl"+i)||{}).value||"";
    if(!code){ toast(t("selectItem")+" — "+(lines[i].sku||""),"err"); return; }
    if(qty<=0){ toast(qty<0?(lang==="th"?"ใส่จำนวนเต็มที่มากกว่า 0":"Enter a whole number above 0"):t("tNoData"),"warn"); return; }
    var nk=code+"@"+loc; need[nk]=(need[nk]||0)+qty;
    var avail=lotOn()?stockAtTotal(code,loc):stockAt(code,loc);
    if(avail<need[nk]){ toast(t("tNoStock")+" — "+code+" @ "+loc+" ("+num(avail)+")","err"); return; }
    plan.push({code:code,qty:qty,loc:loc,sku:lines[i].sku||"",price:parseFloat(lines[i].price)||0});
  }
  /* already picked on another device (its history row synced here, the "picked" flag maybe not yet)? */
  var plat=String(o.platform||"").toUpperCase();
  if((DB.history||[]).some(function(x){ return x.type==="OUT"&&String(x.orderNo||"")===String(o.orderNo)&&(x.mp||String(x.note||"").toUpperCase()===plat); })){
    o.picked=true; Store.save(); closeModal(); toast(L("ออเดอร์นี้ถูกตัดสต๊อกไปแล้ว (จากอีกเครื่อง)","This order was already picked (on another device)"),"warn"); route("mp-orders"); return; }
  plan.forEach(function(p){
    if(p.sku) skuMap()[p.sku]=p.code;                                   // remember the mapping
    var m=findItem(p.code)||{name:p.code};
    var base={type:"OUT",date:today(),time:nowTime(),code:p.code,name:m.name,
      orderNo:o.orderNo, customer:o.buyer||"", shipping:o.shipping||"", tracking:o.tracking||"",
      note:String(o.platform||"").toUpperCase(), status:"Done", mp:true, platform:o.platform||"", price:p.price, sandbox:!!o.sandbox};
    if(lotOn()){
      var r=issueFIFO(p.code,p.loc,p.qty,"");
      r.consumed.forEach(function(c){ hpush(Object.assign({id:nextTxnId(),loc:c.loc,qty:c.qty,lotSup:c.lotSup,lotNo:c.lotNo,
        mfd:c.mfd,exp:c.exp,sn:c.sn,cost:(c.cost||0),cogs:(c.cost||0)*c.qty,value:p.price*c.qty},base)); });
    } else {
      adjustStockAt(p.code,p.loc,-p.qty);
      hpush(Object.assign({id:nextTxnId(),loc:p.loc,qty:p.qty,value:p.price*p.qty},base));
    }
  });
  o.picked=true;
  Store.save(); closeModal(); toast(t("mpPicked"),"ok"); route("mp-orders");
};

window.mpShip=async function(id){
  var o=findOrder(id); if(!o) return;
  if(!confirm(t("mpShip")+" — "+o.orderNo+" ?")) return;
  try{
    toast(L("กำลังแจ้งพร้อมส่ง…","Marking ready to ship…"));
    var r=await Auth.call("mp_ship",{company:session.company,id:o.id});
    o.status="READY_TO_SHIP"; if(r.tracking) o.tracking=r.tracking;
    Store.save(); toast(t("tSaved")+(r.tracking?" · "+r.tracking:""),"ok"); route("mp-orders");
  }catch(e){ toast((e&&e.message)||"ship failed","err"); }
};

/* shipping label: the server returns either a link (Lazada) or the PDF itself (Shopee) */
window.mpLabel=async function(id){
  var o=findOrder(id); if(!o) return;
  var w=window.open("","_blank");                                       // open now so the popup is not blocked
  toast(L("กำลังขอป้ายพัสดุ…","Requesting shipping label…"));
  try{
    var r=await Auth.call("mp_label",{company:session.company,id:o.id});
    if(r.tracking&&r.tracking!==o.tracking){ o.tracking=r.tracking; Store.save(); }
    var url=r.url||"";
    if(!url&&r.pdf){
      var bin=atob(r.pdf), bytes=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
    }
    if(!url) throw new Error(L("ไม่ได้รับไฟล์ป้าย","No label returned"));
    if(w) w.location.href=url; else window.open(url,"_blank");
  }catch(e){ if(w) w.close(); toast((e&&e.message)||"label failed","err"); }
};

/* ---------- sales summary ---------- */
PAGES["mp-sales"]=function(){
  var all=orders().filter(function(o){ return !o.sandbox&&!/cancel|unpaid|to_return|returned/i.test(String(o.status||"")); });   // no test / cancelled / unpaid / returned orders
  var tot=function(list){ return list.reduce(function(a,o){ return a+(parseFloat(o.total)||0); },0); };
  var sp=all.filter(function(o){ return o.platform==="shopee"; });
  var lz=all.filter(function(o){ return o.platform==="lazada"; });
  var byDay={};
  all.forEach(function(o){ var d=o.date||""; if(!d) return;
    byDay[d]=byDay[d]||{date:d,shopee:0,lazada:0,orders:0,qty:0};
    byDay[d][o.platform]=(byDay[d][o.platform]||0)+(parseFloat(o.total)||0);
    byDay[d].orders++; byDay[d].qty+=ordQty(o); });
  var days=Object.keys(byDay).sort().reverse().map(function(d){ var r=byDay[d]; r.total=r.shopee+r.lazada; return r; });
  var stat=function(ic,n2,lb){ return '<div class="stat"><div class="s-ic">'+ic+'</div><div class="s-body"><div class="s-num">'+n2+'</div><div class="s-lb">'+lb+'</div></div></div>'; };
  return '<div class="statgrid">'
      +stat(IC.shop,num(all.length),L("ออเดอร์ทั้งหมด","Total orders"))
      +stat(IC.invoice,money(tot(all)),L("ยอดขายรวม","Total sales"))
      +stat(IC.shop,money(tot(sp)),"Shopee")
      +stat(IC.shop,money(tot(lz)),"Lazada")
    +'</div>'
    + dataTable({
      key:"mpSales", rows:days, defaultSize:50, defaultSort:"date", defaultDir:-1,
      search:function(r,q){ return String(r.date).includes(q); },
      columns:[
        {k:"date",label:"date",render:function(r){ return '<b>'+esc(r.date)+'</b>'; }},
        {k:"orders",label:"items",num:true},
        {k:"qty",label:"qty",num:true,render:function(r){ return num(r.qty); }},
        {k:"shopee",label:"Shopee",num:true,render:function(r){ return money(r.shopee); }},
        {k:"lazada",label:"Lazada",num:true,render:function(r){ return money(r.lazada); }},
        {k:"total",label:"amount",num:true,render:function(r){ return '<b>'+money(r.total)+'</b>'; }}
      ]});
};

window.mpLoadCfg=async function(){
  try{ var cid0=session.company; var cfg=await Auth.call("mp_config_get",{company:cid0}); if(cid0!==session.company) return;
    window._mpCfg=cfg; window._mpCfgCid=cid0; if(current==="mp-settings") route("mp-settings"); }
  catch(e){ toast((e&&e.message)||"load failed","err"); }
};
window.mpSaveKeys=async function(which){
  var b={company:session.company};
  if(which==="shopee"){
    var sbx=!!(document.getElementById("mpShSbx")||{}).checked, cur=window._mpCfg&&window._mpCfg.shopee||{};
    // live and test tokens are not interchangeable: switching mode disconnects the shop (the server drops the token)
    if(cur.linked&&!!cur.sandbox!==sbx&&!confirm(L("เปลี่ยนโหมดจะยกเลิกการเชื่อมต่อร้านเดิม ต้องกดเชื่อมต่อร้านใหม่ ดำเนินการต่อ?","Changing the mode disconnects the shop — you will need to connect it again. Continue?"))) return;
    b.shopee={partner_id:(document.getElementById("mpShPid")||{}).value||"",
      shop_id:(document.getElementById("mpShSid")||{}).value||"", partner_key:(document.getElementById("mpShKey")||{}).value||"", sandbox:sbx}; }
  else {
    var lsbx=!!(document.getElementById("mpLzSbx")||{}).checked, lcur=window._mpCfg&&window._mpCfg.lazada||{};
    if(lcur.linked&&!!lcur.sandbox!==lsbx&&!confirm(L("เปลี่ยนโหมดจะยกเลิกการเชื่อมต่อร้านเดิม ต้องกดเชื่อมต่อร้านใหม่ ดำเนินการต่อ?","Changing the mode disconnects the shop — you will need to connect it again. Continue?"))) return;
    b.lazada={app_key:(document.getElementById("mpLzKey")||{}).value||"",
      region:(document.getElementById("mpLzReg")||{}).value||"th", app_secret:(document.getElementById("mpLzSec")||{}).value||"", sandbox:lsbx}; }
  try{ await Auth.call("mp_config_set",b); window._mpCfg=null; toast(t("tSaved"),"ok"); route("mp-settings"); }
  catch(e){ toast((e&&e.message)||"save failed","err"); }
};
window.mpLink=async function(which){
  try{
    /* the platform and company travel in the query string: mp_auth_url is a GET action */
    var q=await fetch(CONFIG.API_BASE+"?action=mp_auth_url&platform="+encodeURIComponent(which)
        +"&company="+encodeURIComponent(session.company),{headers:Store._headers(),cache:"no-store"});
    var j=await q.json();
    if(!q.ok||!j.url) throw new Error(j.error||"failed");
    window.open(j.url,"_blank","noopener");
    toast(L("เปิดหน้าอนุญาตแล้ว — กลับมากดรีเฟรชเมื่อเสร็จ","Authorisation opened — come back and refresh when done"));
  }catch(e){ toast((e&&e.message)||"link failed","err"); }
};
window.mpUnlink=async function(which){
  if(!confirm(t("mpUnlink")+" "+which+" ?")) return;
  var b={company:session.company}; b[which]={unlink:true};
  try{ await Auth.call("mp_config_set",b); window._mpCfg=null; toast(t("tSaved"),"ok"); route("mp-settings"); }
  catch(e){ toast((e&&e.message)||"failed","err"); }
};
})();
</script>

  "ถุงมือยาง ไม่มีแป้ง M|กล่อง|ลัง|10|ถุงมือ|180|1095","ถุงมือไนไตร L|กล่อง|ลัง|10|ถุงมือ|220|1095","หน้ากาก N95|ชิ้น|กล่อง|20|หน้ากาก|25|1095","หน้ากากอนามัย 3 ชั้น|กล่อง|ลัง|20|หน้ากาก|55|1095","กระบอกฉีดยา 3 มล.|ชิ้น|กล่อง|100|อุปกรณ์ฉีดยา|3|1825","เข็มฉีดยา 25G|ชิ้น|กล่อง|100|อุปกรณ์ฉีดยา|1.5|1825","สำลีแผ่น|ห่อ|ลัง|50|ทำแผล|25|0","ผ้าก๊อซพับ 4x4 นิ้ว|ห่อ|ลัง|50|ทำแผล|35|1825","เทปปิดแผล 1 นิ้ว|ม้วน|กล่อง|12|ทำแผล|30|1825","น้ำเกลือล้างแผล 1000 มล.|ขวด|ลัง|12|น้ำยา|45|730","แอลกอฮอล์เจล 500 มล.|ขวด|ลัง|24|น้ำยา|85|730","เครื่องวัดความดัน ดิจิตอล|เครื่อง|กล่อง|1|เครื่องมือแพทย์|1290|0","เครื่องวัดออกซิเจนปลายนิ้ว|เครื่อง|กล่อง|5|เครื่องมือแพทย์|590|0","หูฟังแพทย์|อัน|กล่อง|1|เครื่องมือแพทย์|890|0","เทอร์โมมิเตอร์ อินฟราเรด|อัน|กล่อง|5|เครื่องมือแพทย์|690|0","ชุดให้น้ำเกลือ|ชุด|กล่อง|50|อุปกรณ์ให้สารน้ำ|25|1825","ถุงขยะติดเชื้อ แดง|แพ็ค|ลัง|20|ของใช้คลินิก|65|0","กระดาษปูเตียง ม้วน|ม้วน|ลัง|12|ของใช้คลินิก|150|0","ไม้กดลิ้น|กล่อง|ลัง|20|ของใช้คลินิก|45|1825","ชุดกาวน์ใช้แล้วทิ้ง|ชุด|แพ็ค|10|ชุดป้องกัน|35|1825"]}
];
/* EAN-13 in the 200-299 "in-store" range: never clashes with a real product barcode */
function ean(b,i){ const s="2"+String(b+10).padStart(2,"0")+"0"+String(i+1).padStart(8,"0");
  let t=0; for(let k=0;k<12;k++) t+=(+s[k])*(k%2?3:1); return s+((10-t%10)%10); }
function rowsOf(bi){ const b=BIZ[bi];
  return b.items.map((x,i)=>{ const p=x.split("|"), cost=+p[5]||0, mn=cost<50?20:(cost<500?10:(cost<2000?3:1));
    return {code:b.k+"-"+String(i+1).padStart(3,"0"),name:p[0],barcode:ean(bi,i),desc:(lang==="th"?"ตัวอย่าง · ":"Sample · ")+(lang==="th"?b.th:b.en),
      unitPackage:p[2],qtyPackage:+p[3]||1,unit:p[1],cat:p[4],sup:b.sup,cost:cost,shelfLifeDays:+p[6]||0,minQty:mn,maxQty:mn*5}; }); }
const COLS=["code","name","barcode","desc","unitPackage","qtyPackage","unit","cat","sup","cost","shelfLifeDays","minQty","maxQty"];   // = Item Master import columns
window.sampleItemsDownload=function(bi){
  if(bi==="all"){ const all=[]; BIZ.forEach((_,i)=>all.push(...rowsOf(i))); downloadCSV("sample_items_all_20x20.csv",toCSV(COLS,all)); }
  else { const b=BIZ[bi]; if(!b) return; downloadCSV("sample_items_"+b.k.toLowerCase()+".csv",toCSV(COLS,rowsOf(bi))); }
  toast(t("tExported"),"ok"); };
window.sampleItemsModal=function(){
  const th=lang==="th";
  const cards=BIZ.map((b,i)=>`<button type="button" class="smp-card" onclick="sampleItemsDownload(${i})">
      <span class="smp-k">${esc(b.k)}</span><span class="smp-t"><b>${esc(th?b.th:b.en)}</b><small>${esc(b.items.slice(0,3).map(x=>x.split("|")[0]).join(", "))}…</small></span>
      <span class="smp-dl">${IC.download||IC.excel||""}</span></button>`).join("");
  modalShell(IC.box, th?"ตัวอย่างสินค้าตามประเภทธุรกิจ":"Sample items by business type",
    th?"20 ประเภทธุรกิจ · ประเภทละ 20 รายการ":"20 business types · 20 items each",
    `<p class="muted" style="margin:0 0 12px">${th?"กดเลือกประเภทธุรกิจเพื่อดาวน์โหลดไฟล์ CSV — แก้ไขได้ตามต้องการ แล้วนำเข้าด้วยปุ่ม \"นำเข้า CSV\" ในหน้านี้ (รหัสที่มีอยู่แล้วจะถูกข้าม)":"Pick a business type to download a CSV — edit it as you like, then load it with \"Import CSV\" on this page (existing codes are skipped)."}</p>
     <div class="smp-grid">${cards}</div>`,
    `<button class="btn btn-ghost" onclick="sampleItemsDownload('all')">${IC.excel}${th?"ดาวน์โหลดทั้งหมด (400 รายการ)":"Download all (400 items)"}</button>
     <button class="btn btn-primary" onclick="closeModal()">${t("close")}</button>`, true);
};
const st=document.createElement("style");
st.textContent=`.smp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.smp-card{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card,#fff);cursor:pointer;font:inherit;color:inherit;min-width:0;transition:border-color .15s,transform .15s}
.smp-card:hover{border-color:var(--orange,#f37021);transform:translateY(-1px)}
.smp-k{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--orange,#f37021);background:rgba(243,112,33,.1);border-radius:8px;padding:4px 6px}
.smp-t{display:flex;flex-direction:column;min-width:0;flex:1}
.smp-t b{font-size:13px}.smp-t small{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smp-dl{flex:0 0 auto;color:var(--sub);display:flex}.smp-dl svg{width:16px;height:16px}
.smp-card:hover .smp-dl{color:var(--orange,#f37021)}`;
document.head.appendChild(st);
})();
</script>
<script id="billing-module">
/* ═══════════════════ BILLING (service fees) ═══════════════════
   Monthly bill per company: Cloud + Support (prices set by the Super Admin). Bills are derived month by
   month from each company's start month; only the payments are stored. Everything lives in META.billing,
   a global record that only a Super Admin can write (the server enforces it), so a company can see its
   bills but never mark one as paid. Invoice layout follows the Myib ACC invoice template. */
(function(){
"use strict";
if(typeof PAGES!=="object"||typeof NAV!=="object") return;
var L=function(th,en){ return lang==="th"?th:en; };

Object.assign(I18N.en,{billing:"Billing",billingSub:"Service fees — Cloud & Support"});
Object.assign(I18N.th,{billing:"ค่าบริการ (Billing)",billingSub:"ค่าบริการ Cloud และ Support รายเดือน"});
var sv=function(p){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; };
IC.bill=IC.bill||sv('<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>');

/* ---------- data ---------- */
var DEF={cloud:350,support:400,vat:0,dueDays:7,color:"#ea580c",
  provider:{name:"MYIB",nameEn:"",address:"",taxId:"",phone:"",email:"",website:""},
  bank:{name:"",branch:"",accName:"",accNo:""},promptpay:"",note:""};
function B(){ if(!META.billing||typeof META.billing!=="object"||Array.isArray(META.billing)) META.billing={}; var b=META.billing;
  if(!b.cfg||typeof b.cfg!=="object"||Array.isArray(b.cfg)) b.cfg={}; if(!b.co||typeof b.co!=="object"||Array.isArray(b.co)) b.co={}; return b; }
function cfg(){ var c=B().cfg; return {enabled:c.enabled!==false,cloud:num0(c.cloud,DEF.cloud),support:num0(c.support,DEF.support),vat:num0(c.vat,DEF.vat),dueDays:num0(c.dueDays,DEF.dueDays),
  color:/^#[0-9a-f]{3,8}$/i.test(c.color||"")?c.color:DEF.color,provider:Object.assign({},DEF.provider,c.provider||{}),bank:Object.assign({},DEF.bank,c.bank||{}),promptpay:c.promptpay||"",note:c.note||""}; }
function num0(v,d){ var n=parseFloat(v); return isFinite(n)?n:d; }
function coRec(cid){ var b=B(); var r=b.co[cid]; if(!r||typeof r!=="object"||Array.isArray(r)) r=b.co[cid]={}; if(!r.paid||typeof r.paid!=="object"||Array.isArray(r.paid)) r.paid={}; return r; }
function coName(cid){ var c=(META.companies||[]).find(function(x){return x.id===cid;}); return c?c.name:cid; }
function ymNow(){ return today().slice(0,7); }
function ymAdd(ym,n){ var p=ym.split("-").map(Number), d=new Date(p[0],p[1]-1+n,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
var TM=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"],
    TS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],
    EM=["January","February","March","April","May","June","July","August","September","October","November","December"];
function ymLabel(ym){ var p=ym.split("-").map(Number); return lang==="th"?(TM[p[1]-1]+" "+(p[0]+543)):(EM[p[1]-1]+" "+p[0]); }
function thDate(ds){ if(!ds) return "-"; var p=String(ds).split("-").map(Number); if(p.length<3||!p[1]) return esc(ds); return lang==="th"?(p[2]+" "+TS[p[1]-1]+" "+(p[0]+543)):(p[2]+" "+EM[p[1]-1].slice(0,3)+" "+p[0]); }
function moneyB(n){ return (parseFloat(n)||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function addDays(ds,n){ var p=ds.split("-").map(Number), d=new Date(p[0],p[1]-1,p[2]); d.setDate(d.getDate()+(n||0)); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* the bills of one company: one per month from its start month up to this month */
function bills(cid){
  var r=coRec(cid), c=cfg(); if(r.off) return [];
  var start=/^\d{4}-\d{2}$/.test(r.start||"")?r.start:ymNow(), out=[], n=0, oldest=ymAdd(ymNow(),-59);
  var ym=start<oldest?oldest:start;                                 // at most 60 months, always ending with this month
  while(ym<=ymNow()&&n<60){ out.push(bill(cid,ym,c)); ym=ymAdd(ym,1); n++; }
  return out.reverse(); }
function bill(cid,ym,c){
  c=c||cfg(); var r=coRec(cid), pd=r.paid[ym]||null, snap=pd&&pd.items?pd:null;
  var named=function(it){ if(!it.kind) return it;                   // stored without words: drawn in the viewer's language
    return Object.assign({},it,{name:(it.kind==="cloud"?L("ค่าบริการ Cloud (Cloud Hosting) ประจำเดือน ","Cloud hosting — "):L("ค่าบริการ Support (ดูแลระบบ) ประจำเดือน ","Support service — "))+ymLabel(ym),unit:L("เดือน","month")}); };
  var items=(snap?snap.items:[{kind:"cloud",qty:1,price:c.cloud,total:c.cloud},{kind:"support",qty:1,price:c.support,total:c.support}]).map(named);
  var vatRate=snap?num0(snap.vat,0):c.vat, sub=items.reduce(function(a,i){return a+(parseFloat(i.total)||0);},0), vat=r2b(sub*vatRate/100);
  var issue=ym+"-01"; if(/^\d{4}-\d{2}-\d{2}$/.test(r.startDay||"")&&r.startDay.slice(0,7)===ym&&r.startDay>issue) issue=r.startDay;   // first month: from the day billing began
  var due=addDays(issue,snap?num0(snap.dueDays,c.dueDays):c.dueDays);
  var st=pd?"paid":(today()>due?"overdue":"open");
  return {cid:cid,ym:ym,no:"BL-"+ym.replace("-","")+"-"+cid,issue:issue,due:due,items:items,vatRate:vatRate,sub:r2b(sub),vat:vat,total:r2b(sub+vat),status:st,paid:pd}; }
function r2b(n){ return Math.round((parseFloat(n)||0)*100)/100; }
function scopeCompanies(){ return isSuper()?(META.companies||[]).map(function(c){return c.id;}):[session.company]; }

/* ---------- page ---------- */
PAGE["billing"]={crumb:["billing"],title:"billing",sub:"billingSub",icon:IC.bill};
GROUP_OF["billing"]=GROUP_OF["billing"]||"";
var navItem={id:"billing",icon:IC.bill,label:"billing"};
[NAV, window.NAV_ORIG].forEach(function(arr){ if(!Array.isArray(arr)||arr.some(function(n){return n.id==="billing";})) return;
  var i=arr.findIndex(function(n){ return n.id==="companies"; }); arr.splice(i<0?arr.length:i+1,0,navItem); });
var _canSeeBl=canSee; canSee=function(id){ if(id==="billing") return (isSuper()||(isAdmin()&&cfg().enabled))&&!menuHidden(id); return _canSeeBl(id); };   // switched off: only the Super Admin still sees it
window._blCo=window._blCo||"ALL";
PAGES["billing"]=function(){
  if(!isAdmin()) return '<div class="adminbar">'+IC.lock+t("adminOnly")+'</div>';
  if(!isSuper()&&!cfg().enabled) return '<div class="adminbar">'+IC.lock+esc(L("ระบบค่าบริการ (Billing) ปิดใช้งานอยู่","Billing is switched off"))+'</div>';
  var onoff=isSuper()?'<div class="panel" style="margin:0 0 14px"><div class="panel-b" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'
    +'<b>'+esc(L("โหมด Billing","Billing mode"))+'</b>'
    +(cfg().enabled?'<span class="pill ok"><i class="pdot"></i>'+esc(L("เปิดใช้งาน — Admin ของแต่ละบริษัทเห็นบิล","On — company admins see their bills"))+'</span>'
      :'<span class="pill ng"><i class="pdot"></i>'+esc(L("ปิดใช้งาน — ซ่อนจากทุกบริษัท (เห็นเฉพาะ Super Admin)","Off — hidden from all companies (Super Admin only)"))+'</span>')
    +'<span class="switch" style="margin-left:auto"><input type="checkbox" '+(cfg().enabled?"checked":"")+' onchange="blToggle(this.checked)"><i></i></span></div></div>':'';
  if(isSuper()){ var ch=false; (META.companies||[]).forEach(function(c){ var r=coRec(c.id); if(!r.start){ r.start=ymNow(); r.startDay=today(); ch=true; } }); if(ch) Store.save(); }   // fix each company's first billing month
  var c=cfg(), ids=scopeCompanies(), sel=isSuper()?window._blCo:session.company;
  var rows=[]; ids.forEach(function(id){ if(sel!=="ALL"&&id!==sel) return; bills(id).forEach(function(b){ rows.push(b); }); });
  var open=rows.filter(function(b){return b.status!=="paid";}), owed=open.reduce(function(a,b){return a+b.total;},0);
  var monthly=r2b((c.cloud+c.support)*(1+c.vat/100));
  var card=function(lb,val,sub,col){ return '<div class="panel" style="flex:1;min-width:180px;margin:0"><div class="panel-b"><div class="muted" style="font-size:12px;font-weight:700">'+lb+'</div><div style="font-size:24px;font-weight:900;color:'+(col||'var(--ink)')+'">'+val+'</div><div class="muted" style="font-size:12px">'+sub+'</div></div></div>'; };
  var head='<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">'
    +card(L("ค่าบริการต่อเดือน","Monthly fee"),"฿"+moneyB(monthly),"Cloud ฿"+moneyB(c.cloud)+" · Support ฿"+moneyB(c.support)+(c.vat?" · VAT "+c.vat+"%":""))
    +card(L("ยอดค้างชำระ","Outstanding"),"฿"+moneyB(owed),open.length+" "+L("บิล","bills"),owed>0?"var(--danger)":"var(--ok)")
    +card(L("ชำระแล้ว","Paid"),String(rows.length-open.length),L("บิล","bills"),"var(--ok)")+'</div>';
  var pill=function(b){ return b.status==="paid"?'<span class="pill ok"><i class="pdot"></i>'+L("ชำระแล้ว","Paid")+'</span>':(b.status==="overdue"?'<span class="pill ng"><i class="pdot"></i>'+L("เกินกำหนด","Overdue")+'</span>':'<span class="pill warn"><i class="pdot"></i>'+L("รอชำระ","Awaiting payment")+'</span>'); };
  var key=function(b){ return jsa(b.cid)+","+jsa(b.ym); };
  var cols=[];
  if(isSuper()) cols.push({k:"cid",label:"company",render:function(b){ return '<b>'+esc(coName(b.cid))+'</b><br><small class="muted">'+esc(b.cid)+'</small>'; },sortVal:function(b){return coName(b.cid);}});
  cols.push({k:"no",label:"invoiceNo",labelHtml:esc(L("เลขที่ใบแจ้งหนี้","Invoice no.")),render:function(b){return '<b>'+esc(b.no)+'</b>';}},
    {k:"ym",label:"date",labelHtml:esc(L("รอบบิล","Billing month")),render:function(b){return esc(ymLabel(b.ym));}},
    {k:"due",label:"dueDate",labelHtml:esc(L("ครบกำหนด","Due")),render:function(b){return '<span style="'+(b.status==="overdue"?'color:var(--danger);font-weight:800':'')+'">'+thDate(b.due)+'</span>';}},
    {k:"total",label:"amount",num:true,labelHtml:esc(L("ยอดรวม","Total")),render:function(b){return moneyB(b.total);}},
    {k:"status",label:"status",render:pill,sortVal:function(b){return b.status;}},
    {k:"pd",label:"date",labelHtml:esc(L("วันที่ชำระ","Paid on")),render:function(b){return b.paid?thDate(b.paid.date):"-";},sortVal:function(b){return b.paid?b.paid.date:"";}},
    {k:"_a",label:"actions",sort:false,toggle:false,render:function(b){ return '<div class="rowact" onclick="event.stopPropagation()">'
      +'<button class="btn btn-ghost btn-sm" onclick="blView('+key(b)+')" title="'+esc(L("ดูใบแจ้งหนี้","View"))+'">'+IC.eye+'</button>'
      +'<button class="btn btn-ghost btn-sm" onclick="blPdf('+key(b)+')" title="PDF">'+IC.download+'</button>'
      +(isSuper()?(b.status==="paid"?'<button class="btn btn-ghost btn-sm danger" onclick="blUnpay('+key(b)+')">'+esc(L("ยกเลิกการชำระ","Undo payment"))+'</button>'
        :'<button class="btn btn-ok btn-sm" onclick="blPayForm('+key(b)+')">'+IC.check+esc(L("ยืนยันชำระแล้ว","Mark paid"))+'</button>'):"")+'</div>'; }});

function bahtWords(n0){ n0=r2b(n0); if(!n0) return "ศูนย์บาทถ้วน";
  var D=["ศูนย์","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"], U=["","สิบ","ร้อย","พัน","หมื่น","แสน"];
  function six(s,hi){ var o="", n=s.length; for(var i=0;i<n;i++){ var d=+s[i], pos=n-i-1; if(!d) continue;
    if(pos===1&&d===1) o+="สิบ"; else if(pos===1&&d===2) o+="ยี่สิบ"; else if(pos===0&&d===1&&((n>1&&(+s.slice(0,-1))>0)||hi)) o+="เอ็ด"; else o+=D[d]+U[pos]; } return o; }
  function rd(num){ var s=String(num), o="", g=[]; while(s.length>6){ g.unshift(s.slice(-6)); s=s.slice(0,-6); } g.unshift(s);
    g.forEach(function(x,i){ o+=six(String(+x),i>0); if(i<g.length-1) o+="ล้าน"; }); return o; }
  var baht=Math.floor(n0), sat=Math.round((n0-baht)*100);
  return (baht?rd(baht)+"บาท":"")+(sat?rd(sat)+"สตางค์":"ถ้วน"); }
function ppPayload(id,amount){ id=String(id).replace(/[^0-9]/g,""); if(!id) return "";
  var kind=id.length>=15?"03":(id.length>=13?"02":"01"), target=kind==="01"?("0000000000000"+id.replace(/^0/,"66")).slice(-13):id;
  var f=function(tag,val){ return tag+String(val.length).padStart(2,"0")+val; };
  var p=f("00","01")+f("01","12")+f("29",f("00","A000000677010111")+f(kind,target))+f("53","764")+f("54",(Math.round(amount*100)/100).toFixed(2))+f("58","TH")+"6304";
  var crc=0xFFFF; for(var i=0;i<p.length;i++){ crc^=p.charCodeAt(i)<<8; for(var j=0;j<8;j++){ crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1); crc&=0xFFFF; } }
  return p+crc.toString(16).toUpperCase().padStart(4,"0"); }
function qrImg(text,px){ try{ if(typeof qrcode!=="function"||!text) return ""; var q=qrcode(0,"M"); q.addData(text); q.make();

/* move stock between two locations from the layout — same records as the Change Location page */
function doTransferStock(code,from,to,qty,_proj,note){
  qty=parseInt(qty)||0;
  if(!code||!from||!to||from===to||qty<=0) return false;
  if(stockAt(code,from)<qty) return false;
  var m=DB.itemMaster.find(function(i){ return i.code===code; })||{name:code};
  var mv=moveStock(code,from,to,qty);
  pushMovePairs({ id:nextTxnId(), type:"OUT", date:today(), time:nowTime(), code:code, name:m.name, loc:from, qty:qty,
      orderNo:"TRANSFER", dept:"", note:(note||t("changeLoc"))+" → "+to, status:"Done" },
    { id:nextTxnId(), type:"IN", date:today(), time:nowTime(), code:code, name:m.name, loc:to, qty:qty,
      orderNo:"TRANSFER", dept:"", note:(note||t("changeLoc"))+" ← "+from, pkg:m.unit||"", pkgQty:qty, unitQty:m.unit||"", status:"Stored" }, mv);
  return true;
}

      /* จุดตั้งต้นของเส้นทางเดิน — วางได้หลายจุด เช่น หน้าประตู หรือโต๊ะจ่ายงาน */
      {k:"spt", n:th?"จุดยืน (ฉันอยู่ที่นี่)":"Start point (you are here)", kind:"spot", w:70, d:70, h:0}
    ]}
  ];
}
function wlPresetOf(k){
  var f=null;
  wlPresets().forEach(function(g){ g.list.forEach(function(p){ if(p.k===k) f=p; }); });
  return f;
}

/* ── ที่เก็บผัง ── */
/* the server stores an empty {} as [] — keys written onto an array never reach JSON, so a cell's Location
   binding vanished after a refresh. Maps are always turned back into plain objects before use. */
function wlMap(v){
  if(v&&typeof v==="object"&&!Array.isArray(v)) return v;
  var o={}; if(v&&typeof v==="object") Object.keys(v).forEach(function(k){ o[k]=v[k]; });
  return o;
}
function wlStore(){ var s=settingsObj(); if(!s.whLayout||typeof s.whLayout!=="object"||Array.isArray(s.whLayout)) s.whLayout=wlMap(s.whLayout); return s.whLayout; }
function wlPlan(wh){
  var st=wlStore();
  if(!st[wh]||typeof st[wh]!=="object"||Array.isArray(st[wh])) st[wh]=wlMap(st[wh]);
  var p=st[wh];
  p.w=+p.w||3000; p.d=+p.d||2000; p.h=+p.h||600; p.grid=+p.grid||10;
  if(!Array.isArray(p.objs)) p.objs=[];
  if(p.objs.some(function(o){ return !o||typeof o!=="object"||Array.isArray(o); }))
    p.objs=p.objs.filter(function(o){ return o&&typeof o==="object"&&!Array.isArray(o); });
  p.objs.forEach(function(o){
    if(o.cells!=null&&(typeof o.cells!=="object"||Array.isArray(o.cells))) o.cells=wlMap(o.cells);
    if(o.packs!=null&&(typeof o.packs!=="object"||Array.isArray(o.packs))) o.packs=wlMap(o.packs);
  });
  return p;
}
function wlWarehouses(){
  var w=[...new Set((DB.locationMaster||[]).map(function(l){ return l.warehouse; }).filter(Boolean))].sort();
  if(!w.length) w=["HEAD"];
  return w;
}
function wlLocsOf(wh){
  return (DB.locationMaster||[]).filter(function(l){ return l.warehouse===wh; })
    .map(function(l){ return l.code; }).sort();
}
function wlNewId(){ return "o"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function wlObj(id){ return wlPlan(WL.wh).objs.find(function(o){ return o.id===id; })||null; }

/* ระหว่างออกแบบไม่บันทึก — แค่จำไว้ว่ามีของที่ยังไม่ได้บันทึก แล้วติดจุดไว้ที่ปุ่ม */
function wlTouch(){
  WL.dirty=true;
  var b=document.getElementById("wlSaveBtn"); if(b) b.classList.add("dirty");
}
/* every Location code bound to a cell in the layout becomes a Location Master row under that warehouse —
   so storage spots can be made from either place (the layout or Location Master) */
function wlSyncLocs(){
  var th=lang==="th", st=wlStore(), made=0;
  if(!Array.isArray(DB.locationMaster)) DB.locationMaster=[];
  var have={}; DB.locationMaster.forEach(function(l){ have[String(l.code).trim().toUpperCase()]=1; });
  Object.keys(st).forEach(function(wh){
    var p=st[wh]; if(!p||!Array.isArray(p.objs)) return;
    p.objs.forEach(function(o){ if(!o||typeof o!=="object") return; wlCells(o).forEach(function(c){
      var code=String(c.loc||"").trim(), k=code.toUpperCase();
      if(!code||have[k]) return; have[k]=1; made++;
      DB.locationMaster.push({code:code, warehouse:wh, cat:String(o.code||o.name||"").trim(), capacity:0,
        desc:(th?"จากผังคลัง":"From layout"), barcode:""});
    }); });
  });
  return made;
}
function wlSaveNow(){
  WL.dirty=false;
  var b=document.getElementById("wlSaveBtn"); if(b) b.classList.remove("dirty");
  var made=wlSyncLocs();
  try{ saveAll(); }catch(e){}
  toast(lang==="th"?("บันทึกผังแล้ว"+(made?" · สร้าง Location ใหม่ "+made+" รายการในข้อมูลตำแหน่ง":""))
                   :("Layout saved"+(made?" · "+made+" new locations added to Location Master":"")),"ok");
}
/* ออกจากหน้าไปเมนูอื่นทั้งที่ยังไม่ได้บันทึก → บันทึกให้เงียบ ๆ ครั้งเดียว งานจะได้ไม่หาย */
function wlFlush(){
  if(!WL.dirty) return;
  WL.dirty=false;
  try{ wlSyncLocs(); }catch(e){}
  try{ saveAll(); }catch(e){}
}

/* ── ยอดคงเหลือแยกตาม Location (ลำดับความสำคัญเดียวกับ locBalances: ledger ชนะ itemMaster) ── */
function wlStockIndex(){
  var idx={};
  var add=function(loc,code,qty){
    if(!loc||!qty) return;
    var e=idx[loc]||(idx[loc]={qty:0,items:[]});
    e.qty+=qty;
    var it=e.items.find(function(x){ return x.code===code; });
    if(it) it.qty+=qty; else e.items.push({code:code,qty:qty});
  };
  (DB.stock||[]).forEach(function(s){ if(s&&s.loc) add(s.loc,s.code,Math.max(0,parseInt(s.qty)||0)); });
  var meta={};
  (DB.itemMaster||[]).forEach(function(i){ if(!i._isStockPos) meta[i.code]={name:i.name||i.code,unit:i.unit||i.useUnit||"",cat:i.cat||""}; });
  Object.keys(idx).forEach(function(l){
    idx[l].items.forEach(function(it){ var m=meta[it.code]||{}; it.name=m.name||it.code; it.unit=m.unit||""; });
    idx[l].items.sort(function(a,b){ return b.qty-a.qty; });
  });
  return idx;
}
/* ช่องทั้งหมดของอ็อบเจกต์ → [{key,level,bay,loc}] (ระดับ 1 = ชั้นล่างสุด) */
function wlCells(o){
  var out=[];
  if(o.kind==="rack"){
    var lv=Math.max(1,+o.levels||1), by=Math.max(1,+o.bays||1);
    if(o.top) for(var Bt=1;Bt<=by;Bt++){                            /* storage on top of the rack (above the top beam) */
      var kt="T-"+Bt;
      out.push({key:kt, level:lv+1, bay:Bt, top:true, loc:(o.cells&&o.cells[kt])||""});
    }
    for(var L=lv;L>=1;L--) for(var B=1;B<=by;B++){
      var k=L+"-"+B;
      out.push({key:k, level:L, bay:B, loc:(o.cells&&o.cells[k])||""});
    }
  } else {
    out.push({key:"0-0", level:1, bay:1, loc:o.loc||""});
  }
  return out;
}
function wlTopH(o,lh){ return Math.max(40,Math.min(lh*0.85,+o.topH||lh*0.85)); }
/* number of different items in one location (2+ = mixed) */
function wlMixN(idx,loc){ var e=loc&&idx[loc]; return (e&&e.items.length>1)?e.items.length:0; }
function wlCellQty(idx,loc){ return (loc&&idx[loc])?idx[loc].qty:0; }
function wlFillColor(q,max){
  if(!q) return WL_FILL[0];
  var r=max>0?q/max:0;
  return WL_FILL[Math.min(4,Math.max(1,Math.ceil(r*4)))];
}

/* ── ขนาดที่วาดจริงบนมุมบน (หมุน 90° สลับกว้าง/ลึก) ── */
function wlBox(o){
  var r=(+o.rot||0)%180;
  return r===90 ? {w:+o.d||10, d:+o.w||10} : {w:+o.w||10, d:+o.d||10};
}
function wlClamp(o,p){
  var b=wlBox(o);
  o.x=Math.max(0,Math.min(Math.round(+o.x||0), p.w-b.w));
  o.y=Math.max(0,Math.min(Math.round(+o.y||0), p.d-b.d));
}

/* มุมมองทั้งหมด: บน · หน้า · หลัง · ข้าง · ไอโซ */
var WL_VIEWS=[["top","มุมบน (Top)","Top"],["front","ด้านหน้า (Front)","Front"],
  ["back","ด้านหลัง (Back)","Back"],["side","ด้านข้าง (Side)","Side"],["iso","3 มิติ (ISO)","Isometric"]];
function wlIsElev(){ return WL.view==="front"||WL.view==="back"||WL.view==="side"; }

  }).join("")+'</div>';

/* ช่องเลือกชั้นวางตัวเดียว — ใช้ได้เฉพาะมุมมองด้าน */

  return '<select class="inp wl-pick" data-nocbx onchange="wlSetSide(this.value)">'

/* เปิดครั้งแรก / เปลี่ยนมุมมอง → ย่อให้พอดีความกว้างที่มี แล้วผู้ใช้ค่อยซูมเอง */
function wlFitKey(){ return WL.wh+"|"+WL.view+"|"+WL.side+"|"+WL.mode; }
function wlAutoFit(){
  WL._autoH=true;                        /* จัดเองรอบนี้ → ให้ย่อตามความสูงด้วย */
  var st=document.getElementById("wlStage"); if(!st||!st.clientWidth) return;
  var p=wlPlan(WL.wh), one=(wlIsElev()&&WL.side!=="ALL")?wlObj(WL.side):null;
  var cm=one?Math.max(600,+one.w||600)
        :(WL.view==="iso")?((p.w+p.d)*0.866)
        :(WL.view==="side")?p.d:p.w;
  var base=one?0.9:(WL.view==="iso"?0.3:0.32);
  /* มุมบนบวกขอบของกรอบภาพเข้าไปในความกว้างจริง จึงต้องเผื่อให้ตรงกับขอบที่ใช้จริง
     (โหมดดูผังลดขอบเหลือ 18 ต่อด้าน หน้าออกแบบยังเป็น 90 เพราะต้องมีที่ให้ไม้บรรทัด) */
  var pad=(WL.view==="top")?(WL.dash?40:180):40;
  var avail=Math.max(240, st.clientWidth-30-pad);
  WL.zoom=Math.min(3,Math.max(0.3,+(avail/(cm*base)).toFixed(2)));
  wlZoomLbSet(WL.zoom);
}
/* พื้นที่สูงที่เหลือจริงใต้ตำแหน่งที่ภาพเริ่มวาด จนถึงขอบล่างของหน้าต่าง */
function wlAvailH(el){
  var r=el.getBoundingClientRect();
  var vh=window.innerHeight||document.documentElement.clientHeight||800;
  return Math.max(220, Math.round(vh-r.top-16));
}
/* จำกัดความสูงของภาพไม่ให้เกินจอ
   SVG มี viewBox จึงมีอัตราส่วนในตัว พอจำกัดความสูง เบราว์เซอร์ย่อให้ทั้งภาพตามสัดส่วนเอง
   ใช้ได้กับทุกมุมมองโดยไม่ต้องรู้สูตรขนาดของแต่ละตัว และไม่ติดพื้นความกว้างขั้นต่ำ 360px */
function wlFitShrink(){
  var svg=document.getElementById("wlSvg"); if(!svg) return;
  /* โหมดเต็มจอ: ยืดเวทีลงไปจนสุดขอบล่าง แล้วจัดภาพไว้กลาง จะได้ไม่เหลือที่ขาวข้างล่าง */
  var stage=document.getElementById("wlStage");
  if(stage){
    if(wlFullIsOn()){
      var sr=stage.getBoundingClientRect();
      var vh=window.innerHeight||document.documentElement.clientHeight||800;
      stage.style.minHeight=Math.max(220, Math.round(vh-sr.top-10))+"px";
    } else { stage.style.minHeight=""; }
  }
  svg.style.maxWidth="100%";
  var natural=svg.getBoundingClientRect();
  if(!natural.height) return;
  /* เต็มจอ: ภาพถูกจัดกึ่งกลางกล่อง ตำแหน่งภาพจึงขยับได้ — วัดจากกล่องที่อยู่กับที่แทน */
  var availH;
  if(stage && wlFullIsOn()){
    var cs=getComputedStyle(stage);
    var inner=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0)
             +(parseFloat(cs.borderTopWidth)||0)+(parseFloat(cs.borderBottomWidth)||0);
    availH=Math.max(220, wlAvailH(stage)-inner-4);
  } else {
    availH=wlAvailH(svg);
  }
  svg.style.maxHeight=availH+"px";
  /* ตัวเลข % ต้องบอกขนาดที่เห็นจริง ไม่ใช่ค่าที่ตั้งไว้แล้วถูกย่อทิ้ง */
  var shown=svg.getBoundingClientRect().height;
  var eff=(natural.height>0)?(WL.zoom*Math.min(1,shown/natural.height)):WL.zoom;
  wlZoomLbSet(eff);
}
/* กดซูมเอง = ปล่อยให้ใหญ่เกินจอได้ ไม่ไปจำกัดความสูงให้ */
function wlFitRelease(){
  var svg=document.getElementById("wlSvg"); if(!svg) return;
  svg.style.maxHeight=""; svg.style.maxWidth="100%";
}
function wlFit(){
  /* เลื่อนเวทีขึ้นชิดบนก่อน จะได้มีที่ให้ภาพเต็มจอจริง ไม่ใช่เหลือแค่เศษใต้หัวตาราง */
  try{ var st=document.getElementById("wlStage"); if(st) st.scrollIntoView({block:"start",behavior:"instant"}); }catch(e){}
  WL._fitKey=wlFitKey(); WL._autoH=true; wlAutoFit(); wlPaint();
}
function wlPaint(){
  var stage=document.getElementById("wlStage"); if(!stage) return;
  if(WL._fitKey!==wlFitKey()){ WL._fitKey=wlFitKey(); wlAutoFit(); }
  var p=wlPlan(WL.wh), idx=wlStockIndex();
  var _fx=stage.querySelector(".wl-fx");      /* ชั้นป้ายสด — เก็บไว้ไม่ให้โดนล้าง */
  stage.innerHTML=(WL.view==="top")?wlTopSVG(p,idx)
                 :(WL.view==="iso")?wlIsoSVG(p,idx)
                 :wlElevSVG(p,idx,WL.view);
  if(_fx) stage.appendChild(_fx);
  wlInspector(idx);
  wlBind();
  try{ wlRouteDraw(); }catch(e){}
  try{ wlFullBarMount(); }catch(e){}
  try{ WL._autoH ? wlFitShrink() : wlFitRelease(); }catch(e){}
}
function wlLabelFit(txt,wpx){
  var max=Math.floor(wpx/6.2);
  txt=String(txt||"");
  return max<2?"":(txt.length>max?txt.slice(0,Math.max(1,max-1))+"…":txt);
}
function wlMaxQty(p,idx){
  var m=0;
  p.objs.forEach(function(o){ wlCells(o).forEach(function(c){ m=Math.max(m,wlCellQty(idx,c.loc)); }); });
  return m;
}

/* ── มุมบน ── */
function wlTopSVG(p,idx){
  /* โหมดดูผังไม่ได้วาดไม้บรรทัดกับป้ายขนาด ขอบ 90 จึงเป็นที่ว่างเปล่า ๆ — เหลือ 18 พอ */
  var th=lang==="th", PAD=WL.dash?18:90, maxQ=wlMaxQty(p,idx);
  var W=p.w+PAD*2, H=p.d+PAD*2;
  var px=Math.max(360, Math.round(p.w*0.32*WL.zoom)+PAD*2);

  /* กริด + ไม้บรรทัด — โหมดดูผังเอาเส้นตารางออก เหลือแต่ออบเจกต์
     หน้าออกแบบยังมีเส้นตาราง เพราะต้องใช้เล็งตอนลากวางของ */
  var g='', step=Math.max(100,Math.round(p.grid*10));
  if(!WL.dash){
    for(var x=0;x<=p.w;x+=step) g+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+p.d+'" stroke="#e3ded3" stroke-width="2"/>';
    for(var y=0;y<=p.d;y+=step) g+='<line x1="0" y1="'+y+'" x2="'+p.w+'" y2="'+y+'" stroke="#e3ded3" stroke-width="2"/>';
  }
  var ru='';
  if(!WL.dash){
    for(var rx=0;rx<=p.w;rx+=step*2) ru+='<text x="'+rx+'" y="-24" text-anchor="middle" font-size="34" fill="#9b958a">'+(rx/100)+'</text>';
    for(var ry=0;ry<=p.d;ry+=step*2) ru+='<text x="-24" y="'+(ry+12)+'" text-anchor="end" font-size="34" fill="#9b958a">'+(ry/100)+'</text>';
    ru+='<text x="'+(p.w/2)+'" y="'+(p.d+70)+'" text-anchor="middle" font-size="36" font-weight="700" fill="#6f6960">'
      +(th?"กว้าง ":"W ")+(p.w/100)+' ม.</text>'
      +'<text transform="translate(-62 '+(p.d/2)+') rotate(-90)" text-anchor="middle" font-size="36" font-weight="700" fill="#6f6960">'
      +(th?"ลึก ":"D ")+(p.d/100)+' ม.</text>';
  }

  var body=wlDrawList(p.objs).map(function(o){
    var b=wlBox(o), c=WL_KIND_C[o.kind]||"#6b7280", selOn=(WL.sel===o.id);
    var flat=(o.kind==="zone"||o.kind==="aisle");
    var cells=wlCells(o), inner="";

    /* จุดยืน — วาดเป็นหมุดกลม ไม่ใช่กล่อง จะได้ไม่ดูเหมือนของที่กินพื้นที่ */
    if(o.kind==="spot"){
      var rr=Math.max(26,Math.min(b.w,b.d)/2);
      return '<g class="wl-obj wl-spot'+(selOn?" sel":"")+'" data-oid="'+o.id+'"'+wlHideOpacity(o)+' transform="translate('+(o.x+b.w/2)+' '+(o.y+b.d/2)+')"'
        +' style="cursor:'+(WL.mode==="design"?"move":"pointer")+'">'
        +'<circle r="'+(rr+10)+'" fill="'+c+'" fill-opacity=".16"/>'
        +'<circle r="'+rr+'" fill="'+c+'" stroke="#fff" stroke-width="'+(selOn?8:5)+'"/>'
        +'<circle cy="'+(-rr*0.22)+'" r="'+(rr*0.3)+'" fill="#fff"/>'
        +'<path d="M'+(-rr*0.42)+' '+(rr*0.52)+' q'+(rr*0.42)+' '+(-rr*0.55)+' '+(rr*0.84)+' 0 z" fill="#fff"/>'
        +'<text y="'+(rr+46)+'" text-anchor="middle" font-size="32" font-weight="800" fill="'+c+'" style="pointer-events:none">'
          +esc(o.code||(lang==="th"?"จุดยืน":"Start"))+'</text>'
        +'</g>';
    }

    if(o.kind==="rack"){
      /* ช่อง (bay) เรียงตามด้านกว้างของ "ตัวชั้นวาง" เสมอ
         หมุน 90° แล้วด้านกว้างของชั้นไปอยู่บนแกนตั้งของผัง ช่องจึงต้องเรียงลงล่าง ไม่ใช่เรียงไปขวา */
      var by=Math.max(1,+o.bays||1), rot90=((+o.rot||0)%180===90);
      var span=rot90?b.d:b.w, bw=span/by;
      var cw=rot90?(b.w-6):(bw-6), ch=rot90?(bw-6):(b.d-6);
      for(var i=0;i<by;i++){
        var bayN=i+1, cx=rot90?3:(i*bw+3), cy=rot90?(i*bw+3):3;
        /* ในมุมบนเห็นทุกระดับซ้อนกัน → รวมยอดทุกระดับของช่องนั้น */
        var tot=0, linked=false, mixB=0;
        cells.forEach(function(cc){ if(cc.bay===bayN){ if(cc.loc) linked=true; tot+=wlCellQty(idx,cc.loc); mixB+=wlMixN(idx,cc.loc)?1:0; } });
        var f=(WL.mode==="stock")?(linked?wlFillColor(tot,maxQ):"#ffffff"):"rgba(255,255,255,.14)";
        inner+='<rect class="wl-bay" data-oid="'+o.id+'" data-bay="'+bayN+'" x="'+cx+'" y="'+cy+'" width="'+cw+'" height="'+ch+'" rx="5"'
          +' fill="'+f+'" stroke="'+(WL.mode==="stock"?(linked?"#55606d":"#c9c2b6"):"rgba(255,255,255,.4)")+'" stroke-width="'+(WL.mode==="stock"?3:2)+'"'
          +(WL.mode==="stock"&&!linked?' stroke-dasharray="10 7"':'')+'/>';
        if(WL.mode==="stock"&&cw>110&&ch>44)
          inner+='<text x="'+(cx+cw/2)+'" y="'+(cy+ch/2+12)+'" text-anchor="middle" font-size="34" font-weight="800" fill="#24303d">'+(tot?num(tot):"")+'</text>';
        if(WL.mode==="stock"&&mixB){                                /* this bay has a location with 2+ different items */
          var mr=Math.max(9,Math.min(18,Math.min(cw,ch)*0.2));
          inner+='<g style="pointer-events:none"><circle cx="'+(cx+cw-mr-3)+'" cy="'+(cy+mr+3)+'" r="'+mr+'" fill="#f59e0b" stroke="#fff" stroke-width="3"/>'
            +'<text x="'+(cx+cw-mr-3)+'" y="'+(cy+mr+3+mr*0.42)+'" text-anchor="middle" font-size="'+(mr*1.25)+'" font-weight="900" fill="#fff">!</text>'
            +'<title>'+(lang==="th"?"มีตำแหน่งที่เก็บสินค้าปนกัน":"Has a mixed-item location")+'</title></g>';
        }
      }
    }
    var lb=o.code||wlKindName(o.kind);
    var tx=(WL.mode==="stock"&&o.kind==="rack")?"":wlLabelFit(lb,b.w*0.33*WL.zoom);

    return '<g class="wl-obj'+(selOn?" sel":"")+'" data-oid="'+o.id+'"'+wlHideOpacity(o)+' transform="translate('+o.x+' '+o.y+')" style="cursor:'+(WL.mode==="design"?"move":"pointer")+'">'
      +'<rect x="0" y="0" width="'+b.w+'" height="'+b.d+'" rx="'+(flat?4:8)+'"'
        +' fill="'+(flat?"none":c)+'" fill-opacity="'+(flat?0:(o.kind==="rack"?.92:.85))+'"'
        +' stroke="'+c+'" stroke-width="'+(selOn?7:4)+'"'+(flat?' stroke-dasharray="18 12"':'')+'/>'
      +inner
      +(tx?'<text x="'+(b.w/2)+'" y="'+(b.d/2+12)+'" text-anchor="middle" font-size="34" font-weight="800"'
        +' fill="'+(flat?c:"#fff")+'" style="pointer-events:none">'+esc(tx)+'</text>':'')
      +(selOn&&WL.mode==="design"
        ?'<rect class="wl-h" data-handle="'+o.id+'" x="'+(b.w-26)+'" y="'+(b.d-26)+'" width="34" height="34" rx="7" fill="#fff" stroke="'+c+'" stroke-width="5" style="cursor:nwse-resize"/>'
        :'')
    +'</g>';
  }).join("");

  return '<svg id="wlSvg" viewBox="'+(-PAD)+' '+(-PAD)+' '+W+' '+H+'" width="'+px+'" preserveAspectRatio="xMidYMid meet" style="touch-action:none">'
    +'<rect x="0" y="0" width="'+p.w+'" height="'+p.d+'" fill="#faf8f4" stroke="#3d3830" stroke-width="7"/>'
    +g+ru+body+'</svg>';
}

/* ── ภาพด้าน: ด้านหน้า / ด้านหลัง / ด้านข้าง ──
   ด้านหน้า  = ยืนมองจากขอบล่างของผัง (แกนนอน = กว้างโกดัง ของที่ y น้อยอยู่ใกล้)
   ด้านหลัง  = ยืนมองจากขอบบนของผัง (แกนนอนกลับด้าน ของที่ y มากอยู่ใกล้)
   ด้านข้าง  = ยืนมองจากขอบซ้ายของผัง (แกนนอน = ลึกโกดัง ของที่ x น้อยอยู่ใกล้) */
/* ปริมาณรวมของทั้งระดับ — ใช้ตอนมองด้านสกัดของชั้นวาง ซึ่งเห็นแค่หน้าแคบ ไม่เห็นว่าแบ่งกี่ช่อง */
function wlLevelQty(o,L,idx){
  var by=Math.max(1,+o.bays||1), tot=0, has=false;
  for(var B=1;B<=by;B++){
    var loc=(o.cells&&o.cells[L+"-"+B])||"";
    if(loc){ has=true; tot+=wlCellQty(idx,loc); }
  }
  return {q:tot, linked:has};
}
/* ชั้นวางหนึ่งใบในภาพรวมทั้งโกดัง วาดลงกรอบ (0,0)-(W,H)
   showBays=false คือมองด้านสกัด เห็นหน้าแคบ จึงวาดเป็นช่องเดียวต่อระดับ */
function wlRackElevMini(o,W,H,idx,maxQ,mode,showBays){
  var lv=Math.max(1,+o.levels||1), by=showBays?Math.max(1,+o.bays||1):1;
  var UW=Math.max(5,Math.min(30,W*0.05));
  var BH=Math.max(4,Math.min(18,H*0.032));
  var FT=Math.max(7,Math.min(34,H*0.085));
  var innerW=Math.max(16,W-UW*2), bw=innerW/by, lh=H/lv, out="";
  var TH=o.top?wlTopH(o,lh):0;

  var upright=function(ux){
    return '<rect x="'+ux+'" y="0" width="'+UW+'" height="'+H+'" rx="2" fill="#4f93c6"/>'
         +'<rect x="'+(ux+UW*0.63)+'" y="0" width="'+(UW*0.37)+'" height="'+H+'" fill="#3b7aa8"/>'
         +'<rect x="'+(ux-UW*0.1)+'" y="'+(H-FT)+'" width="'+(UW*1.2)+'" height="'+FT+'" rx="3" fill="#f7c948"/>';
  };
  out+=upright(0)+upright(W-UW);

  var beam=function(by0){
    return '<rect x="0" y="'+by0+'" width="'+W+'" height="'+BH+'" rx="2" fill="#ee6c1f"/>'
          +'<rect x="0" y="'+by0+'" width="'+W+'" height="'+(BH*0.3)+'" rx="2" fill="#ff6f3c"/>';
  };
  /* ชั้นล่างสุดวางกับพื้น ไม่มีคานรอง — กฎเดียวกับมุมมองชั้นวางเดี่ยว */
  var lvList=[]; for(var Li=1;Li<=lv;Li++) lvList.push(Li); if(o.top) lvList.push("T");
  lvList.forEach(function(L){
    var isTop=(L==="T"), y0=isTop?-TH:H-L*lh, y1=isTop?0:H-(L-1)*lh, hasBeam=(!isTop&&L>1), beamY=hasBeam?(y1-BH):y1;
    for(var B=1;B<=by;B++){
      var bayNo=showBays?((mode==="back")?(by-B+1):B):1;
      var q, kind;
      if(showBays){
        var key=L+"-"+bayNo, loc=(o.cells&&o.cells[key])||"";
        q=loc?wlCellQty(idx,loc):0; kind=wlPackOf(o,key);
      } else {
        var lq=wlLevelQty(o,L,idx);
        q=lq.q; kind=wlPackOf(o,L+"-1");
      }
      var cx=UW+(B-1)*bw, padX=Math.max(2,bw*0.05);
      var zx=cx+padX, zw=bw-padX*2, zy=y0+Math.max(2,lh*0.06), zh=beamY-zy;
      if(zh>5&&zw>5){
        if(q>0) out+=wlCargoSVG(kind, zx, zy, zw, zh, maxQ>0?(0.42+0.58*Math.min(1,q/maxQ)):1);
        else out+='<rect x="'+zx+'" y="'+(zy+zh*0.25)+'" width="'+zw+'" height="'+(zh*0.75)+'" rx="3" fill="none"'
                 +' stroke="#c4ccd4" stroke-width="2" stroke-dasharray="8 6"/>';
        if(showBays&&wlMixN(idx,(o.cells&&o.cells[key])||""))       /* mixed items in this cell */
          out+='<rect x="'+zx+'" y="'+zy+'" width="'+zw+'" height="'+zh+'" rx="3" fill="none" stroke="#f59e0b" stroke-width="'+Math.max(2,Math.min(6,zw*0.04))+'"/>';
      }
    }
    if(hasBeam) out+=beam(beamY);
  });
  out+=beam(0);
  return out;
}
function wlElevSVG(p,idx,mode){
  var th=lang==="th", PAD=WL.dash?18:90, maxQ=wlMaxQty(p,idx);
  var one=(WL.side!=="ALL")?wlObj(WL.side):null;
  if(one) return wlRackElevSVG(one,idx,maxQ);

  var sideAxis=(mode==="side");
  var W2=Math.max(100, sideAxis?p.d:p.w), H2=Math.max(200,p.h);

  /* ตำแหน่งแนวนอน ความกว้างที่เห็น และความใกล้ (1 = ใกล้สุด) ของแต่ละชิ้น */
  var place=function(o){
    var b=wlBox(o), ox=+o.x||0, oy=+o.y||0;
    if(mode==="front") return {x:ox,              w:b.w, near:1-(p.d?oy/p.d:0),        bays:(+o.rot||0)%180===0};
    if(mode==="back")  return {x:p.w-(ox+b.w),    w:b.w, near:(p.d?(oy+b.d)/p.d:0),    bays:(+o.rot||0)%180===0};
    return               {x:oy,                   w:b.d, near:1-(p.w?ox/p.w:0),        bays:(+o.rot||0)%180===90};
  };
  /* โครงสร้างอาคาร — วาดเป็นฉากหลังเสมอ ไม่ว่าจะอยู่ใกล้ผู้มองแค่ไหน */
  var isStruct=function(k){ return k==="wall"||k==="column"||k==="office"||k==="zone"||k==="aisle"; };
  var list=wlDrawList(p.objs).filter(function(o){ return +o.h; }).map(function(o){ return {o:o, pl:place(o)}; });
  list.sort(function(a,b){
    var sa=isStruct(a.o.kind)?0:1, sb=isStruct(b.o.kind)?0:1;
    if(sa!==sb) return sa-sb;
    return a.pl.near-b.pl.near;                                 /* ไกลวาดก่อน ใกล้ทับทีหลัง */
  });

  var body=list.map(function(it){
    var o=it.o, pl=it.pl, c=WL_KIND_C[o.kind]||"#6b7280";
    var op=(0.42+pl.near*0.53).toFixed(2);
    var hh=Math.min(+o.h,H2), yTop=H2-hh;
    var lb=wlLabelFit(o.code||wlKindName(o.kind), pl.w*0.3*WL.zoom);
    var head='<g class="wl-obj'+(WL.sel===o.id?" sel":"")+(wlIsHidden(o)?" wl-hid":"")+'" data-oid="'+o.id
      +'" transform="translate('+pl.x+' '+yTop+')" style="cursor:pointer" opacity="'+(wlIsHidden(o)?0.2:op)+'">';
    var hit='<rect x="0" y="0" width="'+pl.w+'" height="'+hh+'" fill="transparent"/>';

    /* ── ชั้นวาง: โครงเหล็กจริงพร้อมของตามบรรจุภัณฑ์ ชุดเดียวกับมุมมองชั้นวางเดี่ยว ── */
    if(o.kind==="rack"){
      return head+hit
        +wlRackElevMini(o,pl.w,hh,idx,maxQ,mode,pl.bays)
        +(WL.sel===o.id?'<rect x="1.5" y="1.5" width="'+(pl.w-3)+'" height="'+(hh-3)+'" rx="5" fill="none" stroke="#1d6fa4" stroke-width="6"/>':'')
        +(lb?'<text x="'+(pl.w/2)+'" y="'+(hh+34)+'" text-anchor="middle" font-size="32" font-weight="800"'
            +' fill="#24303d" stroke="#ffffff" stroke-width="6" paint-order="stroke" style="pointer-events:none">'+esc(lb)+'</text>':'')
        +'</g>';
    }

    /* ── พาเลทวางพื้น: วาดของจริงตามบรรจุภัณฑ์ ── */
    if(o.kind==="pallet"){
      var pq=wlCellQty(idx,o.loc||"");
      return head+hit
        +(pq>0?wlCargoSVG(wlPackOf(o,"0-0"),2,2,Math.max(6,pl.w-4),Math.max(6,hh-4),
                          maxQ>0?(0.42+0.58*Math.min(1,pq/maxQ)):1)
              :wlPalletSVG(2,Math.max(0,hh-Math.min(hh,18)),Math.max(6,pl.w-4),Math.min(hh,18)))
        +(WL.sel===o.id?'<rect x="1.5" y="1.5" width="'+(pl.w-3)+'" height="'+(hh-3)+'" rx="5" fill="none" stroke="#c45e00" stroke-width="6"/>':'')
        +(lb?'<text x="'+(pl.w/2)+'" y="'+(hh+34)+'" text-anchor="middle" font-size="30" font-weight="800"'
            +' fill="#24303d" stroke="#ffffff" stroke-width="6" paint-order="stroke" style="pointer-events:none">'+esc(lb)+'</text>':'')
        +'</g>';
    }

    /* ── โครงสร้างอาคาร: โปร่งพอให้มองทะลุไปเห็นชั้นวางที่อยู่หลังผนัง ── */
    if(isStruct(o.kind)){
      var stLb=o.code?wlLabelFit(o.code, pl.w*0.3*WL.zoom):"";   /* ไม่ตั้งชื่อก็ไม่ต้องพิมพ์ชนิดทับกลางภาพ */
      return head
        +'<rect x="0" y="0" width="'+pl.w+'" height="'+hh+'" rx="6" fill="'+c+'" fill-opacity=".14" stroke="'+c
          +'" stroke-opacity=".55" stroke-width="'+(WL.sel===o.id?7:4)+'"/>'
        +(stLb?'<text x="'+(pl.w/2)+'" y="'+(hh/2+12)+'" text-anchor="middle" font-size="32" font-weight="800"'
            +' fill="'+c+'" stroke="#ffffff" stroke-width="6" paint-order="stroke" style="pointer-events:none">'+esc(stLb)+'</text>':'')
        +'</g>';
    }

    /* ── ชนิดอื่น ๆ ยังเป็นก้อนทึบเหมือนเดิม ── */
    return head
      +'<rect x="0" y="0" width="'+pl.w+'" height="'+hh+'" rx="6" fill="'+c+'" fill-opacity=".9" stroke="'+c+'" stroke-width="'+(WL.sel===o.id?7:4)+'"/>'
      +(lb?'<text x="'+(pl.w/2)+'" y="'+(hh/2+12)+'" text-anchor="middle" font-size="32" font-weight="800" fill="#fff">'+esc(lb)+'</text>':'')
      +'</g>';
  }).join("");

  var ru='';
  for(var hy=0;hy<=H2;hy+=100){
    ru+='<line x1="0" y1="'+(H2-hy)+'" x2="'+W2+'" y2="'+(H2-hy)+'" stroke="#e3ded3" stroke-width="2"/>';
    if(!WL.dash) ru+='<text x="-18" y="'+(H2-hy+12)+'" text-anchor="end" font-size="32" fill="#9b958a">'+(hy/100)+'</text>';
  }

  var cap=({front:th?"มองจากด้านหน้า":"Front elevation",
            back: th?"มองจากด้านหลัง":"Back elevation",
            side: th?"มองจากด้านข้าง (ซ้าย)":"Side elevation (left)"})[mode];
  var axis=(sideAxis?(th?" · ลึก ":" · D ")+(W2/100):(th?" · กว้าง ":" · W ")+(W2/100))+" "+(th?"ม.":"m");

  /* ป้ายรหัสชั้นวางอยู่ใต้ฐาน ต้องเผื่อที่ด้านล่างให้ ไม่งั้นโดนตัดหายไปครึ่งตัว */
  var padBot=PAD+46;
  return '<svg id="wlSvg" viewBox="'+(-PAD)+' '+(-PAD)+' '+(W2+PAD*2)+' '+(H2+PAD+padBot)+'" width="'
    +Math.max(360,Math.round(W2*0.32*WL.zoom))+'" preserveAspectRatio="xMidYMid meet" style="touch-action:none">'
    +ru+body
    +'<line x1="0" y1="'+H2+'" x2="'+W2+'" y2="'+H2+'" stroke="#3d3830" stroke-width="8"/>'
    +(WL.dash?'':'<text x="'+(W2/2)+'" y="'+(H2+66)+'" text-anchor="middle" font-size="36" font-weight="700" fill="#6f6960">'
      +esc(cap)+esc(axis)+(th?" · สูง ":" · H ")+(H2/100)+' '+(th?"ม.":"m")+'</text>')+'</svg>';
}

/* ชั้นวางตัวเดียว ดูเต็ม ๆ ทุกช่องทุกระดับ พร้อมรหัสกับจำนวน */
/* ══ ของที่วางบนชั้น — วาดตามชนิดบรรจุภัณฑ์ ══
   x,y = มุมซ้ายบนของพื้นที่ที่ให้วาด · w,h = ขนาดพื้นที่ · ของวางชิดพื้นด้านล่างเสมอ */
function wlPalletSVG(x,y,w,h){
  var top=h*0.40, gap=w*0.085;
  var o='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+top+'" rx="1" fill="#e5a948"/>'

}
function wlBoxesSVG(x,y,w,h,cols,rows){

    var bx=x+c*bw+g, byy=y+r*bh+g, ww=bw-g*2, hh=bh-g*2;
    o+='<rect x="'+bx+'" y="'+byy+'" width="'+ww+'" height="'+hh+'" rx="1" fill="#c8823f" stroke="#9c6228" stroke-width="1.2"/>'
      +'<rect x="'+bx+'" y="'+(byy+hh*0.42)+'" width="'+ww+'" height="'+(hh*0.16)+'" fill="#e3bb8a"/>'
      +'<rect x="'+(bx+ww*0.46)+'" y="'+byy+'" width="'+(ww*0.08)+'" height="'+hh+'" fill="#ad6f2f"/>';
  }

}
function wlDrumsSVG(x,y,w,h,cols){
