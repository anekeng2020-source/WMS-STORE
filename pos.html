<script id="addons-p">
/* ═══ ADD-ONS in the POS — same switches and records as the web (DB.settings.addons, DB.addonRecords) ═══
   Switched on / off only on the web (Settings → Add-ons, Super Admin). While off, the POS is unchanged.
   ISO : side menu "ISO": report a problem (NCR, e.g. a customer complaint), recent NCRs, documents in force;
         if the rule is on, a reason is asked before a refund / return and before saving a stock count.
   ERP : side menu "ERP" (manager and up): export POS sales (one row per line) as CSV for the date range,
         or only the sales not exported yet (marker shared with the web: settings.erp.lastSaleId). */
(function(){
"use strict";
function CS(){ try{ return settings(); }catch(e){ return {}; } }
function on(k){ try{ var s=CS(); return !!(s.addons&&s.addons[k]); }catch(e){ return false; } }
function ruleOn(k){ var a=CS().addons||{}; return on("iso")&&!(a.isoRules&&a.isoRules[k]===false); }
function recs(){ if(!Array.isArray(DB.addonRecords)) DB.addonRecords=[]; return DB.addonRecords; }
try{ POS_MERGE.addonRecords="id"; }catch(e){}
function byKind(k){ return recs().filter(function(r){return r.kind===k;}); }
function rid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function g(id){ return ((document.getElementById(id)||{}).value||"").trim(); }
function num(n){ return (parseFloat(n)||0).toLocaleString("en-US",{maximumFractionDigits:2}); }
function nm(arr,k){ var x=arr.find(function(a){return a[0]===k;}); return x?x[1]:k; }
var SEV=[["MINOR",T("เล็กน้อย","Minor")],["MAJOR",T("ร้ายแรง","Major")],["CRITICAL",T("วิกฤต","Critical")]];
var SRC=[["CUST",T("ลูกค้าร้องเรียน / รับคืน","Customer complaint / return")],["STOCK",T("ในร้าน / ชั้นวาง","On the shelf")],["RECV",T("รับสินค้า","Receiving")],["SUPP",T("ผู้จำหน่าย","Supplier")]];
var NST=[["OPEN",T("เปิด","Open")],["ACTION",T("กำลังแก้ไข","In action")],["VERIFY",T("รอทวนสอบ","To verify")],["CLOSED",T("ปิดแล้ว","Closed")]];
var REASONS=[T("ลูกค้าเปลี่ยนใจ","Customer changed mind"),T("สินค้าชำรุด / เสียหาย","Defective / damaged"),T("ขายผิดรายการ","Wrong item sold"),T("ตรวจนับพบผลต่าง","Count difference"),T("สินค้าสูญหาย","Lost"),T("บันทึกผิดพลาด","Entry error"),T("อื่น ๆ","Other")];
function seqNo(){ var ym=today().slice(0,7).replace("-",""), pre="NCR-"+ym+"-", n=0;
  byKind("NCR").forEach(function(r){ var s=String(r.no||""); if(s.indexOf(pre)===0){ var v=parseInt(s.slice(pre.length),10)||0; if(v>n) n=v; } }); return pre+String(n+1).padStart(3,"0"); }

/* side menu entries, kept in step with the switches on every redraw */
var ADD=[["iso","ISO","ISO"],["erp","ERP","ERP"]];
var ADD_IC={iso:'<path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/>',erp:'<path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 21v-5h5"/><path d="M21 3v5h-5"/>'};
function paintAddIcons(){ Object.keys(ADD_IC).forEach(function(k){ var b=document.querySelector('#nav button[onclick="go(\x27'+k+'\x27)"]'); if(!b||b.dataset.adic) return; var old=b.querySelector("svg"); var ic='<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ADD_IC[k]+'</svg>'; if(old) old.outerHTML=ic; else b.insertAdjacentHTML("afterbegin",ic); b.dataset.adic="1"; }); }
function syncNav(){ ADD.forEach(function(a){ var want=on(a[0])&&(a[0]!=="erp"||isMgr()), i=NAV.findIndex(function(n){return n[0]===a[0];});
  if(want&&i<0){ var si=NAV.findIndex(function(n){return n[0]==="settings";}); NAV.splice(si<0?NAV.length:si,0,a); }
  if(!want&&i>=0) NAV.splice(i,1); });
  if((VIEW==="iso"&&!on("iso"))||(VIEW==="erp"&&!(on("erp")&&isMgr()))) VIEW="pos"; }
var _r=render; render=function(){ try{ syncNav(); }catch(e){}
  var r=_r.apply(this,arguments);
  try{ var v=$("view"); if(v&&VIEW==="iso") v.innerHTML=vIso(); else if(v&&VIEW==="erp") v.innerHTML=vErp(); paintAddIcons(); }catch(e){ console.warn("addons-p",e); }
  return r; };

/* ───────── ISO ───────── */
function vIso(){ var ncr=byKind("NCR"), open=ncr.filter(function(r){return r.status!=="CLOSED";}), docs=byKind("DOC").filter(function(d){return d.status==="EFFECTIVE";});
  var mine=ncr.slice().sort(function(a,b){return String(b.no).localeCompare(String(a.no));}).slice(0,12);
  var opt=function(arr,id,v){ return '<select class="inp" id="'+id+'">'+arr.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===v?" selected":"")+'>'+esc(o[1])+'</option>';}).join("")+'</select>'; };
  var items=(DB.itemMaster||[]).map(function(i){return '<option value="'+esc(i.code)+'">'+esc(i.name||"")+'</option>';}).join("");
  return '<div class="adp"><div class="adp-kpi"><div><small>'+T("NCR ที่ยังเปิด","Open NCRs")+'</small><b>'+num(open.length)+'</b></div><div><small>'+T("เอกสารที่ใช้งาน","Documents in force")+'</small><b>'+num(docs.length)+'</b></div></div>'
   +'<div class="adp-card"><h3>'+T("แจ้งปัญหา (เปิด NCR)","Report a problem (new NCR)")+'</h3><div class="adp-g">'
     +'<label>'+T("แหล่งที่พบ","Source")+opt(SRC,"pnSrc","CUST")+'</label><label>'+T("ความรุนแรง","Severity")+opt(SEV,"pnSev","MINOR")+'</label>'
     +'<label>'+T("รหัสสินค้า","Item code")+'<input class="inp" id="pnCode" list="pnItems"><datalist id="pnItems">'+items+'</datalist></label>'
     +'<label>'+T("จำนวน","Qty")+'<input class="inp" id="pnQty" type="number" min="0" value="1"></label>'
     +'<label>'+T("เลขบิล / อ้างอิง","Bill / reference")+'<input class="inp" id="pnRef"></label></div>'
     +'<label style="display:block;margin-top:10px">'+T("รายละเอียดปัญหา *","What is wrong *")+'<textarea class="inp" id="pnDesc" rows="2"></textarea></label>'
     +'<button class="btn primary" style="margin-top:10px" onclick="isoNcrP()">'+T("บันทึก NCR","Save NCR")+'</button>'
     +'<div style="font-size:12px;color:var(--sub);margin-top:6px">'+T("การแก้ไข/ปิด NCR ทำที่เว็บหลักหรือมือถือ","Follow-up and closing are on the web or the phone")+'</div></div>'
   +'<div class="adp-g" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"><div class="adp-card"><h3>'+T("NCR ล่าสุด","Recent NCRs")+'</h3>'+(mine.length?mine.map(function(r){ return '<div class="adp-row"><span><b>'+esc(r.no)+'</b> <small>'+esc(r.code||"")+'</small><br><small>'+esc(String(r.desc||"").slice(0,60))+'</small></span><small>'+esc(nm(NST,r.status))+'</small></div>'; }).join(""):'<div style="color:var(--sub)">-</div>')+'</div>'
   +'<div class="adp-card"><h3>'+T("เอกสารที่ใช้งาน","Documents in force")+'</h3>'+(docs.length?docs.map(function(d){ var ok=/^https?:\/\//i.test(d.url||""); return '<div class="adp-row"><span><b>'+esc(d.code)+'</b> · Rev. '+esc(d.rev||"0")+'<br><small>'+esc(d.title)+'</small></span>'+(ok?'<a class="btn ghost sm" href="'+esc(d.url)+'" target="_blank" rel="noopener">'+T("เปิด","Open")+'</a>':'')+'</div>'; }).join(""):'<div style="color:var(--sub)">-</div>')+'</div></div></div>';
}
window.isoNcrP=function(){ var desc=g("pnDesc"); if(!desc){ toast(T("กรอกรายละเอียดปัญหา","Describe the problem"),"warn"); return; }
  var code=g("pnCode"), it=code?(itemByCode(code)||{}):{}, now=today()+" "+nowTime();
  var r={id:rid("NCR"),kind:"NCR",no:seqNo(),date:today(),source:g("pnSrc"),severity:g("pnSev"),code:code,name:it.name||"",qty:parseFloat(g("pnQty"))||0,ref:g("pnRef"),desc:desc,status:"OPEN",by:whoName(),
    hist:[{at:now,by:whoName(),status:"OPEN",note:T("เปิด NCR (POS)","Opened (POS)")}]};
  recs().push(r); Store.save(); toast(T("บันทึก NCR แล้ว ","NCR saved ")+r.no,"ok"); render(); };

/* reason gate (own layer) */
var _pass=null;
function sigP(){ return (DB.history||[]).length+"|"+(DB.returns||[]).length+"|"+(DB.stocktake||[]).length+"|"+(DB.stock||[]).reduce(function(a,s){return a+(parseInt(s.qty,10)||0);},0); }
function logChg(label,target,p){ recs().push({id:rid("CHG"),kind:"CHG",date:today(),at:today()+" "+nowTime(),by:whoName(),action:label,target:target,reason:p.reason,note:p.note,src:"pos"}); try{ Store.save(); }catch(e){} }
function gateP(name,label,textOf){ var orig=window[name]; if(typeof orig!=="function") return;
  window[name]=function(){ var args=[].slice.call(arguments);
    if(!ruleOn("reason")) return orig.apply(this,args);
    if(_pass&&_pass.name===name){ var p=_pass; _pass=null; var before=sigP(), tgt=textOf(args); var r=orig.apply(this,args);
      var after=function(){ if(sigP()!==before) logChg(label,tgt,p); };
      if(r&&typeof r.then==="function") r.then(after,after); else after(); return r; }
    window._isoGateP={name:name,args:args};
    var o=$("isoAskP"); if(!o){ o=document.createElement("div"); o.id="isoAskP"; document.body.appendChild(o); }
    o.innerHTML='<div class="b"><b style="font-size:16px">'+T("ระบุเหตุผล (ISO)","Reason required (ISO)")+'</b><div style="font-size:12.5px;color:var(--sub);margin:2px 0 12px">'+esc(label)+' · '+esc(textOf(args))+'</div>'
      +'<label style="display:block;margin-bottom:8px">'+T("เหตุผล","Reason")+'<select class="inp" id="isoRsP">'+REASONS.map(function(x){return '<option>'+esc(x)+'</option>';}).join("")+'</select></label>'
      +'<label style="display:block;margin-bottom:12px">'+T("รายละเอียดเพิ่มเติม","Details")+'<input class="inp" id="isoRnP"></label>'
      +'<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onclick="$(\'isoAskP\').className=\'\';window._isoGateP=null">'+T("ยกเลิก","Cancel")+'</button><button class="btn primary" onclick="isoGateOkP()">'+T("ยืนยัน","Confirm")+'</button></div></div>';
    o.className="open"; }; }
window.isoGateOkP=function(){ var q=window._isoGateP; if(!q) return; var reason=g("isoRsP"), note=g("isoRnP");
  if(reason===T("อื่น ๆ","Other")&&!note){ toast(T("เลือก 'อื่น ๆ' ต้องกรอกรายละเอียด","'Other' needs details"),"warn"); return; }
  $("isoAskP").className=""; window._isoGateP=null; _pass={name:q.name,reason:reason,note:note}; window[q.name].apply(window,q.args); _pass=null; };
gateP("confirmReturn",T("คืนสินค้า / คืนเงิน","Return / refund"),function(a){ var s=(DB.sales||[]).find(function(x){return x.id===a[0];})||{}; return (s.ref||a[0])+" · "+(a[2]||""); });
gateP("stkSave",T("บันทึกนับสต๊อก","Stock count"),function(a){ return String(a[0]||""); });

/* ───────── ERP: POS sales export ───────── */
function E(){ var s=CS(); if(!s.erp||typeof s.erp!=="object") s.erp={}; return s.erp; }
var FIELDS=["ref","date","time","branch","cashier","customer","code","name","qty","price","lineTotal","billTotal","vatAmt","pay","status"];
function colOf(f){ var m=(E().map||{}).sales||{}; return String(m[f]||"").trim()||f; }
function sid(s){ return parseInt(String(s.id||"").replace(/\D/g,""),10)||0; }
function saleRows(list){ var out=[]; list.forEach(function(s){ var pay=(s.pay||[]).map(function(p){return (p.method||p.m||"")+":"+(parseFloat(p.amount!=null?p.amount:p.amt)||0);}).join(" ");
  (s.lines||[]).forEach(function(l){ var q=parseFloat(l.qty)||0, pr=parseFloat(l.price)||0, d=parseFloat(l.disc)||0;
    out.push({ref:s.ref,date:s.date,time:s.time,branch:s.branch||"",cashier:s.cashierName||s.cashier||"",customer:s.customerName||s.customer||"",code:l.code,name:l.name,qty:q,price:pr,lineTotal:Math.round((q*pr-d)*100)/100,billTotal:s.total,vatAmt:s.vatAmt||0,pay:pay,status:s.status}); }); }); return out; }
function vErp(){ var e=E();
  return '<div class="adp"><div class="adp-card"><h3>'+T("ส่งออกยอดขาย POS ไป ERP","Export POS sales to ERP")+'</h3><div class="adp-g">'
    +'<label>'+T("ตั้งแต่วันที่","From")+'<input class="inp" id="pxFrom" type="date" value="'+today()+'"></label><label>'+T("ถึงวันที่","To")+'<input class="inp" id="pxTo" type="date" value="'+today()+'"></label>'
    +'<label>'+T("สถานะบิล","Bills")+'<select class="inp" id="pxSt"><option value="Paid">'+T("ชำระแล้ว","Paid")+'</option><option value="ALL">'+T("ทั้งหมด (รวมคืน/ยกเลิก)","All (incl. returns / voids)")+'</option></select></label></div>'
    +'<label style="display:flex;gap:8px;align-items:center;margin:12px 0;font-size:13px"><input type="checkbox" id="pxNew"> '+T("เฉพาะบิลที่ยังไม่เคยส่งออก (ไม่สนช่วงวันที่)","Only bills not exported yet (ignores the dates)")+'</label>'
    +(e.lastSaleAt?'<div style="font-size:12px;color:var(--sub);margin-bottom:10px">'+T("ส่งออกยอดขายล่าสุด ","Last sales export ")+esc(e.lastSaleAt)+'</div>':"")
    +'<div style="font-size:12px;color:var(--sub);margin-bottom:12px">'+T("คอลัมน์: ","Columns: ")+FIELDS.map(function(f){return '<code>'+esc(colOf(f))+'</code>';}).join(", ")+'</div>'
    +'<button class="btn primary" onclick="erpSalesP()">'+T("ส่งออก CSV","Export CSV")+'</button>'
    +'<div style="font-size:12px;color:var(--sub);margin-top:8px">'+T("ตั้งชื่อคอลัมน์ได้ที่เว็บหลัก (เชื่อมต่อ ERP → การแมปฟิลด์ → ยอดขาย POS)","Column names are set on the web (ERP connector → Field mapping → POS sales)")+'</div></div></div>'; }

  var blob=new Blob(["﻿"+text],{type:"text/csv;charset=utf-8"}), url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download="erp_sales_"+today().replace(/-/g,"")+".csv"; document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); },200);
  var mx=list.reduce(function(m,s){ return Math.max(m,sid(s)); },0); if(mx>(+e.lastSaleId||0)){ e.lastSaleId=mx; e.lastSaleAt=today()+" "+nowTime(); }
  recs().push({id:rid("ERP"),kind:"ERP",date:today(),at:today()+" "+nowTime(),by:whoName(),dir:"OUT",dataset:"sales",rows:rows.length,detail:"POS · "+list.length+T(" บิล"," bills")+(onlyNew?" · "+T("เฉพาะใหม่","new only"):" · "+from+" → "+to)});
  Store.save(); toast(T("ส่งออกแล้ว ","Exported ")+num(list.length)+T(" บิล"," bills"),"ok"); };
})();

<script id="dark-mode-js">

  var b=document.createElement("button"); b.type="button"; b.className="themebtn"; b.onclick=window.toggleTheme; p.parentNode.insertBefore(b,p);

<script id="pkg-scope-p">
/* ═══ PACKAGES in the POS — same package as the web (settings.pkg, picked by the Super Admin).

   product = stock balance, stocktake = stock count. Screens outside the package disappear from the side menu,
   the phone bar and the More sheet; if "Sell" is the main button but not in the package, "Withdraw" takes its place.
   No package saved = Full System (no change). ═══ */
(function(){

  "inbound-reg","inbound-inq","outbound-pick","outbound-inq","stock-bal","change-loc","stocktake",
  "m-item","m-loc","m-user","m-supplier","m-customer",

  "returns","packing","hu","ng-stock","qc","wh-dash","wh-layout",

var ALL=BUSINESS.concat(["iso-dash","iso-ncr","iso-trace","iso-docs","iso-changes",
  "erp-export","erp-import","erp-map","erp-api","erp-log","addons","billing","companies","ui-editor"]);
var PKG_LISTS={basic:BASIC,standard:STANDARD,advanced:ADVANCED,business:BUSINESS}, PKG_KNOWN={};
ALL.forEach(function(id){ PKG_KNOWN[id]=1; });
function pkgOf(s){ var p=s&&s.pkg; return PKG_LISTS[p]?p:"full"; }

var VMAP={pos:"so",customers:"so",promotions:"so",cashier:"so",returns:"so",reports:"so",
  withdraw:"outbound-pick",inquiry:"stock-bal",stocktake:"stocktake",iso:"iso-dash",erp:"erp-export"};
function cur(){ try{ return CID?pkgOf(settings()):"full"; }catch(e){ return "full"; } }
function blocked(v){ var w=VMAP[v]; return !!w&&!inPkg(cur(),w); }
window.pkgBlockedP=blocked;

function prune(root){ (root||document).querySelectorAll('[onclick^="go(\'"]').forEach(function(b){
  var m=/^go\('([\w-]+)'\)/.exec(b.getAttribute("onclick")||""); if(!m) return; var off=blocked(m[1]);
  if(off){ if(b.style.display!=="none") b.style.display="none"; } else if(b.style.display==="none"&&b.dataset.pkgOff) b.style.display="";
  if(off) b.dataset.pkgOff="1"; else delete b.dataset.pkgOff; }); }
/* main button: Sell → Withdraw when selling is outside the package */
var _rm=renderMnav; renderMnav=function(){ var p=null; try{ p=posCfg(); }catch(e){}
  if(p&&p.primaryAction!=="withdraw"&&blocked("pos")&&!blocked("withdraw")){ p.primaryAction="withdraw"; try{ return _rm.apply(this,arguments); } finally { p.primaryAction="pos"; } }
  return _rm.apply(this,arguments); };
var _go=go; go=function(v){ if(blocked(v)){ toast(T("เมนูนี้ไม่อยู่ในแพ็กเกจของบริษัท","This menu is not in your company's package"),"err"); v=firstOk(); } return _go.call(this,v); };

/* the More sheet and anything drawn later */
var busy=false; new MutationObserver(function(){ if(busy) return; busy=true; try{ prune(); } finally { busy=false; } }).observe(document.body,{childList:true,subtree:true});
