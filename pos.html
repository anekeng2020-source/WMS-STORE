}
function retTable(list){ return `<table class="t"><thead><tr><th>Ref</th><th>${T('วันที่','Date')}</th><th>${T('ลูกค้า','Customer')}</th><th style="text-align:right">${T('ยอด','Total')}</th><th></th></tr></thead>
  <tbody>${list.map(s=>`<tr><td><b>${esc(s.ref)}</b></td><td>${esc(s.date)} ${esc(s.time)}</td><td>${esc(s.customerName||'-')}</td><td style="text-align:right">฿${money(s.total)}</td><td><button class="btn ghost" style="padding:5px 10px" onclick="doReturn(${jsa(s.id)})">${T('คืน','Return')}</button></td></tr>`).join('')||`<tr><td colspan="5" class="muted">${T('ไม่มีบิล','No bills')}</td></tr>`}</tbody></table>`;
}
function retFilter(q){ q=(q||'').toLowerCase(); $('retList').innerHTML=retTable((DB.sales||[]).filter(s=>s.status==='Paid'&&(s.ref||'').toLowerCase().includes(q)).slice(0,50)); }
function retLeft(l){ return Math.max(0,(parseInt(l.qty,10)||0)-(parseInt(l.returnedQty,10)||0)); }
/* what can still be refunded per payment method of a bill (cash = cash taken minus change; coupons are never cash) */
function refundCaps(s){ const caps={}, pays=s.pay||[];
  pays.forEach(p=>{ if(p.method==='coupon') return; caps[p.method]=r2((caps[p.method]||0)+(parseFloat(p.amount)||0)); });
  if(caps.cash!=null) caps.cash=Math.max(0,r2(caps.cash-(parseFloat(s.change)||0)));
  (DB.sales||[]).filter(r=>r.status==='Return'&&r.origRef===s.ref).forEach(r=>{ if(caps[r.method]!=null) caps[r.method]=Math.max(0,r2(caps[r.method]-(parseFloat(r.refund)||0))); });
  const coupon=pays.filter(p=>p.method==='coupon').reduce((a,p)=>a+(parseFloat(p.amount)||0),0);
  const left=Math.max(0,r2((parseFloat(s.total)||0)-coupon-(parseFloat(s.refunded)||0)));
  Object.keys(caps).forEach(m=>{ caps[m]=Math.min(caps[m],left); });
  if(!pays.length) caps.cash=left;                                   // very old bill without payment lines
  if(s.customer) caps.credit=left;                                   // a member can always take store credit
  return {caps,left}; }
function doReturn(id){ const s=(DB.sales||[]).find(x=>x.id===id); if(!s)return;
  if(!s.lines.some(l=>retLeft(l)>0)){ toast(T('บิลนี้คืนครบแล้ว','Everything on this bill was already returned'),'warn'); return; }
  modal(T('คืนสินค้า','Return')+' · '+s.ref,
   `<table class="t"><thead><tr><th>${T('สินค้า','Item')}</th><th>${T('ขายไป','Sold')}</th><th>${T('คืนได้','Returnable')}</th><th>${T('คืน','Return qty')}</th></tr></thead>
    <tbody>${s.lines.map((l,i)=>`<tr><td>${esc(l.name)}<br><small>${esc(l.code)} ฿${money(l.price)}</small></td><td>${esc(l.qty)}</td><td>${retLeft(l)}</td><td><input class="inp retq" data-i="${i}" type="number" min="0" max="${retLeft(l)}" value="0" style="width:80px;min-height:38px"${retLeft(l)?'':' disabled'}></td></tr>`).join('')}</tbody></table>
    <div class="field" style="margin-top:12px"><label>${T('วิธีคืนเงิน','Refund method')}</label><select id="retMethod" class="inp">${(()=>{ const rc=refundCaps(s).caps, ms=Object.keys(rc).filter(m=>rc[m]>0||m==='credit').sort((a,b)=>(rc[b]||0)-(rc[a]||0)-(a==='credit'?1e9:0)+(b==='credit'?1e9:0));
      return (ms.length?ms:['cash']).map(m=>`<option value="${esc(m)}">${payLabel(m)}${m==='credit'?'':' (≤ ฿'+money(rc[m]||0)+')'}</option>`).join(''); })()}</select></div>
    <div class="field"><label>${T('คืนสต๊อกเข้าตำแหน่ง','Restock to location')}</label><select id="retLoc" class="inp">${locList().filter(c=>!isNG(c)).map(c=>`<option>${esc(c)}</option>`).join('')||`<option value="">${T('ตำแหน่งเดิมที่ขายออก','Where it was sold from')}</option>`}</select></div>`,
   [{t:T('ยกเลิก','Cancel'),c:'ghost',fn:closeModal},{t:T('ยืนยันคืน','Confirm return'),c:'primary',fn:()=>{
     // read the form BEFORE asking for a manager: the approval dialog replaces this one
     const qs={}; let bad=false;
     document.querySelectorAll('.retq').forEach(el=>{ const v=String(el.value||'').trim(), q=Number(v||0), l=s.lines[el.dataset.i];
       if(!(q>=0)||Math.floor(q)!==q||q>retLeft(l)) bad=true; else if(q>0) qs[el.dataset.i]=q; });
     if(bad){ toast(T('จำนวนคืนต้องเป็นจำนวนเต็ม และไม่เกินที่คืนได้','Return qty must be a whole number, no more than returnable'),'err'); return; }
     if(!Object.keys(qs).length){ toast(T('ระบุจำนวนคืน','Enter return qty'),'warn'); return; }
     const method=$('retMethod').value, loc=$('retLoc').value;
     if(method==='cash'&&!CUR_SHIFT){ toast(T('คืนเงินสดต้องเปิดกะก่อน (เงินออกจากลิ้นชัก)','Open a shift before a cash refund (it leaves the drawer)'),'warn'); return; }
     needMgr(()=>confirmReturn(s.id,qs,method,loc)); }}],true);
}
/* how much earlier returns of this bill already put back on each gift card {code: amount} */
function gcRefundedPer(s,skipId){ const out={}, cards=(s.pay||[]).filter(p=>p.method==='giftcard');
  (DB.sales||[]).filter(r=>r.status==='Return'&&r.origRef===s.ref&&r.method==='giftcard'&&r.id!==skipId).forEach(r=>{
    if(Array.isArray(r.gcBack)) r.gcBack.forEach(x=>{ out[x.code]=r2((out[x.code]||0)+(parseFloat(x.amount)||0)); });
    else { let back=parseFloat(r.refund)||0;                           // older returns: they filled the cards in pay order
      cards.forEach(p=>{ if(back<=0) return; const a=Math.min(back,parseFloat(p.amount)||0); out[p.ref]=r2((out[p.ref]||0)+a); back=r2(back-a); }); } });
  return out; }
function confirmReturn(saleId,qs,method,loc){ const s=(DB.sales||[]).find(x=>x.id===saleId); if(!s)return;
  if(method==='credit'&&!s.customer){ toast(T('บิลนี้ไม่มีสมาชิก คืนเป็นเครดิตไม่ได้','No member on this bill — store credit not possible'),'err'); return; }
  if(method==='cash'&&!CUR_SHIFT){ toast(T('คืนเงินสดต้องเปิดกะก่อน','Open a shift before a cash refund'),'err'); return; }
  const rc=refundCaps(s), capM=rc.caps[method]!=null?rc.caps[method]:0;
  if(capM<=0){ toast(T('บิลนี้ไม่ได้จ่ายด้วยวิธีนี้ / คืนครบแล้ว','This bill has nothing left to refund this way'),'err'); return; }
  for(const i in qs){ if(qs[i]>retLeft(s.lines[i])){ toast(T('จำนวนคืนเกินที่คืนได้','More than can be returned'),'err'); return; } }   // re-check: another terminal may have returned meanwhile
  // what the customer actually paid per unit: line net, scaled by bill / member / promo discounts and VAT
  const ratio=(parseFloat(s.subtotal)>0)?(parseFloat(s.total)||0)/parseFloat(s.subtotal):1;
  const maxLeft=Math.max(0,Math.min(rc.left,capM));                  // never more than was paid this way (coupons are never refunded)
  { let pre=0; Object.entries(qs).forEach(([i,q])=>{ const l=s.lines[i]; pre+=r2(lineTotal(l)/(parseInt(l.qty,10)||1)*ratio*q); });
    if(pre>maxLeft+0.004&&!confirm(T('ยอดคืนตามสินค้า ฿','Refund for these items ฿')+money(pre)+T(' เกินที่คืนได้ด้วยวิธีนี้ (฿',' is more than can go back this way (฿')+money(maxLeft)+T(') — คืนเพียง ฿',') — refund only ฿')+money(maxLeft)+'?')) return; }
  let refund=0; const rlines=[];
  Object.entries(qs).forEach(([i,q])=>{ const l=s.lines[i]; const unit=lineTotal(l)/(parseInt(l.qty,10)||1)*ratio; let amt=r2(unit*q);
    if(refund+amt>maxLeft) amt=r2(maxLeft-refund); refund=r2(refund+amt);
    l.returnedQty=(parseInt(l.returnedQty,10)||0)+q;
    const mu=Math.max(1,parseInt(l.mult,10)||1), uBase=unit/mu; let left=q*mu;          // a returned package puts its pieces back
    (DB.history||[]).filter(x=>x.type==='OUT'&&x.orderNo===s.ref&&x.code===l.code&&x.loc&&!x.oversold).forEach(x=>{
      const can=Math.max(0,(parseInt(x.qty,10)||0)-(parseInt(x.retQty,10)||0)), take=Math.min(can,left); if(take<=0) return;
      const lot={lotNo:x.lotNo||'',lotSup:x.lotSup||'',mfd:x.mfd||'',exp:x.exp||'',sn:x.sn||'',cost:parseFloat(x.cost)||costOf(itemByCode(l.code))};
      const toLoc=loc||x.loc;                                        // no location chosen (none set up): back where it came from
      if(x.hu&&toLoc===x.loc) lot.hu=x.hu;                           // back into the pallet / tote it was sold from
      receiveStock(l.code,toLoc,take,lot); x.retQty=(parseInt(x.retQty,10)||0)+take; left-=take;
      hpush(Object.assign({id:uid('H'),type:'IN',date:today(),time:nowTime(),code:l.code,name:l.name,loc:toLoc,qty:take,orderNo:s.ref,value:r2(uBase*take),cogs:r2(lot.cost*take),note:'POS Return',status:'Return'},lot)); });
    if(left>0) hpush({id:uid('H'),type:'IN',date:today(),time:nowTime(),code:l.code,name:l.name,loc:'',qty:0,refundOnlyQty:left,orderNo:s.ref,value:r2(uBase*left),   // sold beyond stock: money back, no goods to restock
      note:'POS Return — '+T('ไม่คืนสต๊อก (ขายเกินสต๊อก)','not restocked (was oversold)'),status:'Return'});
    rlines.push({code:l.code,name:l.name,qty:q,mult:mu,base:q*mu,unit:l.unit||'',amount:amt}); });
  const ret={id:uid('R'),ref:billRef('RET'),origRef:s.ref,date:today(),time:nowTime(),cashier:session.user.username,customer:s.customer,customerName:s.customerName,lines:rlines,refund,method,status:'Return',shiftId:CUR_SHIFT?CUR_SHIFT.id:''};
  DB.sales.push(ret);
  s.refunded=r2((parseFloat(s.refunded)||0)+refund);
  if(method==='giftcard'){ let back=refund; const already=gcRefundedPer(s,ret.id); ret.gcBack=[];   // back onto the card(s) the bill was paid with
    const paidPer={}; (s.pay||[]).filter(p=>p.method==='giftcard').forEach(p=>{ paidPer[p.ref]=r2((paidPer[p.ref]||0)+(parseFloat(p.amount)||0)); });
    Object.keys(paidPer).forEach(code=>{ if(back<=0) return; const gc=(DB.giftcards||[]).find(g=>g.code===code); if(!gc) return;
      const room=Math.max(0,r2(paidPer[code]-(already[code]||0))), a=Math.min(back,room); if(a<=0) return;
      gc.balance=r2((parseFloat(gc.balance)||0)+a); back=r2(back-a); ret.gcBack.push({code,amount:a}); });
    ret.giftcards=ret.gcBack.map(x=>x.code); }
  if(s.customer){ const c=(DB.customerMaster||[]).find(x=>x.code===s.customer);
    if(c){ if(method==='credit') c.storeCredit=r2((parseFloat(c.storeCredit)||0)+refund);
      c.totalSpent=Math.max(0,r2((parseFloat(c.totalSpent)||0)-refund));                       // undo what the refunded part earned
      const rate=parseFloat(posCfg().pointRate)||0; if(rate>0&&(parseInt(s.points,10)||0)>0){ const tot=parseFloat(s.total)||0, after=parseFloat(s.refunded)||0, before=r2(after-refund);   /* points the bill keeps, before vs after */
        const lose=Math.max(0,Math.floor(Math.max(0,tot-before)/rate)-Math.floor(Math.max(0,tot-after)/rate)); c.points=Math.max(0,(parseInt(c.points,10)||0)-lose); } } }
  Store.save(); closeModal(); render(); toast(T('คืนสินค้าสำเร็จ','Return complete')+' ฿'+money(refund),'ok');
}

function openShiftPrompt(){ if(CUR_SHIFT){toast(T('มีกะที่เปิดอยู่แล้ว','Shift already open'),'warn');return;}
  modal(T('เปิดกะ','Open shift'),
   `<div class="field"><label>${T('เงินทอนตั้งต้น (บาท)','Opening cash float')}</label><input id="shFloat" class="inp" type="number" value="1000"></div>`,
   [{t:T('ยกเลิก','Cancel'),c:'ghost',fn:closeModal},{t:T('เปิดกะ','Open'),c:'primary',fn:()=>{
     CUR_SHIFT={id:uid('SH'),ref:'SHIFT-'+today().replace(/-/g,'')+'-'+nowTime().replace(':',''),cashier:session.user.username,cashierName:whoName(),branch:posCfg().branch,openAt:today()+' '+nowTime(),openFloat:parseFloat($('shFloat').value)||0,cashIn:[],cashOut:[],saleIds:[],status:'Open'};
     DB.shifts.push(CUR_SHIFT); Store.save(); closeModal(); render(); toast(T('เปิดกะแล้ว','Shift opened'),'ok');
   }}]);
}
function shiftSales(sh){ return (DB.sales||[]).filter(s=>s.shiftId===sh.id); }
function shiftCashExpected(sh){ let cash=sh.openFloat||0;
  shiftSales(sh).forEach(s=>{ if(s.status==='Paid')(s.pay||[]).forEach(p=>{ if(p.method==='cash')cash+=p.amount; }); if(s.status==='Return'&&s.method==='cash')cash-=s.refund; });
  (sh.cashIn||[]).forEach(c=>cash+=c.amount); (sh.cashOut||[]).forEach(c=>cash-=c.amount);
  // change is handed out of the drawer, but never more than the cash tendered on that bill
  shiftSales(sh).forEach(s=>{ if(s.status!=='Paid')return; const tendered=(s.pay||[]).filter(p=>p.method==='cash').reduce((a,p)=>a+p.amount,0); cash-=Math.min(s.change||0,tendered); });
  return r2(cash);
}
/* what moved through a shift, line by line (the same parts shiftCashExpected adds up) */
function shiftParts(sh){ const all=shiftSales(sh), paid=all.filter(s=>s.status==='Paid'), rets=all.filter(s=>s.status==='Return');
  const cashIn=paid.reduce((a,s)=>a+(s.pay||[]).filter(p=>p.method==='cash').reduce((x,p)=>x+p.amount,0),0);
  const change=paid.reduce((a,s)=>{ const tn=(s.pay||[]).filter(p=>p.method==='cash').reduce((x,p)=>x+p.amount,0); return a+Math.min(s.change||0,tn); },0);
  const refunds={}; rets.forEach(r=>{ refunds[r.method]=r2((refunds[r.method]||0)+(parseFloat(r.refund)||0)); });
  return {paid,rets,cashIn:r2(cashIn),change:r2(change),refunds,refundTotal:r2(rets.reduce((a,r)=>a+(parseFloat(r.refund)||0),0))}; }

     <div class="row3"><button class="btn ghost" onclick="cashMove('in')">＋ ${T('นำเงินเข้า (Cash In)','Cash In')}</button>
     <button class="btn ghost" onclick="cashMove('out')">－ ${T('นำเงินออก (Cash Out)','Cash Out')}</button>
     <button class="btn danger" onclick="closeShift()">${T('ปิดกะ + นับเงิน','Close shift + count')}</button></div>
     <div class="muted" style="margin-top:10px">${T('เงินทอนตั้งต้น','Float')}: ฿${money(sh.openFloat)} · Cash In: ฿${money(cin)} · Cash Out: ฿${money(cout)} · ${T('รับเงินสด','Cash taken')}: ฿${money(cashSales)} · ${T('เงินทอน','Change')}: -฿${money(sp.change)} · ${T('คืนเงินสด','Cash refunds')}: -฿${money(sp.refunds.cash||0)}</div></div>

     <tbody>${sales.slice().reverse().map(s=>`<tr><td>${esc(s.time)}</td><td>${esc(s.ref)}</td><td style="text-align:right">฿${money(s.total)}</td><td><button class="btn ghost" style="padding:4px 10px" onclick="showReceipt(${jsa(s.id)})">${T('ใบเสร็จ','Receipt')}</button></td></tr>`).join('')||`<tr><td colspan="4" class="muted">${T('ยังไม่มีบิล','No bills')}</td></tr>`}</tbody></table></div>`;
}

function posHuOf(hu){ if(!hu) return {pallet:'',tote:''}; const L=DB.huMaster||[], x=L.find(c=>c.code===hu);

function inqRows(){ // build one row per item with its lots; filter by q across many fields
  const q=(INQ_Q||'').toLowerCase().trim();
  return (DB.itemMaster||[]).filter(i=>INQ_CAT==='all'||i.cat===INQ_CAT).map(i=>{
    const lots=(DB.stock||[]).filter(s=>s.code===i.code&&(parseInt(s.qty,10)||0)>0)
      .map(s=>Object.assign({loc:s.loc,qty:parseInt(s.qty,10)||0,lotNo:s.lotNo||'',exp:s.exp||'',cost:s.cost},posHuOf(s.hu)));
    return {it:i,lots,total:lots.reduce((a,l)=>a+l.qty,0)};
  }).filter(r=>{
    if(!q)return true;
    const i=r.it;
    if([i.code,i.name,i.barcode,i.cat,i.sup].some(v=>String(v||'').toLowerCase().includes(q)))return true;
    if(r.lots.some(l=>[l.loc,l.lotNo,l.pallet,l.tote].some(v=>String(v||'').toLowerCase().includes(q))))return true;
    return false;
  });

function saveEditProduct(code){
  if(!isAdmin())return;
  const it=itemByCode(code); if(!it)return;
  const newName=($('epName').value||'').trim();
  if(!newName){ toast(T('กรุณากรอกชื่อสินค้า','Please enter a product name'),'err'); return; }
  const newPrice=parseFloat($('epPrice').value), newCost=parseFloat($('epCost').value);
  if(isNaN(newPrice)||newPrice<0||isNaN(newCost)||newCost<0){ toast(T('กรุณากรอกตัวเลขที่ถูกต้อง','Please enter valid numbers'),'err'); return; }
  const note=($('epNote').value||'').trim();
  const when=today()+' '+nowTime(), by=(session.user&&(session.user.fullName||session.user.username))||'';
  const oldPrice=priceOf(it), oldCost=costOf(it), oldName=it.name||'';
  if(it.price==null) it.price=oldPrice;                                // price was falling back to cost: pin it so a cost edit can't move it
  let changed=false;
  if(newName!==oldName){ it.name=newName; changed=true; }
  if(newPrice!==oldPrice){ if(!Array.isArray(it.priceHistory))it.priceHistory=[]; it.priceHistory.push({prevPrice:oldPrice,price:newPrice,at:when,by,note}); it.price=newPrice; changed=true; }
  if(newCost!==oldCost){ if(!Array.isArray(it.costHistory))it.costHistory=[]; it.costHistory.push({prevCost:oldCost,cost:newCost,at:when,by,note}); it.cost=newCost; changed=true; }
  if(changed)Store.save();
  closeModal();
  $('inqResult').innerHTML=inqTable();
  toast(changed?T('บันทึกข้อมูลสินค้าแล้ว','Product updated'):T('ไม่มีการเปลี่ยนแปลง','No changes'),changed?'ok':'warn');
}
/* ===== Client-side image compression: resize + reduce JPEG quality until ~50KB ===== */
function compressImageFile(file,targetKB){
  targetKB=targetKB||50;
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      try{
        const b64Size=s=>Math.ceil((s.length-s.indexOf(',')-1)*3/4);
        const targetBytes=targetKB*1024;
        const render=(w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); return c; };
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        const maxDim=1000;
        if(w>maxDim||h>maxDim){ const s=Math.min(maxDim/w,maxDim/h); w=Math.round(w*s); h=Math.round(h*s); }
        let canvas=render(w,h);
        let quality=0.85, dataUrl=canvas.toDataURL('image/jpeg',quality), tries=0;
        while(b64Size(dataUrl)>targetBytes&&quality>0.1&&tries<14){ quality-=0.06; dataUrl=canvas.toDataURL('image/jpeg',quality); tries++; }
        // still too big even at low quality → shrink dimensions further and retry
        let shrink=0;
        while(b64Size(dataUrl)>targetBytes&&shrink<4){
          shrink++; w=Math.round(w*0.75); h=Math.round(h*0.75);
          canvas=render(w,h); quality=0.8; dataUrl=canvas.toDataURL('image/jpeg',quality); tries=0;
          while(b64Size(dataUrl)>targetBytes&&quality>0.1&&tries<14){ quality-=0.06; dataUrl=canvas.toDataURL('image/jpeg',quality); tries++; }
        }
        resolve(dataUrl);
      }catch(e){ reject(e); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src=url;
  });
}
function uploadProductImage(code,afterFn){
  if(!isAdmin())return;
  const it=itemByCode(code); if(!it)return;
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=async()=>{
    const file=inp.files&&inp.files[0]; if(!file)return;
    if(file.size>20*1024*1024){ toast(T('ไฟล์ใหญ่เกินไป (จำกัด 20MB ก่อนบีบอัด)','File too large (max 20MB before compression)'),'err'); return; }
    const oldImg=it.img||'';
    toast(T('กำลังบีบอัดรูป...','Compressing image...'),'ok');
    try{
      const dataUrl=await compressImageFile(file,50);
      toast(T('กำลังอัปโหลดรูป...','Uploading image...'),'ok');
      if(CONFIG.USE_BACKEND){
        const r=await fetch(CONFIG.API_BASE+'?action=upload',{method:'POST',headers:Store.headers(true),body:JSON.stringify({company:CID,code:code,data:dataUrl})});
        if(!r.ok)throw new Error('HTTP '+r.status);
        const d=await r.json();
        if(!d||!d.path)throw new Error('no path in response');
        const cur=itemByCode(code)||it; cur.img=d.path;                    // re-read: a sync during the upload replaces the data
        it.img=d.path;
      } else {
        it.img=dataUrl; // offline/local fallback
      }
      Store.save();
      toast(T('เปลี่ยนรูปสินค้าแล้ว (บีบอัดเหลือ ~50KB)','Product image updated (compressed to ~50KB)'),'ok');
      if(afterFn)afterFn(it);
      // (no delete of the old file: uploads overwrite images/<company>/<code>.jpg in place — deleting it would remove the new image)
    }catch(e){
      toast(T('อัปโหลดรูปไม่สำเร็จ ลองใหม่','Upload failed — please try again'),'err');
    }
  };
  inp.click();
}

function pickPromptpayQR(){ if(!isAdmin()){ toast(T('เฉพาะผู้ดูแลระบบ','Admin only'),'err'); return; }
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const file=inp.files&&inp.files[0]; if(!file)return;
    if(file.size>8*1024*1024){ toast(T('ไฟล์ใหญ่เกินไป (จำกัด 8MB)','File too large (max 8MB)'),'err'); return; }
    // stored as a file on the server (max 1000px JPEG q85 — QR stays sharp); only its URL goes into settings
    const reader=new FileReader();
    reader.onload=async()=>{
      let src=reader.result;
      if(CONFIG.USE_BACKEND){
        try{ const r=await fetch(CONFIG.API_BASE+'?action=upload',{method:'POST',headers:Store.headers(true),body:JSON.stringify({company:CID,code:'PROMPTPAY_QR',data:reader.result})});
          const d=r.ok?await r.json():null; if(!d||!d.path)throw new Error('HTTP '+r.status); src=d.path; }
        catch(e){ toast(T('อัปโหลดรูป QR ไม่สำเร็จ ลองใหม่','QR image upload failed — try again')+' ('+(e.message||'network')+')','err'); return; }
      }
      const p=posCfg(); p.promptpayQrImg=src; Store.save();
      const box=$('ppQrPreview'); if(box)box.innerHTML=`<img src="${esc(src)}" style="max-width:140px;border-radius:8px;border:1px solid var(--line)">`;
      const rb=$('ppQrRemoveBtn'); if(rb)rb.style.display='';
      toast(T('บันทึกรูป QR PromptPay แล้ว','PromptPay QR image saved'),'ok');
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}
function removePromptpayQR(){ if(!isAdmin()){ toast(T('เฉพาะผู้ดูแลระบบ','Admin only'),'err'); return; }
  const p=posCfg(); p.promptpayQrImg=''; Store.save();
  const box=$('ppQrPreview'); if(box)box.innerHTML='';
  const rb=$('ppQrRemoveBtn'); if(rb)rb.style.display='none';
  toast(T('ลบรูป QR แล้ว','QR image removed'),'ok');
}

/* ============================ MODULE 12: REPORTS ============================ */
let RPT='sales';
let RPT_FROM='', RPT_TO='', RPT_BILL_Q='', RPT_HTYPE='all', HIST_OPEN={};
function rptInRange(d){ d=String(d||''); if(RPT_FROM&&d<RPT_FROM)return false; if(RPT_TO&&d>RPT_TO)return false; return true; }
function rptSetRange(mode){
  const d=new Date();
  if(mode==='today'){ RPT_FROM=today(); RPT_TO=today(); }
  else if(mode==='month'){ RPT_FROM=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; RPT_TO=today(); }
  else if(mode==='year'){ RPT_FROM=d.getFullYear()+'-01-01'; RPT_TO=today(); }
  else { RPT_FROM=''; RPT_TO=''; }
  render();
}
function rptApplyCustom(){ RPT_FROM=$('rptFrom').value||''; RPT_TO=$('rptTo').value||''; render(); }
function rptBillSearch(){ RPT_BILL_Q=($('rptBillQ')&&$('rptBillQ').value)||''; $('rptBody').innerHTML=reportBody(); }
function rptRerender(){ render(); }
function vReports(){
  const tabs=[['bills','บิลขาย','Sales bills'],['history','ประวัติ','History'],['sales','ยอดขาย','Sales'],['staff','พนักงาน','Staff'],['payment','การรับเงิน','Payments'],['returns','คืนสินค้า','Returns'],['shift','ปิดกะ','Shifts'],['product','สินค้า','Products']];
  return `<div class="tabs" style="margin-bottom:14px">${tabs.map(t=>`<button class="${RPT===t[0]?'on':''}" onclick="RPT='${t[0]}';render()">${T(t[1],t[2])}</button>`).join('')}</div>
    <div class="panel" style="margin-bottom:14px">
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
        <button class="btn ghost" style="padding:7px 14px" onclick="rptSetRange('today')">${T('วันนี้','Today')}</button>
        <button class="btn ghost" style="padding:7px 14px" onclick="rptSetRange('month')">${T('เดือนนี้','This month')}</button>
        <button class="btn ghost" style="padding:7px 14px" onclick="rptSetRange('year')">${T('ปีนี้','This year')}</button>
        <button class="btn ghost" style="padding:7px 14px" onclick="rptSetRange('all')">${T('ทั้งหมด','All time')}</button>
        <span class="muted">${T('หรือกำหนดเอง','or custom')}:</span>
        <input type="date" id="rptFrom" class="inp" style="width:auto" value="${esc(RPT_FROM)}">
        <span class="muted">${T('ถึง','to')}</span>
        <input type="date" id="rptTo" class="inp" style="width:auto" value="${esc(RPT_TO)}">
        <button class="btn primary" style="padding:7px 14px" onclick="rptApplyCustom()">${T('กรอง','Filter')}</button>
      </div>
      <div class="muted" style="margin-top:8px">${T('ช่วงที่แสดง','Showing')}: ${esc(RPT_FROM||T('เริ่มต้น','the start'))} → ${esc(RPT_TO||T('ปัจจุบัน','now'))}</div>
      ${RPT==='bills'?`<div style="margin-top:10px"><input id="rptBillQ" class="inp" style="max-width:260px" placeholder="${T('ค้นหาเลขที่บิล...','Search bill number...')}" value="${esc(RPT_BILL_Q)}" oninput="rptBillSearch()"></div>`:''}
      ${RPT==='history'?`<div class="tabs" style="margin-top:10px">${[['all','ทั้งหมด','All'],['sale','ขาย','Sale'],['withdraw','เบิก','Withdraw'],['restock','เติม','Restock'],['return','คืน','Return']].map(t=>`<button class="${RPT_HTYPE===t[0]?'on':''}" onclick="RPT_HTYPE='${t[0]}';rptRerender()">${T(t[1],t[2])}</button>`).join('')}</div>`:''}
    </div>
    <div class="panel" id="rptBody">${reportBody()}</div>`;
}
function reportBody(){
  const sales=(DB.sales||[]).filter(s=>s.status==='Paid'&&rptInRange(s.date));
  const rets=(DB.sales||[]).filter(s=>s.status==='Return'&&rptInRange(s.date));     // refunds in the same period
  if(RPT==='bills'){ const q=(RPT_BILL_Q||'').toLowerCase().trim();
    const list=sales.filter(s=>!q||String(s.ref||'').toLowerCase().includes(q)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
    return billsTable(list); }
  if(RPT==='history'){ const typ=RPT_HTYPE||'all';
    const LBL={Sale:T('ขาย','Sale'),Withdraw:T('เบิก','Withdraw'),Restock:T('เติม','Restock'),Return:T('คืน','Return')};
    const match=h=>{ const st=h.status||''; if(typ==='all')return true; if(typ==='sale')return st==='Sale'; if(typ==='withdraw')return st==='Withdraw'; if(typ==='restock')return st==='Restock'||st==='Adjust'; if(typ==='return')return st==='Return'; return true; };
    let rows=(DB.history||[]).filter(h=>rptInRange(h.date)&&match(h))
      .sort((a,b)=>String((b.date||'')+(b.time||'')).localeCompare(String((a.date||'')+(a.time||''))))
      .map(h=>{ const lbl=LBL[h.status]||(h.type==='IN'?T('รับเข้า','In'):T('จ่ายออก','Out')); const sign=(h.type==='IN')?'+':'-';
        return {dt:(h.date||'')+' '+(h.time||''),ref:lbl+(h.orderNo?' · '+h.orderNo:'')+(h.note&&h.note!=='POS'?' · '+h.note:''),seller:h.by||'-',code:h.code,name:h.name||h.code,qty:sign+Math.abs(parseInt(h.qty,10)||0),price:h.price||0,amt:h.value||0}; });
    // signatures of movements already in history (avoid double-counting legacy arrays)
    const seen={}; (DB.history||[]).forEach(h=>{ if(h.status==='Withdraw'||h.status==='Restock') seen[(h.date||'')+'|'+(h.code||'')+'|'+Math.abs(parseInt(h.qty,10)||0)]=1; });
    // legacy withdrawals (recorded before history logging)
    if(typ==='all'||typ==='withdraw'){ (DB.withdrawals||[]).filter(w=>rptInRange(w.date)).forEach(w=>{ (w.lines||[]).forEach(l=>{ if(seen[(w.date||'')+'|'+l.code+'|'+Math.abs(l.qty)])return; rows.push({dt:(w.date||'')+' '+(w.time||''),ref:T('เบิก','Withdraw')+(w.note?' · '+w.note:''),seller:w.by||'-',code:l.code,name:l.name,qty:'-'+Math.abs(l.qty),price:0,amt:0}); }); }); }
    // legacy restocks from item.stockHistory
    if(typ==='all'||typ==='restock'){ (DB.itemMaster||[]).forEach(it=>{ (it.stockHistory||[]).forEach(h=>{ const d=String(h.at||'').slice(0,10); if(!rptInRange(d))return; if(seen[d+'|'+it.code+'|'+Math.abs(h.qty)])return; rows.push({dt:h.at||'',ref:T('เติม','Restock')+(h.loc?' · '+h.loc:'')+(h.note?' · '+h.note:''),seller:h.by||'-',code:it.code,name:it.name||it.code,qty:'+'+Math.abs(h.qty),price:0,amt:0}); }); }); }
    rows.sort((a,b)=>String(b.dt).localeCompare(String(a.dt)));
    return historyTable(rows); }
  if(RPT==='sales'){ const byDay={}; const g=d=>byDay[d]=byDay[d]||{n:0,amt:0,ref:0};
    sales.forEach(s=>{g(s.date).n++;g(s.date).amt+=s.total;}); rets.forEach(r=>{g(r.date).ref+=(r.refund||0);});
    return rptTable(['วันที่/Date','บิล/Bills','ยอดขาย/Sales','คืนเงิน/Refunds','สุทธิ/Net'],Object.entries(byDay).sort().reverse().map(([d,v])=>[d,v.n,'฿'+money(v.amt),'฿'+money(v.ref),'฿'+money(v.amt-v.ref)]),'sales'); }
  if(RPT==='staff'){ const by={}; const nameOf={}; sales.forEach(s=>{ nameOf[s.cashier]=s.cashierName||s.cashier; });
    const g=k=>by[k]=by[k]||{n:0,amt:0,ref:0};
    sales.forEach(s=>{const k=s.cashierName||s.cashier;g(k).n++;g(k).amt+=s.total;}); rets.forEach(r=>{ g(nameOf[r.cashier]||r.cashier).ref+=(r.refund||0); });
    return rptTable(['พนักงาน/Staff','บิล/Bills','ยอดขาย/Sales','คืนเงิน/Refunds','สุทธิ/Net'],Object.entries(by).map(([k,v])=>[k,v.n,'฿'+money(v.amt),'฿'+money(v.ref),'฿'+money(v.amt-v.ref)]),'staff'); }
  if(RPT==='payment'){ const by={}; sales.forEach(s=>(s.pay||[]).forEach(p=>{by[p.method]=by[p.method]||{n:0,amt:0};by[p.method].n++;by[p.method].amt+=p.amount;}));
    sales.forEach(s=>{ if(s.change>0&&by.cash) by.cash.amt-=s.change; });                    // cash kept = tendered - change
    rets.forEach(r=>{ const k=r.method==='credit'?'_credit':(r.method||'cash');   // store credit given back is not money paid with credit
      by[k]=by[k]||{n:0,amt:0}; by[k].n++; by[k].amt-=(r.refund||0); });
    return rptTable(['วิธีชำระ/Method','จำนวน/Count','ยอด/Amount'],Object.entries(by).map(([k,v])=>[k==='_credit'?T('คืนเป็นเครดิต','Refund as credit'):payLabel(k),v.n,'฿'+money(v.amt)]),'payment'); }
  if(RPT==='returns'){ const rets=(DB.sales||[]).filter(s=>s.status==='Return'&&rptInRange(s.date));
    return rptTable(['Ref','บิลเดิม/Orig','วันที่/Date','คืนเงิน/Refund','วิธี/Method'],rets.map(r=>[r.ref,r.origRef,r.date+' '+r.time,'฿'+money(r.refund),payLabel(r.method)]),'returns'); }
  if(RPT==='shift'){ const shs=(DB.shifts||[]).filter(s=>s.status==='Closed'&&rptInRange(String(s.closeAt||'').slice(0,10)));
    return rptTable(['กะ/Shift','พนักงาน/Staff','ปิด/Close','คาดหวัง/Exp','นับได้/Count','ส่วนต่าง/Diff'],shs.map(s=>[s.ref,s.cashierName,s.closeAt,'฿'+money(s.expected),'฿'+money(s.counted),'฿'+money(s.diff)]),'shift'); }
  if(RPT==='product'){ const by={}; sales.forEach(s=>{ const ratio=(parseFloat(s.subtotal)>0)?(parseFloat(s.total)||0)/parseFloat(s.subtotal):1;   // what was really paid per line — returns are refunded on the same basis
      s.lines.forEach(l=>{by[l.code]=by[l.code]||{name:l.name,qty:0,amt:0};by[l.code].qty+=bq(l);by[l.code].amt+=r2(Math.max(0,l.price*l.qty-(l.disc||0))*ratio);}); });
    rets.forEach(r=>(r.lines||[]).forEach(l=>{ if(!by[l.code])by[l.code]={name:l.name,qty:0,amt:0}; by[l.code].qty-=(l.base!=null?l.base:(l.qty||0)); by[l.code].amt-=(l.amount||0); }));   // net of returns (pieces)

}

function rptTable(headers,rows,key){

   <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${headers.length}" class="muted">${T('ไม่มีข้อมูล','No data')}</td></tr>`}</tbody></table>`;

/* report rows are kept here and the button only carries the key (no user data inside an attribute) */
const _rptData={};
function rptStash(key,headers,rows){ _rptData[key]={headers,rows}; return key; }
/* a text cell starting with = + - @ would run as a formula in Excel: prefix it with ' (plain numbers stay numbers) */
function csvCell(c){ let s=String(c==null?'':c); if(/^[=+\-@\t\r]/.test(s)&&!/^-?\d+(\.\d+)?$/.test(s)) s="'"+s; return '"'+s.replace(/"/g,'""')+'"'; }
function exportRpt(key){ const d=_rptData[key]; if(!d)return; const headers=d.headers, rows=d.rows;
  const csv=[headers.map(h=>csvCell(String(h).split('/')[0])).join(',')].concat(rows.map(r=>r.map(csvCell).join(','))).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='report-'+key+'-'+today()+'.csv'; a.click(); toast(T('ส่งออกแล้ว','Exported'),'ok'); }

async function stkSave(code){ if(stkSave._busy) return; stkSave._busy=true; try{ return await stkSave_(code); } finally{ stkSave._busy=false; } }
async function stkSave_(code){
  if(!isMgr()){ toast(T('เฉพาะผู้จัดการขึ้นไป','Manager or above only'),'err'); return; }
  const it=itemByCode(code); if(!it)return;
  const cv=String(($('stkQty')||{}).value||'').trim(), counted=Number(cv);
  const loc=($('stkLoc')||{}).value||'MAIN';
  if(cv===''||!(counted>=0)||Math.floor(counted)!==counted){ toast(T('กรุณากรอกจำนวนที่ถูกต้อง','Please enter a valid quantity'),'err'); return; }
  const note=($('stkNote').value||'').trim();
  let photoRef='';
  if(_stkPhotoData){
    if(CONFIG.USE_BACKEND){
      try{
        const stkId='ST'+Date.now();
        const r=await fetch(CONFIG.API_BASE+'?action=upload',{method:'POST',headers:Store.headers(true),body:JSON.stringify({company:CID,code:stkId,data:_stkPhotoData})});
        if(r.ok){ const d=await r.json(); if(d&&d.path)photoRef=d.path; }
      }catch(e){ /* fall through to base64 below */ }
    }
    // never keep a multi-MB photo inline in the synced data
    if(!photoRef) toast(T('อัปโหลดรูปไม่สำเร็จ — บันทึกการนับโดยไม่มีรูป','Photo upload failed — count saved without the photo'),'warn');
  }
  const sysQty=stockAt(code,loc), diff=counted-sysQty;             // read now, after the upload wait
  const stNote=T('นับสต๊อก','Stocktake')+' ('+sysQty+'→'+counted+')'+(note?' · '+note:''), itC=costOf(it);
  if(diff<0){ const {consumed}=issueFIFO(code,loc,-diff);           // oldest lot first — one history row per lot taken
    consumed.filter(c=>c.qty>0).forEach(c=>{ const cst=parseFloat(c.cost)>0?parseFloat(c.cost):itC;
      hpush({id:uid('H'),type:'OUT',date:today(),time:nowTime(),code,name:it.name||code,loc,lotNo:c.lotNo||'',lotSup:c.lotSup||'',mfd:c.mfd||'',exp:c.exp||'',sn:c.sn||'',hu:c.hu,
        cost:cst,cogs:r2(cst*c.qty),qty:c.qty,unitQty:it.unit||'',note:stNote,status:'Adjust'}); }); }
  else if(diff>0){ receiveStock(code,loc,diff,{cost:itC});           // found extra: valued at the item's cost
    hpush({id:uid('H'),type:'IN',date:today(),time:nowTime(),code,name:it.name||code,loc,cost:itC,qty:diff,unitQty:it.unit||'',note:stNote,status:'Adjust'}); }
  if(!Array.isArray(DB.stocktake))DB.stocktake=[];
  DB.stocktake.push({id:uid('ST'),ref:'CNT-POS-'+today().replace(/-/g,'')+'-'+nowTime().replace(/:/g,'')+'-'+code,status:'Done',scopeTxt:'POS',pos:true,   /* also a closed one-line sheet for the web / phone */
    lines:[{code,name:it.name||code,unit:it.unit||'',loc,sysQty,cntQty:counted}],date:today(),time:nowTime(),code,name:it.name||code,loc,before:sysQty,counted,diff,by:(session.user&&(session.user.fullName||session.user.username))||'',note,photo:photoRef});
  Store.save();
  closeModal();
  _stkPhotoData=null;
  if($('stkHistory'))$('stkHistory').innerHTML=stkHistoryTable();
  stkRenderList();
  toast(T('บันทึกการนับสต๊อกแล้ว','Stock count saved')+(diff!==0?(' · '+(diff>0?'+':'')+diff):''),'ok');
}
function stkHistoryTable(){

  if(!rows.length)return `<div class="muted" style="padding:14px 4px">${T('ยังไม่มีประวัติการนับสต๊อก','No stock counts yet')}</div>`;

     <tbody>${g.items.map(r=>`<tr><td>${esc(r.time)}</td><td><b>${esc(r.code)}</b> ${esc(r.name)}</td><td style="text-align:right">${esc(r.before)}</td><td style="text-align:right">${esc(r.counted)}</td><td style="text-align:right;color:${r.diff===0?'var(--sub)':(r.diff>0?'var(--ok)':'var(--danger)')}"><b>${r.diff>0?'+':''}${esc(r.diff)}</b></td><td class="muted">${esc(r.by||'-')}</td><td>${r.photo?`<button class="btn ghost" style="padding:4px 10px" onclick="stkViewPhoto(${jsa(r.id)})">${T('ดูรูป','Photo')}</button>`:''}</td></tr>`).join('')}</tbody></table></div>
  </div>`).join('');
}

/* ============================ PromptPay EMV QR ============================ */
function promptpayPayload(id,amount){
  id=String(id).replace(/[^0-9]/g,'');
  // 01 = mobile (13 digits: 0066 + number without its leading 0), 02 = national / tax ID (13), 03 = e-wallet (15)
  const kind=id.length>=15?'03':(id.length>=13?'02':'01');
  const target=kind==='01'?('0000000000000'+id.replace(/^0/,'66')).slice(-13):id;
  const f=(tag,val)=>tag+String(val.length).padStart(2,'0')+val;
  const mai=f('29',f('00','A000000677010111')+f(kind,target));
  let p=f('00','01')+f('01','12')+mai+f('53','764')+f('54',(Math.round(amount*100)/100).toFixed(2))+f('58','TH');
  p+='6304'; p+=crc16(p);
  return p;
}
function crc16(s){ let crc=0xFFFF; for(let i=0;i<s.length;i++){ crc^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++){ crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1); crc&=0xFFFF; } } return crc.toString(16).toUpperCase().padStart(4,'0'); }

<style id="pos-ref-theme">
/* ================= POS — reference UI (same as WMS HOTEL): icon rail · white canvas · category cards · image grid · detail-items panel · coral CTA ================= */
:root{--bg:#f3f4f6;--card:#ffffff;--panel:#ffffff;--panel2:#f7f7f9;--soft:#f6f7f9;--soft2:#fafafb;--line:#e9eaee;--line2:#f1f2f4;
  --text:#111827;--ink:#111827;--ink2:#2b3140;--ink3:#16181d;--sub:#6b7280;--sub2:#9ca3af;
  --orange:#ff6b45;--orange2:#f0582f;--orange-grad:linear-gradient(135deg,#ff7a55 0%,#ff6b45 100%);--wd-grad:linear-gradient(135deg,#ff7a55 0%,#ff6b45 100%);--wd-bg:#ffeee8;--accent-soft:#ffeee8;--accent-line:#ffcdbd;
  --radius:16px;--shadow:0 2px 10px rgba(17,24,39,.05);--shadow2:0 10px 28px rgba(17,24,39,.08);--shadow-lg:0 16px 40px rgba(17,24,39,.12);
  --font:'Plus Jakarta Sans','Noto Sans Thai',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
html,body{background:var(--bg)} body{font-family:var(--font);letter-spacing:0}
/* accent: everything the dark theme painted black becomes coral */
.btn.primary,.btn.primary.wd{background:var(--orange);color:#fff;border:0;box-shadow:0 6px 16px rgba(255,107,69,.28)}
.btn.primary:active{transform:scale(.98)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.ghost.danger{color:var(--danger)}
.btn{border-radius:12px;font-weight:700}
.tabs button.on,.tabs button.wd.on,.login-tabs button.on{background:var(--accent-soft);color:var(--orange);border-color:var(--accent-line);box-shadow:none}
.topbar .who .av{background:var(--orange);color:#fff;box-shadow:none}
.langsw button.on{background:var(--orange);color:#fff}
.nav button.on{background:var(--accent-soft);color:var(--orange);box-shadow:none}
.mnav .scanbtn{background:var(--orange);box-shadow:0 10px 24px rgba(255,107,69,.35)}
.mnav>button.on{color:var(--orange)}
.cart-fab,.pay-scan,.pay-scan.wd{background:var(--orange);box-shadow:0 10px 24px rgba(255,107,69,.3)}
.inp{border-radius:12px;border:1px solid var(--line);background:#fff}
.inp:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,107,69,.14)}
.paybtn.on{border-color:var(--orange);background:var(--accent-soft);color:var(--orange)}
.paybtn .ic{color:var(--orange)}
.pin-dots .d.on{background:var(--orange);border-color:var(--orange)}
.stat .stat-ic.c-orange,.mode-card .mode-ic{background:var(--orange)}
.panel,.stat,.mode-card,.cart,.pcard,.modal,.acct-menu,.login-card{border:1px solid var(--line);box-shadow:var(--shadow)}
.login-card{border:0!important;box-shadow:none!important}   /* the sign-in page has no frame around the form */
.pill.o{background:var(--accent-soft);color:var(--orange2)}

/* ---- product cards: image · name · available/sold · price ---- */
.pcard{border-radius:16px;padding:8px;background:#fff;box-shadow:none}
.pcard .img{margin:0;width:100%;border-radius:12px;aspect-ratio:4/3;background:var(--soft)}
.pcard .body{padding:10px 4px 4px;position:relative}
.pcard .body::after{display:none}
.pcard .nm{font-weight:700;font-size:14px;min-height:0;line-height:1.3}
.pcard .code{font-size:11px;color:var(--sub2);margin-top:2px}
.pcard .meta{font-size:11.5px;color:var(--sub);margin-top:4px;display:flex;gap:6px;align-items:center}
.pcard .meta i{width:3px;height:3px;border-radius:50%;background:var(--sub2);display:inline-block}
.pcard .pr{color:var(--text);font-weight:800;font-size:16px;margin-top:8px}
.pcard .pr small{color:var(--sub2);font-weight:600;font-size:11px;margin-left:4px}
.pcard .stk{background:var(--orange);color:#fff;border-radius:999px;top:8px;right:8px;left:auto;font-size:10.5px;padding:2px 8px}
.pcard .fav{background:#fff;border-radius:50%;padding:4px 6px;box-shadow:0 2px 6px rgba(0,0,0,.08);top:8px;left:8px}
.pcard .fav svg.i{color:var(--orange)}

/* ---- category cards ---- */
#posTabs{gap:10px;align-items:stretch}
#posTabs::before{content:attr(data-title);flex-basis:100%;font-size:17px;font-weight:800;color:var(--text);margin:2px 0 0}
#posTabs button{min-width:88px;padding:12px 10px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text);font-size:12px;font-weight:700;line-height:1.2}
#posTabs button .ci{width:32px;height:32px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--sub);font-weight:800;font-size:14px}
#posTabs button .ci svg{width:16px;height:16px}
#posTabs button small{color:var(--sub2);font-weight:600;font-size:10.5px}
#posTabs button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--orange)}
#posTabs button.on .ci{background:#fff;color:var(--orange)}
#posTabs.hasCats .cat-select{display:none}
.pgrid::before{content:attr(data-title);grid-column:1/-1;font-size:17px;font-weight:800;color:var(--text);margin:8px 0 -4px}
.pgrid:not([data-title])::before,#posTabs:not([data-title])::before{display:none}
.searchbar .inp{border-radius:12px;padding-left:16px}
.searchbar .btn{border-radius:12px}

/* ---- detail items (cart) ---- */
.cart-h{border-bottom:0;padding:6px 0 10px}
.cart-h b{font-size:18px;font-weight:800}
.citem{padding:12px 0;border-bottom:1px solid var(--line2)}
.citem .r1{align-items:flex-start;gap:10px}
.citem .cth{width:58px;height:58px;border-radius:12px;background:var(--soft);overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--sub2)}
.citem .cth img{width:100%;height:100%;object-fit:cover}
.citem .cth svg.i{width:22px;height:22px}
.citem .r1>div:nth-child(2){flex:1;min-width:0}
.citem .nm{font-size:14px;font-weight:700}
.citem .lt{color:var(--orange);font-weight:800;white-space:nowrap}
.citem .r2{margin-top:8px;padding-left:68px}
.qtybox{border:0;background:transparent;border-radius:0;padding:0;gap:4px}
.qtybox button{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--orange);color:var(--orange);background:#fff;font-size:16px;font-weight:800;line-height:1;box-shadow:none}
.qtybox input{width:34px;height:26px;background:transparent;font-weight:800}
.citem .mini{color:var(--sub2)}
.cart-f{border-top:0;padding:12px 0 0}
.trow{font-size:13px;padding:4px 0}
.trow.big{font-size:18px;font-weight:800;border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
.pos-paytiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pos-paytiles .ptl{font-size:15px;font-weight:800;color:var(--text);margin:14px 0 8px}
.pos-paytiles button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--sub);font-family:inherit}
.pos-paytiles button svg.i{width:22px;height:22px}
.pos-paytiles button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--orange)}
.pay-row .btn.primary{border-radius:12px;height:52px;font-size:15px}
.pay-scan{border-radius:12px}

/* ---- desktop shell: icon rail · header · content ---- */
@media(min-width:821px){
  #app{display:grid;grid-template-columns:84px minmax(0,1fr) auto auto auto;grid-template-rows:72px minmax(0,1fr);height:calc(100dvh - 32px);margin:16px;background:#fff;border-radius:26px;box-shadow:var(--shadow2);overflow:hidden}
  .topbar{display:contents}
  .topbar .lg{grid-area:1/1;align-self:center;justify-self:center;width:46px;height:46px;border-radius:14px;box-shadow:none}
  .topbar .ttl{grid-area:1/2;align-self:center;padding-left:22px;font-size:16px}
  .topbar .ttl small{font-size:11px}
  .topbar-sync{grid-area:1/3;align-self:center;margin-right:8px;background:#fff;border:1px solid var(--line);box-shadow:none;border-radius:12px}
  .langsw{grid-area:1/4;align-self:center;margin-right:10px;background:var(--soft);box-shadow:none}
  .topbar .who{grid-area:1/5;align-self:center;margin-right:22px}
  .nav{grid-area:2/1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px;background:#fff;border-right:1px solid var(--line);border-radius:0;box-shadow:none;overflow-y:auto;overflow-x:hidden;flex:none}
  .nav button{width:62px;min-height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:700;color:var(--sub);padding:6px 2px;white-space:normal;line-height:1.1;text-align:center}
  .nav button svg.i{width:20px;height:20px}
  .view{grid-area:2/2/3/6;margin:0;border-radius:0;box-shadow:none;background:#fff;border-top:1px solid var(--line);padding:18px 24px 22px;min-height:0}
  .pos{grid-template-columns:minmax(0,1fr) 370px;gap:0;height:100%}
  .pos-left{padding-right:22px;min-width:0}
  .pos-right{border-left:1px solid var(--line);padding-left:22px;min-height:0;display:flex}
  .pos-right .cart{height:100%!important;flex:1;border:0;box-shadow:none;border-radius:0;background:transparent;min-height:0}
  .mode-card{display:none}
  .pcard .stk{display:none}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
}
@media(max-width:820px){
  .pcard .meta{white-space:nowrap;overflow:hidden}
  .pcard .pr{white-space:nowrap} .pcard .pr small{display:none}
  .pcard .meta i,.pcard .meta span:nth-child(3){display:none}
  #posTabs button{min-width:74px;padding:9px 8px 8px;font-size:11px}
  #posTabs button .ci{width:26px;height:26px;font-size:12px}
  .pcard .meta{font-size:10px}
  .citem .r2{padding-left:0}
}
</style>
<script id="pos-ref-ui">
/* POS — reference UI (same as WMS HOTEL) behaviour: icon rail, category cards with counts, product meta line, cart thumbnails, payment tiles. Visual layer only. */
(function(){
"use strict";
var ICX={
  gear:'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  undo:'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/></svg>',
  chart:'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>'
};
var RAIL={dashboard:IC.grid,pos:IC.cart,withdraw:IC.boxOut,customers:IC.user,promotions:IC.gift,returns:ICX.undo,cashier:IC.cash,inquiry:IC.box,stocktake:IC.clipboard,reports:ICX.chart,settings:ICX.gear};
var desktop=function(){ return window.innerWidth>820; };
function paintRail(){ var nav=document.getElementById('nav'); if(!nav||!desktop()) return;
  nav.innerHTML=NAV.map(function(n){ return '<button class="'+(VIEW===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')" title="'+esc(T(n[1],n[2]))+'">'+(RAIL[n[0]]||IC.dots)+'<span>'+esc(T(n[1],n[2]))+'</span></button>'; }).join(''); }
function paintTabs(){ var tabs=document.getElementById('posTabs'); if(!tabs) return;
  var items=DB.itemMaster||[], fav=(typeof favSet==='function'?favSet():[]);
  var cats=[]; items.forEach(function(i){ if(i.cat&&cats.indexOf(i.cat)<0) cats.push(i.cat); });
  var cnt=function(c){ return items.filter(function(i){return i.cat===c;}).length; };
  var card=function(key,label,icon,n){ var b=document.createElement('button'); b.className=(POS_TAB===key?'on':''); b.dataset.cat=key;
    b.innerHTML='<span class="ci">'+icon+'</span><span>'+esc(label)+'</span><small>'+n+' '+esc(T('รายการ','items'))+'</small>'; b.onclick=function(){ posTab(key); }; return b; };
  tabs.dataset.title=T('หมวดหมู่','Categories'); tabs.classList.add('hasCats'); tabs.innerHTML='';
  tabs.appendChild(card('all',T('ทั้งหมด','All Menu'),IC.grid,items.length));
  tabs.appendChild(card('fav',T('รายการโปรด','Favorites'),IC.star,fav.length));
  cats.forEach(function(c){ tabs.appendChild(card(c,c,'<b>'+esc(String(c).trim().charAt(0).toUpperCase())+'</b>',cnt(c))); }); }
var fmtN=function(v){ return (Number(v)||0).toLocaleString(); };
function soldMap(){ var m={}; (DB.sales||[]).forEach(function(s){ if(s.status!=='Paid') return; (s.lines||[]).forEach(function(l){ m[l.code]=(m[l.code]||0)+bq(l); }); }); return m; }
function paintCards(){ var g=document.getElementById('pgrid'); if(!g) return; g.dataset.title=T('เลือกสินค้า','Select Menu'); var sold=soldMap();
  g.querySelectorAll('.pcard').forEach(function(card){ if(card.querySelector('.meta')) return; var code=card.dataset.code; var it=(typeof itemByCode==='function'?itemByCode(code):null)||{};
    var nm=card.querySelector('.nm'); if(nm) nm.insertAdjacentHTML('afterend','<div class="meta"><span>'+fmtN(stockTotal(code))+' '+esc(T('คงเหลือ','Available'))+'</span><i></i><span>'+fmtN(sold[code]||0)+' '+esc(T('ขายแล้ว','Sold'))+'</span></div>');
    var pr=card.querySelector('.pr'); if(pr&&it.unit) pr.insertAdjacentHTML('beforeend','<small>/ '+esc(it.unit)+'</small>'); }); }
function paintCartHead(){ var h=document.querySelector('.pos-right .cart-h:not(.wd) b'); if(h) h.textContent=T('รายการสินค้า','Detail Items'); }
function paintAll(){ paintRail(); paintTabs(); paintCards(); paintCartHead(); }
/* hooks */
var _render=render; render=function(){ _render.apply(this,arguments); try{ paintAll(); }catch(e){} };
var _posTab=posTab; posTab=function(t){ _posTab.apply(this,arguments); try{ paintTabs(); paintCards(); }catch(e){} };
var _pc=productCards; productCards=function(){ var r=_pc.apply(this,arguments); setTimeout(paintCards,0); return r; };
var _cartHtml=cartHtml; cartHtml=function(){ var html=_cartHtml.apply(this,arguments); if(!CART.length) return html; var k=0;
  return html.replace(/<div class="r1"><div>/g,function(){ var l=CART[k++]||{}; var it=(typeof itemByCode==='function'?itemByCode(l.code):null)||{};
    return '<div class="r1"><div class="cth">'+(it.img?'<img src="'+esc(imgUrl(it.img))+'" alt="" onerror="this.style.display=\'none\'">':IC.box)+'</div><div>'; }); };
window._posPrefMethod=window._posPrefMethod||'cash';
var _cartFoot=cartFoot; cartFoot=function(){ var html=_cartFoot.apply(this,arguments);
  var cfg=(posCfg().methods)||{}; var methods=[['cash','เงินสด','Cash',IC.cash],['card','บัตร','Card',IC.card],['promptpay','QR','QR',IC.qr]].filter(function(m){ return cfg[m[0]]!==false; });
  var tiles='<div class="pos-paytiles"><div class="ptl" style="grid-column:1/-1">'+esc(T('วิธีชำระเงิน','Payment Method'))+'</div>'+methods.map(function(m){ return '<button type="button" class="'+(window._posPrefMethod===m[0]?'on':'')+'" onclick="posPrefMethod(\''+m[0]+'\',this)">'+m[3]+esc(T(m[1],m[2]))+'</button>'; }).join('')+'</div>';
  html='<div class="trow"><span>'+esc(T('จำนวนรายการ','Items'))+'</span><span>'+CART.length+' ('+esc(T('รายการ','Items'))+')</span></div>'+html;
  return html.replace('<div class="pay-row">',tiles+'<div class="pay-row">'); };
window.posPrefMethod=function(m,btn){ window._posPrefMethod=m; var box=btn&&btn.parentNode; if(box) box.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on',b===btn); }); };
var _openPayment=openPayment; openPayment=function(){ _openPayment.apply(this,arguments); try{ if(window._posPrefMethod&&window._posPrefMethod!=='cash'&&typeof paySetMethod==='function'&&document.getElementById('payArea')) paySetMethod(window._posPrefMethod); }catch(e){} };
var _pay=window.confirmPayment; if(typeof _pay==='function'){ confirmPayment=function(){ var r=_pay.apply(this,arguments); window._posPrefMethod='cash'; return r; }; }
window.addEventListener('resize',function(){ try{ paintRail(); }catch(e){} });
try{ paintAll(); }catch(e){}
})();
</script>

<style id="pos-v3-theme">
/* ================= POS v3 — white sidebar · grey menu canvas · image cards with "add" / stepper · bill panel (order type, item cards, summary, payment tiles)
   colours: the same orange / grey family as the web app (index.html) ================= */
:root{--bg:#eef0f3;--canvas:#f5f6f8;--card:#ffffff;--panel:#ffffff;--soft:#f6f7f9;--soft2:#fafbfc;--line:#e4e6ea;--line2:#eef0f2;
  --text:#1f2125;--ink:#1f2125;--ink2:#34373d;--sub:#6b7280;--sub2:#9aa0a8;
  --orange:#ef6a10;--orange2:#ff8c33;--orange-grad:linear-gradient(135deg,#ff8c33,#ef6a10);--wd-grad:linear-gradient(135deg,#ff8c33,#ef6a10);
  --accent-soft:#fff1e6;--accent-line:#ffd3b3;--wd-bg:#fff1e6;--ok:#2f9e44;--danger:#d6451b;
  --shadow:0 2px 10px rgba(31,33,37,.05);--shadow2:0 10px 30px rgba(31,33,37,.08);--p3-side:216px;
  --font:'Plus Jakarta Sans','Noto Sans Thai',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.btn.primary,.btn.primary.wd{background:var(--orange);box-shadow:0 6px 16px rgba(239,106,16,.26)}
.inp:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(239,106,16,.14)}
.mnav .scanbtn,.cart-fab,.scan-fab{background:var(--orange);box-shadow:0 10px 24px rgba(239,106,16,.32)}

/* ---- product cards ---- */
.pcard.p3c{display:flex;flex-direction:column;text-align:left;border:1.5px solid transparent;border-radius:16px;padding:10px;background:#fff;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.pcard.p3c:hover{box-shadow:var(--shadow2)}
.pcard.p3c.in{border-color:var(--orange)}
.pcard.p3c .img{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--sub2);margin:0}
.pcard.p3c .img img{width:100%;height:100%;object-fit:cover}
.pcard.p3c .img svg.i{width:34px;height:34px}
.pcard.p3c .p3-badge{position:absolute;top:8px;left:8px;background:#ffd23f;color:#1f2125;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px}
.pcard.p3c .p3-badge.out{background:var(--danger);color:#fff}
.pcard.p3c .fav{position:absolute;top:8px;right:8px;left:auto;background:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.08);padding:0}
.pcard.p3c .fav svg.i{width:14px;height:14px;color:var(--orange)}
.pcard.p3c .stk,.pcard.p3c .meta{display:none!important}
.pcard.p3c .body{padding:10px 2px 0;display:flex;flex-direction:column;flex:1}
.pcard.p3c .body::after{display:none}
.pcard.p3c .nm{font-size:13.5px;font-weight:700;line-height:1.3;min-height:35px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;color:var(--text)}
.p3-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px 0 10px}
.pcard.p3c .pr{color:var(--orange);font-weight:800;font-size:15px;margin:0}
.p3-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap}
.p3-tag i{width:8px;height:8px;border-radius:2px;background:var(--ok);display:inline-block}
.p3-tag.low i{background:var(--warn,#f59e0b)}.p3-tag.out i{background:var(--danger)}
.p3-add{margin-top:auto;display:flex;align-items:center;justify-content:center;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--orange);font-weight:700;font-size:12.5px}
.p3-step{margin-top:auto;display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 4px}
.p3-step span{width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;line-height:1;cursor:pointer}
.p3-step b{font-size:14px}

<script id="pos-v3-ui">
/* POS v3 — the screens above: replaces the sell screen, product cards and cart markup. Data and actions are the existing ones

(function(){
"use strict";
var SV={

  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>'

var TYPES=[["store","หน้าร้าน","In store"],["take","สั่งกลับบ้าน","Take away"],["delivery","จัดส่ง","Delivery"]];
window.P3_TYPE=window.P3_TYPE||"store";
/* the withdraw screen uses the same cards — its counts / steppers work on the withdraw list, not the sales cart */
var curList=function(){ return VIEW==="withdraw"?WD_CART:CART; };
var lineOf=function(code){ return curList().find(function(l){ return l.code===code; }); };
var inCart=function(code){ return curList().filter(function(l){ return l.code===code; }).reduce(function(a,l){ return a+(parseInt(l.qty,10)||0); },0); };
var thumb=function(it){ return it&&it.img?'<img src="'+esc(imgUrl(it.img))+'" alt="" onerror="this.style.display=\'none\'">':IC.box; };

/* ── sidebar extras: name on the account chip, logout, ☰ ── */
function shell(){ var tb=document.querySelector("#app .topbar"); if(!tb) return;
  if(!tb.querySelector(".p3-out")){ var b=document.createElement("button"); b.className="p3-out"; b.type="button"; b.onclick=function(){ logout(); };
    b.innerHTML=SV.out+"<span></span>"; tb.appendChild(b); }
  tb.querySelector(".p3-out span").textContent=T("ออกจากระบบ","Logout");
  var av=document.getElementById("uAv"), n=whoName()||"U";
  if(av) av.innerHTML="<i>"+esc(n.replace(/\s+/g," ").split(" ").map(function(w){ return w.charAt(0); }).join("").slice(0,2).toUpperCase())+"</i><em>"+esc(n)+"</em>";
  try{ if(localStorage.getItem("pos_p3_mini")==="1") document.body.classList.add("p3-mini"); }catch(e){} }
window.p3Mini=function(){ var on=document.body.classList.toggle("p3-mini"); try{ localStorage.setItem("pos_p3_mini",on?"1":"0"); }catch(e){} };

/* ── sell screen ── */
vPOS=function(){
  return '<div class="pos p3">'
   +'<div class="pos-left">'
     +'<div class="p3-top"><button class="p3-ic p3-ham" onclick="p3Mini()" title="'+esc(T("ย่อ / ขยายเมนู","Collapse menu"))+'">'+SV.menu+'</button>'
       +'<label class="p3-search">'+SV.search+'<input id="scan" class="inp" placeholder="'+esc(T("ค้นหาสินค้า หรือสแกนบาร์โค้ด…","Search product or scan a barcode…"))+'" autocomplete="off" oninput="p3Find(this.value)"></label>'
       +'<button class="p3-ic pay-scan" title="'+esc(T("กดค้างเพื่อสแกน","Hold to scan"))+'">'+SV.scan+'</button></div>'
     +'<div class="tabs" id="posTabs"></div>'
     +'<div class="pgrid" id="pgrid">'+productCards("")+'</div>'
     +'<div id="pgridPager"></div>'
     +'<div class="p3-holds" id="p3Holds">'+holdsHtml()+'</div>'
   +'</div>'
   +'<div class="pos-right"><div class="cart">'
     +'<div class="p3-bill-h" id="p3BillH">'+billHead()+'</div>'
     +'<div class="p3-seg" id="p3Seg">'+segHtml()+'</div>'
     +'<div class="cart-body" id="cartBody">'+cartHtml()+'</div>'
     +'<div class="cart-f" id="cartFoot">'+cartFoot()+'</div>'
   +'</div></div></div>'; };
/* filters while typing — reads the box when it fires, so a scan that added + cleared it meanwhile leaves the full list */
var _f=null; window.p3Find=function(){ clearTimeout(_f); _f=setTimeout(function(){ var s=document.getElementById("scan"), g=document.getElementById("pgrid"); if(!g||!s) return;
  POS_PAGE=1; g.innerHTML=productCards(s.value); bindPcardLongPress(); renderPosPager(); },160); };
function billHead(){ var c=CUR_CUSTOMER;
  return '<div class="t"><b>'+esc(T("บิลขาย","Sales bill"))+'</b><small>'+esc(c?c.name:T("ลูกค้าทั่วไป","Walk-in customer"))+(CART.length?" · "+cartCount()+" "+T("ชิ้น","pcs"):"")+'</small></div>'
   +'<button class="p3-ic" onclick="pickCustomer()" title="'+esc(T("เลือกลูกค้า","Customer"))+'">'+SV.edit+'</button>'
   +'<button class="p3-ic" onclick="p3More()" title="'+esc(T("ตัวเลือกบิล","Bill options"))+'">'+SV.dots+'</button>'; }
function segHtml(){ return TYPES.map(function(t){ return '<button class="'+(window.P3_TYPE===t[0]?"on":"")+'" onclick="p3Type(\''+t[0]+'\')">'+esc(T(t[1],t[2]))+'</button>'; }).join(""); }
window.p3Type=function(t){ window.P3_TYPE=t; var s=document.getElementById("p3Seg"); if(s) s.innerHTML=segHtml(); };
function holdsHtml(){ var hs=(DB&&DB.sales||[]).filter(function(s){ return s.status==="Hold"; });
  if(!hs.length) return '<div class="none">'+esc(T("ยังไม่มีบิลที่พักไว้ — กด ⋯ ในบิลเพื่อพักบิล","No held bills — use ⋯ on the bill to hold one"))+'</div>';
  return hs.map(function(h,i){ var n=(h.lines||[]).reduce(function(a,l){ return a+(parseInt(l.qty,10)||0); },0);
    return '<button class="p3-hold" onclick="resumeBill('+jsa(h.id)+')"><span class="av">B'+(i+1)+'</span><span style="min-width:0"><b>'+esc(h.customerName||h.ref)+'</b>'
      +'<small>'+n+" "+esc(T("ชิ้น","items"))+" "+SV.arrow+" ฿"+money(h.total)+'</small></span><span class="pl">'+esc(T("พักไว้","Held"))+'</span></button>'; }).join(""); }
window.p3More=function(){
  modal(T("ตัวเลือกบิล","Bill options"),'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    +'<button class="btn ghost" onclick="closeModal();billDiscount()">'+esc(T("ส่วนลดบิล","Bill discount"))+'</button>'
    +'<button class="btn ghost" onclick="closeModal();applyPromo()">'+esc(T("โปรโมชั่น","Promotion"))+'</button>'

    +'<button class="btn ghost" onclick="closeModal();resumeBillList()">'+esc(T("เรียกบิลที่พัก","Resume a held bill"))+'</button>'
    +'<button class="btn ghost danger" style="grid-column:1/-1" onclick="closeModal();clearCart()">'+esc(T("ล้างตะกร้า","Clear cart"))+'</button></div>',
    [{t:T("ปิด","Close"),c:"ghost",fn:closeModal}]); };

/* ── product cards ── */
var _pcOrig=productCards;
productCards=function(q){ var html=_pcOrig.apply(this,arguments);

<script id="update-notifier">
/* ═══ Software update notice ═══
   Every 2 minutes (and when the tab comes back) it checks two fingerprints:
     1) this page file itself (ETag / Last-Modified / size from a no-cache HEAD request)
     2) the backend: api_supabase.php?action=version (hash of the deployed files)
   When either changes while the page is open, a card appears top-right. "Updated — refresh" saves any
   pending work, clears the app caches and reloads from the server (same as Ctrl+Shift+R). */
(function(){
  "use strict";
  var EVERY=120000;
  // drop the cache-buster added by the last update so the address stays clean
  try{ var u0=new URL(location.href); if(u0.searchParams.has("_v")){ u0.searchParams.delete("_v"); history.replaceState(null,"",u0.pathname+(u0.search||"")+u0.hash); } }catch(e){}
  var api=""; try{ api=CONFIG.API_BASE; }catch(e){} if(!api){ try{ api=PHP_API; }catch(e){} }
  function th(){ try{ return (typeof lang!=="undefined"?lang:LANG)!=="en"; }catch(e){ return true; } }
  function T(a,b){ return th()?a:b; }

  function stampOf(r){ if(!r||!r.ok) return ""; return [r.headers.get("etag")||"",r.headers.get("last-modified")||"",r.headers.get("content-length")||""].join("~").replace(/^~+$/,""); }
  /* always the same method (HEAD): GET responses may carry a different ETag / length (compression) and look like an
     update. A host that can't answer HEAD is simply not watched this way — the backend version check still is. */
  var headOK=true;
  function pageStamp(){
    if(!headOK) return Promise.resolve("");
    return fetch(location.pathname+"?_upd="+Date.now(),{method:"HEAD",cache:"no-store"})
      .then(function(r){ if(r.status===405||r.status===501){ headOK=false; return ""; } return stampOf(r); })
      .catch(function(){ headOK=false; return ""; });            // unreadable HEAD on this host: stop asking (one console line, not one every check)
  }
  function apiStamp(){
    if(!api) return Promise.resolve("");
    return fetch(api+(api.indexOf("?")<0?"?":"&")+"action=version&_="+Date.now(),{cache:"no-store"})
      .then(function(r){ return r.ok?r.json():null; }).then(function(j){ return (j&&j.version)||""; })
      .catch(function(){ return ""; });
  }
  var base=["",""], seen=null, snoozeUntil=0, card=null, busy=false;
  function check(){
    if(busy) return;
    if(document.hidden&&(base[0]||base[1])) return;          // the first look (baseline) is taken even in a background tab
    Promise.all([pageStamp(),apiStamp()]).then(function(v){
      var changed=false;
      for(var i=0;i<2;i++){
        if(!v[i]) continue;                         // offline / not available: never counts as an update
        if(!base[i]) base[i]=v[i];
        else if(v[i]!==base[i]) changed=true;
      }
      if(!changed) return;
      if(Date.now()<snoozeUntil) return;                 // closed: quiet for 30 minutes, whatever the stamps do
      seen=v.join("|"); show();
    });
  }

  function show(){
    if(card) return;
    card=document.createElement("div");
    card.setAttribute("role","alertdialog");
    card.style.cssText="position:fixed;top:16px;right:16px;max-height:calc(100vh - 32px);overflow:auto;z-index:2147483000;width:min(340px,calc(100vw - 32px));background:#fff;color:#1f2329;"
      +"border:1px solid #e6e8eb;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:14px 14px 12px;font:14px/1.45 system-ui,-apple-system,'Segoe UI','Noto Sans Thai',sans-serif;"
      +"transform:translateY(-12px);opacity:0;transition:transform .25s ease,opacity .25s ease";
    card.innerHTML=
      '<div style="display:flex;gap:12px;align-items:flex-start">'
      +'<div style="flex:0 0 38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#fb923c,#ea580c);display:flex;align-items:center;justify-content:center">'
      +'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg></div>'
      +'<div style="flex:1;min-width:0"><div data-t style="font-weight:800;font-size:15px;margin-bottom:2px"></div><div data-d style="color:#5b6370;font-size:13px"></div></div>'
      +'<button data-x type="button" aria-label="close" style="border:0;background:transparent;color:#8a919c;font-size:18px;line-height:1;cursor:pointer;padding:2px 4px">✕</button></div>'
      +'<button data-ok type="button" style="margin-top:12px;width:100%;border:0;border-radius:10px;padding:10px 12px;background:#f97316;color:#fff;font-weight:800;font-size:14px;cursor:pointer"></button>';
    card.querySelector("[data-t]").textContent=T("มีการอัปเดตซอฟต์แวร์","Software update available");
    card.querySelector("[data-d]").textContent=T("ระบบมีเวอร์ชันใหม่ กดปุ่มด้านล่างเพื่อบันทึกงานที่ค้างและโหลดเวอร์ชันล่าสุด",
                                                  "A new version is available. Press the button to save pending work and load the latest version.");
    var ok=card.querySelector("[data-ok]"); ok.textContent=T("ยืนยันอัปเดตซอฟต์แวร์ และรีเฟรช","Confirm update & refresh");
    ok.onclick=update;
    card.querySelector("[data-x]").onclick=function(){ snoozeUntil=Date.now()+30*60000; hide(); };
    card.style.top=cardTop()+"px";
    document.body.appendChild(card);
    requestAnimationFrame(function(){ card.style.transform="none"; card.style.opacity="1"; });
  }
  /* sit just below the header / language buttons on the right, so they stay usable */
  function cardTop(){
    var top=16, zone=Math.max(0,window.innerWidth-Math.min(360,window.innerWidth));   // the strip the card covers
    var sel=".top,.topbar,.lang,.loginmode,header,[class*=lang]";
    [].forEach.call(document.querySelectorAll(sel),function(e){
      if(card&&card.contains(e)) return;
      var r=e.getBoundingClientRect(), cs=getComputedStyle(e);
      if(!r.width||!r.height||cs.visibility==="hidden"||cs.display==="none") return;
      if(r.top>200||r.bottom<=0||r.right<zone) return;            // only things in the top-right corner
      top=Math.max(top,Math.round(r.bottom+10));
    });
    return Math.min(top,220);
  }
  window.addEventListener("resize",function(){ if(card) card.style.top=cardTop()+"px"; });
  function hide(){ if(!card) return; var c=card; card=null; c.style.opacity="0"; c.style.transform="translateY(-12px)"; setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },260); }

  /* save pending work first (each page has its own save layer) */
  function flushAll(){
    var waits=[];
    try{ if(typeof Store!=="undefined"){
      if(typeof Store.flushNow==="function") waits.push(Promise.resolve(Store.flushNow(true)).catch(function(){}));      // POS
      else if(typeof Store.flushRemote==="function") waits.push(Promise.resolve(Store.flushRemote()).catch(function(){})); // web (resolves when the server confirmed)
    } }catch(e){}
    try{ if(typeof saveByTableM==="function"&&typeof _saveDirty!=="undefined"&&_saveDirty)                                // mobile
      waits.push(Promise.resolve(saveByTableM()).then(function(r){ if(r&&r.ok) _saveDirty=false; }).catch(function(){})); }catch(e){}
    waits.push(new Promise(function(r){ setTimeout(r,300); }));
    return Promise.race([Promise.all(waits),new Promise(function(r){ setTimeout(r,10000); })]);
  }
  /* anything still not confirmed by the server? then we must not reload */
  function pendingLeft(){
    try{ if(typeof Store!=="undefined"){
      if(typeof Store.hasPending==="function") return Store.hasPending();
      if(typeof Store._pendLoad==="function"){ var o=Store._pendLoad(); return !!(o&&(o.cur||(o.base&&o.base.length))); }
    } }catch(e){}
    try{ if(typeof _saveDirty!=="undefined") return !!_saveDirty; }catch(e){}
    return false;
  }
  /* like Ctrl+Shift+R: drop the cached app files and load everything again from the server */
  function update(){
    if(busy) return; busy=true;
    var ok=card&&card.querySelector("[data-ok]"); if(ok){ ok.disabled=true; ok.style.opacity=".7"; ok.textContent=T("กำลังอัปเดต…","Updating…"); }
    flushAll().then(function(){
      if(pendingLeft()){                                    // never reload with unsaved work
        busy=false; if(ok){ ok.disabled=false; ok.style.opacity=""; ok.textContent=T("ยืนยันอัปเดตซอฟต์แวร์ และรีเฟรช","Confirm update & refresh"); }
        var d=card&&card.querySelector("[data-d]"); if(d){ d.style.color="#c2410c"; d.textContent=T("ยังบันทึกงานขึ้นเซิร์ฟเวอร์ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต แล้วกดอีกครั้ง","Your work isn't saved to the server yet — check the connection and press again"); }
        return Promise.reject("pending");
      }
      var jobs=[];
      try{ if(window.caches&&caches.keys) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(e){}
      try{ if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.update().catch(function(){}); })); })); }catch(e){}
      return Promise.race([Promise.all(jobs),new Promise(function(r){ setTimeout(r,3000); })]);
    }).then(function(){
      var u=new URL(location.href); u.searchParams.set("_v",Date.now());   // bypass the HTTP cache for the page itself
      location.replace(u.toString());
    },function(e){ if(e!=="pending"){ var u=new URL(location.href); u.searchParams.set("_v",Date.now()); location.replace(u.toString()); } });
  }

  setTimeout(check,1500);                                    // baseline right after load
  setInterval(check,EVERY);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) check(); });
  window.addEventListener("focus",check);
  window.__checkForUpdate=check;          // handy for testing from the console
})();

  {k:"athiti",  n:"Athiti", css:"Athiti:wght@400;500;600;700"},
  {k:"pridi",   n:"Pridi", css:"Pridi:wght@400;500;600;700"},
  {k:"trirong", n:"Trirong", css:"Trirong:wght@400;500;600;700"}
];
function thaiFontOf(k){ for(var i=0;i<THAI_FONTS.length;i++) if(THAI_FONTS[i].k===k) return THAI_FONTS[i]; return null; }
function thaiFontFamily(f){ return "'"+f.n+"','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"; }
function applyThaiFont(k){
  var f=thaiFontOf(k), st=document.getElementById("thFontStyle"), ln=document.getElementById("thFontLink");
  if(!f){ if(st) st.remove(); if(ln) ln.remove(); return; }
  if(!ln){ ln=document.createElement("link"); ln.id="thFontLink"; ln.rel="stylesheet"; document.head.appendChild(ln); }
  var href="https://fonts.googleapis.com/css2?family="+f.css+"&display=swap"; if(ln.getAttribute("href")!==href) ln.setAttribute("href",href);
  if(!st){ st=document.createElement("style"); st.id="thFontStyle"; document.head.appendChild(st); }
  var fam=thaiFontFamily(f);
  st.textContent=":root{--font:"+fam+" !important}body{font-family:"+fam+" !important}button,input,select,textarea{font-family:inherit}";
}
/* every time a company's data is (re)loaded, its font follows */

  activateCompany=function(cid){ var r=_ac.apply(this,arguments);
    try{ var s=(typeof META!=="undefined"&&META&&META.settings)?META.settings[cid]:null; applyThaiFont(s&&((s.pos&&s.pos.font)||s.font)); }catch(e){}
    return r; }; })();
/* the company already open when this loads */
try{ var _fc=(typeof CID!=="undefined"&&CID)||(typeof session!=="undefined"&&session&&session.company);
  if(_fc&&typeof META!=="undefined"&&META&&META.settings) applyThaiFont(((META.settings[_fc]||{}).pos||{}).font||(META.settings[_fc]||{}).font); }catch(e){}
/* sign-in screen: the cached POS look (font / colour / name) before anyone signs in */
