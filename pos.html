<script id="keep-empty-maps">
/* The server (PHP) turns an empty object {} into an empty list [] — later, keys written onto that list
   ({}-style: list.someKey = value) are silently dropped by JSON, so the data vanished after a refresh.
   An empty list that carries named keys is really an object: send / store it as one. Real lists are untouched. */
(function(){
  if(Array.prototype.toJSON) return;
  Object.defineProperty(Array.prototype,"toJSON",{configurable:true,writable:true,value:function(){
    if(this.length!==0) return this;
    var ks=Object.keys(this); if(!ks.length) return this;
    var o={}; for(var i=0;i<ks.length;i++) o[ks[i]]=this[ks[i]];
    return o;
  }});
})();
</script>

<style>
:root{--bg:#f4f2ee;--panel:#ffffff;--panel2:#faf8f4;--card:#ffffff;--soft:#faf8f4;--soft2:#fbfaf7;
--line:#e7e1d6;--line2:#efeae1;--text:#1f2937;--ink:#1f2937;--sub:#6b7280;--sub2:#9ca3af;
--orange:#e8720c;--orange2:#f0872a;--orange-grad:linear-gradient(135deg,#f0872a,#e8720c);
--ok:#22c55e;--ok-bg:#eafaf0;--danger:#ef4444;--danger-bg:#fde8e2;--warn:#f59e0b;--warn-bg:#fef3c7;--blue:#0ea5e9;
--purple:#8b5cf6;--purple-grad:linear-gradient(135deg,#a78bfa,#7c3aed);
--pink:#f43f7d;--pink-grad:linear-gradient(135deg,#fb7185,#e11d48);
--teal:#14b8a6;--teal-grad:linear-gradient(135deg,#2dd4bf,#0d9488);
--wd-grad:linear-gradient(135deg,#f0872a,#e8720c);--wd-bg:#fdf1e6;
--header:linear-gradient(180deg,#1f2125 0%,#17181c 100%);
--radius:16px;--shadow:0 2px 12px rgba(30,30,20,.06);--shadow-lg:0 8px 30px rgba(30,30,20,.14);
--mnav-h:64px;
--font:'Inter','Noto Sans Thai',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14.5px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cdd2d8;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.inp{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;font-size:14.5px;line-height:1.5;min-height:44px;background:#fff;color:var(--ink);outline:none}
.inp:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(239,106,16,.14)}
select.inp{min-height:44px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--bg);color:var(--text);box-shadow:4px 4px 10px rgba(174,180,192,.4),-4px -4px 10px rgba(255,255,255,.7)}
.btn.primary{background:var(--orange-grad);color:#fff;border:0;box-shadow:0 3px 10px rgba(239,106,16,.28)}
.btn.primary.wd{background:var(--wd-grad);box-shadow:0 3px 10px rgba(239,106,16,.3)}
.btn.ok{background:var(--ok);color:#fff;border:0}.btn.danger{background:var(--danger);color:#fff;border:0}
.btn.ghost{background:var(--bg);border:0;color:var(--sub);box-shadow:4px 4px 10px rgba(174,180,192,.4),-4px -4px 10px rgba(255,255,255,.7)}
.btn.lg{padding:15px 20px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.block{width:100%}
/* login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 70% -10%,rgba(239,106,16,.12),transparent),var(--bg);z-index:50;padding:14px}
.login-card{background:var(--bg);border-radius:24px;padding:34px;width:min(390px,94vw);box-shadow:var(--shadow-lg)}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px}
.brand .lg{height:46px;display:flex;align-items:center;justify-content:center;color:var(--orange);font-weight:800;font-size:20px}
.brand .lg img{height:46px;width:auto;max-width:160px;object-fit:contain;display:block}
.brand b{font-size:20px}.brand span{display:block;color:var(--sub);font-size:12px;font-weight:600}
.lbl{font-size:12.5px;font-weight:700;color:var(--sub);margin:12px 0 5px;display:block}
/* app layout */
#app{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 20px 8px;background:transparent;color:var(--text);flex-wrap:wrap}
.topbar .lg{height:44px;width:44px;display:flex;align-items:center;justify-content:center;color:var(--orange);font-weight:800;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);flex:0 0 auto}
.topbar .lg img{height:26px;width:auto;max-width:36px;object-fit:contain;display:block}
.topbar .ttl{font-weight:800;color:var(--text)}.topbar .ttl small{display:block;color:var(--sub);font-weight:600;font-size:11px}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none;min-width:0;background:var(--bg);border-radius:16px;padding:5px;box-shadow:var(--shadow)}.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;border:0;color:var(--sub);font-weight:700;padding:9px 13px;border-radius:11px;white-space:nowrap;font-size:13.5px}
.nav button.on{background:var(--orange-grad);color:#fff}
.topbar .who{display:flex;align-items:center;gap:9px;font-size:12.5px;position:relative}
.topbar .who .av{width:40px;height:40px;border-radius:14px;background:var(--bg);color:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:800;border:0;padding:0;font-family:inherit;box-shadow:var(--shadow)}
.topbar .who span.muted{color:var(--sub)}
.acct-menu{position:absolute;top:48px;right:0;background:var(--bg);border-radius:18px;box-shadow:var(--shadow-lg);padding:14px;min-width:180px;z-index:70;color:var(--text)}
.acct-menu .acct-info{display:flex;flex-direction:column;margin-bottom:10px}
.acct-menu .acct-info b{font-size:14.5px}
.acct-menu .acct-info .muted{font-size:12px;color:var(--sub);margin-top:2px}
.view{flex:1;overflow:auto;margin:0 20px 20px;padding:22px;background:var(--bg);border-radius:26px;box-shadow:var(--shadow)}
.topbar-sync{width:40px;height:40px;border-radius:14px;background:var(--bg);border:0;color:var(--sub);display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:var(--shadow)}
.topbar-sync:active{background:var(--soft)}
.topbar-sync svg{width:18px;height:18px}
.topbar-sync.spinning svg{animation:spin .8s linear infinite}
.topbar-sync:disabled{opacity:.6}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.langsw{display:inline-flex;background:var(--bg);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.langsw button{border:0;background:transparent;color:var(--sub);font-weight:800;font-size:12px;padding:7px 13px;border-radius:10px}
.langsw button.on{background:var(--orange-grad);color:#fff}
/* cards / grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.stat{background:var(--bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .k{color:var(--sub);font-size:12.5px;font-weight:600}.stat .v{font-size:26px;font-weight:800;margin-top:4px}
.stat .stat-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:12px}
.stat .stat-ic svg{width:19px;height:19px}
.stat .stat-ic.c-pink{background:var(--pink-grad)}
.stat .stat-ic.c-ok{background:linear-gradient(135deg,#4ade80,#16a34a)}
.stat .stat-ic.c-blue{background:linear-gradient(135deg,#60a5fa,#2563eb)}
.stat .stat-ic.c-orange{background:var(--orange-grad)}
.stat .stat-ic.c-danger{background:linear-gradient(135deg,#f87171,#dc2626)}
.stat .stat-ic.c-purple{background:var(--purple-grad)}
.stat .stat-ic.c-teal{background:var(--teal-grad)}
.panel{background:var(--bg);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;color:var(--sub);font-weight:700;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line2)}
table.t tr:hover td{background:var(--soft2)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800}
.pill.g{background:var(--ok-bg);color:var(--ok)}.pill.r{background:var(--danger-bg);color:var(--danger)}.pill.o{background:var(--warn-bg);color:var(--warn)}
.muted{color:var(--sub);font-size:12.5px}
/* POS layout */
.pos{display:grid;grid-template-columns:1fr 400px;gap:14px;height:calc(100vh - 72px)}
.pos-left{display:flex;flex-direction:column;gap:12px;min-height:0}
.searchbar{display:flex;gap:8px}
.searchbar .search-btn{flex:0 0 auto;padding:0 15px}
.searchbar .inp{flex:1;font-size:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;overflow:auto;align-content:start;align-items:start;grid-auto-rows:max-content;padding:2px 4px 2px 2px;flex:1;min-height:0}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 4px;flex-wrap:wrap}
.pcard{background:#fff;border:0;border-radius:16px;padding:0;text-align:left;color:var(--text);position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(30,30,20,.06),0 6px 18px rgba(30,30,20,.06);display:block;transition:transform .15s ease,box-shadow .15s ease;-webkit-touch-callout:none}
.pcard.pcard-held{transform:scale(1.08);box-shadow:var(--shadow-lg);z-index:2}
.pcard:active{transform:scale(.985)}
.pcard .img{width:100%;aspect-ratio:1/1;position:relative;background:var(--soft);overflow:hidden;color:var(--sub2)}
.pcard .img img{width:100%;height:100%;object-fit:cover}
.pcard .body{padding:12px 13px 14px}
.pcard .nm{font-weight:700;font-size:15px;line-height:1.3;min-height:40px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pcard .code{color:var(--sub);font-size:12px;margin-top:3px}
.nm2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;line-height:1.35;max-height:2.7em;word-break:break-word}
.pcard .pr{color:var(--orange);font-weight:800;font-size:19px;margin-top:8px}
.pcard .stk{position:absolute;top:10px;right:10px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.55);padding:2px 9px;border-radius:10px;font-weight:700}
.pcard .fav{position:absolute;top:8px;left:8px;font-size:18px;color:#f5b301;background:rgba(255,255,255,.85);border:0;padding:2px 6px;border-radius:8px;line-height:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:#fff;border:1px solid var(--line);color:var(--sub);padding:8px 13px;border-radius:9px;font-weight:700;font-size:12.5px}
.tabs button.on{background:var(--orange-grad);color:#fff;border:0}
.tabs button.wd.on{background:var(--wd-grad)}
.tabs .cat-select{background:#fff;border:1px solid var(--line);color:var(--sub);padding:8px 28px 8px 13px;border-radius:9px;font-weight:700;font-size:12.5px;font-family:inherit;max-width:170px}
.tabs .cat-select.on{background:var(--soft2);border-color:var(--orange);color:var(--orange)}
.tabs .cat-select.wd.on{border-color:var(--orange);color:var(--orange)}
.mode-card{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:11px 15px;margin-bottom:12px;box-shadow:var(--shadow)}
.mode-card .mode-ic{width:40px;height:40px;border-radius:11px;background:var(--orange-grad);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mode-card .mode-ic svg{width:22px;height:22px}
.mode-card .mode-txt b{display:block;font-size:15px;color:var(--text)}
.mode-card .mode-txt span{display:block;font-size:11.5px;color:var(--sub);margin-top:1px}
/* cart */
.cart{background:var(--bg);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.cart-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.cart-h.wd{background:var(--wd-bg);border-bottom-color:#c7d6ff}
.cart-h.wd b{color:var(--orange)}
.cart-h.cart-ov-head.wd{background:var(--wd-grad);border-bottom:0}
.cart-h.cart-ov-head.wd b{color:#fff}
.cart-body{flex:1;overflow:auto;padding:6px 10px;min-height:120px}
.citem{padding:10px;border-bottom:1px solid var(--line2)}
.citem .r1{display:flex;justify-content:space-between;gap:8px}
.citem .nm{font-weight:700;font-size:13.5px}
.citem .code{color:var(--sub);font-size:11.5px}
.citem .r2{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.qtybox{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qtybox button{width:32px;height:32px;background:var(--soft);border:0;color:var(--text);font-size:17px;font-weight:800}
.qtybox input{width:44px;height:32px;text-align:center;border:0;background:#fff;color:var(--ink);font-weight:700}
.citem .lt{margin-left:auto;font-weight:800}
.citem .mini{background:transparent;border:0;color:var(--sub);font-size:11.5px;padding:3px 6px;font-weight:700}
.citem .mini.del{color:var(--danger)}
.cart-f{border-top:1px solid var(--line);padding:12px 14px}
.trow{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:var(--sub)}
.trow.big{font-size:20px;font-weight:800;color:var(--text);padding-top:8px;border-top:1px dashed var(--line);margin-top:6px}
.cart-empty{text-align:center;color:var(--sub);padding:40px 10px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,22,26,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
.modal{background:var(--bg);border-radius:22px;width:min(560px,96vw);max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal.wide{width:min(820px,96vw)}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px}
.modal-h .x{background:transparent;border:0;color:var(--sub);font-size:22px}
.modal-b{padding:18px}
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.paybtn{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 8px;color:var(--text);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.paybtn.on{border-color:var(--orange);background:rgba(239,106,16,.09)}
.paybtn .ic{font-size:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2125;color:#fff;padding:12px 20px;border-radius:12px;z-index:90;font-weight:700;box-shadow:var(--shadow-lg)}
.toast.ok{background:var(--ok)}.toast.err{background:var(--danger)}.toast.warn{background:var(--warn)}
.field{margin-bottom:12px}.field label{font-size:12.5px;font-weight:700;color:var(--sub);display:block;margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px}
.bars .bar{flex:1;background:var(--orange-grad);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars .bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9px;color:var(--sub)}
.menu-toggle{display:none;background:transparent;border:0;color:#fff;font-size:22px;padding:4px}
/* ===== responsive / mobile ===== */
@media(max-width:1000px){ .pos{grid-template-columns:1fr 340px} .pgrid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))} }
@media(max-width:820px){
  .topbar{gap:8px;padding:8px 12px}
  .topbar .ttl{font-size:14px}
  .pos{display:flex;flex-direction:column;height:auto}
  .pgrid{grid-template-columns:repeat(3,1fr);gap:8px;max-height:none;overflow:visible}
  .pcard .body{padding:6px 7px 8px}
  .pcard .nm{font-size:11.5px;line-height:1.25;min-height:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .pcard .code{font-size:9.5px;margin-top:2px}
  .pcard .pr{font-size:13px;margin-top:5px}
  .pcard .fav{font-size:13px;padding:2px 4px;top:5px;left:5px;border-radius:6px}
  .pcard .fav svg.i{width:13px;height:13px}
  .pcard .stk{font-size:9px;padding:1px 6px;top:5px;right:5px}
  .pcard .img svg.i{width:26px;height:26px}
  .cart{height:auto!important}
  .pos-right{position:sticky;bottom:0;z-index:20}
  .pos-right .cart-f{display:none}
  .cart-body{max-height:38vh}
  .paygrid{grid-template-columns:repeat(2,1fr)}
  .row3{grid-template-columns:1fr 1fr}
  .cards{grid-template-columns:repeat(2,1fr)}
  .view{padding:12px;margin:0 10px 10px;border-radius:18px}
  table.t{font-size:12.5px}
}
@media(max-width:480px){
  .pgrid{grid-template-columns:repeat(3,1fr);gap:7px}
  .pcard .nm{font-size:11px}
  .pcard .pr{font-size:12.5px}
  .topbar .ttl small{display:none}
}

svg.i{width:18px;height:18px;vertical-align:-3px;flex:0 0 auto;display:inline-block}
.paybtn .ic svg.i{width:26px;height:26px;vertical-align:0}
.pcard .img{position:relative}
.pcard .img svg.i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;color:var(--sub2)}
.pcard .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard .fav svg.i{width:16px;height:16px;color:var(--orange);vertical-align:-2px}
.cart-h svg.i,.citem svg.i{width:14px;height:14px}
.inqimg{position:relative}.inqimg svg.i{width:20px;height:20px;color:var(--sub2)}.inqimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-ov{position:fixed;inset:0;z-index:120;background:#000;display:none;flex-direction:column;align-items:center;justify-content:flex-start}
.scan-ov.show{display:flex}
#reader{width:100%;max-width:100%}
#reader video{width:100%!important;height:auto!important;display:block}
.scan-hint{position:absolute;bottom:64px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:15px;text-shadow:0 2px 8px rgba(0,0,0,.6);z-index:3;padding:0 24px}
.scan-hint small{display:block;opacity:.8;font-weight:500;font-size:12px;margin-top:4px}

/* ================= eKart theme (visual layer only — no logic) =================
   warm amber/orange accent · white rounded cards · pill buttons · Muli (Mulish) font */
:root{
  --bg:#fffaf2;--panel:#ffffff;--panel2:#fff6e8;--card:#ffffff;--soft:#fff4e2;--soft2:#fffaf2;
  --line:#f3e3c7;--line2:#f8eedc;--text:#2b2b2b;--ink:#2b2b2b;--sub:#8a8175;--sub2:#b9ae9e;
  --orange:#ff8f00;--orange2:#ffa000;--orange-grad:linear-gradient(135deg,#ffc107 0%,#ff9800 55%,#ff8f00 100%);
  --wd-grad:linear-gradient(135deg,#ffc107 0%,#ff9800 55%,#ff8f00 100%);--wd-bg:#fff4e2;
  --header:linear-gradient(135deg,#ffb300,#ff8f00);
  --radius:22px;--shadow:0 6px 22px rgba(255,152,0,.10);--shadow-lg:0 18px 44px rgba(255,143,0,.20);
  --font:'Mulish','Noto Sans Thai',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
html,body{background:var(--bg)}
body{letter-spacing:.1px}

/* inputs & buttons */
.inp{border-radius:14px;border:1.5px solid var(--line);background:#fff}
.inp:focus{border-color:var(--orange2);box-shadow:0 0 0 4px rgba(255,160,0,.16)}
.btn{border-radius:999px;font-weight:800}
.btn.primary,.btn.primary.wd{background:var(--orange-grad);box-shadow:0 8px 20px rgba(255,143,0,.32)}
.btn.primary:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--orange);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:active{background:var(--soft)}
.btn.lg{border-radius:999px;padding:16px 22px}

/* login — white card on cream, rotated orange shapes like the eKart artboards */
#login{background:var(--bg);overflow:hidden}
#login::before,#login::after{content:"";position:absolute;border-radius:64px;background:var(--orange-grad);transform:rotate(45deg);z-index:0;opacity:.95}
#login::before{width:420px;height:420px;top:-230px;left:-170px}
#login::after{width:360px;height:360px;bottom:-210px;right:-140px}
.login-card{position:relative;z-index:1;background:#fff;border-radius:30px;box-shadow:var(--shadow-lg);padding:36px 32px}
.brand .lg{background:#2b2d33;border-radius:18px;padding:10px 18px;height:auto}
.brand .lg img{height:34px}
.login-tabs button{background:var(--soft);box-shadow:none;border-radius:999px;color:var(--sub)}
.login-tabs button.on{background:var(--orange-grad);color:#fff;box-shadow:0 6px 16px rgba(255,143,0,.3)}
.lbl{color:var(--sub)}

/* top bar */
.topbar{padding:14px 20px 10px}
.topbar .lg{background:#2b2d33;box-shadow:none;border-radius:14px}
.nav{background:#fff;border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.nav button{border-radius:999px;padding:9px 16px;color:var(--sub)}
.nav button.on{background:var(--orange-grad);color:#fff;box-shadow:0 5px 14px rgba(255,143,0,.3)}
.topbar .who .av{background:var(--orange-grad);color:#fff;border-radius:50%;box-shadow:0 5px 14px rgba(255,143,0,.28)}
.topbar-sync,.langsw{background:#fff;box-shadow:var(--shadow);border-radius:999px}
.langsw button{border-radius:999px}
.langsw button.on{background:var(--orange-grad)}
.acct-menu{background:#fff;border-radius:22px}

/* main surface */
.view{background:transparent;box-shadow:none;border-radius:0;padding:10px 4px 22px}
.panel,.stat,.mode-card,.cart{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
.stat .v{color:var(--text)}
.stat .stat-ic.c-orange{background:var(--orange-grad)}
.mode-card .mode-ic{background:var(--orange-grad);border-radius:14px}
table.t tr:hover td{background:var(--soft)}
.pill.o{background:#fff3d6;color:#e68a00}

/* category / filter chips */
.tabs button,.tabs .cat-select{border-radius:999px;background:#fff;border:1.5px solid var(--line);color:var(--sub)}
.tabs button.on,.tabs button.wd.on{background:var(--orange-grad);color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(255,143,0,.28)}
.tabs .cat-select.on,.tabs .cat-select.wd.on{background:var(--soft);border-color:var(--orange2);color:var(--orange)}

/* product cards — cream image well, bold amber price, "+" add badge */
.pcard{border-radius:22px;box-shadow:0 6px 18px rgba(255,152,0,.10);background:#fff}
.pcard .img{background:var(--soft);margin:8px 8px 0;width:calc(100% - 16px);border-radius:16px}
.pcard .body{padding:10px 14px 14px;position:relative}
.pcard .nm{font-weight:800}
.pcard .pr{color:var(--orange);font-weight:900}
.pcard .body::after{content:"+";position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:var(--orange-grad);color:#fff;font-weight:900;font-size:20px;line-height:31px;text-align:center;box-shadow:0 5px 12px rgba(255,143,0,.35)}
.pcard .stk{background:rgba(43,43,43,.72);border-radius:999px}
.pcard .fav{background:#fff;border-radius:50%;padding:4px 6px;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.pcard .fav svg.i{color:var(--orange2)}
.searchbar .inp{border-radius:999px;padding-left:18px}
.searchbar .search-btn{border-radius:999px}

/* cart — eKart "Kart" screen */
.cart-h{border-bottom:1.5px dashed var(--line)}
.cart-h b{color:var(--text)}
.citem{border-bottom:1px solid var(--line2);border-radius:14px}
.qtybox{border:0;border-radius:999px;background:var(--soft);padding:2px}
.qtybox button{background:#fff;border-radius:50%;width:30px;height:30px;color:var(--orange);box-shadow:0 2px 6px rgba(255,143,0,.18)}
.qtybox input{background:transparent}
.citem .lt{color:var(--orange)}
.trow.big{color:var(--text)}
.trow.big span:last-child,.trow.big b:last-child{color:var(--orange)}
.cart-f{border-top:1.5px dashed var(--line)}
.pay-scan,.pay-scan.wd{background:var(--orange-grad);border-radius:50%;box-shadow:0 8px 18px rgba(255,143,0,.35)}

/* modals & payment */
.modal{background:#fff;border-radius:28px}
.modal-h{border-bottom:1.5px dashed var(--line)}
.paybtn{border-radius:18px;border:1.5px solid var(--line)}
.paybtn.on{border-color:var(--orange2);background:#fff6e5;box-shadow:0 6px 16px rgba(255,143,0,.16)}
.paybtn .ic{color:var(--orange)}
.toast{border-radius:999px}

/* keypads (PIN / qty) — flat cream keys instead of grey neumorphism */
.pin-keypad button,.qty-keypad button{background:var(--soft);box-shadow:none;border-radius:18px}
.pin-keypad button:active,.qty-keypad button:active{box-shadow:none;background:#ffe9c2}
.pin-dots .d.on{background:var(--orange2);border-color:var(--orange2)}

/* mobile bottom nav + FABs */
@media(max-width:820px){
  .mnav{background:#fff;border-top:0;box-shadow:0 -6px 24px rgba(255,152,0,.10);border-radius:24px 24px 0 0}
  .mnav>button.on{color:var(--orange)}
  .mnav .scanbtn{background:var(--orange-grad);box-shadow:0 10px 24px rgba(255,143,0,.45);border:5px solid #fff}
  .cart-fab{background:var(--orange-grad);box-shadow:0 10px 24px rgba(255,143,0,.4);border-radius:999px}
  .cart-fab .cfb-badge{background:#2b2b2b}
  .view{padding:8px 2px calc(var(--mnav-h) + 18px);margin:0 12px 10px}
}
.cart-overlay{background:var(--bg)}
.cart-overlay .cart-ov-head{background:var(--orange-grad)}
@media(max-width:820px){
  .pcard{border-radius:16px}
  .pcard .img{margin:5px 5px 0;width:calc(100% - 10px);border-radius:12px}
  .pcard .body{padding:6px 8px 9px}
  .pcard .body::after{width:22px;height:22px;font-size:15px;line-height:21px;right:6px;bottom:7px}
  .pcard .pr{padding-right:24px}
}

/* login — same layout as the mobile app: no card, amber brand tile, pill buttons, "or" divider */
#login{padding:32px 26px;align-items:center}
.login-card{background:transparent;box-shadow:none;border-radius:0;padding:0;width:min(420px,100%)}
.login-card .brand{flex-direction:column;gap:0;margin-bottom:34px;text-align:center}
.login-card .brand .lg{background:var(--orange-grad);color:#fff;border-radius:22px;padding:16px 22px;box-shadow:0 10px 30px rgba(255,143,0,.35);margin:0 0 16px;min-width:120px}
.login-card .brand .lg img{height:52px;max-width:186px}
.login-card .brand h1{font-size:26px;font-weight:900;margin:0;color:var(--text);line-height:1.2}
.login-card .brand p{font-size:13px;color:var(--sub);margin:2px 0 0;font-weight:600}
.login-card .field{margin-bottom:14px}
.login-card .lbl{margin:0 0 6px;font-size:12.5px}
.login-card .inp{padding:13px 14px;min-height:48px;font-size:15px}
.login-card .btn.lg{padding:15px;font-size:16px;border-radius:999px;width:100%}
.login-card .btn svg{width:18px;height:18px}
.login-or{display:flex;align-items:center;gap:10px;margin:18px 0}
.login-or i{flex:1;height:1px;background:var(--line)}
.login-or span{font-size:12px;color:var(--sub2)}
.login-note{text-align:center;font-size:12px;color:var(--sub);margin:20px 0 0}
.login-card .pin-user-label{margin-top:6px}
/* ============================ end eKart theme ============================ */
/* dropdowns: hand cursor */
select.inp,select,.tabs .cat-select{cursor:pointer}
.pl-sw{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pl-c{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.pl-c.on{box-shadow:0 0 0 2px var(--text)}
.pl-pick{width:30px;height:30px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line);cursor:pointer;display:inline-block;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.pl-pick input{opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.pl-prev{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px;padding:12px 14px;border-radius:12px;background:var(--soft)}
.pl-prev b{font-size:17px;font-weight:800}
.pl-dot{width:14px;height:14px;border-radius:50%;background:var(--orange-grad)}

#splash .sp-ring{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#e8720c,#f7a34d,rgba(232,114,12,0) 72%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 6px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 6px));
  animation:sp-spin 1s linear infinite}
#splash .sp-box{width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,#f0872a,#e8720c);
  display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(232,114,12,.42);animation:sp-pulse 1.5s ease-in-out infinite}
#splash .sp-box svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#splash .sp-brand{font-size:15px;font-weight:900;letter-spacing:1px;color:#e8720c;margin-bottom:-6px;opacity:0;animation:sp-up .55s .15s forwards}
#splash .sp-brand img{display:block;height:34px;max-width:160px;width:auto;object-fit:contain;margin:0 auto}
#splash .sp-title{font-size:30px;font-weight:900;letter-spacing:4px;color:#ffffff;opacity:0;animation:sp-up .6s .25s forwards}
#splash .sp-sub{font-size:11.5px;letter-spacing:2.5px;color:#f0872a;text-transform:uppercase;font-weight:700;margin-top:-8px;opacity:0;animation:sp-up .6s .4s forwards}
#splash .sp-bar{width:170px;height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}
#splash .sp-bar i{position:absolute;height:5px;width:44px;border-radius:99px;background:linear-gradient(90deg,#f7a34d,#e8720c);animation:sp-load 1.15s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sp-spin{to{transform:rotate(360deg)}}
@keyframes sp-pulse{0%,100%{transform:scale(1)}50%{transform:scale(.9)}}
@keyframes sp-up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes sp-load{0%{transform:translateX(-60px)}100%{transform:translateX(190px)}}

<script>
/* Post-login loading screen — same look as the startup splash, plus a welcome line.
   EntryLoader.show({hello,name,sub}) right after the server accepts the login,
   EntryLoader.done() once the app has rendered underneath (kept visible >= MIN ms). */
window.EntryLoader=(function(){
  var MIN=1600, el=null, t0=0, cap=null;
  var BOX='<svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>';
  function line(cls,txt){ var d=document.createElement('div'); d.className=cls; d.textContent=txt||''; return d; }
  function show(o){
    o=o||{};
    var old=document.getElementById('splash'); if(old&&old.parentNode) old.parentNode.removeChild(old);
    el=document.createElement('div'); el.id='splash'; el.className='entry';
    el.innerHTML='<div class="sp-core"><div class="sp-ring"></div><div class="sp-box">'+BOX+'</div></div>'
      +'<div class="sp-brand"><img alt="logo" onerror="this.parentNode.style.display=\'none\'"></div>';
    var bl=(function(){try{return JSON.parse(localStorage.getItem('wms_brand')||'{}')||{};}catch(e){return {};}})(); el.querySelector('.sp-brand img').src=bl.logo||'images/logo.svg';
    el.appendChild(line('sp-title',o.hello));
    if(o.name) el.appendChild(line('sp-name',o.name));      // textContent: user data is never parsed as HTML
    el.appendChild(line('sp-sub',o.sub));
    var bar=document.createElement('div'); bar.className='sp-bar'; bar.innerHTML='<i></i>'; el.appendChild(bar);
    document.body.appendChild(el);
    t0=Date.now();
    clearTimeout(cap); cap=setTimeout(function(){ done(true); },15000);   // never trap the user behind the loader
  }
  function done(now){
    var e=el; el=null; clearTimeout(cap);
    if(!e) return Promise.resolve();
    var wait=now===true?0:Math.max(0,MIN-(Date.now()-t0));
    return new Promise(function(res){ setTimeout(function(){
      e.classList.add('hide'); setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); res(); },560);
    },wait); });
  }
  return {show:show, done:done};
})();
</script>

  set(t){ try{ if(t)sessionStorage.setItem(CONFIG.AUTH_KEY,t); else sessionStorage.removeItem(CONFIG.AUTH_KEY); }catch(e){} },
  async call(action,body){
    const r=await fetch(CONFIG.API_BASE+'?action='+action,{method:'POST',headers:Store.headers(true),body:JSON.stringify(body||{}),cache:'no-store'});

function priceOf(it){ if(!it)return 0; return parseFloat(it.price!=null?it.price:(it.sell!=null?it.sell:it.cost))||0; }

function stockTotal(code){ return (DB.stock||[]).filter(x=>x.code===code&&!isNG(x.loc)).reduce((a,x)=>a+(parseInt(x.qty,10)||0),0); }

function locList(){ return (DB.locationMaster||[]).map(l=>l.code); }
function issueFIFO(code,loc,qty){ // deduct qty at loc oldest-first by lotNo/exp
  let rows=(DB.stock||[]).filter(x=>x.code===code&&x.loc===loc&&(parseInt(x.qty,10)||0)>0);
  rows.sort((a,b)=>{ if(!a.hu!==!b.hu) return a.hu?1:-1;                 // loose stock before stock in a pallet / tote
    const ax=a.exp||'￿', bx=b.exp||'￿'; if(ax!==bx) return ax<bx?-1:1;   // nearest EXP first, no EXP last (same as the web app)
    return String(a.lotNo||'').localeCompare(String(b.lotNo||''),undefined,{numeric:true}); });
  let remain=qty, consumed=[];
  const emptied=[];
  for(const r of rows){ if(remain<=0)break; const av=parseInt(r.qty,10)||0; const take=Math.min(av,remain); r.qty=av-take; remain-=take;
    consumed.push({loc,qty:take,lotNo:r.lotNo||'',lotSup:r.lotSup||'',mfd:r.mfd||'',exp:r.exp||'',sn:r.sn||'',hu:r.hu||undefined,cost:r.cost});
    if(r.qty===0) emptied.push(r); }
  for(let i=DB.stock.length-1;i>=0;i--){ if(emptied.indexOf(DB.stock[i])>=0) DB.stock.splice(i,1); }   // only rows this sale emptied — a negative row elsewhere is stock owed, not rubbish
  return {consumed,short:remain};
}
function consumeAcross(code,qty){ // deduct across non-NG locations
  let remain=qty, consumed=[];
  const locs=[...new Set((DB.stock||[]).filter(s=>s.code===code&&!isNG(s.loc)&&(parseInt(s.qty,10)||0)>0).map(s=>s.loc))];
  for(const loc of locs){ if(remain<=0)break; const r=issueFIFO(code,loc,remain); consumed.push(...r.consumed); remain=r.short; }
  return {consumed,short:remain};
}
function receiveStock(code,loc,qty,lot){ lot=lot||{};                 // same lot = same lotNo + lotSup + mfd + exp + sn (the stock row key)
  const k=['lotNo','lotSup','mfd','exp','sn','hu'], same=x=>k.every(f=>String(x[f]||'')===String(lot[f]||''));
  let row=(DB.stock||[]).find(x=>x.code===code&&x.loc===loc&&same(x));
  if(row){ row.qty=(parseInt(row.qty,10)||0)+qty; if(!(parseFloat(row.cost)>0)&&parseFloat(lot.cost)>0) row.cost=parseFloat(lot.cost); }
  else { const r={code,loc,qty,cost:parseFloat(lot.cost)||0}; k.forEach(f=>{ if(lot[f]) r[f]=lot[f]; }); DB.stock.push(r); } }

/* ============================ STORE (shared api_supabase.php) ============================
   Saves send ONLY the rows this terminal changed (?action=savebatch, merged per row on the
   server), never the whole database — so a sale here can't wipe what the web app or another
   device saved a moment ago. Every unsent change is kept in localStorage until the server
   confirms it, and a pull from the server never runs while local changes are still unsent. */
const POS_SERVER_TABLES=['itemMaster','stock','locationMaster','labelMaster','history','schedule','bookings','logisticMaster','customerMaster','supplierMaster','ngMaster','bomMaster','stocktake','returns','sales','shifts','promotions','giftcards','purchaseOrders','salesOrders','mpOrders'];
/* tables this terminal sends: the fixed list + optional ones the server says it has (caps "table:<name>") */
function posTables(){ const extra=((META&&META.caps)||[]).filter(c=>/^table:/.test(c)).map(c=>c.slice(6)); return POS_SERVER_TABLES.concat(extra.filter(t=>POS_SERVER_TABLES.indexOf(t)<0)); }
const POS_MERGE={labelLog:'id',huMaster:'code',withdrawals:'id',stock:'code|loc|lotNo|lotSup|mfd|exp|sn|hu?',history:'id',schedule:'id',bookings:'id',sales:'id',shifts:'id',returns:'id',stocktake:'id',promotions:'id',giftcards:'code',
  itemMaster:'code',locationMaster:'code',customerMaster:'code',supplierMaster:'code',ngMaster:'code',logisticMaster:'name',purchaseOrders:'id',salesOrders:'id',mpOrders:'id'};   // same keys as the server
/* settings travel as a PATCH (only the fields that changed) once the server says it can merge them —
   a whole-object replace would undo another user's recent change (menus, features, label setup…) */
function settingsPatchOp(prevJson,cur,caps){
  if(!caps||caps.indexOf("settingsPatch")<0) return null;
  var prev=null; try{ prev=prevJson?JSON.parse(prevJson):null; }catch(e){}
  if(!prev||typeof prev!=="object"||Array.isArray(prev)) return null;
  var set=[], unset=[], isObj=function(v){ return !!v&&typeof v==="object"&&!Array.isArray(v); };
  (function walk(a,b,path){
    Object.keys(b).forEach(function(k){ var p=path.concat(k), bv=b[k];
      if(bv===undefined){ if(Object.prototype.hasOwnProperty.call(a,k)) unset.push(p); return; }
      if(isObj(a[k])&&isObj(bv)&&p.length<6) walk(a[k],bv,p);
      else if(!Object.prototype.hasOwnProperty.call(a,k)||JSON.stringify(a[k])!==JSON.stringify(bv)) set.push([p,bv]); });
    Object.keys(a).forEach(function(k){ if(!Object.prototype.hasOwnProperty.call(b,k)) unset.push(path.concat(k)); });
  })(prev,cur||{},[]);
  return {table:"settings",mode:"patch",set:set,unset:unset};
}
/* quantities travel as +/- changes once the server supports it (caps "delta"): two devices selling the same item at
   the same moment both send "-1" and the database adds both, instead of both sending "9" and losing a sale */
var DELTA_FIELDS={stock:["qty"],giftcards:["balance"],customerMaster:["points","storeCredit","totalSpent"]};
function deltaOn(tb,snap){ return !!(snap&&DELTA_FIELDS[tb]&&META&&META.caps&&META.caps.indexOf("delta")>=0); }
function deltaId(){ return "D"+Date.now().toString(36)+Math.random().toString(36).slice(2,9); }   // one per change set: a retry is never added twice
/* snap / cur: {rowKey: JSON of the row} -> {rows:[{data,d,set,del}], dels:[rowKey]} */
function deltaRows(tb,fields,snap,cur){
  var rows=[], dels=[], num=function(v){ var n=parseFloat(v); return isFinite(n)?n:0; };
  Object.keys(cur).forEach(function(k){
    if(cur[k]===snap[k]) return;
    var c=JSON.parse(cur[k]), s=(k in snap)?JSON.parse(snap[k]):null, d={}, set={};
    fields.forEach(function(f){ var x=Math.round((num(c[f])-(s?num(s[f]):0))*100)/100; if(x) d[f]=x; });
    Object.keys(c).forEach(function(f){ if(fields.indexOf(f)>=0) return; if(!s||JSON.stringify(c[f])!==JSON.stringify(s[f])) set[f]=c[f]; });
    if(s) Object.keys(s).forEach(function(f){ if(fields.indexOf(f)<0&&!(f in c)) set[f]=null; });
    if(s&&!Object.keys(d).length&&!Object.keys(set).length) return;
    rows.push({data:c,d:d,set:set}); });
  Object.keys(snap).forEach(function(k){ if(k in cur) return; var s=JSON.parse(snap[k]);
    if(tb==="stock"){ var d={}; fields.forEach(function(f){ var x=-num(s[f]); if(x) d[f]=x; }); rows.push({data:s,d:d,set:{},del:true}); }   // gone here: take its qty off; the row goes when it reaches 0
    else dels.push(k); });
  return {rows:rows,dels:dels};
}
const POS_PEND_KEY='pos_pending_v1';
const Store={
  _t:null,
  _saveInFlight:null,
  _snap:{}, _snapRows:{}, _cur:null,     // _cur = {json, commit[]} for the newest unsent change set
  headers(post){ const h={}; if(CONFIG.API_KEY)h['X-API-Key']=CONFIG.API_KEY; const t=Auth.token; if(t)h['X-Auth-Token']=t; if(post)h['Content-Type']='application/json'; return h; },
  async load(){
    if(this._t) await this.flushNow();      // never drop a pending change
    if(this._saveInFlight){ try{ await this._saveInFlight; }catch(e){} }
    if(CONFIG.USE_BACKEND){
      try{
        const r=await fetch(CONFIG.API_BASE+'?action=load',{headers:this.headers(false),cache:'no-store'});
        if(r.status===401){ sessionExpired(); return false; }
        if(!r.ok)throw new Error('HTTP '+r.status);
        const d=await r.json();
        this.apply(d);
        try{ localStorage.setItem(CONFIG.DB_KEY,JSON.stringify(this.payload())); }catch(e2){}
        return true;
      }
      catch(e){ console.warn('load failed',e); toast(T('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ใช้ข้อมูลในเครื่อง','Server unreachable, using local')+' ('+(e.message||'network')+')','warn');
        try{ const raw=localStorage.getItem(CONFIG.DB_KEY); if(raw)this.apply(JSON.parse(raw)); }catch(e2){}
        return false;
      }
    }
    try{ const raw=localStorage.getItem(CONFIG.DB_KEY); if(raw)this.apply(JSON.parse(raw)); }catch(e){}
    return true;
  },
  apply(d){ d=d||{}; META.caps=Array.isArray(d.caps)?d.caps:null; META.companies=d.companies||[]; META.users=d.users||[]; META.partitions=d.partitions||{}; META.settings=d.settings||{}; META.txnSeq=d.txnSeq||0;
    if(d.me) META.me=d.me;   // signed-in user as the server sees it (never includes passwords/PINs)
    // META.partitions is a brand-new object now: re-point DB (and the open shift / customer) at it
    if(CID)activateCompany(CID);
  },
  payload(){ return {companies:META.companies,users:META.users,partitions:META.partitions,settings:META.settings,txnSeq:META.txnSeq,me:META.me}; },
  async pullOnly(silent){
    clearTimeout(this._t);
    if(!CONFIG.USE_BACKEND){ if(!silent)toast(T('โหมดออฟไลน์ ไม่มีเซิร์ฟเวอร์ให้ซิงค์','Offline mode — no server to sync from'),'warn'); return false; }
    // push first; if local changes can't be uploaded, do NOT replace them with server data
    const f=await this.flushNow();
    if(!f.ok){ if(!silent)toast(T('ยังบันทึกขึ้นเซิร์ฟเวอร์ไม่ได้ — เก็บข้อมูลในเครื่องไว้ก่อน','Unsaved changes could not be uploaded — kept on this device')+(f.err?' ('+f.err+')':''),'err'); return false; }
    try{
      const rev0=this._rev||0;
      const r=await fetch(CONFIG.API_BASE+'?action=load',{headers:this.headers(false),cache:'no-store'});
      if(r.status===401){ sessionExpired(); return false; }
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=await r.json();
      if(this._t||this._pendLoad().base.length||(this._rev||0)!==rev0){ return false; }   // something changed while we were downloading (even if already sent): keep it, pull next time
      this.apply(d);
      try{ localStorage.setItem(CONFIG.DB_KEY,JSON.stringify(this.payload())); }catch(e2){}
      return true;
    }catch(e){
      console.warn('pullOnly failed',e);
      if(!silent)toast(T('ซิงค์จากเซิร์ฟเวอร์ไม่สำเร็จ','Sync from server failed')+' ('+(e.message||'network')+')','err');
      return false;
    }
  },
  _rowKey(row,key){ let s=''; key.split('|').forEach((f,i)=>{ const opt=f.slice(-1)==='?'; if(opt) f=f.slice(0,-1);   // "field?" only when the row has it (hu = pallet / tote)
    const v=(row&&row[f]!=null)?String(row[f]):''; if(opt&&v==='') return; s+=(i?'|':'')+v; }); return s; },
  /* baseline = what the server has (called whenever data is (re)loaded) */
  snapshot(){
    this._snap={}; this._snapRows={}; this._cur=null; if(!CID)return;
    const p=META.partitions[CID]||{};
    posTables().forEach(tb=>{ const data=p[tb]; if(!Array.isArray(data))return;
      if(POS_MERGE[tb]){ const m={}; data.forEach(r=>{ m[this._rowKey(r,POS_MERGE[tb])]=JSON.stringify(r); }); this._snapRows[tb]=m; }
      else this._snap[tb]=JSON.stringify(data); });

  },
  /* rows changed since the baseline -> {payload, commit[]} or null */
  diff(){
    if(!CID||!META.partitions||!META.partitions[CID])return null;
    const p=META.partitions[CID], ops=[], commit=[];
    posTables().forEach(tb=>{ const data=p[tb]; if(!Array.isArray(data))return;
      const key=POS_MERGE[tb];
      if(key){
        const snap=this._snapRows[tb]||{}, cur={}, upserts=[], deletes=[];
        data.forEach(r=>{ cur[this._rowKey(r,key)]=JSON.stringify(r); });
        if(deltaOn(tb,this._snapRows[tb])){                           // stock / gift-card balance / points as +/- changes
          const dr=deltaRows(tb,DELTA_FIELDS[tb],snap,cur);
          if(dr.rows.length) ops.push({table:tb,mode:'delta',key,id:deltaId(),rows:dr.rows});
          if(dr.dels.length) ops.push({table:tb,mode:'merge',key,upserts:[],deletes:dr.dels});
          if(dr.rows.length||dr.dels.length) commit.push(()=>{ this._snapRows[tb]=cur; });
          return; }
        Object.keys(cur).forEach(k=>{ if(cur[k]!==snap[k]) upserts.push(JSON.parse(cur[k])); });
        Object.keys(snap).forEach(k=>{ if(!(k in cur)) deletes.push(k); });
        if(upserts.length||deletes.length){ ops.push({table:tb,mode:'merge',key,upserts,deletes}); commit.push(()=>{ this._snapRows[tb]=cur; }); }
      } else {
        const b=JSON.stringify(data);
        if(b!==this._snap[tb]){ ops.push({table:tb,mode:'replace',data}); commit.push(()=>{ this._snap[tb]=b; }); }
      }
    });
    const s=(META.settings||{})[CID]||{}, sb=JSON.stringify(s);
    if(sb!==this._snap.$settings){ const po=settingsPatchOp(this._snap.$settings,s,META.caps);
      if(!po) ops.push({table:'settings',mode:'replace',data:s}); else if(po.set.length||po.unset.length) ops.push(po);
      commit.push(()=>{ this._snap.$settings=sb; }); }
    if(!ops.length){ commit.forEach(f=>f()); return null; }          // only a baseline to move (settings that didn't really change)
    return {payload:{company:CID,ops,globals:{}},commit};      // the POS never writes users / companies / sequences
  },
  _pendLoad(){ let o=null; try{ o=JSON.parse(localStorage.getItem(POS_PEND_KEY)||'null'); }catch(e){} o=o||{}; if(!Array.isArray(o.base))o.base=[]; return o; },
  _pendStore(o){ try{ if(o&&((o.base&&o.base.length)||o.cur))localStorage.setItem(POS_PEND_KEY,JSON.stringify(o)); else localStorage.removeItem(POS_PEND_KEY); }catch(e){} },
  /* a cashier change never loses the previous cashier's unsent sales: they wait on a shelf for that user */
  _pendOwn(o,me){

function todaySales(){ return (DB.sales||[]).filter(s=>s.date===today()&&s.status==='Paid'); }
function vDashboard(){
  const ts=todaySales();
  const rets=(DB.sales||[]).filter(s=>s.date===today()&&s.status==='Return'), refunds=r2(rets.reduce((a,r)=>a+(parseFloat(r.refund)||0),0));
  const gross=ts.reduce((a,s)=>a+s.total,0), total=r2(gross-refunds);     // what stays after today's refunds
  const bills=ts.length;
  const custs=new Set(ts.map(s=>s.customer||'walkin')).size;
  // hourly
  const hrs=Array(24).fill(0); ts.forEach(s=>{ const h=parseInt((s.time||'0:0').split(':')[0],10)||0; hrs[h]+=s.total; });
  const activeH=hrs.map((v,i)=>({h:i,v})).filter(x=>x.v>0); const maxH=Math.max(1,...hrs);
  // top products (+ cost/profit for the admin summary)
  const exVat=s=>{ const t=parseFloat(s.total)||0; if(!s.vatEnabled)return t; if(s.vatMode==='excl')return t-(parseFloat(s.vatAmt)||0); const r=parseFloat(s.vatRate)||0; return t*100/(100+r); };
  /* cost of goods: the lot costs written to history for each bill (falls back to the line's cost) */
  const cogsOf={}; (DB.history||[]).forEach(x=>{ if(x.cogs==null||!x.orderNo) return; const k=x.orderNo+'|'+x.code;
    if(x.type==='OUT'&&x.status==='Sale') cogsOf[k]=(cogsOf[k]||0)+(parseFloat(x.cogs)||0);
    else if(x.type==='IN'&&x.status==='Return'&&x.date===today()) cogsOf['R|'+k]=(cogsOf['R|'+k]||0)+(parseFloat(x.cogs)||0); });
  const prod={}, usedC={}; let netRev=0; ts.forEach(s=>{ const ex=exVat(s); netRev+=ex; const ratio=(parseFloat(s.subtotal)>0)?ex/parseFloat(s.subtotal):1;
    s.lines.forEach(l=>{ prod[l.code]=prod[l.code]||{name:l.name,qty:0,amt:0,net:0,cost:0}; const it=itemByCode(l.code), k=s.ref+'|'+l.code;
    prod[l.code].qty+=bq(l); prod[l.code].amt+=lineTotal(l); prod[l.code].net+=lineTotal(l)*ratio;
    if(cogsOf[k]!=null){ if(!usedC[k]){ prod[l.code].cost+=cogsOf[k]; usedC[k]=1; } }        // a bill's lots counted once per item
    else prod[l.code].cost+=(l.cost!=null?parseFloat(l.cost)||0:costOf(it))*bq(l); }); });
  /* today's refunds come off sales, and the cost of goods put back comes off cost */
  rets.forEach(r=>{ const s0=(DB.sales||[]).find(x=>x.ref===r.origRef), exR=s0&&(parseFloat(s0.total)||0)>0?exVat(s0)/parseFloat(s0.total):1;
    netRev-=(parseFloat(r.refund)||0)*exR;
    (r.lines||[]).forEach(l=>{ const p=prod[l.code]=prod[l.code]||{name:l.name,qty:0,amt:0,net:0,cost:0}, k='R|'+r.origRef+'|'+l.code;
      p.qty-=(l.base!=null?l.base:(l.qty||0)); p.amt-=(l.amount||0); p.net-=(l.amount||0)*exR;
      if(cogsOf[k]!=null&&!usedC[k]){ p.cost-=cogsOf[k]; usedC[k]=1; } }); });
  const top=Object.entries(prod).map(([c,d])=>({code:c,...d})).sort((a,b)=>b.qty-a.qty).slice(0,6);
  const totalCost=Object.values(prod).reduce((a,p)=>a+p.cost,0);
  const profit=netRev-totalCost;
  const byProfit=Object.entries(prod).map(([c,d])=>({code:c,...d,profit:d.net-d.cost})).sort((a,b)=>b.profit-a.profit).slice(0,10);
  // payment mix
  const pay={}; ts.forEach(s=>{ (s.pay||[]).forEach(p=>{ pay[p.method]=(pay[p.method]||0)+p.amount; });
    const tc=(s.pay||[]).filter(p=>p.method==='cash').reduce((a,p)=>a+p.amount,0); if(tc) pay.cash=r2(pay.cash-Math.min(s.change||0,tc)); });   /* change goes back out of the cash */
  const barH=activeH.length?activeH:hrs.map((v,i)=>({h:i,v})).slice(8,20);
  return `
  <div class="cards" style="margin-bottom:14px">
    <div class="stat"><div class="k">${T('ยอดขายวันนี้','Today sales')}</div><div class="v" style="color:var(--orange2)">฿${money(total)}</div>${refunds?`<div class="muted" style="font-size:11.5px;margin-top:2px">${T('หักคืนแล้ว ฿','after refunds ฿')}${money(refunds)}</div>`:''}</div>
    <div class="stat"><div class="k">${T('จำนวนบิล','Bills')}</div><div class="v">${bills}</div></div>
    <div class="stat"><div class="k">${T('จำนวนลูกค้า','Customers')}</div><div class="v">${custs}</div></div>
    <div class="stat"><div class="k">${T('เฉลี่ย/บิล','Avg/bill')}</div><div class="v">฿${money(bills?total/bills:0)}</div></div>
  </div>
  <div class="panel"><h3>${T('ยอดขายรายชั่วโมง','Hourly sales')}</h3>
    <div class="bars">${barH.map(x=>`<div class="bar" style="height:${Math.max(2,x.v/maxH*100)}%" title="${x.h}:00 ฿${money(x.v)}"><span>${x.h}</span></div>`).join('')||`<div class="muted">${T('ยังไม่มีข้อมูล','No data')}</div>`}</div>
    <div style="height:22px"></div></div>
  <div class="panel"><h3>${T('สินค้าขายดี','Top products')}</h3>
    <table class="t"><thead><tr><th>${T('สินค้า','Item')}</th><th style="text-align:right">${T('จำนวน','Qty')}</th><th style="text-align:right">${T('ยอด','Amount')}</th></tr></thead>
    <tbody>${top.map(t=>`<tr><td><b>${esc(t.code)}</b> ${esc(t.name)}</td><td style="text-align:right">${esc(t.qty)}</td><td style="text-align:right">฿${money(t.amt)}</td></tr>`).join('')||`<tr><td colspan="3" class="muted">${T('ยังไม่มีข้อมูล','No data')}</td></tr>`}</tbody></table></div>
  <div class="panel" style="margin-top:14px"><h3>${T('วิธีชำระเงิน','Payment methods')}</h3>
    <table class="t"><tbody>${Object.entries(pay).map(([m,a])=>`<tr><td>${payLabel(m)}</td><td style="text-align:right"><b>฿${money(a)}</b></td></tr>`).join('')||`<tr><td class="muted">${T('ยังไม่มีข้อมูล','No data')}</td></tr>`}</tbody></table></div>
  ${isAdmin()?`<div class="panel" style="margin-top:14px"><h3>${T('สรุปยอดขาย ต้นทุน กำไร (Admin)','Sales, cost & profit summary (Admin)')}</h3>
    <div class="cards" style="margin-bottom:14px">
      <div class="stat"><div class="k">${T('ยอดขาย','Sales')}</div><div class="v" style="color:var(--orange2)">฿${money(total)}</div></div>
      <div class="stat"><div class="k">${T('ต้นทุนรวม','Total cost')}</div><div class="v" style="color:var(--sub2)">฿${money(totalCost)}</div></div>
      <div class="stat"><div class="k">${T('กำไรขั้นต้น','Gross profit')}</div><div class="v" style="color:${profit>=0?'var(--ok)':'var(--danger)'}">฿${money(profit)}</div></div>
      <div class="stat"><div class="k">${T('% กำไร','Margin %')}</div><div class="v">${total?((profit/total*100).toFixed(1)):'0.0'}%</div></div>
    </div>
    <table class="t"><thead><tr><th>${T('สินค้า','Item')}</th><th style="text-align:right">${T('จำนวน','Qty')}</th><th style="text-align:right">${T('ยอดขาย','Sales')}</th><th style="text-align:right">${T('ต้นทุน','Cost')}</th><th style="text-align:right">${T('กำไร','Profit')}</th></tr></thead>
    <tbody>${byProfit.map(t=>`<tr><td><b>${esc(t.code)}</b> ${esc(t.name)}</td><td style="text-align:right">${esc(t.qty)}</td><td style="text-align:right">฿${money(t.amt)}</td><td style="text-align:right;color:var(--sub2)">฿${money(t.cost)}</td><td style="text-align:right;color:${t.profit>=0?'var(--ok)':'var(--danger)'}"><b>฿${money(t.profit)}</b></td></tr>`).join('')||`<tr><td colspan="5" class="muted">${T('ยังไม่มีข้อมูล','No data')}</td></tr>`}</tbody></table>
  </div>`:''}`;
}
function payLabel(m){ const map={cash:['เงินสด','Cash'],promptpay:['QR PromptPay','QR PromptPay'],card:['บัตรเครดิต','Credit Card'],debit:['บัตรเดบิต','Debit Card'],mbank:['Mobile Banking','Mobile Banking'],giftcard:['Gift Card','Gift Card'],coupon:['คูปอง','Coupon'],credit:['เครดิตร้าน','Store Credit']}; const x=map[m]; return x?T(x[0],x[1]):esc(m); }   // an unknown method name is text

function bindPayScanButtons(){ document.querySelectorAll('.pay-scan').forEach(el=>{ if(el._scanBound)return; el._scanBound=true; bindHoldToScan(el); }); }
function bindHoldToScan(el){
  const start=e=>{ if(e&&e.preventDefault)e.preventDefault(); if(_scanHeld)return; _scanHeld=true; el.classList.add('holding'); startScan(); };
  const stop=e=>{ if(e&&e.preventDefault)e.preventDefault(); if(!_scanHeld)return; _scanHeld=false; el.classList.remove('holding'); stopScan(); };
  el.addEventListener('pointerdown',start);
  el.addEventListener('pointerup',stop);
  el.addEventListener('pointercancel',stop);
  el.addEventListener('pointerleave',stop);
  // also bind raw touch events directly — on iOS Safari this is the most reliable way to
  // suppress the native long-press text-selection/callout menu on a hold gesture
  el.addEventListener('touchstart',start,{passive:false});
  el.addEventListener('touchend',stop,{passive:false});
  el.addEventListener('touchcancel',stop,{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
/* ===== Camera scan (hold to open, release to close) — unified via html5-qrcode, works the same on iOS & Android ===== */
let qrScanner=null, scanning=false, _lastScanAt=0, _scanHeld=false, _scanStarting=false, _graceTimer=null;
let _scanGen=0;
function startScan(){
  if(scanning||_scanStarting)return; scanning=true; _scanStarting=true; const gen=++_scanGen; let inst=null;
  const si=$('scan'); if(si)si.blur();
  const hint=$('scanHint'); if(hint)hint.innerHTML=T('จ่อบาร์โค้ด/QR ในกรอบ','Aim barcode/QR in frame')+'<small>'+T('ปล่อยนิ้วเพื่อปิดกล้อง','Release to close')+'</small>';
  $('scanOv').classList.add('show');
  if(typeof Html5Qrcode==='undefined'){ toast(T('โหลดตัวสแกนไม่ได้ (ต้องต่อเน็ต)','Scanner failed to load (needs internet)'),'err'); _scanStarting=false; stopScan(); return; }
  const onReady=()=>{
    if(gen!==_scanGen){ try{ inst.stop().then(()=>{ try{inst.clear();}catch(_){} }).catch(()=>{}); }catch(_){} return; }   // closed while starting
    _scanStarting=false;
    if(!_scanHeld){
      // The user had already released — on iOS this usually happens because the native
      // camera-permission dialog interrupts the touch-hold on first use. Rather than closing
      // immediately (which made scanning look broken on iPhone), give a short grace window
      // to actually scan now that the camera is finally ready.
      clearTimeout(_graceTimer);
      _graceTimer=setTimeout(()=>{ if(scanning&&!_scanHeld)stopScan(); },2500);
    }
  };
  try{
    inst=new Html5Qrcode('reader',{verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}}); qrScanner=inst;
    const cfg={fps:10,qrbox:function(vw,vh){ const m=Math.floor(Math.min(vw||300,vh||300)*0.75); const s2=Math.max(m,120); return {width:s2,height:s2}; },experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
    inst.start({facingMode:'environment'},cfg,onScanSuccess,function(){}).then(onReady).catch(function(err0){
      if(gen!==_scanGen)return;
      console.warn('camera start (facingMode) failed',err0);
      // fallback: pick a camera from the list (prefer the back camera)
      Html5Qrcode.getCameras().then(function(cams){
        if(!cams||!cams.length){ toast(T('ไม่พบกล้อง','No camera found'),'err'); _scanStarting=false; stopScan(); return; }
        const back=cams.filter(c=>/back|rear|environment|หลัง/i.test(c.label||''))[0]||cams[cams.length-1];
        if(gen!==_scanGen)return;
        inst.start(back.id,cfg,onScanSuccess,function(){}).then(onReady).catch(function(err){ if(gen!==_scanGen)return; toast(T('เปิดกล้องไม่ได้','Cannot open camera')+': '+(err&&err.message||err),'err'); _scanStarting=false; stopScan(); });
      }).catch(function(err){ toast(T('เปิดกล้องไม่ได้ (ขอสิทธิ์กล้องไม่สำเร็จ)','Cannot open camera (permission failed)')+': '+(err&&err.message||err),'err'); _scanStarting=false; stopScan(); });
    });
  }catch(e){ _scanStarting=false; toast(T('เปิดกล้องไม่ได้','Cannot open camera')+': '+(e&&e.message||e),'err'); stopScan(); }
}
function stopScan(){
  clearTimeout(_graceTimer);
  if(_scanStarting)return; // camera/permission still pending — onReady() above will handle it once resolved
  $('scanOv').classList.remove('show');
  if(qrScanner){ const s=qrScanner; qrScanner=null; try{ s.stop().then(()=>{ try{s.clear();}catch(_){} }).catch(()=>{}); }catch(_){} }
  scanning=false;
}
function forceCloseScan(){
  // used by the manual X button — closes even if a camera/permission request is still pending

function bindPcardLongPress(){
  document.querySelectorAll('.pcard').forEach(el=>{
    if(el._pcBound)return; el._pcBound=true;
    const code=el.getAttribute('data-code');
    let timer=null, longPressed=false, moved=false, sx=0, sy=0;
    const clearTimer=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
    const start=e=>{
      clearTimer(); // always cancel any previous pending timer for this card first
      longPressed=false; moved=false; el.classList.remove('pcard-held');
      sx=e.clientX; sy=e.clientY;
      timer=setTimeout(()=>{
        longPressed=true; timer=null;
        el.classList.add('pcard-held');
        if(navigator.vibrate)try{navigator.vibrate(12);}catch(_){}
        setTimeout(()=>el.classList.remove('pcard-held'),160); // brief 'pop' feedback only — never left enlarged
        showPcardDetail(code);
      },1000);
    };
    const move=e=>{ if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10){ moved=true; clearTimer(); } };
    const end=e=>{
      const wasLongPress=longPressed;
      clearTimer(); longPressed=false; el.classList.remove('pcard-held');
      if(wasLongPress||moved){ e.preventDefault(); return; }
      playClickSound();
      addToCart(code);
    };
    const cancel=()=>{ clearTimer(); longPressed=false; el.classList.remove('pcard-held'); };
    // Pointer Events only (covers mouse + touch + pen uniformly) — do NOT also bind
    // touchstart/touchend here, since binding both fires two independent timers per
    // press and the earlier one never gets cancelled, causing the detail popup to
    // re-trigger later ('stuck') even after the modal was already closed.
    el.addEventListener('pointerdown',start);
    el.addEventListener('pointermove',move);
    el.addEventListener('pointerup',end);
    el.addEventListener('pointercancel',cancel);
    el.addEventListener('pointerleave',cancel);
    el.addEventListener('contextmenu',e=>e.preventDefault());
  });
}

/* ===== Scan feedback: sound + confirmation popup ===== */
let _actx=null;
function _getActx(){ if(!_actx){ try{ _actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ _actx=null; } } return _actx; }
function playScanSound(ok){
  const ctx=_getActx(); if(!ctx)return;
  try{
    if(ctx.state==='suspended')ctx.resume();
    const t0=ctx.currentTime;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    if(ok){
      o.type='sine'; o.frequency.setValueAtTime(1046.5,t0);
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.25,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.14);
      o.start(t0); o.stop(t0+0.16);
    } else {
      o.type='square'; o.frequency.setValueAtTime(220,t0); o.frequency.setValueAtTime(160,t0+0.13);
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.22,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.27);
      o.start(t0); o.stop(t0+0.29);
    }
  }catch(e){}
}
function playClickSound(){
  // soft, quiet tap feedback for manually adding an item to the cart (distinct from the
  // louder scan beep) — short, low-volume click so it doesn't feel intrusive when tapping
  // through many products in a row
  const ctx=_getActx(); if(!ctx)return;
  try{
    if(ctx.state==='suspended')ctx.resume();
    const t0=ctx.currentTime;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.setValueAtTime(1500,t0);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.09,t0+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.06);
    o.start(t0); o.stop(t0+0.07);
  }catch(e){}
}

function lineTotal(l){ return Math.max(0,(l.price*l.qty)-(l.disc||0)); }
function cartSubtotal(){ return CART.reduce((a,l)=>a+lineTotal(l),0); }
const pctOf=v=>Math.min(100,Math.max(0,parseFloat(v)||0));
function billDiscAmt(){ const st=cartSubtotal(); if(BILL_DISC.type==='pct')return r2(st*pctOf(BILL_DISC.value)/100); return r2(Math.min(st,Math.max(0,BILL_DISC.value||0))); }
function memberDiscAmt(){ if(!CUR_CUSTOMER)return 0;
  const own=CUR_CUSTOMER.discPct, pct=pctOf((own!=null&&own!=='')?own:posCfg().memberDisc);      // a member set to 0% gets 0%
  return r2(Math.max(0,cartSubtotal()-billDiscAmt())*pct/100); }
function promoDiscAmt(){ if(!CUR_PROMO)return 0; return r2(Math.min(Math.max(0,CUR_PROMO._amt||0),Math.max(0,cartSubtotal()-billDiscAmt()-memberDiscAmt()))); }   // never beyond what is left
function cartTotal(){ return r2(Math.max(0, cartSubtotal()-billDiscAmt()-memberDiscAmt()-promoDiscAmt()) + cartVatAmt()); }
/* the VAT inside / on top of this bill (for the record) — cartVatAmt() is only what gets ADDED (excl) */
function cartVatPart(){ const cfg=posCfg(); if(!cfg.vatEnabled) return 0; const rate=parseFloat(cfg.vatRate)||0;
  const base=Math.max(0, cartSubtotal()-billDiscAmt()-memberDiscAmt()-promoDiscAmt());
  return cfg.vatMode==='excl'?r2(base*rate/100):r2(base*rate/(100+rate)); }
function cartVatAmt(){
  const cfg=posCfg();
  if(!cfg.vatEnabled||cfg.vatMode!=='excl')return 0;
  const base=Math.max(0, cartSubtotal()-billDiscAmt()-memberDiscAmt()-promoDiscAmt());
  return r2(base*(cfg.vatRate||0)/100);
}

function paySetMethod(m){ PAY_STATE.method=m; PAY_STATE.entered=''; renderPayModal(); }

function r2(n){ return Math.round((parseFloat(n)||0)*100)/100; }
/* store credit of the member on this bill, minus what this bill already uses */
function memberRec(){ return CUR_CUSTOMER?(DB.customerMaster||[]).find(c=>c.code===CUR_CUSTOMER.code)||null:null; }
function creditLeft(){ const c=memberRec(); if(!c) return 0; const used=PAY_STATE?PAY_STATE.lines.filter(p=>p.method==='credit').reduce((a,p)=>a+p.amount,0):0; return Math.max(0,r2((parseFloat(c.storeCredit)||0)-used)); }

function couponUsed(code){ const k=String(code).toLowerCase();
  return PAY_STATE.lines.some(p=>p.method==='coupon'&&String(p.ref).toLowerCase()===k)
    || (DB.sales||[]).some(s=>(s.pay||[]).some(p=>p.method==='coupon'&&String(p.ref||'').toLowerCase()===k)); }
function collectPay(){ const amt=r2(($('payAmt')||{}).value); if(amt<=0){toast(T('ระบุจำนวนเงิน','Enter amount'),'warn');return null;}
  const m=PAY_STATE.method, due=r2(PAY_STATE.total-PAY_STATE.lines.reduce((a,p)=>a+p.amount,0));
  // only cash can be more than what is due (that's change) — card / transfer / gift card / coupon can't pay out cash
  if(m!=='cash'&&amt>due+0.004){ toast(T('ยอดเกินที่ต้องชำระ (วิธีนี้ไม่มีเงินทอน) — สูงสุด ฿','More than the amount due (no change for this method) — max ฿')+money(due),'err'); return null; }
  const line={method:m,amount:amt};
  if(m==='giftcard'){ const code=(($('gcCode')||{}).value||'').trim(); const gc=(DB.giftcards||[]).find(g=>g.code===code&&g.active); if(!gc){toast(T('Gift Card ไม่ถูกต้อง','Invalid gift card'),'err');return null;}
    if(r2(gc.balance)-gcUsed(code)<amt-0.004){toast(T('ยอด Gift Card ไม่พอ (คงเหลือ ฿','Insufficient gift card (balance ฿')+money(r2(gc.balance)-gcUsed(code))+')','err');return null;} line.ref=code; }
  if(m==='credit'){ if(amt>creditLeft()+0.004){ toast(T('เครดิตไม่พอ (คงเหลือ ฿','Not enough store credit (left ฿')+money(creditLeft())+')','err'); return null; } line.ref=CUR_CUSTOMER?CUR_CUSTOMER.code:''; }
  if(m==='coupon'){ const code=(($('cpCode')||{}).value||'').trim();
    if(!isMgr()){ toast(T('การรับคูปองต้องให้ผู้จัดการทำรายการ','Coupons must be taken by a manager'),'err'); return null; }
    if(!code){ toast(T('ระบุรหัสคูปอง','Enter the coupon code'),'warn'); return null; }
    if(couponUsed(code)){ toast(T('คูปองนี้ถูกใช้ไปแล้ว','This coupon was already used'),'err'); return null; }
    line.ref=code; }
  if(['card','debit','mbank'].includes(PAY_STATE.method)) line.ref=($('payRef')||{}).value||'';
  return line;
}
function addSplit(){ const l=collectPay(); if(!l)return; PAY_STATE.lines.push(l); PAY_STATE.entered=''; renderPayModal(); }
function confirmPayment(){
  let line=null; const paid0=PAY_STATE.lines.reduce((a,p)=>a+p.amount,0);
  if(paid0<PAY_STATE.total-0.004){ line=collectPay(); if(!line)return; PAY_STATE.lines.push(line); }
  const paid=r2(PAY_STATE.lines.reduce((a,p)=>a+p.amount,0));
  if(paid<PAY_STATE.total-0.004){ toast(T('ยอดชำระไม่พอ','Insufficient payment'),'warn'); PAY_STATE.entered=''; renderPayModal(); return; }
  if(completeSale(PAY_STATE.lines, r2(paid-PAY_STATE.total))===false&&line){   // balance check failed: the line just added must not stay hidden in the list
    const i=PAY_STATE.lines.indexOf(line); if(i>=0) PAY_STATE.lines.splice(i,1); PAY_STATE.entered=''; renderPayModal(); }
}
function completeSale(payLines,change){
  if(completeSale._busy) return; completeSale._busy=true; setTimeout(()=>{ completeSale._busy=false; },800);
  // gift cards are charged only now; re-check balances (another terminal may have used the card meanwhile)
  const gcNeed={}; payLines.filter(p=>p.method==='giftcard').forEach(p=>{ gcNeed[p.ref]=(gcNeed[p.ref]||0)+p.amount; });
  for(const code in gcNeed){ const gc=(DB.giftcards||[]).find(g=>g.code===code&&g.active);
    if(!gc||r2(gc.balance)<gcNeed[code]-0.004){ toast(T('ยอด Gift Card ไม่พอ: ','Insufficient gift card: ')+code,'err'); completeSale._busy=false; return false; } }
  const crNeed=r2(payLines.filter(p=>p.method==='credit').reduce((a,p)=>a+p.amount,0)), crRec=crNeed>0?memberRec():null;
  if(crNeed>0&&(!crRec||r2(crRec.storeCredit)<crNeed-0.004)){ toast(T('เครดิตร้านไม่พอ','Not enough store credit'),'err'); completeSale._busy=false; return false; }
  for(const code in gcNeed){ const gc=DB.giftcards.find(g=>g.code===code&&g.active); gc.balance=r2(r2(gc.balance)-gcNeed[code]); gc.lastUsed=today(); }
  if(crRec) crRec.storeCredit=r2(r2(crRec.storeCredit)-crNeed);
  const ref=billRef('POS');
  // deduct stock + history
  CART.forEach(l=>{ const q=bq(l), {consumed,short}=consumeAcross(l.code,q), unitVal=q?lineTotal(l)/q:0, itemCost=costOf(itemByCode(l.code));
    const costOfLot=c=>{ const v=parseFloat(c.cost); return v>0?v:itemCost; };   // a row without its own cost: the item's cost, never 0
    const base={type:'OUT',date:today(),time:nowTime(),code:l.code,name:l.name,unitQty:l.unit,orderNo:ref,customer:CUR_CUSTOMER?CUR_CUSTOMER.name:'',price:l.price,status:'Sale'};
    consumed.filter(c=>c.qty>0).forEach(c=>hpush(Object.assign({id:uid('H'),loc:c.loc,lotNo:c.lotNo||'',lotSup:c.lotSup||'',mfd:c.mfd||'',exp:c.exp||'',sn:c.sn||'',hu:c.hu,qty:c.qty,value:r2(unitVal*c.qty),cost:costOfLot(c),cogs:r2(costOfLot(c)*c.qty),note:'POS'},base)));
    if(short>0) hpush(Object.assign({id:uid('H'),loc:'',qty:short,value:r2(unitVal*short),cost:itemCost,cogs:r2(itemCost*short),oversold:true,note:'POS — '+T('ขายเกินสต๊อก (ผู้จัดการอนุมัติ)','oversold (manager approved)')},base));
  });
  const cfgAtSale=posCfg();
  const sale={id:uid('S'),ref,date:today(),time:nowTime(),orderType:window.P3_TYPE||'',cashier:session.user.username,cashierName:whoName(),branch:posCfg().branch,
    customer:CUR_CUSTOMER?CUR_CUSTOMER.code:'',customerName:CUR_CUSTOMER?CUR_CUSTOMER.name:'',
    lines:JSON.parse(JSON.stringify(CART)).map(l=>Object.assign(l,{cost:costOf(itemByCode(l.code))})),subtotal:r2(cartSubtotal()),billDisc:billDiscAmt(),memberDisc:memberDiscAmt(),promoDisc:promoDiscAmt(),promo:CUR_PROMO?CUR_PROMO.name:'',promoCode:CUR_PROMO?String(CUR_PROMO.code||''):'',
    vatEnabled:!!cfgAtSale.vatEnabled,vatMode:cfgAtSale.vatMode||'incl',vatRate:cfgAtSale.vatRate||0,vatAmt:cartVatPart(),
    total:cartTotal(),pay:payLines,change:change,status:'Paid',shiftId:CUR_SHIFT?CUR_SHIFT.id:'' };
  // member points + history
  if(CUR_CUSTOMER){ const rate=parseFloat(posCfg().pointRate)||0; const earned=rate>0?Math.floor(sale.total/rate):0; sale.points=earned;
    const cm=(DB.customerMaster||[]).find(c=>c.code===CUR_CUSTOMER.code); if(cm){ cm.points=(parseInt(cm.points,10)||0)+earned; cm.lastBuy=today(); cm.totalSpent=(parseFloat(cm.totalSpent)||0)+sale.total; } }
  DB.sales.push(sale);
  if(CUR_SHIFT){ CUR_SHIFT.saleIds=CUR_SHIFT.saleIds||[]; CUR_SHIFT.saleIds.push(sale.id); }
  Store.save(true);
  closeModal(); clearCart();
  showReceipt(sale.id,true);
}

function receiptHTML(sale,forPrint){
  const cfg=posCfg();
  const lines=sale.lines.map(l=>`<tr><td>${esc(l.name)}<br><small>${esc(l.code)} ${l.qty}${(l.mult||1)>1?' '+esc(l.unit||''):''}x฿${money(l.price)}${l.disc?(' -฿'+money(l.disc)):''}</small></td><td style="text-align:right;vertical-align:top">฿${money(Math.max(0,(l.price*l.qty)-(l.disc||0)))}</td></tr>`).join('');
  const pay=(sale.pay||[]).map(p=>`<tr><td>${payLabel(p.method)}${p.ref?(' '+esc(p.ref)):''}</td><td style="text-align:right">฿${money(p.amount)}</td></tr>`).join('');
  return `<div style="font-family:'Sarabun',monospace;width:300px;margin:0 auto;color:#000;font-size:12.5px">
    <div style="text-align:center;margin-bottom:6px"><b style="font-size:15px">${esc((META.companies.find(c=>c.id===CID)||{}).name||'mywms POS')}</b><br>
    ${cfg.receiptHeader?esc(cfg.receiptHeader)+'<br>':''}${T('สาขา','Branch')}: ${esc(cfg.branch||'-')}</div>
    <div style="border-top:1px dashed #000;border-bottom:1px dashed #000;padding:4px 0;font-size:11.5px">
      ${T('เลขที่','No')}: ${esc(sale.ref)}<br>${sale.date} ${sale.time} · ${esc(sale.cashierName||sale.cashier)}<br>
      ${sale.customerName?(T('ลูกค้า','Customer')+': '+esc(sale.customerName)+'<br>'):''}</div>
    <table style="width:100%;border-collapse:collapse;margin:4px 0">${lines}</table>
    <div style="border-top:1px dashed #000;padding-top:4px">
      <table style="width:100%"><tr><td>${T('ยอดรวม','Subtotal')}</td><td style="text-align:right">฿${money(sale.subtotal)}</td></tr>
      ${sale.billDisc?`<tr><td>${T('ส่วนลดบิล','Bill disc')}</td><td style="text-align:right">-฿${money(sale.billDisc)}</td></tr>`:''}
      ${sale.memberDisc?`<tr><td>${T('ส่วนลดสมาชิก','Member disc')}</td><td style="text-align:right">-฿${money(sale.memberDisc)}</td></tr>`:''}
      ${sale.promoDisc?`<tr><td>${T('โปรโมชั่น','Promo')}</td><td style="text-align:right">-฿${money(sale.promoDisc)}</td></tr>`:''}
      ${(()=>{ const vatOn=sale.vatEnabled!=null?sale.vatEnabled:cfg.vatEnabled; if(!vatOn)return '';
        const vatMode=sale.vatMode||cfg.vatMode||'incl'; const rate=sale.vatRate!=null?sale.vatRate:(cfg.vatRate||7);
        if(vatMode==='excl'){
          const vatAmt=sale.vatAmt!=null?sale.vatAmt:(sale.total*rate/(100+rate));
          const exVat=sale.total-vatAmt;
          return `<tr><td>${T('มูลค่าก่อน VAT','Price excl. VAT')}</td><td style="text-align:right">฿${money(exVat)}</td></tr>
          <tr><td>${T('VAT','VAT')} ${rate}%</td><td style="text-align:right">+฿${money(vatAmt)}</td></tr>`;
        }
        const exVat=sale.total/(1+rate/100), vatAmt=sale.total-exVat;
        return `<tr><td>${T('มูลค่าก่อน VAT','Price excl. VAT')}</td><td style="text-align:right">฿${money(exVat)}</td></tr>
        <tr><td>${T('VAT','VAT')} ${rate}%</td><td style="text-align:right">฿${money(vatAmt)}</td></tr>`;
      })()}
      <tr><td><b>${T('สุทธิ','Total')}</b></td><td style="text-align:right"><b>฿${money(sale.total)}</b></td></tr></table></div>
    <table style="width:100%;border-top:1px dashed #000;margin-top:4px">${pay}
      ${sale.change?`<tr><td>${T('เงินทอน','Change')}</td><td style="text-align:right">฿${money(sale.change)}</td></tr>`:''}</table>
    ${sale.points?`<div style="text-align:center;font-size:11px">${T('คะแนนสะสม','Points earned')}: ${sale.points}</div>`:''}
    <div style="text-align:center;margin-top:8px;border-top:1px dashed #000;padding-top:6px">${esc(cfg.receiptFooter||'')}<br><span id="rqr_${sale.id}"></span></div>
  </div>`;
}
function waitForQRCode(cb,triesLeft){
  triesLeft=(triesLeft==null)?40:triesLeft;
  if(typeof QRCode!=='undefined'){ cb(true); return; }
  if(triesLeft<=0){ cb(false); return; }
  setTimeout(()=>waitForQRCode(cb,triesLeft-1),100);
}
function showReceipt(id,justPaid){ const sale=(DB.sales||[]).find(s=>s.id===id); if(!sale)return;
  modal(justPaid?T('ชำระเงินสำเร็จ','Payment complete'):T('ใบเสร็จ','Receipt'),
    `<div style="background:#fff;padding:14px;border-radius:10px">${receiptHTML(sale)}</div>`,
    [{t:T('ปิด','Close'),c:'ghost',fn:closeModal},
     {t:T('พิมพ์','Print'),c:'primary',fn:()=>printReceipt(sale)}],true);
  waitForQRCode(ok=>{ const box=$('rqr_'+sale.id); if(!box)return; if(ok){ new QRCode(box,{text:'RECEIPT:'+sale.ref,width:70,height:70,correctLevel:QRCode.CorrectLevel.L}); } });
}
function printReceipt(sale){ const w=window.open('','_print','width=380,height=640'); if(!w){toast(T('อนุญาต popup เพื่อพิมพ์','Allow popups to print'),'warn');return;}
  const q=$('rqr_'+sale.id), qrHtml=q?(q.querySelector('img')&&q.querySelector('img').src?'<img src="'+q.querySelector('img').src+'" width="70" height="70">':(q.querySelector('canvas')?'<img src="'+q.querySelector('canvas').toDataURL()+'" width="70" height="70">':'')):'';   // the QR drawn on screen goes onto paper too
  const rh=receiptHTML(sale,true).replace('<span id="rqr_'+sale.id+'"></span>','<span>'+qrHtml+'</span>');
  w.document.write(`<html><head><title>${esc(sale.ref)}</title><link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet"></head><body onload="setTimeout(()=>{print();},400)">${rh}</body></html>`); w.document.close(); }
function qrReceipt(sale){
  modal('QR Receipt',`<div style="text-align:center;padding:10px"><div id="bigqr" style="display:inline-block;min-width:200px;min-height:200px;background:#fff;padding:14px;border-radius:12px;align-items:center;justify-content:center;display:flex"><span class="muted">${T('กำลังโหลด QR...','Loading QR...')}</span></div><div class="muted" id="bigqrMsg" style="margin-top:10px">${esc(sale.ref)}</div></div>`,[{t:T('ปิด','Close'),c:'ghost',fn:closeModal}]);
  waitForQRCode(ok=>{
    const b=$('bigqr'); if(!b)return;
    if(ok){
      b.innerHTML=''; b.style.display='inline-block';
      new QRCode(b,{text:T('ใบเสร็จ','Receipt')+' '+sale.ref+' · '+sale.date+' '+sale.time+' · '+T('ยอดรวม','Total')+' ฿'+money(sale.total),width:200,height:200});
      const msg=$('bigqrMsg'); if(msg)msg.textContent=T('สแกนเพื่อดูสรุปใบเสร็จ','Scan to view receipt summary')+' · '+sale.ref;
    } else {
      b.innerHTML=`<div class="muted" style="padding:10px;color:var(--danger);max-width:220px">${T('โหลดตัวสร้าง QR ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่','Failed to load the QR generator — please check your internet connection and try again')}</div>`;
    }
  });
}

/* ============================ MODULE 4: PROMOTION ============================ */
function recalcPromo(){ if(!CUR_PROMO)return; CUR_PROMO._amt=calcPromo(CUR_PROMO); }
function calcPromo(p){ const st=cartSubtotal(); const qty=CART.reduce((a,l)=>a+l.qty,0);
  if(p.type==='pct')return st*(p.value||0)/100;
  if(p.type==='baht')return Math.min(st,p.value||0);
  if(p.type==='threshold')return st>=(p.min||0)?Math.min(st,p.value||0):0;
  if(p.type==='happyhour'){ const h=new Date().getHours(); return (h>=(p.from||0)&&h<(p.to||24))?st*(p.value||0)/100:0; }
  if(p.type==='bxgy'){ if(!p.buyCode)return 0; const qOf=c=>CART.filter(l=>l.code===c).reduce((a,l)=>a+l.qty,0);
    const bq=p.buyQty||1, gq=p.getQty||1, gCode=p.getCode||p.buyCode;
    let sets; if(gCode===p.buyCode) sets=Math.floor(qOf(p.buyCode)/(bq+gq));                    // same item: free ones must be in the cart too
    else sets=Math.min(Math.floor(qOf(p.buyCode)/bq),Math.floor(qOf(gCode)/gq));                 // other item: only if it was actually taken
    const gl=CART.find(l=>l.code===gCode), unit=gl&&(parseInt(gl.qty,10)||0)>0?lineTotal(gl)/(parseInt(gl.qty,10)||1):priceOf(itemByCode(gCode));
    return sets*gq*unit; }                                          // the cart's (possibly changed) price, not the list price
  if(p.type==='bundle'){ const items=(p.items||[]).filter(Boolean); const ok=items.length>0&&items.every(c=>CART.find(l=>l.code===c)); return ok?(p.value||0):0; }
  if(p.type==='coupon'||p.type==='voucher')return p.value||0;
  return 0;
}

function vReturns(){ const paid=(DB.sales||[]).filter(s=>s.status==='Paid').sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,50);
